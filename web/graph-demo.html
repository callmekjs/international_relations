evelopment) 해양ㆍ대 기ㆍ산림ㆍ토양 및 폐기물등 주요환경 분야 보전을 위한 실천계획(86008 126 “제3장 실리외교 추구외 공동번영품신 기여 21)을 채택하고, 현재 협상중인 기후협약과 생물다양성협약도 서명할 예정이다.","chapter":3,"section":null,"page":41,"src":"1992 외교백서 제3장.pdf","id":"1991-s00698"},{"year":1992,"admin":"노태우","text":"100)회의를 계기로 1989년부터 2년간 유엔을 중심으로 개최되었던 UNCED 준비회의, 기후변화협약 및 생물다양성협약 채택을 위한 정부간 협 상위원회 회의가 종결되었다.","chapter":3,"section":null,"page":46,"src":"1993 외교백서 제3장.pdf","id":"1992-s00611"},{"year":1993,"admin":"김영삼","text":"그 결과 빠르면 1994년 하반기경에 발효될 것이라고 예상되던 기후변화협약 (94.3.21 발효 예정), 생물다양성 협약(93.12.29 발효)등이 예상을 앞당겨 발효하게 되었다.","chapter":5,"section":4,"page":46,"src":"1994 외교백서 제5장.pdf","id":"1993-s01017"},{"year":1994,"admin":"김영삼","text":"한편, 생물종의 다양성 보존을 위한 “생물다양성협약” 제1차 당사국 총회와 \"멸종위기에 처한 야생동식물의 국제거래에 관한 협약” (01785) 제9차 당사국 총회가 1994년 11, 18월중 개최되었다.","chapter":4,"section":5,"page":45,"src":"1995 외교백서 제4장.pdf","id":"1994-s00954"},{"year":1995,"admin":"김영삼","text":"제3차 유엔지속개 발위원회, 생물다양성 협약, 몬트리올 의정서, 바젤협약, 런던협약 등의 다자협약 뿐만 아니라, 지역 및 양자 차원에서의 환경협력도 적극 추진하 였다.","chapter":1,"section":2,"page":9,"src":"1996 외교백서 제1장.pdf","id":"1995-s00148"},{"year":1996,"admin":"김영삼","text":"제 4차 유엔 지속개발위원회, 생물다양성 협약, 몬트리올 의정서, 바젤 협약 등 기채택된 다자간 협약의 후속이행 논의에 적극 참여하고, 지역 및 양자 차원에서의 환경협력도 적극 추진하였다.","chapter":2,"section":2,"page":14,"src":"1997 외교백서 제2장.pdf","id":"1996-s00772"},{"year":1997,"admin":"김영삼","text":"제 5차 유엔지속개발위원회, 생물다양성협약, 몬트리올 의정서, 바젤협약 등 기채택된 다자간 협약의 후속이행에 적극 참여하고 지역 및 양자차원에서의 환경협력도 적극 추진하였다.","chapter":2,"section":2,"page":1,"src":"1998 외교백서 제2장.doc","id":"1997-s00751"},{"year":1998,"admin":"김대중","text":"우리나라는 이러한 국제환경보전 논의에 적극 참여하기 위해 기후변화협약, 생물다양성협약, 몬트리올의정서, 바젤협약 등의 주요 국제환경협약에 가입하여 관련 후속조치이행 논의에 적극 참여하고 있으며, 생명공학안전성의정서, 국제산림보전, 유해 화학물질의 국가간 이동통제 등 새로운 분야 에서의 협약채택 협상에도 논의 초기부터 참여해 오고 있다.","chapter":5,"section":4,"page":1,"src":"1999 외교백서 제5장.doc","id":"1998-s02050"},{"year":1999,"admin":"김대중","text":"우리나라는 이러한 국제환경보전 논의에 적극 참여하기 위해 기후변화협약, 생물다양성협약, 몬트리올의정서, 바젤협약 등의 주요 국제환경협약에 가입하여 관련 후속이행 논의에 적극 참여하고 있으며, 국제산림보전, 유해 화학물질의 국가간 이동통제 등 새로운 분야에서의 협약채택 협상에도 　참여해 오고 있다.","chapter":4,"section":4,"page":58,"src":"2000 외교백서 제4장.hwp","id":"1999-s01304"},{"year":2000,"admin":"김대중","text":"우리나라는 이러한 국제환경보전 논의에 적극 참여하기 위해 기후변화협약, 생물다양성협약, 몬트리올의정서, 바젤협약 등의 주요 국제환경협약에 가입하여 관련 후속이행 논의에 적극 참여하고 있으며, 국제산림보전, 유해 화학물질의 국가간 이동통제 등 새로운 분야에서의 협약채택 협상에도 참여해왔다.","chapter":4,"section":3,"page":2000,"src":"2001 외교백서 제4장.hwp","id":"2000-s01229"},{"year":2001,"admin":"김대중","text":"우리나라는 이러한 국제환경 보전 논의에 적극 참여하기 위해 기후변화협약, 생물다양성협약, 몬트리올의정서, 바젤협약, 유해 화학물질의 국가간 이동통제 등의 주요 국제환경협약에 가입하여 관련 후속이행 논의에 적극 참여하고 있으며, 바이오 안전성, 국제산림보전, 잔류성 유기오염 물질의 통제 등 새로운 분야에서의 협약채택 협상에도 참여해 왔다.","chapter":4,"section":3,"page":1,"src":"2002 외교백서 제4장.hwp","id":"2001-s01357"},{"year":2002,"admin":"김대중","text":"4) 지구환경금융(GEF)에서의 환경 재원 마련 동향 주몺봍 봊몼딘 봊몼딘 우리나라는 기후변화협약, 생물다양성협약, 몬트리올의정서, 바젤협약, 유해 화학물질의 국가간 이동 통제 등의 주요 국제환경협약 관련 논의에 적극 참여하는 한편 바이오안전성, 국제산림보전, 잔류성 유기오염 물질의 통제 등 새로운 분야에서의 협약채택 협상에도 참여해 왔다.","chapter":4,"section":3,"page":1,"src":"2003 외교백서 제4장.hwp","id":"2002-s00831"},{"year":2003,"admin":"노무현","text":"2) 생태계 분야 2003년 한 해 동안 생물다양성협약(CBD)내에서는 유전자원에 대 한 접근 및 이익공유(ABS)에 대한 논의가 특히 활발하게 이루어졌 다.","chapter":4,"section":3,"page":73,"src":"2004 외교백서 제4장.pdf","id":"2003-s01608"},{"year":2006,"admin":"노무현","text":"지식재산권 분야에 있어서는 지리적 표시(GI: Geographical Indication) 보호제도 그리고 지식재산권 협정(TRIPS)와 생물다양성협약(CBD)의 관계가 주요 쟁점이었으며, 우리나라는 2006년 총 3회에 걸쳐 TRIPS 이사회 회의에 참석하여 우리 업계의 이익을 보호하는데 역점 을 두었다.","chapter":4,"section":3,"page":40,"src":"2007 외교백서 제4장.pdf","id":"2006-s01305"}],"docCount":53},{"id":"유엔해양법협약","kind":"treaty","aliases":["유엔해양법 협약","유엔해양법협약"],"total":59,"byYear":{"1989":1,"1990":2,"1992":2,"1993":2,"1994":1,"1995":3,"1998":2,"1999":4,"2000":2,"2001":3,"2002":1,"2006":1,"2007":2,"2008":2,"2009":1,"2010":2,"2011":1,"2012":2,"2013":1,"2014":1,"2015":1,"2016":1,"2018":3,"2019":3,"2020":2,"2021":3,"2022":1,"2023":3,"2024":3,"2025":3},"rateByYear":{"1989":6.7,"1990":15.0,"1992":15.7,"1993":15.9,"1994":7.5,"1995":21.4,"1998":8.0,"1999":16.0,"2000":8.0,"2001":9.4,"2002":7.1,"2006":6.5,"2007":14.7,"2008":12.7,"2009":5.9,"2010":10.1,"2011":5.5,"2012":9.6,"2013":5.7,"2014":4.3,"2015":4.6,"2016":12.5,"2018":17.9,"2019":16.5,"2020":8.9,"2021":17.4,"2022":5.3,"2023":13.6,"2024":14.8,"2025":16.4},"byAdmin":{"김대중":12,"문재인":11,"이명박":8,"윤석열":7,"김영삼":6,"노태우":5,"박근혜":4,"노무현":3,"이재명":3},"focus":0.2,"first":1989,"last":2025,"peak":1999,"peakRate":"1995","docs":[{"year":1990,"admin":"노태우","text":"유엔해양법협약의 채택 경위를 살펴보면, 1967년 유엔총회는 「국제관할권 이원정 해저‧해상화 평화적 사용 연구품 위한 빼뿌중브옵] 설립을 결의하였 고 (결의 제2340 ××1Ｌ호), 1968년에는 「국가관할권 이원의 해저ㆍ해상의 평화적 이용을 위한 위원회(심해저위원회)」 설립을 결의하였다.","chapter":3,"section":null,"page":68,"src":"1991 외교백서 제3장.pdf","id":"1990-s00888"},{"year":1992,"admin":"노태우","text":"나. 해양‧남극관련 업무 및 국제법률기구 참가활동 (1) 해양법 관련사항 1982년 12월 채택된 『유엔해양법협약」은 60개국의 비준서(또는 가입서) 가 기탁된 후 12개월이 지나면 발효하게 되어 있는 바, 1998년 12월말 현재 53개국(대부분 개도국)이 협약을 비준하였으며 이러한 추세대로 협약비준 이 이루어진다고 가정할 경우, 향후 2-3년내 발효가 예상된다.","chapter":3,"section":null,"page":67,"src":"1993 외교백서 제3장.pdf","id":"1992-s00723"},{"year":1993,"admin":"김영삼","text":"214 / 제 6장 유엔 등 국제기구를 통한 다자외교 2. 해양 및 남극 업무 가. 해양법 「유엔해양법협약,은 1993년 11월 16일 가이아나가 60번째 협약 비준서를 기탁함으로써 1994년 11월 16일부터 발효할 예정이다.","chapter":6,"section":4,"page":20,"src":"1994 외교백서 제6장.pdf","id":"1993-s01146"},{"year":1994,"admin":"김영삼","text":"2. 해양 및 남극업무 가. 해양법 1988년 채택된 「유엔해양법협약(044\\ Convention on the the Law 제4절 조약체결 및 국제법 업무 / 229 of the 568) 」』은 1994년 11월 16일 발효되었으며, 협약채택후 변화된 국 제정치ㆍ경제상황과 선진국의 입장을 반영하여 협약상의 심해저개발제도 를 수정한 「심해저이행협정』이 1994년 7월 28일 유엔총회에서 채택되어 1994년 11월 16일부터 잠정적용되고 있다.","chapter":6,"section":4,"page":34,"src":"1995 외교백서 제6장.pdf","id":"1994-s01236"},{"year":1995,"admin":"김영삼","text":"그밖에 11월 87일부터 18월 1일간 유엔해양법협약 당사국회의를 제1절 안보리 진출과 유엔 외교 / 229 개최하여 대륙붕 한계 설정위원회 선거일을 1997년 3월로 연기하였으며, 국제해양법 재관소의 초기단계의 행정ㆍ예산문제를 검토하여 재판소 여 원 규모에 관해 잠정적으로 합의하였다.","chapter":6,"section":1,"page":16,"src":"1996 외교백서 제6장.pdf","id":"1995-s01254"},{"year":1998,"admin":"김대중","text":"나. 주변국과의 어업협정 체결추진 1994년 유엔해양법협약이 발효하면서 한.중.일 3국은 각기 동 협약에 가입하고 배타적 경제수역법을 선포하였다.","chapter":5,"section":5,"page":1,"src":"1999 외교백서 제5장.doc","id":"1998-s02208"},{"year":1999,"admin":"김대중","text":"전세계적으로 어족자원의 감소 및 과도한 이용이 문제가 되고 있으며, 1994.11월 유엔해양법협약 발효이후 수산자원 보존 및 관리에 관한 국제 수산규범도 다자 및 지역적 차원에서 급속도로 체계화되고 있다.","chapter":4,"section":6,"page":58,"src":"2000 외교백서 제4장.hwp","id":"1999-s01577"},{"year":2000,"admin":"김대중","text":"현재 전 세계적으로 남획에 의한 어족자원 감소와 1994년 유엔해양법협약의 발효이후 각국의 배타적경제수역(Exclusive Economic Zone : EEZ) 선포에 따른 조업 수역의 축소 등으로 인해 이용가능한 자원은 빠른 속도로 축소되고 있다.","chapter":4,"section":5,"page":2000,"src":"2001 외교백서 제4장.hwp","id":"2000-s01560"},{"year":2001,"admin":"김대중","text":"현재 전세계적으로 남획에 의한 어족자원 감소와 1994년 유엔해양법협약의 발효이후 각국의 배타적경제수역(Exclusive Economic Zone : EEZ) 선포에 따른 조업 수역의 축소 등으로 인해 이용가능한 자원은 빠른 속도로 축소되고 있다.","chapter":4,"section":5,"page":1,"src":"2002 외교백서 제4장.hwp","id":"2001-s01701"},{"year":2002,"admin":"김대중","text":"4. 해양 항공 및 남극업무 가. 해양법질서 구축에의 적극 참여 1994년 11월 16일 발효한 유엔해양법협약(United Nations Convention on the Law of the Sea) 은 2002년 12월 현재 141개국이 가입함에 따라 보편적인 해양 법규범으로서의 위상을 갖게 되었다.","chapter":6,"section":null,"page":1,"src":"2003 외교백서 제6장.hwp","id":"2002-s01327"},{"year":2006,"admin":"노무현","text":"정부는 유엔해양법협약 등 국제법에 따라 이웃나라들과의 교섭에 성실히 임할 계획이며, 이러한 과정에서 우리의 배타적경제수역이 최대한 확보되도록 노력해 나갈 예정이다.","chapter":3,"section":7,"page":84,"src":"2007 외교백서 제3장.pdf","id":"2006-s01036"},{"year":2007,"admin":"노무현","text":"2) 국제법에 기초한 주변국과의 해양경계획정 교섭 우리나라는 1996년 배타적경제수역(EEZ: Exclusive Economic Zone)을 선포한 이래 「유엔해양법협약」의 관련 규정에 따라 서해, 남해, 동해 그리고 동중국해를 대상으로 하여 이웃나라인 일본 및 중국과 각각 해양경계를 획정하기 위해 성실히 노력해 왔다.","chapter":3,"section":5,"page":118,"src":"2008 외교백서 제3장.pdf","id":"2007-s00942"},{"year":2008,"admin":"이명박","text":"2) 국제법에 기초한 주변국과의 해양경계획정 교섭 우리나라는 1996년 배타적경제수역(EEZ: Exclusive Economic Zone)을 선포한 이 래「유엔해양법협약」의 관련 규정에 따라 서해, 남해, 동해 그리고 동중국해를 대상으로 하여 이웃 나라인 일본 및 중국과 각각 해양경계를 획정하기 위해 노력해왔다.","chapter":5,"section":4,"page":202,"src":"2009 외교백서_제5장.pdf","id":"2008-s01523"},{"year":2009,"admin":"이명박","text":"4. 국제법에 기초한 주변국과의 해양경계획정 교섭 우리나라는 1996년 배타적경제수역(EEZ: Exclusive Economic Zone)을 선포한 이 래^유엔해양법협약_의 관련 규정에 따라 서해, 남해, 동해 그리고 동중국해를 대상으로 하여 이웃나라인 일본 및 중국과 각각 해양경계를 획정하기 위해 노력해 왔다.","chapter":5,"section":4,"page":49,"src":"2010 외교백서_제5장.pdf","id":"2009-s01631"}],"docCount":55},{"id":"동북아평화협력구상","kind":"policy","aliases":["동북아평화협력구상"],"total":56,"byYear":{"2013":7,"2014":28,"2015":18,"2016":2,"2017":1},"rateByYear":{"2013":39.6,"2014":119.8,"2015":82.4,"2016":25.0,"2017":7.6},"byAdmin":{"박근혜":55,"문재인":1},"focus":0.98,"first":2013,"last":2017,"peak":2014,"peakRate":"2014","docs":[{"year":2013,"admin":"박근혜","text":"또한, 동 계기를 적극 활용, 우리 측은 한반도 신뢰프로세스와 동북아평화협력구상에 대한 러시아 측의 지지와 참여를 당부하였다.","chapter":2,"section":4,"page":80,"src":"2014 외교백서_제2장.pdf","id":"2013-s00459"},{"year":2014,"admin":"박근혜","text":"북한이 변화의 길로 나올 수 있는 외부 환경을 조성하기 위해 동북아평화협력구상, 유라시아 이니셔티브, 남·북·러 3각 협력 사업을 전개하 였다.","chapter":1,"section":2,"page":25,"src":"2015 외교백서(국문)-1장.pdf","id":"2014-s00152"},{"year":2015,"admin":"박근혜","text":"이와 더불어 오바마 대통령은 동북아평화협력구상에 환영 의지를 표명하고, 한·일·중 3국 정상회담 개최 노력을 평가함으로써 동북아 평화 및 번영을 위한 우리의 양자·소다자·다자 협력 추진 구상에 대한 지지를 확인하였다.","chapter":2,"section":3,"page":55,"src":"2016 외교백서 2장.pdf","id":"2015-s00311"},{"year":2016,"admin":"박근혜","text":"그리고 국정과제 이행 지원을 위해 ‘동북아평화협력구상’, ‘중견국 외교’, ‘한·미 동맹’, ‘한반도 신뢰프로세스’ 등 연구프로그램을 실시하고 있으며, 「2016 동북아평 화협력포럼」, 「제3차 한·EU 동북아평화협력구상 세미나」 등을 개최하여 우리 외 교안보 정책에 대한 국제사회의 지지 기반을 강화하였다.","chapter":7,"section":2,"page":204,"src":"2017 외교백서(7장).pdf","id":"2016-s00932"},{"year":2017,"admin":"문재인","text":"이 중에서도 「동북아평화협력플랫폼』은 역대 정부에서 동북아평화협력구상('동평구)이 라는 이름 아래 추진해 온 동북아 다자협력을 더욱 발전시커 나가러는 의지가 반영된 구상 이다.","chapter":2,"section":4,"page":18,"src":"2018 외교백서 국문_2장.pdf","id":"2017-s00408"},{"year":2013,"admin":"박근혜","text":"아울러, 우리의 한반도 신뢰프로세스 및 동북아평화협력구상에 대한 프랑스 측의 지지 및 환영 입장을 재확인하였으며, 유엔 안보리·G20 회원국인 양국의 비확 산, 기후변화, 테러리즘, 해적, 사이버안보, 지속가능한 성장, 개발 등에 있어 더 욱 긴밀히 협력해 나가기로 하였다.","chapter":3,"section":2,"page":113,"src":"2014 외교백서_제3장.pdf","id":"2013-s00610"},{"year":2014,"admin":"박근혜","text":"또한 우리 측이 동북아평화협력구상을 포함한 역내 협력 증 진 노력을 강조한 데 대해 미국 측은 이러한 대화가 역내의 다양한 도전에 대처하 는 데 기여할 수 있음에 공감하였다.","chapter":2,"section":3,"page":64,"src":"2015 외교백서(국문)-2장.pdf","id":"2014-s00371"},{"year":2015,"admin":"박근혜","text":"이 자리에서 윤병세 장 관은 2015년도가 종전 및 광복 70주년, 한·일 국교정상화 50주년 등 역사적 의 미가 매우 큰 해임을 감안하여 한·일 관계 등 양자 차원은 물론이고 한·미·일, 한·일·중 등 소다자 협력, 동북아평화협력구상 등 다양한 차원에서의 역내 협 력 강화를 위한 우리의 적극적 노력을 설명하였고, 케리 장관은 이에 큰 환영의 뜻을 표명하면서 적극 협조해 나가겠다는 뜻을 밝혔다.","chapter":2,"section":3,"page":56,"src":"2016 외교백서 2장.pdf","id":"2015-s00322"},{"year":2013,"admin":"박근혜","text":"아울러, 우리의 한반도 신뢰프로세 스 및 동북아평화협력구상에 대한 EU 차원(28개 회원국) 지지를 확보하는 한편, EU의 통합·신뢰구축 경험을 공유해 나가기로 하였다.","chapter":3,"section":2,"page":116,"src":"2014 외교백서_제3장.pdf","id":"2013-s00621"},{"year":2014,"admin":"박근혜","text":"동북아평화협력구상 추진 및 유라시아 협력 확대 1) 동북아평화협력구상 박근혜 정부는 출범 초부터 일관되게 신뢰의 중요성을 강조하였다.","chapter":2,"section":4,"page":87,"src":"2015 외교백서(국문)-2장.pdf","id":"2014-s00481"},{"year":2015,"admin":"박근혜","text":"또한 3국 제6차 한·일·중 정상회의(2015.11.1, 서울) 정상은 「동북아 평화협력을 위한 공동선언 문」 을 채택하고 북핵 불용과 한반도 통일에 관한 3국 차원의 공동 메시지를 발신 하는 한편 우리 정부가 추진 중인 「동북아평화협력구상」 과 3국 협력을 상호 연 계하여 추진하기로 하였다.","chapter":2,"section":4,"page":84,"src":"2016 외교백서 2장.pdf","id":"2015-s00474"}],"docCount":11},{"id":"포격도발","kind":"event","aliases":["포격 도발","포격도발"],"total":54,"byYear":{"2010":36,"2011":5,"2012":3,"2013":2,"2015":8},"rateByYear":{"2010":181.0,"2011":27.6,"2012":14.4,"2013":11.3,"2015":36.6},"byAdmin":{"이명박":44,"박근혜":10},"focus":0.81,"first":2010,"last":2015,"peak":2010,"peakRate":"2010","docs":[{"year":2010,"admin":"이명박","text":"3. 한반도 및 주변 정세 북한은 2010년 천안함 폭침과 연평도 포격도발을 감행, 민간인을 포함한 많은 인명피 해를 야기하였다.","chapter":1,"section":1,"page":15,"src":"2011 외교백서_제1장.pdf","id":"2010-s00089"},{"year":2011,"admin":"이명박","text":"특히 2009년 북한의 장거리 미사일 발사 및 2차 핵실험, 2010년 천안함 폭침, 연평도 포격 도발, 영변 우라늄 농축시설 공개 등 북한의 잇따른 도 발행위로 인해 남북관계 및 북한 비핵화 논의가 더욱 어려운 상황에 직면하였다.","chapter":1,"section":1,"page":16,"src":"2012 외교백서 01.pdf","id":"2011-s00096"},{"year":2012,"admin":"이명박","text":"남북 간 교역은 천안함 폭침, 연평도 포격 도발에 대한 북한의 책임있는 조치를 유도하기 위하여 시행된 ‘5.24 조치’의 기조 하에서도 개성공단의 생산성 증가로 인하여 2012년에는 전년도 17억 1천 불 대비 15.0% 증가한 19억 7천만 불을 기록하였다.","chapter":1,"section":1,"page":20,"src":"2013 외교백서_제1장.pdf","id":"2012-s00148"},{"year":2013,"admin":"박근혜","text":"2010년 11월을 마지막으로 연평도 포격도발 이후 중단되었 던 이산가족 상봉의 조속한 재개를 위해 남·북은 2013년 8월 23일 이산가족 상 봉 추진 관련 적십자 실무 접촉을 통해 9월 25일부터 30일 사이에 이산가족 상봉 행사를 개최하기로 합의하였고, 9월 16일에는 남북 간에 상봉 대상자 최종 명단 까지 교환하였으나, 행사 나흘 전인 9월 21일 북측의 일방적인 연기 통보로 인해 이산가족 상봉 행사는 무산되기에 이르렀다.","chapter":2,"section":1,"page":34,"src":"2014 외교백서_제2장.pdf","id":"2013-s00184"},{"year":2015,"admin":"박근혜","text":"먼저 한반도 차원에서 살펴보면, 김정은 정권은 신년사를 통해 남북 정상회담 가능성까 지 언급하며 유화적 제스처를 취하는 듯했지만, 5월 잠수함발사탄도미사일(SLBM) 시험발 사, 8월 비무장지대(DMZ) 목함지뢰 도발과 서부전선 포격도발 등으로 한반도를 긴장 속에 몰아넣었습니다.","chapter":1,"section":null,"page":2,"src":"2016 외교백서 1장.pdf","id":"2015-s00005"},{"year":2010,"admin":"이명박","text":"또한 연평도 포격도발과 관련해 서도 많은 국가들이 우리 입장을 지지하거나 북한의 도발을 규탄하는 성명을 발표하였다.","chapter":1,"section":1,"page":15,"src":"2011 외교백서_제1장.pdf","id":"2010-s00092"},{"year":2011,"admin":"이명박","text":"그러나 북한은 천안함 폭침을 부인하고 연평도 포격도발의 책임을 우리측에 전가하 는 기존의 입장을 반복하여 남북관계의 진전을 위한 여건이 조성되지 못했다.","chapter":2,"section":1,"page":26,"src":"2012 외교백서 02.pdf","id":"2011-s00159"},{"year":2012,"admin":"이명박","text":"우리 정부는 북한의 무력도발에 대해서는 단호하게 대처할 것임을 천명하고, 천안함 폭침 및 연평도 포격도발에 대해 북한이 책임있는 조치를 취해야 한다는 입장을 밝혔다.","chapter":2,"section":1,"page":29,"src":"2013 외교백서_제2장.pdf","id":"2012-s00188"},{"year":2013,"admin":"박근혜","text":"5) 개성공단 발전적 정상화 관련 국제공조 북한은 그간 연평도 포격도발 및 천안함 피격사건에도 지속되어 온 개성공단 운 제1절 한반도 정세의 안정적 관리 용을 2013년 4월 일방적으로 중단함으로써, 남북 간 모든 경협사업이 중단되는 상황이 초래되었다.","chapter":2,"section":1,"page":35,"src":"2014 외교백서_제2장.pdf","id":"2013-s00194"},{"year":2015,"admin":"박근혜","text":"이에 북한은 8월 20일 DMZ 포격도발을 단행하고 8월 21일 준전시상태 선포 같은 고강도 도발 위협을 하면서 한반도의 긴장을 고조시 켰다.","chapter":1,"section":1,"page":22,"src":"2016 외교백서 1장.pdf","id":"2015-s00152"},{"year":2010,"admin":"이명박","text":"북한문제 관련, 일본은 북한의 천안함 사태, 연평도 포격도발을 강력규탄 하고 우리입장을 적극 지지하였으며 국제사회가 단호하게 대응을 해 나가야 한다는 입 장을 견지하였다.","chapter":1,"section":1,"page":17,"src":"2011 외교백서_제1장.pdf","id":"2010-s00114"},{"year":2011,"admin":"이명박","text":"우리 정부는 북한의 무력도발에 대해서는 단호하게 대처할 것임을 천명하고, 천안함 폭침 및 연평도 포격도발에 대해 북한이 책임있는 조치를 취해야 한다는 입장을 밝혔다.","chapter":2,"section":1,"page":28,"src":"2012 외교백서 02.pdf","id":"2011-s00176"},{"year":2012,"admin":"이명박","text":"이산가족 상봉은 2010년 11월을 마지막으로 연평도 포격도발 이후 중단되었으나, 우리 정부는 이산가족 상봉이 중대한 인도적 사안으로서 조속히, 근본적으로 해결되어야 한다는 입장을 견지해왔다.","chapter":2,"section":1,"page":23,"src":"2013 외교백서_제2장.pdf","id":"2012-s00199"},{"year":2015,"admin":"박근혜","text":"북 한은 8월 비무장지대에서 목함지뢰 및 포격 도발을 해 왔고, 이에 우리 정부는 북한의 도발에 단호한 입장을 견지함으로써 북한이 관련 협상에 나오도록 하였 으며, 북한과 끈질긴 협상 끝에 목함지뢰 및 포격 도발에 대한 북한의 유감 표명 과 함께 8.25 남북합의를 도출해 냈다.","chapter":1,"section":2,"page":25,"src":"2016 외교백서 1장.pdf","id":"2015-s00164"}],"docCount":14},{"id":"평화번영정책","kind":"policy","aliases":["평화번영 정책","평화번영정책"],"total":53,"byYear":{"2003":33,"2004":4,"2005":9,"2006":7},"rateByYear":{"2003":113.6,"2004":144.9,"2005":77.2,"2006":45.8},"byAdmin":{"노무현":53},"focus":1.0,"first":2003,"last":2006,"peak":2003,"peakRate":"2004","docs":[{"year":2003,"admin":"노무현","text":"외교통상부는 한반도의 평화와 안정을 확고히 하기 위해 평화번영정책과 균형적 실용외교를 추 진함으로써 안보 현안들에 능동적으로 대응하는 한편, 선진 경제로의 도약을 위해 경제∙통상 외교 활동을 적극 전개하였습니다.","chapter":null,"section":null,"page":1,"src":"2004 외교백서 발간사_목차.pdf","id":"2003-s00002"},{"year":2004,"admin":"노무현","text":"외교통상부는 북핵 문제의 평화적 해결, 한∙미 동맹관계의 공고화, 이라크파병, 자유무역협정(FTA) 추진등우리의국 익을 위해 어느 것 하나 소홀히 할 수 없는 과제들에 직면하 여, 참여정부의 외교정책 기조인 평화번영정책과 균형적 실 용외교를바탕으로국민이익을극대화하고자최대한노력을기울였습니다.","chapter":null,"section":null,"page":3,"src":"2005 외교백서 발간사_목차.pdf","id":"2004-s00002"},{"year":2005,"admin":"노무현","text":"제3절 _ 주변국과 미래지향적 관계 발전 | 59 4절 Ministry of Foreign Affairs and Trade 남북 교류협력과 북한의 국제사회 참여 지원 참여정부는 출범 이후 평화번영정책을 일관되게 추진하면서, 한반도 평화 증진 및 남북 한의 공동번영을 추구해 오고 있다.","chapter":2,"section":3,"page":891,"src":"2006 외교백서 제2장.pdf","id":"2005-s00368"},{"year":2006,"admin":"노무현","text":"2006년의 경우 우리와 국제사회의 우려와 자제 요청에도 불구하고 북한이 미사일 발사와 핵실험 등 도발적 행위를 감행함으로써 남북 당국간 대화가 중단되고 주요 경협사업의 추진이 차질을 빚는 등 남북관계가 경색되었으며 평화번영정책에 대한 국내외의 비판에 직면하기도 하였다.","chapter":2,"section":4,"page":34,"src":"2007 외교백서 제2장.pdf","id":"2006-s00431"},{"year":2003,"admin":"노무현","text":"아울러 제반 양자 및 다자 계기를 통해 참여정부의 평화번영정책에 대한 국제사회의 지지 를 확보하였습니다.","chapter":null,"section":null,"page":1,"src":"2004 외교백서 발간사_목차.pdf","id":"2003-s00004"},{"year":2004,"admin":"노무현","text":"우리 정 부는 한반도에 평화를 정착시키고 남북한 공동번영을 추구함으로써 평화통일의 기반을 조성하고 동북 아 공존∙공영의 토대를 마련하고자 하는 안보정책 구상인 평화번영정책을 적극적으로 추진하였다.","chapter":1,"section":2,"page":7,"src":"2005 외교백서 제1장.pdf","id":"2004-s00189"},{"year":2005,"admin":"노무현","text":"우리 정부의 평화번영정책은 과거 냉전의 시기에 갈 등과 대립으로 점철되어 온 한반도를 동북아 평화와 번영의 중심으로 만들어 나감으로써 동북아 지역의 안정과 번영뿐만 아니라 세계평화에도 기여한다는 역사인식에 기초하고 있다.","chapter":2,"section":4,"page":33,"src":"2006 외교백서 제2장.pdf","id":"2005-s00369"},{"year":2006,"admin":"노무현","text":"그러나, 우리 정부는 ASEM 정상회의(9월 9일~12일), 제61차 유엔총회(9월 17일~27 일), APEC 정상회의(11월 17일~19일) 등 주요 다자간 정상회의 및 미국, 일본, 중국, 러시아 등 주요국과의 고위급 회담시 평화번영정책이 남북간 긴장완화를 통해 한반도 평화와 안정 유지에 기여해 온 점을 설명하면서 우리의 대북정책에 대한 국제사회의 지지확보를 위한 외교적 노력을 지속해 왔다.","chapter":2,"section":4,"page":34,"src":"2007 외교백서 제2장.pdf","id":"2006-s00432"},{"year":2003,"admin":"노무현","text":"또한, 정부는 한반도에 평화를 정착시키고, 남북한 공동번영을 추 구함으로써 평화통일의 기반을 조성하고 동북아 공존∙공영의 토대 를 마련하고자 하는 참여정부의 안보정책 구상인 평화번영정책을 적 극적으로 추진하여 왔다.","chapter":2,"section":2,"page":4,"src":"2004 외교백서 제2장.pdf","id":"2003-s00891"},{"year":2004,"admin":"노무현","text":"아 울러 주요 양자 및 다자회의 계기에 우리의 평화번영정책에 대한 국제사회의 지지를 확보하기 위한 외 교적 노력을 지속적으로 전개하였다.","chapter":1,"section":2,"page":7,"src":"2005 외교백서 제1장.pdf","id":"2004-s00190"},{"year":2005,"admin":"노무현","text":"1. 평화번영정책에 대한 국제사회의 지지 확보 우리 정부는 평화번영정책을 통해 남북한과 동북아의 평화와 번영을 실현하기 위한 노 력을 경주하면서, 북핵 문제의 해결을 위해 외교적 역량을 결집하고 있다.","chapter":2,"section":4,"page":34,"src":"2006 외교백서 제2장.pdf","id":"2005-s00375"},{"year":2006,"admin":"노무현","text":"이와 함께 우리 정부는 평화번영정책의 추진을 통해 북한내 식량난 등 인도적 상황을 개선함 으로써 탈북 요인을 완화하려는 노력도 지속하고 있다.","chapter":2,"section":4,"page":38,"src":"2007 외교백서 제2장.pdf","id":"2006-s00449"}],"docCount":12},{"id":"정전협정","kind":"treaty","aliases":["정전 협정","정전협정"],"total":49,"byYear":{"1995":6,"1996":10,"1997":9,"1998":6,"1999":4,"2001":1,"2002":2,"2003":1,"2010":4,"2013":3,"2023":3},"rateByYear":{"1995":42.9,"1996":60.3,"1997":41.2,"1998":23.9,"1999":16.0,"2001":3.1,"2002":14.3,"2003":3.4,"2010":20.1,"2013":17.0,"2023":13.6},"byAdmin":{"김영삼":25,"김대중":13,"이명박":4,"박근혜":3,"윤석열":3,"노무현":1},"focus":0.51,"first":1995,"last":2023,"peak":1996,"peakRate":"1996","docs":[{"year":1995,"admin":"김영삼","text":"이는 북한이 1992년 8월에 채택된 남북기본합의서 및 1994년 10월 미ㆍ북간 기본합의문상의 남북대화 재개조항의 이행을 지연ㆍ거부하며 의도적으로 남북관계 개선을 회피하는 한편, 정전기구들의 기능을 정지시 키고 정전협정의 폐기를 위협함으로써 남북관계를 긴장상태로 몰고 갔기 때문이다.","chapter":3,"section":1,"page":3,"src":"1996 외교백서 제3장.pdf","id":"1995-s00671"},{"year":1996,"admin":"김영삼","text":"4자회담은 한반 도 문제의 당사자인 남ㆍ복한과 함께 정전협정 서명에 직접적으로 관여한 미국과 중국을 참여시킴으로써 미국과 대화하려는 북한의 희망을 한반도 평화문제의 남ㆍ북한 당사자 해결원칙의 테두리 내에서 반영한 신축적인 제안이며, 미국과의 협상을 통한 문제해결만을 고집하고 있는 북한의 군 사적 위협이 아직도 존재하고 있는 현실에서 남ㆍ북한 문제를 합리적으로 제 2절 1996년도 주요 외교시책 / 113 해결해 나갈 수 있는 가장 현실적인 방안이라고 평가되고 있다.","chapter":2,"section":2,"page":8,"src":"1997 외교백서 제2장.pdf","id":"1996-s00728"},{"year":1997,"admin":"김영삼","text":"또한 지난해 4월 한 미 양국정상이 남북한과 정전협정 서명 관련국인 미 중이 참여하는 \"4자회담\" 개최를 제의한 이후, 4자회담 공동설명회(97년 3월 5일), 공동설명 후속협의(97월 4월 16일∼21일), 3차례에 걸친 예비회담을 통해 북한의 참여를 유도한 결과, 비로소 1997년 12월 9일 제네바에서 제 1차 4자회담 본회담이 개최되었다.","chapter":1,"section":2,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00132"},{"year":1998,"admin":"김대중","text":"북한은 미.북 평화협정 체결 등 한반도 평화체제 수립에 있어 우리나라를 배제하고 미국과의 직접 대화채널 구축을 기도해 오고 있으나, 한.미 양국은 한반도에서 새로운 평화체제가 수립될 때까지는 현 정전협정이 유지되어야 하며, 한반도 평화체제 수립은 남북 당사자간에 논의되어야 한다는 확고한 입장을 견지해 오고 있다.","chapter":3,"section":1,"page":1,"src":"1999 외교백서 제3장.doc","id":"1998-s00756"},{"year":1999,"admin":"김대중","text":"아울러 한반도 긴장완화와 평화정착을 위한 4자회담의 중요성과 한반도에서 항구적 평화체제 수립시까지 현 정전협정의 유효성을 재확인하는 한편, 1999년 6월 서해사태와 관련해 북한에 대해 북방한계선의 준수를 촉구하고, 심각한 경제난에도 불구하고 탄도 미사일, 생화학무기 등 북한이 대량파괴무기를 증강시키고 있는데 대해 심각한 우려를 표명하면서 북한의 대량파괴무기 사용은 어떠한 상황에서도 용인하지 않을 것임을 재확인하였다.","chapter":3,"section":1,"page":245,"src":"2000 외교백서 제3장.hwp","id":"1999-s00732"},{"year":2001,"admin":"김대중","text":"동 과도정부는 양 종족이 각각 18개월간 정․부통령을 교대로 수행하면서 종족간 화해와 협력을 통해 내전 종식과 평화 정착을 시도하고 있으며, 남아공이 평화유지군을 파견한 상태이나 상금 Hutu계 반군단체와 정부간 정전협정이 미체결된 상황으로 일부 반군의 저항이 계속되고 있어 정세전망이 불투명 상태이다.","chapter":1,"section":3,"page":1,"src":"2002 외교백서 제1장.hwp","id":"2001-s00822"},{"year":2002,"admin":"김대중","text":"특히, 2002년 7월 르완다와의 정전 협정 체결과 2002년 12월 프레토리아 협정 서명 이후 2003년 4월 범민족대화에서 평화협상의 최종법안이 서명됨에 따라 4년간 지속된 내전이 종식될 전망이 한층 밝아졌다.","chapter":1,"section":3,"page":10,"src":"2003 외교백서 제1장.hwp","id":"2002-s00493"},{"year":2003,"admin":"노무현","text":"그 결과 스리랑카 경제는 2002년 2월 정부-LTTE간 정전협정 체 결 이후, LTTE와의 평화과정 진전에 힘입어 관광객 및 외국인 투자 가 크게 증가하고 있으며, 2002년도 GDP 증가율 4% 성장에 이어 2003년도에는 5.5%의 실질성장을 시현하는 등 경제 전반이 호전되 고 있다.","chapter":1,"section":3,"page":47,"src":"2004 외교백서 제1장.pdf","id":"2003-s00326"},{"year":2010,"admin":"이명박","text":"이러한 북한의 무력도발은 유엔 헌장, 남북기본합의서, 정전협정을 위반 한 것으로, 한반도는 물론 동북아의 평화와 안정을 심각하게 저해하는 것이었다.","chapter":1,"section":1,"page":15,"src":"2011 외교백서_제1장.pdf","id":"2010-s00090"},{"year":2013,"admin":"박근혜","text":"북한은 3차 핵실험 이후 3-4월간 정전협정 백 지화 및 남북 불가침합의 전면 폐기 선언, 평양 주재 외교단과 외국인에 대한 철 수 권고, 개성공단 내 북한 근로자 철수 등 지속적으로 도발수위를 높여갔으며, 이에 따라 한반도 정세는 급격히 냉각되었다.","chapter":1,"section":1,"page":21,"src":"2014 외교백서_제1장.pdf","id":"2013-s00129"},{"year":2023,"admin":"윤석열","text":"김정은 위원장은 정전협정 체 결 70주년 기념행사(7.27)에 참석차 방북한 세르게이 쇼이구(Sergei Shoigu) 러시아 국방 장관을 만나 안보 문제를 논의한 데 이어, 코로나19 이후 첫 해외 일정으로 러시아를 방문 (9.12~17), 보스토치니 우주기지에서 푸틴 대통령과 러·북 정상회담을 갖고, 러시아 내 군 수공업 및 군사 시설을 참관하였다.","chapter":1,"section":1,"page":23,"src":"2023년도 국제정세와 외교활동.pdf","id":"2023-s00221"},{"year":1995,"admin":"김영삼","text":"118 / 제 3 장 한반도 평화정착과 통일을 위한 노력 2. 한반도 평화유지를 위한 노력 북한은 1994년이래 정전협정 자체를 유명무실화시키려는 행동을 계속 함으로써 정전협정 체제를 뿌리로부터 흔들었다.","chapter":3,"section":1,"page":4,"src":"1996 외교백서 제3장.pdf","id":"1995-s00673"},{"year":1996,"admin":"김영삼","text":"그 결과 1996년 7월 자카르타에서 개최된 。아세안지역안보포럼(&ㅁ#)\" 각료회의에서는 의장성명에 한반도 평화체제 구축 및 정전협정 준수 필요 성, 남북대화 재개의 중요성, &81)0에 대한 재정적ㆍ정치적 지원 권고 등의 내용이 포함되는 등 한반도 평화정착 및 동북아다자안보대화 (48581) 실현에 대한 역내국가들의 지지를 확보하였다.","chapter":2,"section":2,"page":10,"src":"1997 외교백서 제2장.pdf","id":"1996-s00743"},{"year":1997,"admin":"김영삼","text":"그결과 1997년 7월 말레이시아에서 개최된 제 4차 \"아세안 지역안보포럼(ARF)\" 외무장관회의에서는 의장성명에 한반도 평화체제 구축전까지 정전협정 준수 필요성, 4자회담의 최근 진전사항 환영, KEDO에 대한 재정적 정치적 지원 권고 등의 내용이 포함되는 등 한반도 평화정착을 위한 역내 국가들의 지지를 확보하였다.","chapter":2,"section":2,"page":1,"src":"1998 외교백서 제2장.doc","id":"1997-s00720"}],"docCount":28},{"id":"교토의정서","kind":"treaty","aliases":["교토 의정서","교토의정서"],"total":48,"byYear":{"1997":3,"1998":4,"1999":2,"2000":4,"2001":14,"2002":1,"2003":2,"2006":3,"2007":5,"2008":4,"2009":1,"2010":1,"2011":3,"2012":1},"rateByYear":{"1997":13.7,"1998":15.9,"1999":8.0,"2000":16.0,"2001":44.1,"2002":7.1,"2003":6.9,"2006":19.6,"2007":36.6,"2008":25.4,"2009":5.9,"2010":5.0,"2011":16.5,"2012":4.8},"byAdmin":{"김대중":25,"노무현":10,"이명박":10,"김영삼":3},"focus":0.52,"first":1997,"last":2012,"peak":2001,"peakRate":"2001","docs":[{"year":1997,"admin":"김영삼","text":"나. 지구 환경 협력에의 적극적 동참 (1) 대기 분야 (가) 지구 온난화 방지 1994년 발효한 기후변화협약(UN Framework Convention on Climate Change)에 이어 1997년 12월 기후변화협약 부속 교토의정서(Kyoto Protocol to the UNFCCC)가 채택되었다.","chapter":4,"section":6,"page":1995,"src":"1998 외교백서 제4장.doc","id":"1997-s01954"},{"year":1998,"admin":"김대중","text":"1997년 12월 교토에서 개최된 제 3차 당사국총회는 선진국에 대해 2008∼2012년 기간에 1990년 대비 평균 5% 이상의 온실가스 배출을 감축할 것을 요구하는 구속력 있는 의무를 규정하는 교토의정서(Kyoto Protocol)를 채택하였다.","chapter":5,"section":4,"page":1,"src":"1999 외교백서 제5장.doc","id":"1998-s02081"},{"year":1999,"admin":"김대중","text":"1997년 12월 교토에서 개최된 제 3차 당사국총회는 선진국에 대해 2008년-2012년 기간에 1990년 대비 평균 5%이상의 온실가스 배출을 감축할 것을 요구하는 구속력 있는 의무를 규정하는 교토의정서(Kyoto Protocol)를 채택하였다.","chapter":4,"section":4,"page":58,"src":"2000 외교백서 제4장.hwp","id":"1999-s01349"},{"year":2000,"admin":"김대중","text":"우리는 또한 스위스, 멕시코와 환경협력그룹(Environmental Integrity Group : EIG)을 결성, EU, Umbrella, 77그룹 등 각 그룹간 이해를 조정하는 등 교토의정서의 환경적 건전성을 추구한다는 기본 취지하에 활동함으로써 환경친화국가로서의 이미지를 제고하였으며, EIG 그룹의 공동입장으로 우리의 관심사안을 개진하기도 했다.","chapter":4,"section":3,"page":2000,"src":"2001 외교백서 제4장.hwp","id":"2000-s01236"},{"year":2001,"admin":"김대중","text":"기후변화와 관련하여 국제사회는 2001년 7월 제6차 당사국총회 속개회의와 10월 제7차 당사국총회를 개최하여 교토의정서 메카니즘의 구체적 운영 규칙을 확정, 교토의정서를 세계지속가능발전정상회의 이전까지 발효시키기 위한 토대를 마련하였다.","chapter":4,"section":3,"page":1,"src":"2002 외교백서 제4장.hwp","id":"2001-s01365"},{"year":2002,"admin":"김대중","text":"나. 국제 기구에서의 논의 동향 및 우리의 참여 1) 유엔에서의 환경논의 쳴곌목 수석대표인 최성홍 외교통상부 장관은 기조연설을 통하여 WSSD의 핵심 주제로 논의되었던 빈곤퇴치를 위하여 개도국과 우리의 개발경험을 공유할 의사를 천명하였으며, 교토의정서의 2002년내 비준 추진계획을 표명하는 등 지속가능발전을 위한 우리나라의 국내 외 노력을 소개하였다.","chapter":4,"section":3,"page":1,"src":"2003 외교백서 제4장.hwp","id":"2002-s00824"},{"year":2003,"admin":"노무현","text":"기후변화와 관련하여 국제사회는 2003년 12월 제9차 당사국 총회 와 부속기구회의를 개최하여 교토의정서의 조기발효 필요성을 재확 인하고 러시아에 대한 조기비준을 촉구하였다.","chapter":4,"section":3,"page":67,"src":"2004 외교백서 제4장.pdf","id":"2003-s01573"},{"year":2006,"admin":"노무현","text":"2006년 11월 나이로비에서 개최된 제12차 유엔 기후변화협약 당사국 총회와 제2차 교토의정서 당사국회의 에서는 2012년 이후 선진국의 추가 의무설정을 위한 작업계획과 교토의정서의 기후변화대응 적절성을 점검하기 위한 검토시기를 확정하고, 기후변화 적응 5개년 작업에 관한 나이로비 작업계획과 개도국의 기후변화 적응을 지원하기 위한 적응기금 운영원칙 등을 채택하였다.","chapter":3,"section":4,"page":7,"src":"2007 외교백서 제3장.pdf","id":"2006-s00810"},{"year":2007,"admin":"노무현","text":"동 선언을 통하여 교토의정서 1차 공약기간이 만료되는 2012년 이후 기후변화 대응체제 형성과 관련된 기본방향 설정에 기여하였으며, 2007년 12월 발리 기후변화협약 당사국 총회에 2012년 이후 체제의 조속한 수정을 촉구하는 내용의 강력한 메시지를 전달하였다.","chapter":3,"section":1,"page":72,"src":"2008 외교백서 제3장.pdf","id":"2007-s00573"},{"year":2008,"admin":"이명박","text":"2. 유엔 기후변화협상 대응 1) Post-2012 기후변화협상 현황 2007년 12월 인도네시아 발리에서 개최된 제13차 유엔기후변화협약 당사국 총회 겸 제3차 교토의정서 당사국 총회(이하 발리회의)에서 교토의정서 제1차 공약기간인 2008- 2012년 이후의 기후변화체제 마련을 위한 국제협상(이하 Post-2012 기후변화협상)을 2009년 말까지 마무리 짓기로 합의함에 따라 2008년상반기부터협상이이루어지고있다.","chapter":4,"section":3,"page":24,"src":"2009 외교백서_제4장.pdf","id":"2008-s00922"},{"year":2009,"admin":"이명박","text":"2) 우리의 대응 우리나라는 기후변화에 대한 역사적 책임이 교토의정서 체제에서 감축의무를 부담 하고 있는 선진국과 비교 시 상대적으로 적고, 온실가스 배출이 증가하고 있는 경제₩산업 구조상 온실가스 배출이 안정화되거나 감소하고 있는 선진국과 동일한 형태와 수준의 목 표치를 설정하는 것은 적절하지 않다는 판단에 따라, 범세계적인 기후변화 대응 노력에 적극 동참하되, 우리의 국력과 경제여건에 상응하고 국제사회가 납득할 수 있는 자발적 감축목표치를 제시하였다.","chapter":4,"section":4,"page":133,"src":"2010 외교백서_제4장.pdf","id":"2009-s00965"},{"year":2010,"admin":"이명박","text":"2) 우리의 대응 교토의정서 체제 하에서 우리나라는 선진국에 비해 기후변화에 대한 역사적 책임이 상대적으로 낮고, 경제·산업구조상의 특성도 상이하여 선진국과 동일한 형태와 수준의 목표치를 설정하는 것은 적절치 않다.","chapter":4,"section":4,"page":152,"src":"2011 외교백서_제4장.pdf","id":"2010-s01218"},{"year":2011,"admin":"이명박","text":"기후·환경 분야에서는 2011년 11월 남아공 더반에서 개최된 제17차 기후변화협약 당사국총회(COP17)에서 선진국의 교토의정서 연장과 함께 2020년부터 모든 당사국이 참 여하는 새로운 기후변화체제 설립에 합의하는‘더반 플랫폼’을 채택하였다.","chapter":1,"section":1,"page":10,"src":"2012 외교백서 01.pdf","id":"2011-s00034"},{"year":2012,"admin":"이명박","text":"한편 2012년 12월 카타르 도하에서 개최된 제18차 기후변화협약 당사국 총회 (COP18)에서 당사국들은 2020년 이후 모든 당사국에게 적용되는 신기후체제 구축을 위한 단일한 협상틀 마련에 합의하고, 선진국의 의무적 온실가스 감축을 규정한 교토의정서를 2020년까지 연장하는 것에 합의하였으나, 일부 선진국들이 2012년 국제 정세 및 외교정책 기조 제1절 국제 정세 개관 이 연장안에 참여하지 않기로 함에 따라 그 실효성이 상당부분 약화되었다.","chapter":1,"section":1,"page":11,"src":"2013 외교백서_제1장.pdf","id":"2012-s00054"}],"docCount":32},{"id":"유엔기후변화협약","kind":"treaty","aliases":["유엔기후변화 협약","유엔기후변화협약"],"total":42,"byYear":{"1992":1,"2007":1,"2008":1,"2009":2,"2010":2,"2011":2,"2013":1,"2014":1,"2015":2,"2016":2,"2018":2,"2019":3,"2020":2,"2021":3,"2022":6,"2023":4,"2024":3,"2025":4},"rateByYear":{"1992":7.9,"2007":7.3,"2008":6.4,"2009":11.8,"2010":10.1,"2011":11.0,"2013":5.7,"2014":4.3,"2015":9.2,"2016":25.0,"2018":11.9,"2019":16.5,"2020":8.9,"2021":17.4,"2022":31.6,"2023":18.1,"2024":14.8,"2025":21.9},"byAdmin":{"윤석열":13,"문재인":10,"이명박":7,"박근혜":6,"이재명":4,"노태우":1,"노무현":1},"focus":0.31,"first":1992,"last":2025,"peak":2022,"peakRate":"2022","docs":[{"year":1992,"admin":"노태우","text":"1992년중 오존층 보호를 위한 비엔나 협약, 유 류오열 손해배상을 위한 기금설치협약 등에 가입한 데 이어, 1993년 중에는 유엔기후변화협약, 폐기물 투기에 관한 런던협약 등에 가입할 계획이다.","chapter":3,"section":null,"page":66,"src":"1993 외교백서 제3장.pdf","id":"1992-s00718"},{"year":2007,"admin":"노무현","text":"그러한 가운데 2007년 12월 3~15일간 인도네시아 발리에서 제13차 유엔기후변화협약 당사국총회 겸 제3차 교토의정서 당사국총회(이하 발리회의)가 개최되었다.","chapter":4,"section":2,"page":136,"src":"2008 외교백서 제4장.pdf","id":"2007-s01081"},{"year":2008,"admin":"이명박","text":"2. 유엔 기후변화협상 대응 1) Post-2012 기후변화협상 현황 2007년 12월 인도네시아 발리에서 개최된 제13차 유엔기후변화협약 당사국 총회 겸 제3차 교토의정서 당사국 총회(이하 발리회의)에서 교토의정서 제1차 공약기간인 2008- 2012년 이후의 기후변화체제 마련을 위한 국제협상(이하 Post-2012 기후변화협상)을 2009년 말까지 마무리 짓기로 합의함에 따라 2008년상반기부터협상이이루어지고있다.","chapter":4,"section":3,"page":24,"src":"2009 외교백서_제4장.pdf","id":"2008-s00922"},{"year":2009,"admin":"이명박","text":"그 132 _ 2010 외교백서 러자 코펜하겐 총회의 의장국인 덴마크는 통상 각료급인 유엔기후변화협약 당사국 총회 에 우리나라를 포함한 전 세계 193개국 정상들을 초청하여 추후 협상 타결을 위한 정치적 합의 도출을 도모하였다.","chapter":4,"section":4,"page":31,"src":"2010 외교백서_제4장.pdf","id":"2009-s00960"},{"year":2010,"admin":"이명박","text":"2) 저탄소녹색성장 정책 홍보 우리나라는 제16차 유엔기후변화협약 당사국총회(이하 칸쿤 기후변화총회) 등 각종 다자회의 및 양자회담에서 저탄소녹색성장 비전과 제18차 유엔기후변화협약 당사국총회 (COP18 : the 18th Conference of the Parties to the United Nations Framework Con- vention on Climate Change) 유치 추진 전략을 적극적으로 홍보하였다.","chapter":4,"section":4,"page":151,"src":"2011 외교백서_제4장.pdf","id":"2010-s01211"},{"year":2011,"admin":"이명박","text":"2) 저탄소녹색성장 정책 홍보 우리나라는 제17차 유엔기후변화협약 당사국총회(이하 더반 당사국총회) 등 각종 다 자회의 및 양자회담에서 저탄소녹색성장 비전을 적극적으로 홍보하였다.","chapter":4,"section":4,"page":147,"src":"2012 외교백서 04.pdf","id":"2011-s00993"},{"year":2013,"admin":"박근혜","text":"유엔 기후변화협상 대응과 녹색기후기금(GCF) 사무국 유치 우리나라는 11월 11-23일간 폴란드 바르샤바에서 개최된 제19차 유엔기후변화 협약 당사국총회(COP19)를 비롯하여 유엔기후변화협약 당사국총회 사전 장관급 회의(Pre-COP), 주요경제국포럼(MEF), 피터스버그 기후변화 대화 등 주요 공 식 및 비공식 기후변화 협상 국제회의에 참여하여, 우리 입장을 개진하는 한편 선·개도국 간 가교역할을 수행함으로써 2020년 이후 신 기후체제 마련을 위한 협상 진전에 건설적 기여를 하였다.","chapter":4,"section":2,"page":186,"src":"2014 외교백서_제4장.pdf","id":"2013-s00964"},{"year":2014,"admin":"박근혜","text":"유엔 기후변화협상 대응과 녹색기후기금(GCF) 재원 조성 우리나라는 12월 1~14일 페루 리마에서 개최된 제20차 유엔기후변화협약 당사 국총회(COP20)를 비롯하여 유엔기후정상회의, 주요경제국포럼(MEF), 피터스버 그 기후변화 대화, 카르타헤나 기후변화 대화 등 주요 공식 및 비공식 기후변화 협상 국제회의에 참여하여 우리 입장을 개진하는 한편 선진국·개도국 간 가교 역할을 수행함으로써 2020년 이후 신기후변화체제 마련을 위한 협상 진전에
