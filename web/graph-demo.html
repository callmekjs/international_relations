:2015,"admin":"박근혜","text":"또한 양국 대통령은 한국의 유라시아 이니셔티브와 러시아의 신 동방정책이 공동의 목표를 지향하고 있으며, 어려운 국제 환경에도 불구하고 실질협력을 추 진할 수 있는 동력이 되고 있다는 데 인식을 같이 하고 러시아의 극동·시베리아 개발 협력 등을 통해 양국 관계를 좀 더 호혜적인 차원으로 발전시켜 나가기로 하 였다.","chapter":2,"section":4,"page":86,"src":"2016 외교백서 2장.pdf","id":"2015-s00486"},{"year":2014,"admin":"박근혜","text":"2) 유라시아 이니셔티브 (1) 개념 유라시아 이니셔티브란? 유라시아 지역의 지속 가능한 번영과 평 화를 이룩하기 위하여 대한민국이 제시 한 국가대전략이자 유라시아의 미래를 위해 역내 국가들과 함께 ‘하나의 대륙’, ‘창조의 대륙’, ‘평화의 대륙’을 만들어 나 가자는 협력 구상이다.","chapter":2,"section":4,"page":91,"src":"2015 외교백서(국문)-2장.pdf","id":"2014-s00510"},{"year":2015,"admin":"박근혜","text":"2) 유라시아 이니셔티브 박근혜 정부는 아시아와 유럽의 연계성과 교류 협력 증진을 통해 지속가능한 번 영과 평화를 이룩하고자 유라시아 주요 권역을 대상으로 정상외교, 역내 연계성 증진을 위한 시범사업, 호혜적 협력 촉진을 위한 제도적 기반 구축, 창조경제 생 태계 조성 등을 통해 다각적으로 유라시아 이니셔티브를 추진하였다.","chapter":2,"section":4,"page":94,"src":"2016 외교백서 2장.pdf","id":"2015-s00526"},{"year":2014,"admin":"박근혜","text":"유라시아 이니셔티브의 3가지 개념 첫째, 유라시아를 유기적으로 연계하는 ‘하나의 대륙’ 제4절 주변국과의 전략적 협력 심화 유라시아는 지리상으로 단일 대륙이지만 이념과 체제, 지역 간 장벽으로 인해 연계성과 역동성을 살리지 못한 채 고립과 단절의 시간을 보냈다.","chapter":2,"section":4,"page":91,"src":"2015 외교백서(국문)-2장.pdf","id":"2014-s00512"},{"year":2015,"admin":"박근혜","text":"정상외교 차원에서는 4월과 5월 우리나라를 각각 방문한 우즈베키스탄, 투르 제4절 주변국과의 전략적 협력 심화 크메니스탄, 타지키스탄 대통령이 유라시아 이니셔티브 지지를 재확인하였으며 9월 서울에서 개최된 한·EU 정상회담에서 28개 EU 회원국들이 유라시아 구상 을 명시적으로 지지하였다.","chapter":2,"section":4,"page":94,"src":"2016 외교백서 2장.pdf","id":"2015-s00527"}],"docCount":7},{"id":"평화조약","kind":"treaty","aliases":["평화조약"],"total":23,"byYear":{"1989":1,"1996":1,"1997":3,"1998":2,"1999":4,"2000":5,"2001":2,"2002":1,"2003":3,"2019":1},"rateByYear":{"1989":6.7,"1996":6.0,"1997":13.7,"1998":8.0,"1999":16.0,"2000":20.0,"2001":6.3,"2002":7.1,"2003":10.3,"2019":5.5},"byAdmin":{"김대중":14,"김영삼":4,"노무현":3,"노태우":1,"문재인":1},"focus":0.61,"first":1989,"last":2019,"peak":2000,"peakRate":"2000","docs":[{"year":1989,"admin":"노태우","text":"북방 4개 특빼배빼 등으로 평화조약이 체결되지 못한 채 냉각상태를 지속 해 온 일-소관계는 고르바죠프 서기장 집권 이래 서서히 개선되어 왔으며, 특히 1988년 12월의 세바르드나제 외상 방일시, 고르바죠프 서기장 방일을 추진할 것에 양국이 합의를 보는 등 그간 일ㆍ소판계의 진전을 위한 노력이 양국간에 꾸준히 계속되어 왔다.","chapter":4,"section":null,"page":3,"src":"1990 외교백서 제4장.pdf","id":"1989-s01024"},{"year":1996,"admin":"김영삼","text":"일ㆍ러관계는 1993 10월 Yeltsin 러시아 대통령과 입전승침(세천) 일본 총리간의 '도쿄선언'으로 양국간 현안인 평화조약의 조기체결 교섭 에 합의하는 등 관계개선의 조짐을 보였으나, 1996년에도 최대현안인 북방4도 문제를 둘러싼 양국간의 이견 및 Yeltsin 대통령의 건강문제 등으로 별다른 관계진전은 없었던 것으로 평가된다.","chapter":1,"section":3,"page":20,"src":"1997 외교백서 제1장.pdf","id":"1996-s00172"},{"year":1997,"admin":"김영삼","text":"러시아와는 11월 Yeltsin 대통령과의 크라스노야르스크 회담을 통해 2000년까지 평화조약을 체결하기로 합의하는 등 북방영토 문제 해결을 위한 우호적인 환경을 조성하였고, 중국과는 일 중 국교정상화 25주년을 맞이하여 정상급 교류를 통해 어업협정 체결 등 현안을 타결하였다.","chapter":1,"section":3,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00161"},{"year":1998,"admin":"김대중","text":"1998년중 일본은 주변사태법 등 신 미.일 방위협력지침 관련법안의 정비를 통한 미국과의 안보협력 강화, 소위 북방 영토문제 해결과 2000년까지 일.러 평화조약 체결을 목표로 한 대러 관계 증진, 일.중 평화우호조약 체결 20주년을 맞아 쟝쩌민(江澤民) 주석의 방일을 통한 대중관계 강화 등을 추진하였다.","chapter":1,"section":3,"page":1,"src":"1999 외교백서 제1장.doc","id":"1998-s00172"},{"year":1999,"admin":"김대중","text":"러시아와의 북방영토문제 해결과 평화조약 체결 교섭 또한 영토문제에 대한 양국간 이견과 Yeltsin 대통령의 건강문제로 인한 일본 방문 연기로 별다른 진전을 거두지 못하였다.","chapter":1,"section":1,"page":1,"src":"2000 외교백서 제1장.hwp","id":"1999-s00039"},{"year":2000,"admin":"김대중","text":"그러나 양국사이에는 '북방 4도' 즉 쿠릴열도 남부 4개섬의 영유권 문제와 평화조약 체결 문제가 마땅한 접점을 찾지 못하고 여전히 해묵은 현안으로 자리 잡고 있다.","chapter":1,"section":2,"page":1,"src":"2001 외교백서 제1장.hwp","id":"2000-s00121"},{"year":2001,"admin":"김대중","text":"러시아와의 관계에 있어 일본 정부는 남쿠릴 4도 영유권 문제해결과 양국간 평화조약 체결을 목표로 일․러 관계 개선을 추진하였다.","chapter":1,"section":3,"page":1,"src":"2002 외교백서 제1장.hwp","id":"2001-s00328"},{"year":2002,"admin":"김대중","text":"촰뫔뭧 촰뫔뭧 일본은 평화조약 체결문제를 북방4도 귀속문제와 동시에 해결한다는 기본방침을 유지하면서, 1956년 소 공동선언 , 1993년 동경선언 , 2001년 이르쿠츠크 성명 등 그간 축적된 성과를 바탕으로 러시아 측과 계속 교섭해 나가기로 하였다.","chapter":1,"section":3,"page":10,"src":"2003 외교백서 제1장.hwp","id":"2002-s00226"},{"year":2003,"admin":"노무현","text":"일본은 일∙러간 최대 현안인 남쿠릴 4도(북방4도) 영유권 문제해 결과 평화조약 체결을 기본 목표로 하는 한편, 이를 위한 환경조성 차원에서 경제협력(극동지역 개발협력 및 파이프라인 건설 등) 강화 등을 통한 사전 정지 작업도 병행하고 있다.","chapter":1,"section":3,"page":30,"src":"2004 외교백서 제1장.pdf","id":"2003-s00230"},{"year":2019,"admin":"문재인","text":"러시아와는 9월 일ㆍ러 정상회남을 비롯해 수차례 의 장ㆍ차관급 협의를 개최했으나 평화조약 협상에 가시적 진전은 거의 없었다.","chapter":1,"section":1,"page":11,"src":"2020 외교백서 국문_제1장.pdf","id":"2019-s00052"},{"year":1997,"admin":"김영삼","text":"하시모토 총리는 7월 \"신뢰, 상호이익, 장기적 관점\"이라는 대러시아 외교 3원칙을 발표하여 기존의 정경불가분의 원칙에서 벗어나 중층적인 성격의 대러정책으로 전환하였고, 11월초 Yeltsin 대통령과의 크라스노야르스크 정상회담에서 2000년까지 평화조약의 체결 및 대러 경제협력을 위한 하시모토-Yeltsin 플랜의 추진에 합의하였다.","chapter":1,"section":3,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00178"},{"year":1998,"admin":"김대중","text":"일.러 양국은 1998년 4월 가와나(川奈)에서의 하시모토 (橋本) 총리와 Yeltsin 대통령간 정상회담에서 1997년 11월 크라스노야르스크 정상회담시 합의한 바 있는 2000년까지의 평화조약 체결 원칙을 재확인 하는 한편, 평화조약에는 북방 4도 귀속문제를 포함한 21세기 일.러간 우호협력의 원칙 등을 포함하기로 하였다.","chapter":1,"section":3,"page":1,"src":"1999 외교백서 제1장.doc","id":"1998-s00203"},{"year":1999,"admin":"김대중","text":"북방 4도 반환문제를 포함하여 러시아와의 관계정상화(평화조약 체결)가 시급한 외교목표인 일본은 1998년 11월 일.러 양국 정상회담에서 '창조적 파트너십'을 표방하였다.","chapter":1,"section":2,"page":1,"src":"2000 외교백서 제1장.hwp","id":"1999-s00108"},{"year":2000,"admin":"김대중","text":"러시아와의 관계에 있어 일본 정부는 남부쿠릴열도(북방4도) 영유권 문제 해결과 양국간 평화조약 체결을 목표로 일 러 관계 개선을 추진하였다.","chapter":1,"section":3,"page":1,"src":"2001 외교백서 제1장.hwp","id":"2000-s00180"}],"docCount":20},{"id":"침투사건","kind":"event","aliases":["침투 사건","침투사건"],"total":22,"byYear":{"1996":14,"1997":5,"1998":2,"2010":1},"rateByYear":{"1996":84.4,"1997":22.9,"1998":8.0,"2010":5.0},"byAdmin":{"김영삼":19,"김대중":2,"이명박":1},"focus":0.86,"first":1996,"last":2010,"peak":1996,"peakRate":"1996","docs":[{"year":1996,"admin":"김영삼","text":"북한의 잠수함 침투사건으로 인해 유발된 남ㆍ 북한간 군사적 대치국면를 비롯하여 여러 가지 도전과 어려움도 있었습니 다만, 우리는 국민적인 지지를 바탕으로 외교력을 발휘하여 이러한 일들 을 극복하고 여러 가지 소중한 성과를 거두었습니다.","chapter":null,"section":null,"page":3,"src":"1997 외교백서 머리말_목차.pdf","id":"1996-s00004"},{"year":1997,"admin":"김영삼","text":"1996년 9월 강릉 잠수함 침투사건으로 제2차 공동 발굴작업이 무산된 이래, 1997년 5월 4일∼13일간 뉴욕에서 개최된 미·북간 회담에서 97년중으로 미군유해 공동발굴작업을 재개키로 합의한 후, 6월 25일∼27일 뉴욕에서 열린 미군유해 공동발굴을 위한 실무협상을 통해 97년에 3차례의 공동 발굴작업을 실시하기로 합의, 실행되었다.","chapter":1,"section":2,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00139"},{"year":1998,"admin":"김대중","text":"북한은 1998년에도 여전히 로켓추진체 발사, 금창리 지하 의혹시설, 잠수정 침투사건 등 지속적으로 긴장을 조성하면서 한국을 배제한 채로 대미 접근전략에 집착하였다.","chapter":1,"section":2,"page":1,"src":"1999 외교백서 제1장.doc","id":"1998-s00141"},{"year":2010,"admin":"이명박","text":"제2절 국제평화를 위한 기여 확대 1. 유엔과의 관계 강화 2010년에는 1996년 북한 잠수함 침투 사건 이후 처음으로 북한의 대남 도발 사안 에 대하여 유엔 안전보장이사회 조치가 채택되었다.","chapter":5,"section":2,"page":198,"src":"2011 외교백서_제5장.pdf","id":"2010-s01576"},{"year":1996,"admin":"김영삼","text":"한ㆍ미 양국은 북한이 잠수함 침투사건에 대한 공식 사과 등 납득할 만한 조치를 취할 때까지 북한과 직접 관련된 KEDO 사업 및 대북 지원사업 등의 시행에 일시적 후퇴가 불가피하다는데 인식을 같이하였으며, 이에 따라 남ㆍ북한간의 접촉과 교류도 사실상 중단되었다.","chapter":1,"section":2,"page":9,"src":"1997 외교백서 제1장.pdf","id":"1996-s00098"},{"year":1997,"admin":"김영삼","text":"잠수함 침투 사건에 대해 북한이 사과하고 재발 방지를 약속함으로써 제네바 합의 이행을 위한 제반 사업이 재개되었다.","chapter":2,"section":2,"page":1,"src":"1998 외교백서 제2장.doc","id":"1997-s00702"},{"year":1998,"admin":"김대중","text":"1991년 3월 한국군 장성이 군정위 수석대표에 임명된 이후, 군정위 활동에 불참해온 북한은 1994년말 미.북 장성급 회담을 제의하였고, 이에 대하여 한.미 양국은 1998년 2월 우리군 장성이 포함된 유엔사.북한군간 장성급 회담을 북한측에 제의, 6월 8일 유엔사와 북한군이 판문점 장성급 회담 절차안에 합의하였으며, 양측은 1998년중 3차례 회담을 개최하여 북한 잠수정 및 무장간첩 침투사건 등을 논의하였다.","chapter":3,"section":1,"page":1,"src":"1999 외교백서 제3장.doc","id":"1998-s00757"},{"year":1996,"admin":"김영삼","text":"일본은 한ㆍ일 관계에 대한 배려와 함께, 4월 한ㆍ미 양국이 제의한 4자회담에 북한이 전혀 반응을 보이지 않는 가운데 9월 북한의 잠수함 침투사건이 발생하는 등 한반도 정세가 호전되는 기미를 보이지 않음에 따라 북한과의 관계 개선에 신중히 대처하였다.","chapter":1,"section":3,"page":21,"src":"1997 외교백서 제1장.pdf","id":"1996-s00175"},{"year":1997,"admin":"김영삼","text":"1996년 9월 18일 북한의 잠수함 침투사건이 발생한 후, 제네바 합의 이행은 일시적인 경색국면을 맞았다.","chapter":3,"section":3,"page":30,"src":"1998 외교백서 제3장.doc","id":"1997-s00850"}],"docCount":9},{"id":"멸종위기","kind":"event","aliases":["멸종 위기","멸종위기"],"total":22,"byYear":{"1993":3,"1994":2,"1995":1,"1996":2,"1997":2,"1998":3,"1999":2,"2000":3,"2002":1,"2013":1,"2014":1,"2025":1},"rateByYear":{"1993":23.8,"1994":15.0,"1995":7.1,"1996":12.1,"1997":9.2,"1998":11.9,"1999":8.0,"2000":12.0,"2002":7.1,"2013":5.7,"2014":4.3,"2025":5.5},"byAdmin":{"김영삼":10,"김대중":9,"박근혜":2,"이재명":1},"focus":0.45,"first":1993,"last":2025,"peak":1993,"peakRate":"1993","docs":[{"year":1993,"admin":"김영삼","text":"또한 1993년도에 접어들면서 멸종위기에 처한 야생 동식물의 보호를 위한 국제적 노력이 더욱 강화되었다.","chapter":5,"section":4,"page":48,"src":"1994 외교백서 제5장.pdf","id":"1993-s01035"},{"year":1994,"admin":"김영삼","text":"한편, 생물종의 다양성 보존을 위한 “생물다양성협약” 제1차 당사국 총회와 \"멸종위기에 처한 야생동식물의 국제거래에 관한 협약” (01785) 제9차 당사국 총회가 1994년 11, 18월중 개최되었다.","chapter":4,"section":5,"page":45,"src":"1995 외교백서 제4장.pdf","id":"1994-s00954"},{"year":1995,"admin":"김영삼","text":"'멸종위기 동식물의 국제거래에 관한 협약 (21785) '과 관련하여서는 협약 상임위원회 및 아주지역 회의 등이 개최되어 주요 관심 대상인 호랑 이, 코뿔소 보호를 위한 구체적인 국제적 노력방안에 관해 협의하였고, 현재 급속히 감소하고 있는 것으로 알려져 있는 상어, 고래 보호 문제를 계속 논의키로 하였다.","chapter":4,"section":5,"page":36,"src":"1996 외교백서 제4장.pdf","id":"1995-s00994"},{"year":1996,"admin":"김영삼","text":"다) 멸종위기 야생동식물 보호 1996년도에 개최된 멸종위기에 처한 야성동식물의 국제거래에 관한 협약(01785) 의 주요회의는 제 13차 동물위원회(1996.9) 및 제 37차 상임위원회 (1996. 12) 였다.","chapter":4,"section":5,"page":107,"src":"1997 외교백서 제4장.pdf","id":"1996-s01503"},{"year":1997,"admin":"김영삼","text":"(다) 멸종위기 야생 동식물 보호 1997년에 개최된 멸종위기에 처한 야생 동식물의 국제거래에 관한 협약(Convention on International Trade in Endangered Species of Wild Fauna and Flora: CITES)의 주요회의는 6월에 개최된 제 10차 당사국총회였다.","chapter":4,"section":6,"page":1995,"src":"1998 외교백서 제4장.doc","id":"1997-s01984"},{"year":1998,"admin":"김대중","text":"다) 멸종위기 야생 동식물 보호 멸종위기에 처한 야생동식물 종의 국제거래에 관한 협약(CITES)은 멸종위기에 처한 동.식물의 국제거래를 규제하기 위한 목적으로 1973년 3월 워싱턴에서 채택되었으며 우리나라는 1993년 7월 9일 가입서를 기탁하였다.","chapter":5,"section":4,"page":1,"src":"1999 외교백서 제5장.doc","id":"1998-s02110"},{"year":1999,"admin":"김대중","text":"마. 멸종위기 야생 동식물 보호 멸종위기에 처한 야생동식물종의 국제거래에 관한 협약(Convention on International Trade in Endangered Species of Wild Fauna and Flora : CITES)은 멸종위기에 처한 동․식물의 국제거래를 규제하기 위한 목적으로 1973년 3월 워싱턴에서 채택되었으며 우리나라는 1993년 7월 9일 가입서를 기탁하였다.","chapter":4,"section":4,"page":58,"src":"2000 외교백서 제4장.hwp","id":"1999-s01379"},{"year":2000,"admin":"김대중","text":"우리는 멸종위기에 처한 야생 동식물종의 보호를 위해 국제 거래를 통제하는 CITES협약(Convention on International Trade in Endangered Species of Wild Fauna and Flora) 제11차 당사국총회(2000년 4월, 나이로비)에 참석, 인삼을 동 협약상의 교역규제 품목으로 등재시키려는 러시아의 부속서 개정 제안시 한국산 인삼을 국제거래 규제대상에서 제외하는 결정을 채택토록 하였다.","chapter":4,"section":3,"page":2000,"src":"2001 외교백서 제4장.hwp","id":"2000-s01238"},{"year":2002,"admin":"김대중","text":"2) 생태계 분야 뭕계볿 2002년 11월에는 칠레 산티아고에서 멸종위기에 처한 야생동 식물종의 국제거래에 관한 협약(CITES) 제12차 당사국총회가 개최되었다.","chapter":4,"section":3,"page":1,"src":"2003 외교백서 제4장.hwp","id":"2002-s00833"},{"year":2013,"admin":"박근혜","text":"현재 우리나라는 생태계 분야에서는 생물다양성협약, 멸종위기에 처한 동식물 의 국제거래에 관한 협약(CITES), 습지보전을 위한 람사르(Ramsar)협약, 화학 및 폐기물 분야에서는 유해폐기물의 국가 간 이동 및 처리 통제에 관한 바젤협약, 잔류성 유기오염물질에 관한 스톡홀름협약, 유해화학물질 사전 승인 통보에 관한 로테르담협약 등의 주요 국제 환경협약에 가입하여 생물다양성 보전 및 지속가능 한 이용, 화학 및 유해폐기물의 국제적 관리 등 전 지구적 환경 이슈논의 및 대응 에 적극 동참하고 있다.","chapter":4,"section":2,"page":188,"src":"2014 외교백서_제4장.pdf","id":"2013-s00975"},{"year":2014,"admin":"박근혜","text":"현재 우리나라는 생태계 분야에서 생물다양성협약, 멸종 위기에 처한 동식물 의 국제거래에 관한 협약(CITES), 습지 보전을 위한 람사르(Ramsar) 협약과 화 학 및 폐기물 분야에서 유해폐기물의 국가 간 이동 및 처리 통제에 관한 바젤협 약, 잔류성 유기오염물질에 관한 스톡홀름협약, 유해화학물질 사전 승인 통보에 관한 로테르담협약 등 주요 국제 환경협약에 가입하여 생물 다양성의 보전 및 지 속 가능한 이용, 화학 및 유해폐기물의 국제 관리 등 전 지구 차원의 환경 이슈 논 의 및 대응에 적극 동참하고 있다.","chapter":4,"section":2,"page":238,"src":"2015 외교백서(국문)-4장.pdf","id":"2014-s01320"},{"year":1993,"admin":"김영삼","text":"세계야생기금(0/\\00)등 환경보호 단체들 은 멸종 위기에 처한 야생동식물의 국제 거래에 관한 협약(01788) 위반국 들에 대한 무역제재 조치를 강력히 주장하고, 미국 정부는 위반국들에 대한 무역 제재 방안을 구체적으로 검토하기에 이르렀다.","chapter":5,"section":4,"page":48,"src":"1994 외교백서 제5장.pdf","id":"1993-s01036"},{"year":1994,"admin":"김영삼","text":"1994년 11월 미국 포터 로더데일에서는 멸종위기에 처한 야생 동식물 의 국제거래에 관한 협약 (01785 협약) 제9차 당사국총회가 개최되었다.","chapter":4,"section":5,"page":49,"src":"1995 외교백서 제4장.pdf","id":"1994-s00973"},{"year":1996,"admin":"김영삼","text":"우리 정부는 011085의 당사국으로서 특히 곰쓸개등 멸종위기 동물과 관련된 약재의 밀매행위를 앞으로도 계속 단속해 나가는 한편, 우리 나라의 특정약재 사용에 관한 일부 환경보호기구들의 왜곡ㆍ과장된 시각을 시정하기 위한 노력도 병행해 갈 것이다.","chapter":4,"section":5,"page":107,"src":"1997 외교백서 제4장.pdf","id":"1996-s01506"}],"docCount":21},{"id":"이라크사태","kind":"event","aliases":["이라크 사태","이라크사태"],"total":21,"byYear":{"1996":2,"1997":2,"1998":4,"2002":4,"2003":7,"2005":1,"2006":1},"rateByYear":{"1996":12.1,"1997":9.2,"1998":15.9,"2002":28.5,"2003":24.1,"2005":8.6,"2006":6.5},"byAdmin":{"노무현":9,"김대중":8,"김영삼":4},"focus":0.43,"first":1996,"last":2006,"peak":2003,"peakRate":"2002","docs":[{"year":1996,"admin":"김영삼","text":"60제국, 시리아, 이집트 등은 북부 이라크사태가 역내평화와 안전을 위협하는 것을 우려하여 이라크의 유엔결의 준수를 촉구하는 등 대이라크 견제를 지속하였으나, 영국을 제외한 대다수 유엔 안보리 이사국과 중동 국가들은 미국의 지원요청에 적극적으로 호응하지 않았다.","chapter":1,"section":3,"page":84,"src":"1997 외교백서 제1장.pdf","id":"1996-s00625"},{"year":1997,"admin":"김영삼","text":"이라크가 10월 29일 UNSCOM이 이라크에 대한 미국의 부당한 압력행사 도구로 남용되고 있음을 구실로 미국 국적 UNSCOM 사찰요원들을 추방함으로써 야기된 이라크 사태는 11월 12일 유엔안보리의 대 이라크 추가 제재결의안 채택, 미국의 무력사용 불사 의지 표명 등으로 인해 제 2차 걸프전의 발발 직전까지 지역내 긴장을 고조시켰다.","chapter":1,"section":3,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00374"},{"year":1998,"admin":"김대중","text":"그럼에도 불구하고 유엔 안보리 상임이사국 및 핵 강대국의 지위를 이용하여 코소보 및 이라크 사태 등 국제문제에 대해 적극적인 개입정책을 추진하였으며, 특히 대국주의 외교를 지향하는 Primakov 내각이 9월 출범하면서 외환.금융위기를 극복하기 위한 적극적인 경제외교를 펼쳤다.","chapter":1,"section":1,"page":1,"src":"1999 외교백서 제1장.doc","id":"1998-s00039"},{"year":2002,"admin":"김대중","text":"2. 이라크사태와 대량파괴무기 가. 9.11 테러 이후 미국의 대외정책 기조 변화 자몓뫌몬 뫓부곫 ㅗ촉뒘 몺樂뭦몦몬 몺樂뭦 몔읢표 미국은 대량파괴무기 보유 및 기술이전을 막기 위해 외교적 해결을 모색하는 비확산(nonproliferation) 정책은 물론 요주의 세력들의 WMD 보유의지를 군사적 수단을 통해서라도 사전에 억제하려는 반확산(counterproliferation) 정책을 동시에 추구하고 있다.","chapter":1,"section":3,"page":10,"src":"2003 외교백서 제1장.hwp","id":"2002-s00185"},{"year":2003,"admin":"노무현","text":"나. 경제 정세 2003년 세계경제는 전반기에 이라크 사태에 따른 지정학적 불확 실성, 주식시장 버블의 후유증 및 아시아 지역의 SARS 여파 등으로 다소 부진을 보였으나, 하반기부터 미국과 아시아 지역에서의 투자 분위기 회복과 각국의 적극적인 거시 경제정책 운용에 따라 경기 회복 세를 나타냈다.","chapter":1,"section":1,"page":7,"src":"2004 외교백서 제1장.pdf","id":"2003-s00067"},{"year":2005,"admin":"노무현","text":"ARF 외교장관회의에 참석한 반기문 장관은 북핵 문제, 6자회담 및 최근 남북관계 진전 상황 등을 설명하고 테러 문제와 이라크 사태 등 여타 국제정세에 대한 토의에도 참가하였 다.","chapter":3,"section":3,"page":16,"src":"2006 외교백서 제3장.pdf","id":"2005-s00797"},{"year":2006,"admin":"노무현","text":"2006년국제정세및외교정책기조 제1 절 국제정세개관 1. 국제 정치 정세 개 관 2006년 국제 정세는 북한의 미사일 발사와 핵실험, 이란의 핵 문제 등으로 핵확산 우려가 고조되는 가운데, 이라크 사태의 장기화에 따른 중동지역의 불안정과 국제 테러리즘의 지속은 국제사회의 불안정 요인이 되었다.","chapter":1,"section":null,"page":2,"src":"2007 외교백서 제1장.pdf","id":"2006-s00108"},{"year":1996,"admin":"김영삼","text":"안보리는 1996년중 공식회의 114회, 비공식회의 211회를 개최하여 부 룬디 사태, 동부자이르사태, 이라크사태 등 30여개의 주요국제분쟁을 다 루었으며, 이중에는 1996년 4월 북한의 비무장지대 침범사건 및 1996년 _ ㆍ 9월 북한잠수함사건도 포함되어 있다.","chapter":4,"section":3,"page":65,"src":"1997 외교백서 제4장.pdf","id":"1996-s01257"},{"year":1997,"admin":"김영삼","text":"이라크가 자국내 대량살상무기 생산시설에 대한 UN 특별사찰단(United Nations Special Committee : UNSCOM)의 사찰을 거부함으로써 야기된 위기시 미 영의 대이라크 강경정책에 대해 불, 러, 중등이 온건정책을 제시하고, 이에 따라 Kofi Annan UN사무총장이 외교적으로 이라크 사태를 해결함으로써 이라크에 대한 미국의 봉쇄 정책이 한계에 도달하였다는 견해도 대두되었다.","chapter":1,"section":3,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00587"},{"year":1998,"admin":"김대중","text":"반면에 같은 시기에 이라크 정부가 유엔 특별사찰단 (United Nations Special Commission : UNSCOM)과의 협력 관계를 전면 중단하겠다고 선언하면서 시작된 이라크 사태는 미국과 이라크의 신경전 속에서 2주만에 이라크가 조건 없는 UNSCOM의 사찰을 수용함으로써 수습되는 듯 보였으나 이라크측이 집권 바트당 본부 사찰을 놓고 또 다시 협조를 거부함에 따라 무력충돌 직전까지 이르렀었다.","chapter":1,"section":1,"page":1,"src":"1999 외교백서 제1장.doc","id":"1998-s00048"},{"year":2002,"admin":"김대중","text":"이라크 사태와 관련, 프랑스는 미국을 견제하기 위해 UN 안보리 대이라크 결의안 채택 논의 과정에서 2단계 결의안을 주장하였다.","chapter":1,"section":3,"page":10,"src":"2003 외교백서 제1장.hwp","id":"2002-s00419"},{"year":2003,"admin":"노무현","text":"최근 각종 테러사건이 끊이지 않는 가운데 악화 양상을 보인 반미 주의와 이슬람 근본주의는 향후 이라크 사태 전개에 있어 도전요소 로 부상하고 있다.","chapter":1,"section":1,"page":18,"src":"2004 외교백서 제1장.pdf","id":"2003-s00148"},{"year":1998,"admin":"김대중","text":"오부치 총리의 취임 직후 개최된 Clinton-오부치 정상회담(9월 22일)은 양국간 안보 및 경제.통상분야의 현안을 심도 있게 논의하는 계기가 되었으며, 11월 19∼20일간 Clinton 대통령의 일본 방문시에도 양 정상은 일본의 경제회복 조치, 이라크 사태, 한반도 정세 등과 관련 양국간 긴밀한 협조를 한층 더 강화하기로 합의하였다.","chapter":1,"section":3,"page":1,"src":"1999 외교백서 제1장.doc","id":"1998-s00369"},{"year":2002,"admin":"김대중","text":"이스라엘-팔레스타인 사태는 하반기 들어 이라크 사태가 긴박하게 진행됨에 따라 소강상태에 접어들게 되었다.","chapter":6,"section":null,"page":1,"src":"2003 외교백서 제6장.hwp","id":"2002-s01253"}],"docCount":15},{"id":"세계경제위기","kind":"event","aliases":["세계경제 위기","세계경제위기"],"total":21,"byYear":{"1998":1,"1999":1,"2008":2,"2009":14,"2010":2,"2012":1},"rateByYear":{"1998":4.0,"1999":4.0,"2008":12.7,"2009":82.9,"2010":10.1,"2012":4.8},"byAdmin":{"이명박":19,"김대중":2},"focus":0.9,"first":1998,"last":2012,"peak":2009,"peakRate":"2009","docs":[{"year":1998,"admin":"김대중","text":"이와 같은 현상은 우리나라의 대중남미 교역구성이 공산품을 수출하고 원자재를 주로 수입하는 관계로 최근의 세계경제위기에 따른 경기침체로 인해 중남미국들이 주로 수출하는 원자재 가격이 하락한 것 등에 기인하고 있다.","chapter":5,"section":1,"page":1,"src":"1999 외교백서 제5장.doc","id":"1998-s01537"},{"year":1999,"admin":"김대중","text":"이와 같은 현상은 우리나라의 대중남미 교역품목이 공산품을 수출하고 원자재 등 1차산품을 주로 수입하는 관계로 최근 세계경제위기에 따른 경기침체로 인해 중남미국가들의 주요수출품인 석유를 제외한 원자재의 국제가격이 하락한데 따른 것이다.","chapter":5,"section":1,"page":622,"src":"2000 외교백서 제5장.hwp","id":"1999-s01757"},{"year":2008,"admin":"이명박","text":"특 히, G20 정상회의가 11월 워싱턴에서 개최되어 세계경제위기 극복을 위한 다자적 노력이 활성화되었다.","chapter":1,"section":1,"page":14,"src":"2009 외교백서_제1장.pdf","id":"2008-s00159"},{"year":2009,"admin":"이명박","text":"2010 외교백서 인 사 말 2009년 한 해 우리는 세계경제위기, 북한의 핵실험 등 연이은 도발로 인한 어려운 대외 환경과 숱한 도전 속에서도 외교적 성과를 거둠으로써‘성숙한 세계국가’구현에 한 걸음 더 다가갈 수 있었습니다.","chapter":1,"section":null,"page":5,"src":"2010 외교백서_제1장.pdf","id":"2009-s00001"},{"year":2010,"admin":"이명박","text":"국내 및 중동 지역 학계, 경제계, 문화계 및 정부인사 36명이 참석하여, △ 동북아와 중동의 안보 및 핵 문제 △ G20 정상회의 후 국제경제 전망, 한·아랍 경제 협력, 세계경제 위기 후 아랍경제 전망, 한국 원자력 에너지 개발 경험 △ 한국내 이슬람 연구, 중동내 한국 연구, 문화ㆍ스포츠ㆍ한류, 이슬람 문화와 민주주의 등을 주제로 논의하였다.","chapter":3,"section":4,"page":109,"src":"2011 외교백서_제3장.pdf","id":"2010-s00859"},{"year":2012,"admin":"이명박","text":"2) APEC 주요 의제별 논의내용과 우리의 활동 (1) 무역·투자 자유화 및 지역경제통합 회원국들은 2012년 유럽 재정위기 이후 세계경제 위기 속에서 보호주의를 저지하고 역내 무역·투자 자유화를 통한 성장과 번영을 추구해야 한다는 데 의견을 같이 하였다.","chapter":3,"section":5,"page":147,"src":"2013 외교백서_제3장.pdf","id":"2012-s00913"},{"year":2008,"admin":"이명박","text":"일본 정부는 12월 각료회의에서 내년도 실질 경제성장률을 0%로 잡는 등 세계경제위기의 여파로 인해 어두운 경제전망 을 내놓았다.","chapter":1,"section":1,"page":16,"src":"2009 외교백서_제1장.pdf","id":"2008-s00176"},{"year":2009,"admin":"이명박","text":"특히, 제2, 3차 G20 정상회의에서 G20 의장단 국가 로 활동하면서 세계경제위기 극복을 위한 국제적 노력에 주도적으로 참여한 결과, 금년 11월 G20 정상회의를 한국에서 개최하게 되는 뜻깊은 성과를 거두었습니다.","chapter":1,"section":null,"page":7,"src":"2010 외교백서_제1장.pdf","id":"2009-s00008"},{"year":2010,"admin":"이명박","text":"동 회의의 성과는 첫째, 세계경제 위기 이후 새로운 성장 패러다임 수립과 아·태 지 역의 경제통합에 대한 APEC 회원국들의 의지를 확인한 것이다.","chapter":3,"section":5,"page":111,"src":"2011 외교백서_제3장.pdf","id":"2010-s00868"},{"year":2009,"admin":"이명박","text":"앞으로 세계는 더욱 긴밀히 연결되어 세계경제위기, 기후변화, 테러리즘, 에너지₩자 원 부족과 같은 범세계적 문제의 영향이 보다 확산되고 심화될 것으로 보입니다.","chapter":1,"section":null,"page":9,"src":"2010 외교백서_제1장.pdf","id":"2009-s00021"}],"docCount":10},{"id":"원자력협정","kind":"treaty","aliases":["원자력 협정","원자력협정"],"total":21,"byYear":{"1991":1,"1994":1,"1996":1,"1997":1,"2007":2,"2008":2,"2009":1,"2010":3,"2011":1,"2014":2,"2015":6},"rateByYear":{"1991":8.4,"1994":7.5,"1996":6.0,"1997":4.6,"2007":14.7,"2008":12.7,"2009":5.9,"2010":15.1,"2011":5.5,"2014":8.6,"2015":27.5},"byAdmin":{"박근혜":8,"이명박":7,"김영삼":3,"노무현":2,"노태우":1},"focus":0.38,"first":1991,"last":2015,"peak":2015,"peakRate":"2015","docs":[{"year":1991,"admin":"노태우","text":"또한 118. 제3장 실리외교 추구상 공동번영 al 기여 1991년 ｌＬ1월에는 양국간 원자력협력을 증진키 위한 한ㆍ영 원자력협정이 체결되어 차세대 원자로 및 핵폐기물 관리등 연구협력추진의 기반을 마련하였으 며 1992년 상반기중에 제1차 한ㆍ영 원자력 공동위원회가 개최될 예정이다.","chapter":3,"section":null,"page":33,"src":"1992 외교백서 제3장.pdf","id":"1991-s00658"},{"year":1996,"admin":"김영삼","text":"원자력 분야의 대외 협력은 양자에 있어서는 별도의 원자력협정의 체결을 통하여 이루어지고 있다.","chapter":4,"section":1,"page":37,"src":"1997 외교백서 제4장.pdf","id":"1996-s01093"},{"year":1997,"admin":"김영삼","text":"이러한 배경하에 96년에는 개도국과는 처음으로 아르헨티나 및 베트남과 원자력 협력 협정이 체결되었고, 현재 터키, 브라질, 체코 등과도 원자력 협정 체결을 추진중에 있다.","chapter":4,"section":2,"page":1995,"src":"1998 외교백서 제4장.doc","id":"1997-s01436"},{"year":2007,"admin":"노무현","text":"즉 미국은 3월에 채택된 「일·호 안보협력 공동선언」을 계기로 호주를 미·일 동맹의 틀 속에 편입하여 미· 일·호 삼각 안보협력체제를 출범시켰고, 7월「미·인도 원자력협정」타결을 통해 대인도 접근 노력을 한층 강화하는 등 아·태 지역과 주변 지역을 연결하는 군사 협력관계 확대 노력이 두드러지게 나타났다.","chapter":1,"section":null,"page":17,"src":"2008 외교백서 제1장.pdf","id":"2007-s00144"},{"year":2008,"admin":"이명박","text":"1) 원자력 협력 협정 체결 및 개정 우리나라는 2008년 11월 현재 총 23개국(발효 20개국, 미발효 3개국)과 원자력 협력 협정을 체결하 였으며, UAE, 남아공 등의 국가와도 원자력 협정을 체결하기 위한 문안 교섭을 진행 중이다.","chapter":4,"section":2,"page":22,"src":"2009 외교백서_제4장.pdf","id":"2008-s00907"},{"year":2009,"admin":"이명박","text":"2009년에는 요르단 및 UAE와 원자력협정을 체결하여 양국 원자력협 력 강화를 위한 기반을 마련하였으며, 2009년 12월 우리의 UAE 원전수주가 이루어질 수 있는 법적 기반을 마련하였다.","chapter":4,"section":5,"page":161,"src":"2010 외교백서_제4장.pdf","id":"2009-s01200"},{"year":2010,"admin":"이명박","text":"아르헨티나 기획부 장관 방한을 통해 원전 협력 MOU(9월)가 체결되었으며, 인도, 알 제리, 쿠웨이트, 말레이시아 등과는 원자력 협정을 협의중에 있다.","chapter":4,"section":3,"page":147,"src":"2011 외교백서_제4장.pdf","id":"2010-s01189"},{"year":2011,"admin":"이명박","text":"남아공 및 인도와 원자력 협정을 체결하 여 원전수출 기반을 구축하였으며, 사우디, 알제리 등과 원자력협정 체결을 논의하였다.","chapter":1,"section":2,"page":20,"src":"2012 외교백서 01.pdf","id":"2011-s00135"},{"year":2014,"admin":"박근혜","text":"먼저 양국 외교장관들은 하루 전날에 열린 제46차 한·미 안보 협의회의(SCM)에서의 ‘조건에 기초한 전시작전통제권 전환’ 최종 합의에 대한 환 영 의사를 표명하였으며, 한·미 원자력협정 협상과 관련한 그동안의 진전을 평 가하면서 적시에 협상을 완결하기 위한 의지를 재확인하였다.","chapter":2,"section":3,"page":63,"src":"2015 외교백서(국문)-2장.pdf","id":"2014-s00368"},{"year":2015,"admin":"박근혜","text":"무엇보다 우리 외교의 근간인 한·미 관 계에서는 신(新)원자력협정이 발효됨으로써 1953년 한미상호방위조약(1954년 발효), 한미 자유무역협정(FTA, 2012년 발효)에 이어 동맹을 떠받치는 3대 제도적 장치가 마련되었습 니다.","chapter":1,"section":null,"page":2,"src":"2016 외교백서 1장.pdf","id":"2015-s00015"},{"year":2007,"admin":"노무현","text":"한편, 환경 분야 에서는 중국, 호주와의 철새보호협정 및 튀니지와의 환경협력협정이 발효되었으며, 자원· 에너지 분야에서는 한·우크라이나 원자력협정이 발효되었다.","chapter":3,"section":5,"page":117,"src":"2008 외교백서 제3장.pdf","id":"2007-s00928"},{"year":2008,"admin":"이명박","text":"2008년 에는 요르단과 원자력 협정을 체결하여 양국 원자력 협력 강화를 위한 기반을 마련하였다.","chapter":4,"section":2,"page":22,"src":"2009 외교백서_제4장.pdf","id":"2008-s00908"},{"year":2010,"admin":"이명박","text":"현재 남아공ㆍ일본 등 과는 원자력 협정을 체결하였으며, 한·UAE 원자력협정(1월)은 발효까지 마친 상태이다.","chapter":4,"section":3,"page":147,"src":"2011 외교백서_제4장.pdf","id":"2010-s01190"},{"year":2015,"admin":"박근혜","text":"또 안보협력 증진 기조하에 인도와는 아베 총리의 인도 방문을 계기로 ‘방위 장비 및 기술이전 협정’ 및 ‘군사정보 보호협정’을 체결하고 일·인 원자력협정에 원칙적 합의를 이루는 등 전략적 협력을 확대하였다.","chapter":1,"section":1,"page":13,"src":"2016 외교백서 1장.pdf","id":"2015-s00060"}],"docCount":16},{"id":"마스트리히트조약","kind":"treaty","aliases":["마스트리히트 조약","마스트리히트조약"],"total":21,"byYear":{"1992":4,"1993":4,"1994":3,"1995":2,"1996":2,"1997":3,"1998":2,"2004":1},"rateByYear":{"1992":31.4,"1993":31.7,"1994":22.5,"1995":14.3,"1996":12.1,"1997":13.7,"1998":8.0,"2004":36.2},"byAdmin":{"김영삼":14,"노태우":4,"김대중":2,"노무현":1},"focus":0.67,"first":1992,"last":2004,"peak":1992,"peakRate":"2004","docs":[{"year":1992,"admin":"노태우","text":"마스트리히트조약(1991. 12) 체결을 바탕으로 1990년대 말까지 정치, 경 제, 외교ㆍ안보정책 등의 통합을 겨냥하여 「유럽합중국』을 모색해온 유럽 통합 운동은 80 회원국들의 마스트리히트조약 비준 과정에서 야기된 제반 문제점 및 독일의 고금리정책의 고수에 따른 80 회원국간 통화정책 조정의 실패 등 80 내부문제로 예상대로의 진전을 보지 못하고 있다.","chapter":1,"section":null,"page":1,"src":"1993 외교백서 제1장.pdf","id":"1992-s00012"},{"year":1993,"admin":"김영삼","text":"또한 구주연합조약(마스트리히트조약)이 2년에 걸친 비준과정 끝에 1993 년 11월 1일 발효하여 구주연합(00106863ㅁ1017)이 공식 출범함으로써 | 1993년은 구주통합사에 있어 기념비적인 한해로 기록되었다.","chapter":2,"section":1,"page":5,"src":"1994 외교백서 제2장.pdf","id":"1993-s00072"},{"year":1994,"admin":"김영삼","text":"유럽공동체 (60) 는 93년 11월 마스트리히트조약 발효를 계기로 구주연 합 (80)) 으로 확대 개편되었으며, 스웨덴, 핀란드, 오스트리아가 1994년 중 신규 가입이 결정됨으로써 앞으로 8ㄴ를 중심으로한 유럽 경제권의 위상이 크게 높아질 것으로 전망됨에 따라 정부는 이러한 EU 경제권의 변화동향을 감안하여 대5ㄴ 교역 및 투자확대를 위해 적극 노력하였다.","chapter":1,"section":3,"page":7,"src":"1995 외교백서 머리말.pdf","id":"1994-s00034"},{"year":1995,"admin":"김영삼","text":"1991년 체결된 마스트리히트(08851ㅁ001) 조약은 경제분야 통합분만 아니라, 공동 외교안보정책, 내무. 사법분야까지 포괄하는 유럽통함을 도 모하고 있으나, 마스트리히트 조약의 이행과정에 여러 가지 문제점이 노 정되었다.","chapter":2,"section":3,"page":56,"src":"1996 외교백서 제2장.pdf","id":"1995-s00541"},{"year":1996,"admin":"김영삼","text":"1991년 12원 체결된 마스트리히트(0885101) 조약은 경제분야 통합 뿐만 아니라, 공동 외교안보정책과 내무ㆍ사법분야까지 포괄하는 구주통 합을 도모하고 있으나, 마스트리히트 조약의 이행과정에 여러가지 문제점 이 노정되었다.","chapter":1,"section":3,"page":68,"src":"1997 외교백서 제1장.pdf","id":"1996-s00506"},{"year":1997,"admin":"김영삼","text":"유럽에서는 유럽연합(European Union: EU)이 암스텔담 정상회의에서 마스트리히트조약을 개정하는 신유럽연합 조약안에 합의하는 등 역내 정치·경제적 통합을 진전시키면서 국제질서 형성에 독자적인 영향력을 확보해 갔다.","chapter":1,"section":1,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00039"},{"year":1998,"admin":"김대중","text":"특히 EU는 1997년 암스테르담 정상회의에서 향후 EU 확대에 대비하여 1993년의 마스트리히트 조약을 개정하는 암스테르담 조약을 체결하고 제반 제도 개선에 박차를 가하는 등 탈냉전 이후 국제정치질서 형성에 있어서의 정치.외교적 위상을 증대시켜가고 있다.","chapter":3,"section":1,"page":1,"src":"1999 외교백서 제3장.doc","id":"1998-s00821"},{"year":2004,"admin":"노무현","text":"9) EU는 마스트리히트 조약(Maastricht Treaty, 1992)에서 공동외교안보정책(CFSP)을 EU의 3대 지주 (three pillars)중 하나로 채택하고 본 격적인 정치∙외교분야의 협력을 시작하였으며, 암스테르담 조약(Amsterdam Treaty, 1997년)을 통하여 CFSP의 조직과 운영 방향 등을 구 체화하였다.","chapter":1,"section":null,"page":3,"src":"2005 외교백서 제1장.pdf","id":"2004-s00072"},{"year":1992,"admin":"노태우","text":"또한. 1992년 2월 ?일 구주동맹 추진을 위한 마스트리히트조약이 서명됨으로써, 이러한 단일시장의 효과를 제고하고 회원국 상호간 경제통화정책을 조화시 킴으로써 경제통합을 강화하고 93년중 공동대외정책도 적극 추진중에 있다.","chapter":3,"section":null,"page":17,"src":"1993 외교백서 제3장.pdf","id":"1992-s00464"},{"year":1993,"admin":"김영삼","text":"그러나 무엇보다도 1992년 2월 서멍된 구주연합조약 (일명 마스트리히트 조약)이 2넌에 걸친 각 회원국의 비준과정끝에 1993년 10월 13일 독일이 마지막으로 비준서를 기탁함으로써 1993년 11월 1일부로 발효, 마침내 구 주연합(80702068ㅁ40101 : 80))이 공식 출범한 것은 구주통합사는 물론 국제정치면에서 매우 중요한 사건이었다.","chapter":2,"section":3,"page":51,"src":"1994 외교백서 제2장.pdf","id":"1993-s00401"},{"year":1994,"admin":"김영삼","text":"유럽공동체 (60) 는 93년 11월 마스트리히트조약 발효를 계기로 구주연 합 (80)) 으로 확대 개편되었으며, 스웨덴, 핀란드, 오스트리아가 1994년 중 신규 가입이 결정됨으로써 앞으로 8ㄴ를 중심으로한 유럽 경제권의 위상이 크게 높아질 것으로 전망됨에 따라 정부는 이러한 EU 경제권의 변화동향을 감안하여 대5ㄴ 교역 및 투자확대를 위해 적극 노력하였다.","chapter":1,"section":3,"page":7,"src":"1995 외교백서 제1장.pdf","id":"1994-s00115"},{"year":1995,"admin":"김영삼","text":"인플레율은 1994년의 2. 7%로부터 1995년 8. 0%로 하락하였 으나, 재정적자 규모는 1995년 1, 236억마르크 (610782의 3. 6%) 로서 경제 통화동맹 (8800) 진입을 위한 마스트리히트조약 기준 (51078의 3%) 을 상 회하였다.","chapter":2,"section":3,"page":58,"src":"1996 외교백서 제2장.pdf","id":"1995-s00551"},{"year":1996,"admin":"김영삼","text":"특히, 80의 회원국이 향후 중. 동구, 사이프러스, 발틱제 국 등으로 확대될 경우 현상태로는 더 이상 효율적인 기능을 할 수 없다 는 것이 공통적으로 인식되게 되었고, 따라서 마스트리히트 조약의 수정 과 제도개혁의 필요성이 대두되었다.","chapter":1,"section":3,"page":68,"src":"1997 외교백서 제1장.pdf","id":"1996-s00507"},{"year":1997,"admin":"김영삼","text":"특히 EU는 1997년 암스테르담에서 개최된 정상회의에서 향후 EU 확대에 대비하여 마스트리히트 조약을 개정하는 암스테르담 조약을 체결하여 제반 제도 개선에 박차를 가하고, 공동외교 안보정책(CFSP)의 적극 추진을 모색함으로써 탈냉전이후 국제정치 질서 형성에 있어서의 영향력을 증대시켜가고 있다.","chapter":3,"section":1,"page":30,"src":"1998 외교백서 제3장.doc","id":"1997-s00814"}],"docCount":17},{"id":"연대구상","kind":"policy","aliases":["연대 구상","연대구상"],"total":16,"byYear":{"2022":5,"2023":8,"2024":3},"rateByYear":{"2022":26.4,"2023":36.3,"2024":14.8},"byAdmin":{"윤석열":16},"focus":1.0,"first":2022,"last":2024,"peak":2023,"peakRate":"2023","docs":[{"year":2022,"admin":"윤석열","text":"이와 함께 인태 전략 틀 속에서 아세안에 특화된 지역 정책으로서 ‘한-아세안 연대구상(KASI: Korea-ASEAN Solidarity Initiative)’을 발표하였다.","chapter":1,"section":null,"page":26,"src":"2022년도 국제정세와 외교활동(외교백서).pdf","id":"2022-s00230"},{"year":2023,"admin":"윤석열","text":"‘한-아세안 연대구상(KASI)’이행 계획을 발표(4월)하여 한-아세안 관계 격상을 위한 토 대를 구축하였고, 최초의 한-태도국 정상회의를 개최(5월)하여 태평양도서국들과의 협력 을 심화하였습니다.","chapter":null,"section":null,"page":2,"src":"2023년도 국제정세와 외교활동.pdf","id":"2023-s00011"},{"year":2024,"admin":"윤석열","text":"우리 정부는 인태전략의 주요 파트너인 아세안과 2024년 ‘포괄적 전략 동반자 관계’를 수립하였는데, 이행 2년차를 맞이한 ‘한-아세안 연대구상(Korea-ASEAN Solidarity Initia tive, KASI)을 중심으로 AI, 환경, 스마트시티와 같은 미래분야로 협력을 확대해 나가기로 하였다.","chapter":2,"section":1,"page":65,"src":"2024년도 국제정세와 외교활동.pdf","id":"2024-s00505"},{"year":2022,"admin":"윤석열","text":"제2절 아세안 및 인태 지역 외교 아세안 및 인태 지역 외교 제 절 1. 아세안 지역 외교 1) 한·아세안 연대구상(KASI) 발표 정부는 윤석열 대통령의 2022년 11월 제23차 한·아세안 정상회의(프놈펜) 참석 계기에 인태 전략과 지역별 협력 네트워크 제3장 아세안에 특화된 지역정책으로서 「한·아세안 연대구상(KASI: Korea-ASEAN Solidarity Initiative)」을 발표하였다.","chapter":3,"section":2,"page":69,"src":"2022년도 국제정세와 외교활동(외교백서).pdf","id":"2022-s00541"},{"year":2023,"admin":"윤석열","text":"제2절 외교정책 기조 또한 2022.11월 한·아세안 정상회의에서 대통령이 발표한 한·아세안 연대구상(KASI)· 을 본격 이행하여 아세안과의 호혜적 실질·전략 파트너십과 역내 주요국들과의 관계 강 화 노력을 지속하였다.","chapter":1,"section":2,"page":27,"src":"2023년도 국제정세와 외교활동.pdf","id":"2023-s00249"},{"year":2024,"admin":"윤석열","text":"(10) 아세안 사무국 조태열 외교장관은 5월 25일부터 31일까지 방한한 까으 끔 후은(Kao Kim Hourn) 아세 안 사무총장과 5월 28일 오찬면담을 가지면서 한-아세안 대화관계 35주년 계기 한-아세 안 포괄적 전략 동반자 관계(CSP) 수립, 한-아세안 연대구상(KASI) 이행 및 한-아세안 실 질 협력 발전 방안 등에 대해 논의하였다.","chapter":2,"section":2,"page":73,"src":"2024년도 국제정세와 외교활동.pdf","id":"2024-s00570"},{"year":2022,"admin":"윤석열","text":"또한 베트남 정부는 우리 정부의 「한·아세안 연대 구상」과 「담대한 구상」을 환영하며, 앞으로도 한반도를 포함한 역내 평화와 안정을 위해 긴밀한 협력을 계속해 나가기로 합의하였다.","chapter":3,"section":2,"page":71,"src":"2022년도 국제정세와 외교활동(외교백서).pdf","id":"2022-s00561"},{"year":2023,"admin":"윤석열","text":"또한, 4월 11일 한-아세안 연대구상(KASI: Korea-ASEAN Solidarity Initiative)을 이행해 나가기 위한 8개 중점 추진과제를 발표하고, 2023년 5월 29일~30일간 한·태도국 정상회 의를 최초로 개최하여 행동계획을 발표하는 등 아세안 및 태도국 대상 협력의 폭과 수준 을 대폭 확대해 나가고 있다.","chapter":3,"section":1,"page":68,"src":"2023년도 국제정세와 외교활동.pdf","id":"2023-s00555"},{"year":2024,"admin":"윤석열","text":"특히 이행 2년 차를 맞이한 한-아 세안 연대구상(KASI)을 중심으로 AI, 환경, 스마트시티, 교육, 국방 및 사이버 안보 등의 분 야를 포함하는 아세안과의 포괄적 협력에 대한 의지를 밝혔다.","chapter":2,"section":7,"page":159,"src":"2024년도 국제정세와 외교활동.pdf","id":"2024-s01142"}],"docCount":9},{"id":"교포정책","kind":"policy","aliases":["교포정책"],"total":16,"byYear":{"1993":9,"1994":7},"rateByYear":{"1993":71.4,"1994":52.4},"byAdmin":{"김영삼":16},"focus":1.0,"first":1993,"last":1994,"peak":1993,"peakRate":"1993","docs":[{"year":1993,"admin":"김영삼","text":"제7장 새 교포정책과 우리국민의 해외 진출 제 1절 새 교포정책의 수립과 시행 / 219 제 1 절 새 교포정책의 수립과 시행 1. 교포 현황 1993년 1월 1일 현재 세계각국에 거주하는 재외한인수는 약 494만명으로 지역별로는 아주 271만, 미주 170만, 구주 59만, 중동 1만 2천. 아프리카 2천 7백명이며, 국별로는 중국 193만. 미국 153만, 일본 71만, 독립국가연 합((18)지역 46만명의 순으로서 전체의 94%인 약 463만명이 이들 4개 국 ㆍ지역에 집중되어 있다.","chapter":7,"section":null,"page":1,"src":"1994 외교백서 제7장.pdf","id":"1993-s01158"},{"year":1994,"admin":"김영삼","text":"제8장 재외국민 지원 제 ｌ절 새 교포정책 시행 / 269 제 1 절 새 교포정책 시행 1. 새 교포정책 수립 취지 문민정부의 수림과 냉전종식으로 우리의 북한에 대한 압도적 우위가 확보됨에 따라 통일한국을 시야에 둔 미래지향적인 새 교포정책 수립이 긴요하게 되어, 문민정부 출범을 계기로 외무부는 1993년 8월 유관부처 간 교포정책협의체인 “재외국민정책심의위원회\"를 개최, 새 시대의 조류 에 맞는 “새 교포정책\"을 수립하여 시행해 오고 있다.","chapter":8,"section":null,"page":1,"src":"1995 외교백서 제8장.pdf","id":"1994-s01341"},{"year":1993,"admin":"김영삼","text":"재중국교포는 전체의 약 97%인 187만명이 길림성. 흑룡강성. 요녕성등 220 / 제장 새 교포정책과 우리국민의 해외 진출 동북3성에 집중 거주하고 있으며, 특히 길림성내 연변조선족 자치주에는 82 만여명이 밀집거주 하고 있는 것으로 추산되고 있다.","chapter":7,"section":1,"page":3,"src":"1994 외교백서 제7장.pdf","id":"1993-s01164"},{"year":1994,"admin":"김영삼","text":"1994 12월 31일 현제 전세계에 거주하고 있는 교포는 총 583만여명 으로 이중 대략 미국에 180만명, 일본에 70만명, 중국에 194만명, 독림 국가연합지역에 46만명, 기타지역에 33만명이 거주하고 있으며, 이들 지역별 교포사회는 역사적 형성과성과 지역적 특성이 매우 다양하기 때문 에 정부는 교포정책을 이들 지역별 교포사회의 특성을 고려하여 신축적으 로 운용하고 있다.","chapter":8,"section":1,"page":3,"src":"1995 외교백서 제8장.pdf","id":"1994-s01342"},{"year":1993,"admin":"김영삼","text":"2. 새 교포정책 가. 새 교포정책 수립의 취지와 내용 종래 정부가 추진해 온 교포정책의 목표는 기본적으로 우리교포들이 거주 국에 잘 적응하면서 안정된 생활을 정착시키고. 나아가 거주국의 지역사회 발전에 기여하는 존경받는 구성원으로 성장토록 유도하며. 또한 모국과의 유대강화를 통해 한민족으로서의 긍지를 가지고 자랑스럽게 살아갈수 있도 록 지원하는 것이었다.","chapter":7,"section":1,"page":4,"src":"1994 외교백서 제7장.pdf","id":"1993-s01166"},{"year":1994,"admin":"김영삼","text":"2. 새 교포정책의 기본방향 가. 교포의 거주국 사회내 정착 지원 새 교포정책은 교포들이 본래의 이주목적대로 거주국에 잘 적응하고 266 / 제 8장 재외국민 지원 나아가 거주국의 모범적인 구성원이 될 수 있도록 지원하는 것으로 이는 교포가 본국에 정신적 뿌리를 두면서도 거주국에서 성공적으로 정착하여 본국과 거주국간의 교류증진을 위한 중요한 교량역할을 수행할 수 있도록 지원한다는 점에서 교포 자신을 위해서도 바람직할 뿐 아니라 정부의 “세계화” 노력에도 부응한다고 할 수 있다.","chapter":8,"section":1,"page":3,"src":"1995 외교백서 제8장.pdf","id":"1994-s01343"}],"docCount":6},{"id":"대북포용정책","kind":"policy","aliases":["대북포용 정책","대북포용정책"],"total":14,"byYear":{"1994":1,"1998":2,"1999":6,"2000":5},"rateByYear":{"1994":7.5,"1998":8.0,"1999":24.0,"2000":20.0},"byAdmin":{"김대중":13,"김영삼":1},"focus":0.93,"first":1994,"last":2000,"peak":1999,"peakRate":"1999","docs":[{"year":1994,"admin":"김영삼","text":"흡수통합의 결과 심각한 사회 경제적 후유증을 않고 있는 독일의 교훈 등에 비추어 우리정부의 대북포용정책은 장기적으로 우리의 통일비용을 크게 절감할 수 있는 슬기로운 대응조치였다고 평가된다.","chapter":3,"section":2,"page":17,"src":"1995 외교백서 제3장.pdf","id":"1994-s00675"},{"year":1998,"admin":"김대중","text":"그 결과, 한.미.일 3국은 대북포용정책 기조를 유지한다는데 대한 공감대를 바탕으로 포괄적 대북정책 구상을 마련하기 위한 노력을 기울여 나갔으며, 중.러 및 국제사회의 광범위한 지지를 획득하였다.","chapter":2,"section":2,"page":1,"src":"1999 외교백서 제2장.doc","id":"1998-s00693"},{"year":1999,"admin":"김대중","text":"정부는 평화와 상호의존을 지향하는 주변 및 국제정세와 북한이 계속적인 경제침체와 외교적 고립으로 인해 생존을 위해서는 변화를 모색치 않을 수 없는 상황에 있는 점을 고려, 대북포용정책을 추진함으로써 북한이 체제붕괴에 대한 불안없이 변화를 모색할 수 있도록 유리한 환경을 조성해 주기위해 노력하였다.","chapter":3,"section":1,"page":245,"src":"2000 외교백서 제3장.hwp","id":"1999-s00691"},{"year":2000,"admin":"김대중","text":"우리 정부는 일 북한 관계 개선이 우리의 대북포용정책에 부응하고 한반도 평화와 안정에 기여할 것이라는 관점에서 이를 환영 지지하고 있으며, 일 북한간 접촉시 일본정부와 사전 사후 긴밀한 협의를 해오고 있다.","chapter":3,"section":1,"page":1,"src":"2001 외교백서 제3장.hwp","id":"2000-s00807"},{"year":1998,"admin":"김대중","text":"또한, 1998년 필리핀에서 개최된 제 5차 ARF에서는 우리의 신정부 출범 후 일관되게 추진되고 있는 대북포용정책을 설명하고, 의장성명에 '북경 남북대화 재개와 제네바 4자회담 출범을 환영 하고, 1953년 정전협정 준수의 중요성을 재확인하며, KEDO에 대한 국제적인 지원 증대를 촉구'한다는 내용을 포함시켰다.","chapter":5,"section":2,"page":1,"src":"1999 외교백서 제5장.doc","id":"1998-s01754"},{"year":1999,"admin":"김대중","text":"이와 같이 대북포용정책을 통해 한반도 정세를 안정적으로 관리함으로써 외환위기 등 경제난 극복에도 기여할 수 있었다.","chapter":3,"section":1,"page":245,"src":"2000 외교백서 제3장.hwp","id":"1999-s00697"},{"year":2000,"admin":"김대중","text":"그 결과, 러시아는 한반도의 평화 안정과 냉전구조 해체를 위한 우리의 대북포용정책 및 포괄적 접근방안을 일관되게 지지해오고 있으며, 한반도 평화와 안정을 위한 건설적 기여 노력 또한 계속해 오고 있다.","chapter":3,"section":1,"page":1,"src":"2001 외교백서 제3장.hwp","id":"2000-s00822"},{"year":1999,"admin":"김대중","text":"그 결과, 1999년 5월 한.러 정상회담시 러측은 한반도의 평화․안정과 냉전구조 해체를 위한 우리의 대북포용정책 및 포괄적 접근방안을 적극적으로 지지하는 한편, 한반도 평화와 안정을 위한 건설적 기여 노력을 계속해 나갈 것을 약속하였다.","chapter":3,"section":1,"page":245,"src":"2000 외교백서 제3장.hwp","id":"1999-s00796"},{"year":2000,"admin":"김대중","text":"이러한 맥락에서 Ivanov 러시아 외무장관은 2000년 2월 북한을 방문하였을 당시 북한 측에 우리의 대북포용정책과 남북 대화에 호응할 것을 적극 권유하였으며, Putin 대통령 역시 2000년 7월 북한 방문시 러 북간 발표된 공동선언문을 통해 2000년 6월 개최된 남북 정상회담 성과와 그 결과 채택된 남북 공동선언을 바탕으로 남북 관계가 지속 개선되어 나가는 것에 대한 지지를 표명하였다.","chapter":3,"section":1,"page":1,"src":"2001 외교백서 제3장.hwp","id":"2000-s00823"}],"docCount":9},{"id":"베를린구상","kind":"policy","aliases":["베를린 구상","베를린구상"],"total":13,"byYear":{"2017":10,"2018":3},"rateByYear":{"2017":75.6,"2018":17.9},"byAdmin":{"문재인":13},"focus":1.0,"first":2017,"last":2018,"peak":2017,"peakRate":"2017","docs":[{"year":2017,"admin":"문재인","text":"?월 베를린 구상을 발퓨한 이 후 '문재인의 한반도 정책'을 제시하는 등 주요 계기마다 한반도 평회와 남북한 간 대화ㆍ교 류 재개 필요성에 대한 국제사회의 이해 제고를 위해 노력하였다.","chapter":1,"section":1,"page":6,"src":"2018 외교백서 국문_1장.pdf","id":"2017-s00126"},{"year":2018,"admin":"문재인","text":"3 한반도 정세 2017년 북한의 핵실험 및 탄도미사일 발사와 연이은 ‘국가 핵무력 완성’ 선포로 한 반도를 둘러싼 역내 긴장이 고조됐으나 우리 정부는 2017년 7월 베를린 구상을 통해 천명된 대화 기조를 유지하며 북한을 대화의 장으로 유도하기 위해 노력했다.","chapter":1,"section":1,"page":16,"src":"2019 외교백서 국문_제1장.pdf","id":"2018-s00091"},{"year":2017,"admin":"문재인","text":"이러한 한반도 정책 구상은 2017년 7월 6일 독일 르버재단 조청 연설을 통해 베를린 구상'이라는 이름으로 발표되었다.","chapter":2,"section":1,"page":2,"src":"2018 외교백서 국문_2장.pdf","id":"2017-s00184"},{"year":2018,"admin":"문재인","text":"2월 북한의 평창동계올림픽 참가를 계기로 북한 고위급 대표단 방남(2.9~11, 2.25~27)과 정부의 대북 특사단 파견(3.5~6)이 이루어지면서 2017년 7 월 정부가 발표한 ‘베를린 구상’의 기조하에 단절된 남북관계 복원과 한반도 평화정착 을 본격적으로 추진해 나갈 수 있는 여건이 조성됐다.","chapter":2,"section":1,"page":26,"src":"2019 외교백서 국문_제2장.pdf","id":"2018-s00160"},{"year":2017,"admin":"문재인","text":"베를린 구상은 '평화 공존'과 '공동 번영'이라는 비전하에 평화로운 한반도를 위한 5대 기 조와 4대 실천과제를 담고 있다.","chapter":2,"section":1,"page":2,"src":"2018 외교백서 국문_2장.pdf","id":"2017-s00185"},{"year":2018,"admin":"문재인","text":"2017년 연이은 북한의 도발에 따른 엄중한 상황 속에서 우리 정부는 국제사회와 다져온 긴밀한 공조와 협력을 바탕으로 단호히 대응하는 한편, 베를린 구상에 따라 비 핵화 및 남북관계 진전을 목표로 북한을 대화의 장으로 유도하기 위한 외교적 노력을 지속했다.","chapter":2,"section":2,"page":34,"src":"2019 외교백서 국문_제2장.pdf","id":"2018-s00212"}],"docCount":6},{"id":"신동방정책","kind":"policy","aliases":["신동방 정책","신동방정책"],"total":12,"byYear":{"2017":1,"2018":3,"2019":4,"2020":1,"2021":2,"2022":1},"rateByYear":{"2017":7.6,"2018":17.9,"2019":22.1,"2020":4.5,"2021":11.6,"2022":5.3},"byAdmin":{"문재인":11,"윤석열":1},"focus":0.92,"first":2017,"last":2022,"peak":2019,"peakRate":"2019","docs":[{"year":2018,"admin":"문재인","text":"우리 정부가 추진하는 신남방정 책과 인도가 추진하는 신동방정책을 통해 양국이 서로 미래를 향한 중요한 동반자임을 확인하고 양국 간 ‘특별전략적 동반자 관계’를 더욱 강화하기로 했다.","chapter":3,"section":1,"page":69,"src":"2019 외교백서 국문_제3장.pdf","id":"2018-s00482"},{"year":2019,"admin":"문재인","text":"모디 정부는 신동방정책(&0+ 888 201107)을 적 극적으로 추진하며 한국, 아세안, 일본과 협력을 강화했다.","chapter":1,"section":1,"page":14,"src":"2020 외교백서 국문_제1장.pdf","id":"2019-s00086"},{"year":2020,"admin":"문재인","text":"8) 인도 나렌드라 모디(Narendra Modi) 총리의 제2기 정부는 신동방정책(Act East Policy) 을 지속 추진하며 한국, 일본, 아세안 등과 계속 협력해 나가는 가운데 미국, 호주 등 과의 협력도 강화하고 있다.","chapter":1,"section":1,"page":15,"src":"2021 외교백서(국문).pdf","id":"2020-s00096"},{"year":2021,"admin":"문재인","text":"8) 인도 나렌드라 모디(Narendra Modi) 총리에 대한 높은 지지가 유지되는 가운데, 모디 정부 는 신동방정책(Act East Policy)을 통해 우리나라를 포함한 동아시아 국가와 협력을 추진 했다.","chapter":1,"section":null,"page":15,"src":"2021년도 국제정세와 외교활동(외교백서)_홈페이지 게시.pdf","id":"2021-s00105"},{"year":2022,"admin":"윤석열","text":"제1절 국제정세 개관 8) 인도 제1장 나렌드라 모디(Narendra Modi) 총리가 경제 성장과 일자리 창출, 인프라 확충, 생활환 경 개선 등을 위한 정책을 추진해 나가면서 70% 가까운 높은 지지율을 유지하는 가운데, 모디 정부는 신동방 정책(Act East Policy)을 통해 우리나라를 포함한 동아시아 국가와 협 력을 적극 추진했다.","chapter":1,"section":1,"page":19,"src":"2022년도 국제정세와 외교활동(외교백서).pdf","id":"2022-s00158"},{"year":2018,"admin":"문재인","text":"이를 통해 우리 정 부에서 추진하는 신남방정책과 인도에서 추진하는 신동방정책(Act East Policy)에서 양국이 미래를 향한 중요한 동반자임을 서로 확인하고 2030년까지 양국 교역액 500억 달러 달성을 목표로 제시했다.","chapter":3,"section":1,"page":3,"src":"2019 외교백서 국문_제3장.pdf","id":"2018-s00569"},{"year":2019,"admin":"문재인","text":"아울러 양국은 3019년 3월 한-ㆍ인도 정상회담 논의 결과에 따라 니 우리의 신남방정책과 인도의 신동방정책을 조화롭게 점목해 역내 평회와 상생번영을 위한 양국 간 소통과 협력을 계속 강화하기로 했다.","chapter":3,"section":1,"page":2,"src":"2020 외교백서 국문_제3장.pdf","id":"2019-s00480"},{"year":2021,"admin":"문재인","text":"양 장관은 신남방정책과 인도의 신동방정책 간 시너지효과 강화를 위해 다방 면에 걸쳐 소통과 협력을 강화하고, 양국 간 고위급 교류의 재개도 추진키로 했다.","chapter":4,"section":1,"page":67,"src":"2021년도 국제정세와 외교활동(외교백서)_홈페이지 게시.pdf","id":"2021-s00497"},{"year":2018,"admin":"문재인","text":"양국 장관은 7월 문재인 대통령과 11월 김정숙 여사의 잇따른 인도 방문으로 양국 간 우호 협력관계가 더욱 고 조되고 있다고 평가하고, 우리 정부의 신남방정책과 인도의 신동방정책 간 시너지를 바 탕으로 양국 간 ‘특별전략적 동반자 관계’를 더욱 심화하기로 했다.","chapter":3,"section":1,"page":81,"src":"2019 외교백서 국문_제3장.pdf","id":"2018-s00596"},{"year":2019,"admin":"문재인","text":"양국 정상은 한국 정부의 신남방정책과 인도 정부의 신동방정책을 조화롭게 접목해 역내 평화와 상생번영을 위한 양국 간의 소통과 협력을 계속 강화하기로 했다.","chapter":3,"section":1,"page":83,"src":"2020 외교백서 국문_제3장.pdf","id":"2019-s00605"}],"docCount":10},{"id":"국가안보전략","kind":"policy","aliases":["국가안보전략"],"total":11,"byYear":{"1999":1,"2003":1,"2005":2,"2015":1,"2017":1,"2021":1,"2022":2,"2025":2},"rateByYear":{"1999":4.0,"2003":3.4,"2005":17.2,"2015":4.6,"2017":7.6,"2021":5.8,"2022":10.5,"2025":11.0},"byAdmin":{"노무현":3,"문재인":2,"윤석열":2,"이재명":2,"김대중":1,"박근혜":1},"focus":0.27,"first":1999,"last":2025,"peak":2005,"peakRate":"2005","docs":[{"year":1999,"admin":"김대중","text":"미국은 지난 1998년 11월 '동아시아 전략 보고서(East Asia Strategy Report：EASR '98)' 발표에 이어 1999년 12월에는 '국가안보전략 보고서(National Security Strategy for a New Century : NSS '99)'를 발표, 탈냉전 시대의 미국 안보 정책에 있어서 한반도를 포함한 동아시아 지역의 중요성을 인식하고 이 지역에 10만명의 미군을 계속 전진 배치할 것과 유사시 Win-Win 전략 수행의지를 재확인하였다.","chapter":3,"section":1,"page":245,"src":"2000 외교백서 제3장.hwp","id":"1999-s00726"},{"year":2003,"admin":"노무현","text":"대외관계에 있어서 폴란드 정부는 미국, 영국 다음으로 많은 2,400여명의 병력을 이라크에 파병, 다국적 사단을 지휘하는 122 / 제 1 장 국제정세 및 한반도 주변정세 등 제고된 위상을 보였으며, 9월에는 새로운 국제 안보 환경 변화 에 부응하여‘국가안보전략(National Security Strategy)’을 채 택하여 장기적 관점에서 국제적 역할 확대를 모색하고 있다.","chapter":1,"section":3,"page":105,"src":"2004 외교백서 제1장.pdf","id":"2003-s00707"},{"year":2005,"admin":"노무현","text":"아울러 21세기 미국의 국가안보전략을 효과적으로 추진하기 위하여 변환 외교(Transfor- mational Diplomacy)2) 정책을 새로이 채택하였다.","chapter":1,"section":1,"page":2,"src":"2006 외교백서 제1장.pdf","id":"2005-s00076"},{"year":2015,"admin":"박근혜","text":"2) 지역별 동향 미국은 연초 국가안보전략(National Security Strategy) 보고서를 통해 국제적 리더십의 지속적인 발휘를 강조하며, 다방면에서의 다각적인 외교 노력을 지속해 나갔다.","chapter":1,"section":1,"page":11,"src":"2016 외교백서 1장.pdf","id":"2015-s00045"},{"year":2017,"admin":"문재인","text":"13월에는 국가안보전략(488)을 발표하고 쇼미국 본토 방위 강화 쇼국가 번영 추진 소힘을 통한 평화 유지 쇼미국 영향력 증진을 미국의 핵심 안보이익으로 규정하였다.","chapter":1,"section":1,"page":2,"src":"2018 외교백서 국문_1장.pdf","id":"2017-s00034"},{"year":2021,"admin":"문재인","text":"이러한 맥락에 서 2021년 3월 「국가안보전략 잠정지침」을 발표하고 코로나19 종식, 경제 위기 극복, 민주 주의 재건, 이민 제도 정비, 동맹·파트너 관계 재활성화, 기후위기 대응, 기술 분야 리더십 확보, 미·중 관계 관리 등 8대 우선과제를 설정했다.","chapter":1,"section":null,"page":9,"src":"2021년도 국제정세와 외교활동(외교백서)_홈페이지 게시.pdf","id":"2021-s00043"},{"year":2022,"admin":"윤석열","text":"제1절 국제정세 개관 둘째, 미국은 2022년 2월 「인태 전략」, 10월 「국가안보전략」 보고서 등을 발표 하며 인태지역 중시, 전략적 우선순위에 따른 동맹·파트너십 강화, 공급망 재편 등 기조를 제1장 이어갔다.","chapter":1,"section":1,"page":9,"src":"2022년도 국제정세와 외교활동(외교백서).pdf","id":"2022-s00039"},{"year":2025,"admin":"이재명","text":"또한, 미국은 12월 발표한 국가안보전략(NSS)을 통해 서반구 지역을 미국 안보의 핵심 공간으로 규정하고, 중국과 러시아의 역내 영향력 확대를 견제하기 위한 정책적 기반을 강화하였다.","chapter":1,"section":1,"page":9,"src":"2025년도 국제정세와 외교활동.pdf","id":"2025-s00020"},{"year":2005,"admin":"노무현","text":"아울러 21세기 미국의 국가안보전략을 효과적으로 추진하기 위하여 변환 외교(Transfor- mational Diplomacy)2) 정책을 새로이 채택하였다.","chapter":4,"section":1,"page":2,"src":"2006 외교백서 제4장.pdf","id":"2005-s00995"},{"year":2025,"admin":"이재명","text":"이러한 기조를 반영하여 2025년 12월 5일 발표된 국가안보전략(National Security Strategy)은 주권, 국익 중심 전략 기조 하에 최고 핵심가치로서 미국 본토 보호를 부각하였다.","chapter":1,"section":1,"page":11,"src":"2025년도 국제정세와 외교활동.pdf","id":"2025-s00040"}],"docCount":10}],"links":[{"source":"미국","target":"일본","weight":975,"pmi":1.45,"rel":"협력","relConf":0.63,"relCounts":{"협력":31,"대화":10,"지원":4,"갈등":4},"byYear":{"1989":29,"1990":31,"1991":38,"1992":30,"1993":26,"1994":29,"1995":47,"1996":54,"1997":56 const mk = (host, key, color, label, count, toggle) => {
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button"; b.setAttribute("aria-pressed", "true");
  b.innerHTML = `<span class="dot" style="background:${color}"></span>${label}` +
                (count != null ? `<span class="n">${count}</span>` : "");
  b.onclick = () => { const v = b.getAttribute("aria-pressed") === "true";
    b.setAttribute("aria-pressed", !v); toggle(!v); layout(); };
  host.append(b);
};

  // 한 층 아래를 보여준다
  periodEl.innerHTML = "";

  for (const it of items) {
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button";
    b.setAttribute("aria-pressed", it.sel ? "true" : "false");
    b.textContent = it.label;
    b.onclick = it.on;
    periodEl.append(b);
  }
  if (admin && !year) {
    const hint = document.createElement("span");
    hint.className = "sub"; hint.style.margin = "0"; hint.textContent = "연도를 누르면 그 해로 들어갑니다";
    periodEl.append(hint);
  }
}
document.getElementById("q").oninput = e => { query = e.target.value.trim(); draw(); };
document.getElementById("view").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  view = b.dataset.v;
  document.getElementById("view").querySelectorAll("button")
    .forEach(x => x.setAttribute("aria-pressed", x === b));
  document.getElementById("viewNote").textContent = VIEW[view].note;
  layout();
};
document.getElementById("metric").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  metric = b.dataset.m;
  document.getElementById("metric").querySelectorAll("button")
    .forEach(x => x.setAttribute("aria-pressed", x === b));
  draw();
};

function setScope() {
  document.getElementById("scope").textContent =
    year ? `${year}년 · ${DATA.meta.yearAdmin[year]} 정권`
    : admin ? `${admin} 정권` : `1989 – 2025 · 37개년`;
  const g = year && (DATA.meta.gaps || {})[year];
  document.getElementById("gap").innerHTML = g
    ? `<div class="gap"><b>원본 결손</b> — ${g.map(x => `${x.missing} 없음(${x.ratio})`).join(", ")}.
       이 해가 작아 보이는 것은 자료가 없어서이지 외교가 적었기 때문이 아닙니다.</div>` : "";
}

/* ── 무엇을 보일지 ── */
const yearsOf = a => a ? years.filter(y => DATA.meta.yearAdmin[y] === a) : null;
function cnt(o) {
  if (year) return o.byYear[year] || 0;
  const ys = yearsOf(admin);
  if (!ys) return o.total ?? Object.values(o.byYear).reduce((x, y) => x + y, 0);
  return ys.reduce((s, y) => s + (o.byYear[y] || 0), 0);
}
let shown = [], shownL = [], alpha = 1;
function layout() {
  const V = VIEW[view];
  shown = nodes.filter(n => on[n.kind] && V.kinds.includes(n.kind) && cnt(n) > 0);
  let S = new Set(shown.map(n => n.id));
  shownL = links.filter(l => S.has(l.s.id) && S.has(l.t.id) &&
                             relOn[l.rel || "언급"] && cnt(l) > 0);
  if (V.hub) {
    // 주인공에 닿은 선만 남긴다. 나라—나라 선을 빼야 정책·사건이 보인다.
    shownL = shownL.filter(l => l.s.kind === V.hub || l.t.kind === V.hub ||
                                (V.hub === "event" && (l.s.kind === "treaty" || l.t.kind === "treaty")));
  }
  shown = shown.filter(n => shownL.some(l => l.s === n || l.t === n));
  shown.forEach(n => { if (!n.placed) { n.x = (Math.random()-.5)*520; n.y = (Math.random()-.5)*520; n.placed = 1; } });
  const b = document.getElementById("badge");
  if (shown.length === 0) {
    // 빈 화면을 그냥 두면 고장인 줄 안다. **왜 비었는지** 말해 준다.
    const what = {country:"나라", policy:"정책", event:"사건·조약", all:"자료"}[view];
    b.textContent = `이 조건에는 ${what}가 없습니다 — ` +
      (admin ? `${admin} 정권 백서에 잡힌 ${what} 이름이 없습니다` : "조건을 넓혀 보세요");
  } else {
    b.textContent = `점 ${shown.length} · 선 ${shownL.length} · 종류 붙은 선 ${shownL.filter(l => l.rel).length}`;
  }
  alpha = .9;
}

function tick() {
  for (const l of shownL) {
    const dx = l.t.x - l.s.x, dy = l.t.y - l.s.y, d = Math.hypot(dx, dy) || 1;
    const want = 70 + 250 / (1 + Math.log1p(l.weight));
    const f = (d - want) / d * .012 * alpha;
    l.s.vx += dx*f; l.s.vy += dy*f; l.t.vx -= dx*f; l.t.vy -= dy*f;
  }
  for (let i = 0; i < shown.length; i++) {
    const a = shown[i];
    for (let j = i+1; j < shown.length; j++) {
      const b = shown[j];
      let dx = b.x-a.x, dy = b.y-a.y, d2 = dx*dx + dy*dy;
      if (d2 > 260000) continue;
      if (d2 < 1) { dx = Math.random(); dy = Math.random(); d2 = 1; }
      const f = 900*alpha/d2;
      a.vx -= dx*f; a.vy -= dy*f; b.vx += dx*f; b.vy += dy*f;
    }
    a.vx -= a.x*.0016*alpha; a.vy -= a.y*.0016*alpha;
    a.x += a.vx *= .82; a.y += a.vy *= .82;
  }
  alpha *= .992;
}

/* ── 그리기 ── */
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let W=0, H=0, dpr=1, k=1, ox=0, oy=0;
function resize(){ dpr = Math.min(devicePixelRatio||1, 2); W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
addEventListener("resize", resize);
const rad = n => 4 + Math.sqrt(cnt(n)) * (year ? 2.4 : (admin ? 1.0 : .55));
const sx = n => n.x*k + ox + W/2, sy = n => n.y*k + oy + H/2;
const thick = l => metric === "pmi"
  ? Math.max(.4, (l.pmi + 3) * .55)
  : Math.max(.4, Math.log1p(cnt(l)) * .55);

function draw() {
  ctx.clearRect(0,0,W,H);
  const near = sel ? new Set(shownL.filter(l => l.s===sel||l.t===sel).flatMap(l => [l.s.id, l.t.id])) : null;
  ctx.lineCap = "round";
  for (const l of shownL) {
    const hot = sel && (l.s===sel || l.t===sel);
    ctx.strokeStyle = l.rel ? cssv("--" + l.rel) : (hot ? cssv("--edge-hot") : cssv("--edge"));
    ctx.globalAlpha = sel && !hot ? .16 : (l.rel ? .75 : 1);
    ctx.lineWidth = thick(l) * Math.min(k, 1.6);
    ctx.beginPath(); ctx.moveTo(sx(l.s), sy(l.s)); ctx.lineTo(sx(l.t), sy(l.t)); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  const hit = query ? nodes.filter(n => n.id.includes(query)).map(n => n.id) : null;
  for (const n of shown) {
    const r = rad(n)*Math.min(k,1.5), X = sx(n), Y = sy(n);
    const dim = (sel && !near.has(n.id) && n!==sel) || (hit && !hit.includes(n.id));
    ctx.globalAlpha = dim ? .16 : 1;
    ctx.beginPath(); ctx.arc(X, Y, r, 0, 7);
    ctx.fillStyle = cssv(KIND[n.kind].css); ctx.fill();
    if (n===sel || n===hover) { ctx.lineWidth = 2; ctx.strokeStyle = cssv("--ink"); ctx.stroke(); }
    const big = cnt(n) > (year ? 6 : (admin ? 60 : 300));
    if (!dim && (big || n===sel || n===hover || (hit && hit.includes(n.id)))) {
      ctx.font = `${n===sel?700:500} ${Math.min(13, 10+r/5)}px system-ui,sans-serif`;
      ctx.fillStyle = cssv("--ink"); ctx.textAlign = "center";
      ctx.fillText(n.id, X, Y-r-5);
    }
  }
  ctx.globalAlpha = 1;
}
(function loop(){ if (alpha > .002) tick(); draw(); requestAnimationFrame(loop); })();

/* ── 눌렀을 때 ── */
function at(mx,my){ let best=null, bd=400;
  for (const n of shown) { const d=(sx(n)-mx)**2+(sy(n)-my)**2, r=(rad(n)*Math.min(k,1.5)+7)**2;
    if (d<r && d<bd) { bd=d; best=n; } } return best; }
let drag = null;
cv.onpointerdown = e => { drag = {x:e.clientX, y:e.clientY, ox, oy, moved:0}; cv.setPointerCapture(e.pointerId); };
cv.onpointermove = e => { const r = cv.getBoundingClientRect();
  if (drag) { drag.moved += Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y);
    ox = drag.ox + e.clientX-drag.x; oy = drag.oy + e.clientY-drag.y; }
  else { hover = at(e.clientX-r.left, e.clientY-r.top); cv.style.cursor = hover ? "pointer" : "grab"; } };
cv.onpointerup = e => { const r = cv.getBoundingClientRect();
  if (drag && drag.moved < 5) select(at(e.clientX-r.left, e.clientY-r.top)); drag = null; };
cv.onwheel = e => { e.preventDefault(); k = Math.max(.25, Math.min(4, k*Math.exp(-e.deltaY*.0012))); };

/* ── 자세히 ── */
function select(n) {
  sel = n; docLimit = 5;
  const d = document.getElementById("detail");
  if (!n) { d.innerHTML = `<p class="empty">점을 고르면 여기에 자세히 나옵니다.</p>`; return; }
  const rel = shownL.filter(l => l.s===n || l.t===n)
    .map(l => ({o: l.s===n ? l.t : l.s, w: cnt(l), rel: l.rel, sample: l.sample}))
    .filter(r => r.w > 0).sort((a,b) => b.w - a.w).slice(0, 14);
  const max = rel.length ? rel[0].w : 1;
  const src = year || admin ? n.byYear : n.rateByYear;
  const vals = years.map(y => (n.rateByYear[y] ?? 0)), mx = Math.max(...vals, .1);
  const pts = vals.map((v,i) => `${i/(vals.length-1)*260},${46 - v/mx*40}`).join(" ");
  const withRel = rel.find(r => r.rel && r.sample);
  const adm = Object.entries(n.byAdmin).sort((a,b) => b[1]-a[1]).slice(0,3);

  d.innerHTML = `
    <div><h2 class="name serif">${n.id}</h2>
      <div class="tag"><span class="dot" style="background:var(${KIND[n.kind].css})"></span>${KIND[n.kind].label}</div></div>
    <div class="stats">
      <div class="stat"><div class="k">언급</div><div class="v">${cnt(n).toLocaleString()}</div></div>
      <div class="stat"><div class="k">분량대비 최고</div><div class="v">${n.peakRate}</div></div>
      <div class="stat"><div class="k">처음</div><div class="v">${n.first}</div></div>
      <div class="stat"><div class="k">마지막</div><div class="v">${n.last}</div></div>
    </div>
    <div><div class="lbl" style="margin-bottom:5px">해마다 (백서 분량 대비)</div>
      <svg class="spark" viewBox="0 0 260 50" preserveAspectRatio="none" aria-hidden="true">
        <polyline points="${pts}" fill="none" stroke="var(${KIND[n.kind].css})" stroke-width="1.6"/></svg>
      <div class="yr"><span>${years[0]}</span><span>${years[years.length-1]}</span></div></div>
    <div><div class="lbl" style="margin-bottom:5px">많이 다룬 정권</div>
      <div class="sub" style="margin:0">${adm.map(([a,c]) => `${a} ${c.toLocaleString()}`).join(" · ")}</div></div>
    <div id="docs"></div>
    ${withRel ? `<div><div class="lbl" style="margin-bottom:5px">관계의 근거</div>
      <blockquote class="quote">${withRel.sample.text}
      <cite>${withRel.sample.year}년 · ${n.id}—${withRel.o.id} → <b style="color:var(--${withRel.rel})">${withRel.rel}</b></cite></blockquote></div>` : ""}
    <div><div class="lbl" style="margin-bottom:5px">이어진 것 ${rel.length}</div>
      <div class="rel">${rel.map(r => `<button type="button" data-id="${r.o.id}">
        <span class="dot" style="background:var(${KIND[r.o.kind].css})"></span>${r.o.id}
        ${r.rel ? `<span class="kind" style="color:var(--${r.rel})">${r.rel}</span>` : ""}
        <span class="w">${r.w}</span></button>`).join("")}</div></div>`;
  renderDocs(n);
  d.querySelectorAll("[data-id]").forEach(b => b.onclick = () => select(byId.get(b.dataset.id)));
  d.scrollTop = 0;
}

/* 근거 원문 — 지식그래프의 점이 '어디에 그렇게 쓰여 있나'를 보여준다.
   그래프만 있고 원문이 없으면 확인할 길이 없다. */
let docLimit = 5;
function renderDocs(n) {
  const host = document.getElementById("docs");
  if (!host) return;
  const scope = d => (!year && !admin) || (year ? d.year === year : d.admin === admin);
  const all = (n.docs || []).filter(scope);
  if (!all.length) {
    // '아예 안 나왔다'와 '데모에 안 담았다'는 다르다. 섞으면 오해한다.
    const c = cnt(n);
    host.innerHTML = `<div class="lbl" style="margin-bottom:5px">원문</div>
      <p class="empty">${c > 0
        ? `이 시기에 ${c}번 나오지만, 데모에는 원문을 담지 않았습니다.`
        : "이 시기에는 나오지 않습니다."}</p>`;
    return;
  }
  const list = all.slice(0, docLimit);
  // 이름에 표시를 한다. 정규식 대신 쪼개서 붙인다 — 이름에 특수문자가
  // 들어 있어도 안전하고, 이스케이프를 틀릴 일이 없다.
  const esc = t => t.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  // 별칭까지 표시한다 — 'UN' 이 든 문장도 '유엔' 노드의 근거다
  const hl = t => (n.aliases || [n.id]).reduce(
    (acc, a) => acc.split(a).join(`${a}`), esc(t))
    .split("").join("<mark>").split("").join("</mark>");
  host.innerHTML = `
    <div class="lbl" style="margin-bottom:5px">원문 ${all.length}${all.length < n.docCount ? ` / 전체 ${n.docCount}` : ""}</div>
    <div class="docs">${list.map(x => `<div class="doc">
      <p>${hl(x.text)}</p>
      <div class="meta"><b>${x.year}년</b> ${x.admin} 정권
        ${x.chapter ? `· ${x.chapter}장` : ""}${x.section ? ` ${x.section}절` : ""}
        ${x.page ? `· ${x.page}쪽` : ""} · ${x.src}</div></div>`).join("")}</div>
    ${all.length > list.length
      ? `<button class="more" type="button" id="moreDocs">더 보기 (${all.length - list.length}개 남음)</button>` : ""}`;
  const m = document.getElementById("moreDocs");
  if (m) m.onclick = () => { docLimit += 10; renderDocs(n); };
}

document.getElementById("note").innerHTML =
  `백서 문장 <b>${DATA.meta.sentences.toLocaleString()}개</b>에서 뽑았습니다.<br>
   선은 <b>한 문장 안에 함께 나온 것</b>이고, 그중 관계 종류가 붙은 것은
   <b>${links.filter(l => l.rel).length}개</b>입니다.<br><br>
   표본 15개를 원문과 대조한 결과 <b>정확도 87%</b>,
   아는 사실 18건 채점 <b>17건 통과</b>.<br>
   나머지는 나열 문장이라 관계로 보지 않았습니다.`;

document.getElementById("viewNote").textContent = VIEW[view].note;
renderPeriods();
resize(); setScope(); layout();
select(byId.get("북한") || nodes[0]);
</script>
