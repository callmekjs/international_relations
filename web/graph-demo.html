<title>외교백서 지식그래프</title>
<style>
:root{
  --ground:#f6f4ef; --panel:#fffdf9; --line:#ddd7c9; --line-soft:#eae5d9;
  --ink:#1c1a17; --ink-2:#57524a; --ink-3:#8b8478;
  --country:#1f6f6b; --org:#8a6a1f; --policy:#7b3a68; --event:#a8442a;
  --edge:rgba(90,84,74,.20); --edge-hot:rgba(28,26,23,.55);
  --shadow:0 1px 2px rgba(40,34,24,.06),0 8px 24px rgba(40,34,24,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#14161a; --panel:#1b1e24; --line:#2f343d; --line-soft:#252a31;
  --ink:#eceae5; --ink-2:#a8a49b; --ink-3:#726d64;
  --country:#5fc7bd; --org:#d8ae53; --policy:#cf8ab6; --event:#e58a68;
  --edge:rgba(200,196,187,.16); --edge-hot:rgba(236,234,229,.6);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --ground:#14161a; --panel:#1b1e24; --line:#2f343d; --line-soft:#252a31;
  --ink:#eceae5; --ink-2:#a8a49b; --ink-3:#726d64;
  --country:#5fc7bd; --org:#d8ae53; --policy:#cf8ab6; --event:#e58a68;
  --edge:rgba(200,196,187,.16); --edge-hot:rgba(236,234,229,.6);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
.serif{font-family:"Nanum Myeongjo","Apple SD Gothic Neo",Batang,"Times New Roman",serif}
.wrap{display:grid;grid-template-columns:236px minmax(0,1fr) 300px;height:100vh;height:100dvh}
@media(max-width:1000px){.wrap{grid-template-columns:1fr;grid-template-rows:auto 60vh auto;height:auto}}

/* ── 왼쪽 ── */
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:22px}
h1{font-size:19px;line-height:1.25;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--ink-3);font-size:11.5px;margin-top:6px;letter-spacing:.02em}
.grp{display:flex;flex-direction:column;gap:9px}
.lbl{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--ink-3);font-weight:700}
.kinds{display:flex;flex-direction:column;gap:5px}
.kind{display:flex;align-items:center;gap:9px;padding:6px 9px;border:1px solid var(--line-soft);
  border-radius:7px;background:none;color:var(--ink);cursor:pointer;font:inherit;font-size:12.5px;text-align:left;
  transition:border-color .15s,opacity .15s}
.kind:hover{border-color:var(--line)}
.kind[aria-pressed="false"]{opacity:.34}
.kind:focus-visible{outline:2px solid var(--ink-2);outline-offset:2px}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.kind .n{margin-left:auto;color:var(--ink-3);font-size:11px;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--country)}
.yr{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.yr b{color:var(--ink);font-size:15px;font-weight:700}
.adm{font-size:11.5px;color:var(--ink-2)}
.searchbox{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:7px;
  background:var(--ground);color:var(--ink);font:inherit;font-size:12.5px}
.searchbox:focus-visible{outline:2px solid var(--ink-2);outline-offset:1px}
.gap{font-size:11.5px;line-height:1.6;color:var(--ink-2);background:color-mix(in srgb,var(--event) 9%,transparent);
  border:1px solid color-mix(in srgb,var(--event) 30%,transparent);border-radius:7px;padding:9px 11px}
.gap b{color:var(--event)}
.hint{font-size:11px;color:var(--ink-3);line-height:1.55;border-top:1px solid var(--line-soft);padding-top:12px;margin-top:auto}

/* ── 가운데 ── */
main{position:relative;overflow:hidden;background:var(--ground)}
canvas{display:block;width:100%;height:100%;cursor:grab}
canvas:active{cursor:grabbing}
.badge{position:absolute;left:14px;top:12px;font-size:11px;color:var(--ink-3);
  background:var(--panel);border:1px solid var(--line-soft);border-radius:20px;padding:4px 11px;
  font-variant-numeric:tabular-nums;pointer-events:none}

/* ── 오른쪽 ── */
.detail{background:var(--panel);border-left:1px solid var(--line);padding:20px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.empty{color:var(--ink-3);font-size:12.5px;line-height:1.7}
.name{font-size:22px;letter-spacing:-.015em;margin:0;line-height:1.2}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-2);margin-top:5px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:8px;overflow:hidden}
.stat{background:var(--panel);padding:9px 11px}
.stat .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3)}
.stat .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:1px}
.spark{width:100%;height:52px;display:block}
.quote{font-size:12.5px;line-height:1.75;color:var(--ink-2);border-left:2px solid var(--line);padding-left:11px}
.quote cite{display:block;font-style:normal;font-size:10.5px;color:var(--ink-3);margin-top:7px;letter-spacing:.03em}
.rel{display:flex;flex-direction:column;gap:2px}
.rel button{display:flex;align-items:center;gap:8px;width:100%;padding:5px 7px;border:0;border-radius:6px;
  background:none;color:var(--ink);font:inherit;font-size:12.5px;cursor:pointer;text-align:left}
.rel button:hover{background:var(--ground)}
.rel button:focus-visible{outline:2px solid var(--ink-2);outline-offset:-2px}
.rel .w{margin-left:auto;color:var(--ink-3);font-size:11px;font-variant-numeric:tabular-nums}
.bar{height:3px;border-radius:2px;flex:0 0 34px;background:var(--line)}
</style>

<div class="wrap">
<aside>
  <div>
    <h1 class="serif">외교백서 지식그래프</h1>
    <div class="sub">1989 – 2025 · 37개년</div>
  </div>

  <div class="grp">
    <div class="lbl">점의 종류</div>
    <div class="kinds" id="kinds"></div>
  </div>

  <div class="grp">
    <div class="lbl">연도</div>
    <input type="range" id="year" aria-label="연도">
    <div class="yr"><span id="ylo"></span><b id="ynow"></b><span id="yhi"></span></div>
    <div class="adm" id="adm"></div>
  </div>

  <div id="gap"></div>

  <div class="grp">
    <div class="lbl">찾기</div>
    <input class="searchbox" id="q" placeholder="미국, 신남방정책…" aria-label="개체 찾기">
  </div>

  <div class="hint">
    점을 누르면 오른쪽에 자세히 나옵니다.<br>
    빈 곳을 끌면 화면이 움직이고, 휠로 크기를 바꿉니다.<br><br>
    선의 굵기는 <b>한 문장 안에 함께 나온 횟수</b>입니다.
  </div>
</aside>

<main>
  <canvas id="cv"></canvas>
  <div class="badge" id="badge"></div>
</main>

<div class="detail" id="detail">
  <p class="empty">왼쪽 그래프에서 점을 고르세요.<br><br>
  37년치 외교백서 문장 65,611개에서 나라·기구·정책·사건을 뽑고, 한 문장 안에 함께 나온 것끼리 이었습니다.</p>
</div>
</div>

const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

const nodes = DATA.nodes.map(n => ({...n, x:0, y:0, vx:0, vy:0}));
const byId = new Map(nodes.map(n => [n.id, n]));
const links = DATA.links.map(l => ({...l, s:byId.get(l.source), t:byId.get(l.target)}))
                        .filter(l => l.s && l.t);
nodes.forEach(n => n.deg = 0);
links.forEach(l => { l.s.deg++; l.t.deg++; });

const years = DATA.meta.years;
const on = {country:true, org:true, policy:true, event:true};
let year = null, sel = null, hover = null, query = "";

/* ── 왼쪽 조작판 ── */
const kindsEl = document.getElementById("kinds");
for (const [k, v] of Object.entries(KIND)) {
  const b = document.createElement("button");
  b.className = "kind"; b.type = "button"; b.setAttribute("aria-pressed", "true");
  b.innerHTML = `<span class="dot" style="background:var(${v.css})"></span>${v.label}
    <span class="n">${nodes.filter(n => n.kind === k).length}</span>`;
  b.onclick = () => { on[k] = !on[k]; b.setAttribute("aria-pressed", on[k]); layout(); };
  kindsEl.append(b);
}
const yr = document.getElementById("year");
yr.min = 0; yr.max = years.length; yr.value = years.length; yr.step = 1;
document.getElementById("ylo").textContent = years[0];
document.getElementById("yhi").textContent = years[years.length - 1];
function setYear() {
  const i = +yr.value;
  year = i === years.length ? null : years[i];
  document.getElementById("ynow").textContent = year ?? "전체";
  document.getElementById("adm").textContent = year ? DATA.meta.yearAdmin[year] + " 정권" : "37개년 전부";
  const g = year && (DATA.meta.gaps || {})[year];
  document.getElementById("gap").innerHTML = g
    ? `<div class="gap"><b>원본 결손</b> — ${g.map(x => `${x.missing} 없음(${x.ratio})`).join(", ")}.
       ${g[0].cause} 이 해가 작아 보이는 것은 <b>자료가 없어서</b>이지 외교가 적었기 때문이 아닙니다.</div>`
    : "";
  layout();
}
yr.oninput = setYear;
document.getElementById("q").oninput = e => { query = e.target.value.trim(); draw(); };

/* ── 무엇을 보일지 ── */
const cnt = (o, y) => y ? (o.byYear[y] || 0) : o.total ?? Object.values(o.byYear).reduce((a, b) => a + b, 0);
let shown = [], shownL = [];
function layout() {
  shown = nodes.filter(n => on[n.kind] && cnt(n, year) > 0);
  const S = new Set(shown.map(n => n.id));
  shownL = links.filter(l => S.has(l.s.id) && S.has(l.t.id) &&
                             (year ? (l.byYear[year] || 0) > 0 : true));
  const seen = new Set(); shownL.forEach(l => { seen.add(l.s.id); seen.add(l.t.id); });
  shown.forEach(n => { if (!n.placed) { n.x = (Math.random() - .5) * 500; n.y = (Math.random() - .5) * 500; n.placed = 1; } });
  document.getElementById("badge").textContent = `점 ${shown.length} · 선 ${shownL.length}`;
  alpha = .9;
}

/* ── 힘 계산 (직접 만든 간단한 것) ── */
let alpha = 1;
function tick() {
  const w = year ? y => (l => l.byYear[year] || 0) : null;
  for (const l of shownL) {
    const dx = l.t.x - l.s.x, dy = l.t.y - l.s.y;
    const d = Math.hypot(dx, dy) || 1;
    const want = 70 + 260 / (1 + Math.log1p(l.weight));
    const f = (d - want) / d * .012 * alpha;
    l.s.vx += dx * f; l.s.vy += dy * f; l.t.vx -= dx * f; l.t.vy -= dy * f;
  }
  for (let i = 0; i < shown.length; i++) {
    const a = shown[i];
    for (let j = i + 1; j < shown.length; j++) {
      const b = shown[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      let d2 = dx * dx + dy * dy;
      if (d2 > 260000) continue;
      if (d2 < 1) { dx = Math.random(); dy = Math.random(); d2 = 1; }
      const f = 900 * alpha / d2;
      a.vx -= dx * f; a.vy -= dy * f; b.vx += dx * f; b.vy += dy * f;
    }
    a.vx -= a.x * .0016 * alpha; a.vy -= a.y * .0016 * alpha;
    a.x += a.vx *= .82; a.y += a.vy *= .82;
  }
  alpha *= .992;
}

/* ── 그리기 ── */
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let W = 0, H = 0, dpr = 1, k = 1, ox = 0, oy = 0;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener("resize", resize);
const rad = n => 4 + Math.sqrt(cnt(n, year)) * (year ? 2.4 : .55);
const sx = n => n.x * k + ox + W / 2, sy = n => n.y * k + oy + H / 2;

function draw() {
  ctx.clearRect(0, 0, W, H);
  const near = sel ? new Set(shownL.filter(l => l.s === sel || l.t === sel).flatMap(l => [l.s.id, l.t.id])) : null;
  ctx.lineCap = "round";
  for (const l of shownL) {
    const hot = sel && (l.s === sel || l.t === sel);
    ctx.strokeStyle = hot ? cssv("--edge-hot") : cssv("--edge");
    ctx.globalAlpha = sel && !hot ? .22 : 1;
    ctx.lineWidth = Math.max(.4, Math.log1p((year ? l.byYear[year] || 0 : l.weight)) * .55) * Math.min(k, 1.6);
    ctx.beginPath(); ctx.moveTo(sx(l.s), sy(l.s)); ctx.lineTo(sx(l.t), sy(l.t)); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  const hit = query ? nodes.filter(n => n.id.includes(query)).map(n => n.id) : null;
  for (const n of shown) {
    const r = rad(n) * Math.min(k, 1.5), X = sx(n), Y = sy(n);
    const dim = (sel && !near.has(n.id) && n !== sel) || (hit && !hit.includes(n.id));
    ctx.globalAlpha = dim ? .18 : 1;
    ctx.beginPath(); ctx.arc(X, Y, r, 0, 7);
    ctx.fillStyle = cssv(KIND[n.kind].css); ctx.fill();
    if (n === sel || n === hover) { ctx.lineWidth = 2; ctx.strokeStyle = cssv("--ink"); ctx.stroke(); }
    const big = cnt(n, year) > (year ? 6 : 300);
    if (!dim && (big || n === sel || n === hover || (hit && hit.includes(n.id)))) {
      ctx.font = `${n === sel ? 700 : 500} ${Math.min(13, 10 + r / 5)}px system-ui,sans-serif`;
      ctx.fillStyle = cssv("--ink"); ctx.textAlign = "center";
      ctx.fillText(n.id, X, Y - r - 5);
    }
  }
  ctx.globalAlpha = 1;
}
(function loop() { if (alpha > .002) tick(); draw(); requestAnimationFrame(loop); })();

/* ── 눌렀을 때 ── */
function at(mx, my) {
  let best = null, bd = 400;
  for (const n of shown) {
    const d = (sx(n) - mx) ** 2 + (sy(n) - my) ** 2;
    const r = (rad(n) * Math.min(k, 1.5) + 7) ** 2;
    if (d < r && d < bd) { bd = d; best = n; }
  }
  return best;
}
let drag = null;
cv.onpointerdown = e => { drag = {x:e.clientX, y:e.clientY, ox, oy, moved:0}; cv.setPointerCapture(e.pointerId); };
cv.onpointermove = e => {
  const r = cv.getBoundingClientRect();
  if (drag) {
    drag.moved += Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y);
    ox = drag.ox + e.clientX - drag.x; oy = drag.oy + e.clientY - drag.y;
  } else { hover = at(e.clientX - r.left, e.clientY - r.top); cv.style.cursor = hover ? "pointer" : "grab"; }
};
cv.onpointerup = e => {
  const r = cv.getBoundingClientRect();
  if (drag && drag.moved < 5) { const n = at(e.clientX - r.left, e.clientY - r.top); select(n); }
  drag = null;
};
cv.onwheel = e => { e.preventDefault(); const f = Math.exp(-e.deltaY * .0012); k = Math.max(.25, Math.min(4, k * f)); };

/* ── 오른쪽 자세히 ── */
function select(n) {
  sel = n;
  const d = document.getElementById("detail");
  if (!n) { d.innerHTML = `<p class="empty">왼쪽 그래프에서 점을 고르세요.</p>`; return; }
  const rel = shownL.filter(l => l.s === n || l.t === n)
    .map(l => ({o: l.s === n ? l.t : l.s, w: year ? (l.byYear[year] || 0) : l.weight}))
    .filter(r => r.w > 0).sort((a, b) => b.w - a.w).slice(0, 14);
  const max = rel.length ? rel[0].w : 1;
  const vals = years.map(y => n.byYear[y] || 0), mx = Math.max(...vals, 1);
  const pts = vals.map((v, i) => `${i / (vals.length - 1) * 260},${48 - v / mx * 42}`).join(" ");
  const adm = Object.entries(n.byAdmin).sort((a, b) => b[1] - a[1]).slice(0, 3);

  d.innerHTML = `
    <div>
      <h2 class="name serif">${n.id}</h2>
      <div class="tag"><span class="dot" style="background:var(${KIND[n.kind].css})"></span>${KIND[n.kind].label}</div>
    </div>
    <div class="stats">
      <div class="stat"><div class="k">언급</div><div class="v">${(year ? n.byYear[year] || 0 : n.total).toLocaleString()}</div></div>
      <div class="stat"><div class="k">최다 연도</div><div class="v">${n.peak}</div></div>
      <div class="stat"><div class="k">처음</div><div class="v">${n.first}</div></div>
      <div class="stat"><div class="k">마지막</div><div class="v">${n.last}</div></div>
    </div>
    <div>
      <div class="lbl" style="margin-bottom:6px">해마다</div>
      <svg class="spark" viewBox="0 0 260 52" preserveAspectRatio="none" aria-hidden="true">
        <polyline points="${pts}" fill="none" stroke="var(${KIND[n.kind].css})" stroke-width="1.6"/>
      </svg>
      <div class="yr"><span>${years[0]}</span><span>${years[years.length - 1]}</span></div>
    </div>
    <div>
      <div class="lbl" style="margin-bottom:6px">많이 다룬 정권</div>
      <div class="adm">${adm.map(([a, c]) => `${a} ${c.toLocaleString()}`).join(" · ")}</div>
    </div>
    ${n.sample ? `<div><div class="lbl" style="margin-bottom:6px">백서 원문</div>
      <blockquote class="quote">${n.sample.text}
      <cite>${n.sample.year}년 외교백서 · ${n.sample.admin} 정권</cite></blockquote></div>` : ""}
    <div>
      <div class="lbl" style="margin-bottom:6px">함께 나온 것 ${rel.length}</div>
      <div class="rel">${rel.map(r => `<button type="button" data-id="${r.o.id}">
        <span class="dot" style="background:var(${KIND[r.o.kind].css})"></span>${r.o.id}
        <span class="bar"><span style="display:block;height:100%;border-radius:2px;width:${r.w / max * 100}%;background:var(${KIND[r.o.kind].css})"></span></span>
        <span class="w">${r.w}</span></button>`).join("")}</div>
    </div>`;
  d.querySelectorAll("[data-id]").forEach(b => b.onclick = () => select(byId.get(b.dataset.id)));
  d.scrollTop = 0;
}

resize(); setYear();
select(byId.get("미국") || nodes[0]);
</script>
