인이 일부 제3세계 국가들에 의한 국제적 테러의 위험성을 중대시키는 동시에, 이들 국가의 핵무기 등 첨단무기의 개발ㆍ수입 노력 증대 및 미국, 러시아연방, 영국, 프랑스, 중국 등 군사대국들의 이들 제3세계 국가들에 대한 무기판매가 이러한 지역분쟁을 확대시켜 1990년대 국제질서의 안정 유지에 역기능적으로 6 제1장 국은질서 회[이과 우리 외교정책 방향 작용할 가능성도 잔존하고 있다.","chapter":1,"section":null,"page":5,"src":"1992 외교백서 제1장.pdf","id":"1991-s00052"},{"year":1992,"admin":"노태우","text":"영국경제는 민간부문의 채무부담과 고금리에 따른 민간소비 부진. 및 설비투자 위축으로 경기침체 국면에서 벗어나지 못하였으며 프랑스경제 도 경기전망 불투명에 따른 기업의 설비 투자 위축 등 내수부진으로 저성장 에 머물렀다.","chapter":3,"section":null,"page":2,"src":"1993 외교백서 제3장.pdf","id":"1992-s00382"},{"year":1993,"admin":"김영삼","text":"한편, 남태평양 비핵지대화조약에 서명거부 입장을 견지 하면서 핵실험을 계속하여 왔던 프랑스가 1992년 4월 이 지역에서의 핵실 험중지 입장을 발표함에 따라 향후 프랑스와 남태평양제국간 핵실험 문제를 둘러싼 분쟁은 다소 완화될 것으로 전망된다.","chapter":2,"section":3,"page":33,"src":"1994 외교백서 제2장.pdf","id":"1993-s00270"},{"year":1994,"admin":"김영삼","text":"나) 프랑스 1993년 3월이후 제2차 좌우파 공존체제 (좌파의 Mitterrand 대통령-우 파연합의 Balladur 총리) 가 유지되었으며, 각 정당은 1995년 4월로 예정 되어 있는 대통령 선거 준비에 들어 갔는 바, 사회당의 몰락과 연피전 대선후보의 부재로 인해 주로 우파연합 후보가 상호경쟁 하는 양상을 제3절 각 지역 정세 및 평가 / 75 보였다.","chapter":2,"section":3,"page":48,"src":"1995 외교백서 제2장.pdf","id":"1994-s00467"},{"year":1995,"admin":"김영삼","text":"프랑스와 중국이 잇달아 핵실험을 실시함으로써 국내외의 강한 반발을 불러 일으키기도 하였지만, 이러한 NPT 조약의 무기한 연장 결정에 힘입어 1996년내에 포괄적 핵실험금지 : 협약(71187) 을 체결하여 핵확산방지 체제를 한층 공고히 하려는 국제사 회의 노력이 계속 진행되었다.","chapter":2,"section":1,"page":5,"src":"1996 외교백서 제2장.pdf","id":"1995-s00214"},{"year":1996,"admin":"김영삼","text":"： 이밖에 북한은 영국, 독일, 프랑스 등 구주국가와의 수교문제도 중점 타진하였으나 성과를 거두지 못했으며, 고위인사 순방을 통해 서구국가로 부터의 대북투자유치와 동남아 지역국가들과의 교역증진을 추진하였다.","chapter":1,"section":2,"page":15,"src":"1997 외교백서 제1장.pdf","id":"1996-s00144"},{"year":1997,"admin":"김영삼","text":"반면 이란, 이라크에 대한 경제제재의 지속에 관하여 미국 대 프랑스·러시아·중국·일본 등의 입장 차이가 노정되었고 미국과 이라크 관계가 유엔 무기사찰단의 이라크내 무기 사찰을 둘러싸고 1997년 11월부터 다시 긴장관계에 돌입하였다.","chapter":1,"section":1,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00045"},{"year":1998,"admin":"김대중","text":"서유럽에서는 1997년 영국.프랑스.이탈리아에 이어 1998년에도 독일.이탈리아에서 중도좌파 정권이 들어서면서 EU 15개 회원국 중 스페인과 아일랜드를 제외한 13개국에서 중도좌파 정당들이 단독 내지 연정 형태로 집권하였다.","chapter":1,"section":1,"page":1,"src":"1999 외교백서 제1장.doc","id":"1998-s00041"},{"year":1999,"admin":"김대중","text":"러시아 및 브라질의 경제위기로 수출이 급감하였던 독일과 이탈리아 역시 하반기부터 경기회복 추세를 보였으며, 상대적으로 양호한 경제실적을 기록했던 프랑스도 1998년 하반기부터 경기둔화 조짐을 보였으나 1999년 하반기부터 회복세로 접어들었다.","chapter":1,"section":1,"page":1,"src":"2000 외교백서 제1장.hwp","id":"1999-s00050"},{"year":2000,"admin":"김대중","text":"2000년도에는 상 하반기 각각 의장국인 포르투갈 및 프랑스의 노력으로 2000년 12월 7일～11일 니스에서 개최된 EU 정상회의에서 제도 개혁안에 최종 합의가 이루어졌다.","chapter":1,"section":1,"page":1,"src":"2001 외교백서 제1장.hwp","id":"2000-s00047"},{"year":2001,"admin":"김대중","text":"이에 유럽중앙은행(European Central Bank: ECB)은 기준금리를 인하하였으며 독일, 프랑스를 비롯한 대부분의 회원국들은 대대적인 감세정책을 통한 경기부양책을 시행하였다.","chapter":1,"section":1,"page":1,"src":"2002 외교백서 제1장.hwp","id":"2001-s00172"},{"year":2002,"admin":"김대중","text":"그러나, 독일정부는 대다수 독일국민의 대 이라크전 반대여론에 힘입어 총선에 승리하였으며, 유럽통합 진전과정 및 대 이라크전 반대에 있어 프랑스와 공조를 지속해 온 까닭에 대 이라크전 반대 정책을 쉽게 바꿀 수는 없었으며, 이에 따라 대미관계도 어느 정도 긴장관계를 유지하게 되었다.","chapter":1,"section":3,"page":10,"src":"2003 외교백서 제1장.hwp","id":"2002-s00407"}],"docCount":111},{"id":"G20","kind":"org","aliases":["G20"],"total":635,"byYear":{"2000":6,"2001":11,"2002":4,"2006":1,"2008":21,"2009":68,"2010":116,"2011":48,"2012":38,"2013":36,"2014":47,"2015":28,"2016":11,"2018":24,"2020":20,"2021":24,"2022":39,"2023":35,"2024":29,"2025":29},"rateByYear":{"2000":24.0,"2001":34.6,"2002":28.5,"2006":6.5,"2008":133.4,"2009":402.6,"2010":583.2,"2011":264.8,"2012":182.7,"2013":203.5,"2014":201.1,"2015":128.2,"2016":137.3,"2018":143.1,"2020":89.3,"2021":139.5,"2022":205.7,"2023":158.7,"2024":143.1,"2025":158.8},"byAdmin":{"이명박":291,"박근혜":122,"윤석열":103,"문재인":68,"이재명":29,"김대중":21,"노무현":1},"focus":0.46,"first":2000,"last":2025,"peak":2010,"peakRate":"2010","docs":[{"year":2000,"admin":"김대중","text":"아울러 WTO와 경제개발협력기구(OECD)에서 논의되고 있는 다자규범 형성과정에서 우리의 경제위상에 걸맞는 능동적인 역할을 수행하였으며, 환경, 투자, 경쟁정책, 노동기준, 부패방지, 전자상거래 등 새로운 이슈와 G20회의 등 국제금융질서 개편을 위한 국제적 논의에도 적극적으로 참여하였다.","chapter":2,"section":2,"page":1,"src":"2001 외교백서 제2장.hwp","id":"2000-s00705"},{"year":2001,"admin":"김대중","text":"아울러 WTO와 경제개발협력기구(OECD) 등의 국제기구에서 이루어지고 있는 다자규범 논의에서 우리의 입장을 최대한 반영하기 위해 노력하였으며, 환경, 투자, 경쟁정책, 노동기준, 부패방지, 전자상거래 등 새로운 이슈와 G20회의 등 국제금융질서 개편을 위한 국제적 논의에도 적극적으로 참여하였다.","chapter":2,"section":2,"page":1,"src":"2002 외교백서 제2장.hwp","id":"2001-s00894"},{"year":2002,"admin":"김대중","text":"볡구봊 볿딭촳 아울러 WTO와 경제개발협력기구(OECD) 등의 국제기구에서 이루어지고 있는 다자규범 논의에 우리의 입장을 최대한 반영하기 위해 노력하였으며, 환경, 투자, 경쟁정책, 노동기준, 부패방지, 전자상거래 등 새로운 이슈와 G20회의 등 국제금융질서 개편을 위한 국제적 논의에도 적극적으로 참여하였다.","chapter":2,"section":null,"page":1,"src":"2003 외교백서 제2장.hwp","id":"2002-s00536"},{"year":2006,"admin":"노무현","text":"여기에 미국, EC, 케언즈 그룹 57), G20 58), G10 59), G33 60) 등 협상 그룹내 또는 그룹간에 기 술적 사안에 대한 실무수준의 협의가 병행되는 상태로 협상이 진행되었다.","chapter":4,"section":3,"page":38,"src":"2007 외교백서 제4장.pdf","id":"2006-s01283"},{"year":2008,"admin":"이명박","text":"특히 G8 확대정상회의(7월), G20 세계금 융정상회의(11월) 등에 우리가 적극 참여하여 선진국과 개도국 간 교량자로서 우리의 국 제적 위상을 제고하고, 향후 국제 질서 형성(global governance) 논의에도 기여할 수 있 었던것은의미가크다고하겠습니다.","chapter":null,"section":null,"page":5,"src":"2009 외교백서_목차.pdf","id":"2008-s00009"},{"year":2009,"admin":"이명박","text":"특히, 제2, 3차 G20 정상회의에서 G20 의장단 국가 로 활동하면서 세계경제위기 극복을 위한 국제적 노력에 주도적으로 참여한 결과, 금년 11월 G20 정상회의를 한국에서 개최하게 되는 뜻깊은 성과를 거두었습니다.","chapter":1,"section":null,"page":7,"src":"2010 외교백서_제1장.pdf","id":"2009-s00008"},{"year":2010,"admin":"이명박","text":"국제경제협력을 위한 최상위 협의체인 서울 G20 정상회의를 성공적으로 개최함으로써 우리의 국제적 리더십을 대내외에 과시할 수 있었으며, 우리 외교에 있어 또하나의 빛나는 기념비를 세울 수 있었습니다.","chapter":1,"section":null,"page":2,"src":"2011 외교백서_제1장.pdf","id":"2010-s00002"},{"year":2011,"admin":"이명박","text":"아울러, 2010 서울 G20 정상회의 후 속과제를 충실히 이행함으로써 글로벌 선도국가로서 리더십을 발휘하였습니다.","chapter":1,"section":null,"page":8,"src":"2012 외교백서 01.pdf","id":"2011-s00014"},{"year":2012,"admin":"이명박","text":"정부는 G20 정상회의(2010.11) 및 세계개발원조총회(2011.11)에 이어 2012년 3월 핵안보정상회의도 성공적으로 개최함으로써 글로벌 거버넌스 구축에 기여하였고, 나아가 10월 녹색기후기금(GCF) 사무국 유치 및 우리 주도의 최초 국제기구인 글로벌 녹색성장연구소(GGGI) 발족, 유엔 안보리 비상임이사국 진출 등을 통해 국제사회 내 우리의 위상을 크게 높였습니다.","chapter":1,"section":null,"page":4,"src":"2013 외교백서_제1장.pdf","id":"2012-s00009"},{"year":2013,"admin":"박근혜","text":"아울러, ODA 사업 추진체계를 정비하여 수원국 개발에 대한 원조 효과성을 제 고하고 부산 글로벌 파트너십, G20, OECD 등 주요 국제개발포럼에서 핵심적 역 할을 지속 수행 하는 등 개발협력을 통한 우리 외교지평을 확대하였다.","chapter":1,"section":2,"page":26,"src":"2014 외교백서_제1장.pdf","id":"2013-s00159"},{"year":2014,"admin":"박근혜","text":"양국 정상은 2014년 11월 개최된 G20 정상회의, 아·태경제협력체(APEC) 정 상회의 등 다자회의를 계기로 만나 양국 관계의 안정된 발전에 대한 정상 차원의 상호 의지를 확인하고 남·북·러 3각 협력 등 실질 협력 사업에 대한 건설적인 논의를 하였다.","chapter":2,"section":4,"page":82,"src":"2015 외교백서(국문)-2장.pdf","id":"2014-s00455"},{"year":2015,"admin":"박근혜","text":"또한 세계 경제의 저성장 기조가 장기화되고 불확실성이 증대되는 상황에서 우리 경제 는 2015년 안탈리아 G20 정상회의에서 경제구조 개혁에서 높은 평가를 받았고, 국가신용 등급도 역대 최고를 기록하였습니다.","chapter":1,"section":null,"page":3,"src":"2016 외교백서 1장.pdf","id":"2015-s00029"},{"year":2016,"admin":"박근혜","text":"또한 G20 정상회의 개최 를 통한 글로벌 의제에 대한 기여뿐만 아니라, 상하이협력기구(SCO: Shanghai Cooperation Organization) 창립 15주년을 기념하고, 중·ASEAN 대화관계 수 립 25주년 기념 정상회의를 개최하는 등 주변국 관여도 지속하였다.","chapter":1,"section":1,"page":8,"src":"2017 외교백서(1장).pdf","id":"2016-s00023"},{"year":2018,"admin":"문재인","text":"중국과는 통상 및 남중국해 문제 등을 둘러싸고 대립하는 양상을 보이면서도, 11월 미·중 외교안보대화 를 개최하고 12월 주요 20개국(G20) 정상회의를 계기로 열린 미·중 정상회담에서 무 역협상을 개시하기로 하는 등 대화와 협력을 이어나가는 모습을 보였다.","chapter":1,"section":1,"page":10,"src":"2019 외교백서 국문_제1장.pdf","id":"2018-s00022"}],"docCount":58},{"id":"인도네시아","kind":"country","aliases":["인도네시아"],"total":634,"byYear":{"1989":6,"1990":8,"1991":9,"1992":10,"1993":6,"1994":23,"1995":11,"1996":16,"1997":17,"1998":17,"1999":21,"2000":28,"2001":25,"2002":11,"2003":28,"2004":4,"2005":8,"2006":15,"2007":15,"2008":15,"2009":16,"2010":17,"2011":22,"2012":27,"2013":25,"2014":20,"2015":15,"2016":8,"2017":24,"2018":20,"2019":24,"2020":17,"2021":15,"2022":24,"2023":36,"2024":14,"2025":17},"rateByYear":{"1989":39.9,"1990":60.0,"1991":75.8,"1992":78.6,"1993":47.6,"1994":172.3,"1995":78.6,"1996":96.4,"1997":77.8,"1998":67.7,"1999":84.0,"2000":112.0,"2001":78.7,"2002":78.5,"2003":96.4,"2004":144.9,"2005":68.6,"2006":98.0,"2007":109.9,"2008":95.3,"2009":94.7,"2010":85.5,"2011":121.3,"2012":129.8,"2013":141.3,"2014":85.6,"2015":68.7,"2016":99.9,"2017":181.4,"2018":119.3,"2019":132.4,"2020":75.9,"2021":87.2,"2022":126.6,"2023":163.2,"2024":69.1,"2025":93.1},"byAdmin":{"김대중":102,"문재인":100,"이명박":97,"윤석열":74,"김영삼":73,"노무현":70,"박근혜":68,"노태우":33,"이재명":17},"focus":0.16,"first":1989,"last":2025,"peak":2023,"peakRate":"2017","docs":[{"year":1989,"admin":"노태우","text":"4. ※@ 3 판보와의 관계 가. 동남아지역 196?7년 8월 8일 방콕선언에 의해 인도네시아, 말레이시아, 태국, 필리핀, 싱가폴등 5개국으로 발족한 아세안은 반공을 전면으로 내세우지는 않았으나, 기본적으로 반공 정권간의 협력체제적 성격을 띄고 있다.","chapter":2,"section":null,"page":12,"src":"1990 외교백서 제2장.pdf","id":"1989-s00329"},{"year":1990,"admin":"노태우","text":"중국은 천안문 사태(1989, 6) 의 후유증에서 벗어나기 위하여 인도네시아와 사우디아라비아와의 관계개선, 이라크의 쿠웨이트 침공에 대한 유엔안보리 제재 결의 지지, 캄보디아 폴포트 세력에 대한 지지 철회, 그리고 한국과의 무역대표부 설치 합의 등 아시안게임 개최를 전후하여 종래의 실용주의적 외교 노력을 전개하고 있다.","chapter":1,"section":null,"page":10,"src":"1991 외교백서 제1장.pdf","id":"1990-s00061"},{"year":1991,"admin":"노태우","text":"4. 제3세계외생 관계 가. 동남아지역 1967년 8월 8일 「방콕선언」|에 의해 인도네시아, 말레이지아, 태국, 필리핀, 싱가폴등 5개국으로 발족한 아세안은 반공을 전면으로 내세우지는 않았으나, 기본적으로 반공 국가간의 정치협력체적 성격을 표방해왔다.","chapter":2,"section":null,"page":12,"src":"1992 외교백서 제2장.pdf","id":"1991-s00224"},{"year":1992,"admin":"노태우","text":"제3절 1992년도 외교시책이 1990년대 중장기 외교정책 방향 19 에너지 등 주요자원의 안정적 확보를 위하여 러시아, 중국, 호주, 캐나다, 미국, 인도네시아, 브라질 등 자원부국들에 대한 자원외교를 강화하고, 수출 시장 확대 및 다변화를 위하여 중ㆍ러 등 북방국가 및 제3세계 국가들에 대 해서도 적극 진출해야 하며, 1990년대 중반 0801) 가입 등 선진경제권 진입 을 위해서도 외교노력을 경주해야 한다.","chapter":1,"section":null,"page":19,"src":"1993 외교백서 제1장.pdf","id":"1992-s00125"},{"year":1993,"admin":"김영삼","text":"인도네시아는 1967년 수하르토 대통령의 집권이래 군의 이중기능(국방 및 사회참여) 및 00148(직능그룹) 조직을 중심으로 지난 26년간 정치ㆍ 사회적 안정을 유지해 왔다.","chapter":2,"section":3,"page":27,"src":"1994 외교백서 제2장.pdf","id":"1993-s00227"},{"year":1994,"admin":"김영삼","text":"> 94년 11월 15일 인도네시아 보고르에서 개최된 제2차 6880 정상회의 는 21세기 태평양시대를 앞두고 아ㆍ태지역의 무역증진 및 경제협력 확대 에 대한 구체적인 비젼을 제시한 한편, APEC 정상간의 활발한 정상외교 의 무대가 되었다.","chapter":1,"section":2,"page":9,"src":"1995 외교백서 머리말.pdf","id":"1994-s00049"},{"year":1995,"admin":"김영삼","text":"한편, 정부는 우리의 역동적인 경제개발 경험을 전수하고 호혜적인 상호교류 체계 구축을 위하여 인도네시아, 필리핀 등 80여개 개발도상국 에 총 106명의 해외봉사단을 파견하여 높은 호응을 받고 있다.","chapter":1,"section":2,"page":9,"src":"1996 외교백서 제1장.pdf","id":"1995-s00143"},{"year":1996,"admin":"김영삼","text":"동남아 지역은 고도의 경제성장에도 불구하고 여전히 불안요소가 남아 있는데 미얀마 인권문제, 인도네시아 동티모르 문제, 남사군도 문제 등을 | 그 예로 들 수 있다.","chapter":1,"section":3,"page":26,"src":"1997 외교백서 제1장.pdf","id":"1996-s00206"},{"year":1997,"admin":"김영삼","text":"1997년도 하반기부터 동남아의 태국으로부터 시작된 외환·금융위기가 인도네시아, 말레이지아, 필리핀 등 동남아 국가들은 물론 한국에까지 확산되었고, 한국·태국·인도네시아 등 다수 국가들이 IMF 구조금융지원을 받는 사태로까지 번짐으로써, 앞으로 상당기간 경제성장은 물론 지역협력에도 부정적인 영향을 미칠 가능성이 있을 것으로 보인다.","chapter":1,"section":2,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00103"},{"year":1998,"admin":"김대중","text":"특히, 동남아시아의 경우, 아세안지역안보포럼(ASEAN Regional Forum：ARF)을 중심으로 안정적 역내 안보구조가 1998년에도 기본적으로 유지되었지만, 캄보디아의 쿠데타 발생, 인도네시아의 Suharto 대통령 하야, 말레이시아 Anwar 전 부총리 축출 등으로 인해 아세안 역내 국가들간의 내부결속력이 이완되는 현상이 노정되었다.","chapter":1,"section":1,"page":1,"src":"1999 외교백서 제1장.doc","id":"1998-s00046"},{"year":1999,"admin":"김대중","text":"그러나 인도네시아의 총선과 대통령 선거, 동티모르 분리독립, 아체(Aceh) 등의 분리독립 움직임과 유혈사태, 미얀마와 캄보디아의 정정불안 등으로 일부 국가는 사회 불안을 경험하였다.","chapter":1,"section":1,"page":1,"src":"2000 외교백서 제1장.hwp","id":"1999-s00063"},{"year":2000,"admin":"김대중","text":"동남아 지역 1) 지역 동향 동남아 지역은 세계 경제의 성장, 중국의 조기 WTO 가입 가능성 증대 그리고 남북관계 진전 등 긍정적인 외부 여건에 힘입어 기본적으로는 안정세를 유지하였으나, 인도네시아, 필리핀 등 핵심국가들의 정치적 불안정과 각국의 금융 및 기업 구조 조정 부진 등 역내 부정적 요인들이 상존하여 완전한 경제 회복 기틀을 마련하는데 걸림돌이 되었으며, 이에 따라 경제위기 재발 가능성에 대한 우려도 제기되었다.","chapter":1,"section":3,"page":1,"src":"2001 외교백서 제1장.hwp","id":"2000-s00205"},{"year":2001,"admin":"김대중","text":"엔화가치 급락에 따른 경쟁력 약화, 역내 국가들의 구조조정 부진, 정권교체 이전 필리핀과 인도네시아의 정치․사회적 불안 고조 등도 역시 동남아 경제에 부정적 요인으로 작용하였다.","chapter":1,"section":1,"page":1,"src":"2002 외교백서 제1장.hwp","id":"2001-s00182"},{"year":2002,"admin":"김대중","text":"인도네시아에서는 2001년 7월 출범한 Megawati 대통령 정부가 민심수습 및 분열된 국민여론의 통합을 도모하는 한편, 경제적 어려움을 극복하기 위해 IMF, IBRD 등 국제경제기구와 ASEAN 회원국과의 협력을 강화하기 위한 정책을 추진하였다.","chapter":1,"section":3,"page":10,"src":"2003 외교백서 제1장.hwp","id":"2002-s00237"}],"docCount":111},{"id":"이라크","kind":"country","aliases":["이라크"],"total":633,"byYear":{"1989":9,"1990":20,"1991":10,"1992":4,"1993":2,"1994":1,"1995":2,"1996":14,"1997":16,"1998":28,"1999":22,"2000":13,"2001":17,"2002":46,"2003":157,"2004":18,"2005":22,"2006":17,"2007":23,"2008":14,"2009":18,"2010":10,"2011":11,"2012":19,"2013":14,"2014":25,"2015":22,"2016":5,"2017":9,"2018":5,"2019":12,"2020":13,"2021":2,"2022":2,"2023":6,"2024":4,"2025":1},"rateByYear":{"1989":59.9,"1990":150.0,"1991":84.2,"1992":31.4,"1993":15.9,"1994":7.5,"1995":14.3,"1996":84.4,"1997":73.2,"1998":111.5,"1999":88.0,"2000":52.0,"2001":53.5,"2002":328.1,"2003":540.4,"2004":652.2,"2005":188.7,"2006":111.1,"2007":168.5,"2008":88.9,"2009":106.6,"2010":50.3,"2011":60.7,"2012":91.3,"2013":79.1,"2014":107.0,"2015":100.7,"2016":62.4,"2017":68.0,"2018":29.8,"2019":66.2,"2020":58.0,"2021":11.6,"2022":10.5,"2023":27.2,"2024":19.7,"2025":5.5},"byAdmin":{"노무현":237,"김대중":126,"이명박":72,"박근혜":66,"노태우":43,"문재인":41,"김영삼":35,"윤석열":12,"이재명":1},"focus":0.37,"first":1989,"last":2025,"peak":2003,"peakRate":"2004","docs":[{"year":1989,"admin":"노태우","text":"상기 유엔 인권위원회 및 인권소위에서는 아랍 피점령지역, 남아공, 과테 말라, 동터몰, 레바논, 엘살바돌, 이란, 이라크, 쿠바 등지에서의 인권위반 사 례 및 소수민족 보호문제, 특히 천안문사태 이후의 중국의 인권상황상 대하 여 많은 논의가 있었다.","chapter":3,"section":null,"page":58,"src":"1990 외교백서 제3장.pdf","id":"1989-s00969"},{"year":1990,"admin":"노태우","text":"이러한 「새로 운 사고]에 의한 소련의 대외정책은 미ㆍ소간 획기적인 군축협상의 성공적 타결을 바탕으로 한 「전략적 혁명」 (strategic revolution) 함 이록하는 계기를 마련하였을 뿐만 아니라 지역분쟁 개입 자제, 나아가서는 최근 이라크의 쿠웨이트 침공으로 빚어진 걸프전쟁에서 나타나듯이, 분쟁 위기관리와 관련한 「미.‧소간 협조체제」(a U.S.-Soviet partnership) 의 가능성을 높여 주고 있다.","chapter":1,"section":null,"page":1,"src":"1991 외교백서 제1장.pdf","id":"1990-s00006"},{"year":1991,"admin":"노태우","text":"유엔은 이라크, 아프가니스탄, 캄보디아 등 지역분쟁 해결에 있어서 중요한 역할을 수행하였으며, 앞으로 유엔의 평화유지활동(8#0ㅇ)강화를 통한 세계평화 와 안정추구 노력이 더욱 증대될 것으로 전망된다.","chapter":1,"section":null,"page":4,"src":"1992 외교백서 제1장.pdf","id":"1991-s00047"},{"year":1992,"admin":"노태우","text":"냉전 종식이후 세계는 전반적으로 안정화되어 가고 있다고 말할 수 있으 나, 러시아의 민주화와 경제개혁 지원, 제3세계에서의 대량살상무기 확산 및 보스니아ㆍ리비아ㆍ이라크 등지에서의 지역분쟁 등이 새로운 도전으로 등 장하여 미국의 주요한 외교과제가 되었다.","chapter":4,"section":null,"page":22,"src":"1993 외교백서 제4장.pdf","id":"1992-s00875"},{"year":1993,"admin":"김영삼","text":"부쉬 행정부 이래 계속되어온 중동 지역에서의 평화 정착을 위한 노력으 제 3절 각지역 정세 및 우리나라와의 관계 / 61 로 9월에 역사적인 이스라엘 - 81,()간 화해가 이루어졌으나, 이라크와 리 비아에 대한 강경 자세는 계속되고 있다.","chapter":2,"section":3,"page":38,"src":"1994 외교백서 제2장.pdf","id":"1993-s00314"},{"year":1994,"admin":"김영삼","text":"러시아는 유엔 안보리 상임이사국의 지위 및 핵보유 군사대국으로서의 입지를 심분 활용하여 보스니아 사태, 중동평화회담, 이라크-쿠웨이트 영토분쟁，북한 핵문제 호el 적극 개입하면서 분쟁해결을 위한 독자적 목소리를 내고 있으며, 94년 7월 개최된 나폴리 G-7 정상회담부터 정치 회담에 공식적으로 참여할 자격을 획득함으로써 6-8 회담의 기틀을 마련 하였으며 동년 6월에는 0801와의 경제협정을 체결하여 경제적 냉전을 종식시키고 자국의 시장경제 전환에 필요한 각종 기술지원을 0601로부 터 받을 수 있게 되었다.","chapter":2,"section":3,"page":56,"src":"1995 외교백서 제2장.pdf","id":"1994-s00513"},{"year":1995,"admin":"김영삼","text":"또한 알제리, 수단, 이집트 등에서의 회교원리주의의 확산과 1995년 108 / 제8장 국제정세 및 한반도 주변정세 6월 이디오피아에서 발생한 Mubarak 이집트 대통령 암살미수 사건을 둘러싼 수단ㆍ이집트ㆍ이디오피아간 분쟁, 이라크ㆍ쿠웨이트간 전후처리 및 배상문제, 아람에미리트연합과 이란간, 그리고 예멘과 에리트리아간 도서영유권 분쟁은 잠재적인 역내 안정 저해요인으로 남아있다.","chapter":2,"section":3,"page":71,"src":"1996 외교백서 제2장.pdf","id":"1995-s00628"},{"year":1996,"admin":"김영삼","text":"그러나, 중동지역의 복잡한 역사적, 종교적 배경 및 산유부국과 자원빈국간의 경제적 격차 등으로 1990 이라크의 . . 쿠웨이트 침공과 같은 국지적 분쟁 가능성은 상존하고 있다.","chapter":1,"section":3,"page":83,"src":"1997 외교백서 제1장.pdf","id":"1996-s00615"},{"year":1997,"admin":"김영삼","text":"반면 이란, 이라크에 대한 경제제재의 지속에 관하여 미국 대 프랑스·러시아·중국·일본 등의 입장 차이가 노정되었고 미국과 이라크 관계가 유엔 무기사찰단의 이라크내 무기 사찰을 둘러싸고 1997년 11월부터 다시 긴장관계에 돌입하였다.","chapter":1,"section":1,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00045"},{"year":1998,"admin":"김대중","text":"그럼에도 불구하고 유엔 안보리 상임이사국 및 핵 강대국의 지위를 이용하여 코소보 및 이라크 사태 등 국제문제에 대해 적극적인 개입정책을 추진하였으며, 특히 대국주의 외교를 지향하는 Primakov 내각이 9월 출범하면서 외환.금융위기를 극복하기 위한 적극적인 경제외교를 펼쳤다.","chapter":1,"section":1,"page":1,"src":"1999 외교백서 제1장.doc","id":"1998-s00039"},{"year":1999,"admin":"김대중","text":"중동지역은 3월부터 시작된 국제유가의 급등과 이라크에 대한 경제제재 해제 분위기에 힘입어 경기침체에서 벗어났다.","chapter":1,"section":1,"page":1,"src":"2000 외교백서 제1장.hwp","id":"1999-s00067"},{"year":2000,"admin":"김대중","text":"9월 1일 Clinton 대통령이 NMD 배치 결정을 연기하겠다고 발표함에 따라 NMD 배치를 둘러싼 미 러 양국간 갈등관계는 다소 완화되었으나, 러시아가 유엔의 대이라크 제재 조치를 무시하고 9월 23일 항공기를 이라크로 비행토록 하였으며, 9월 24일 유고 대통령 선거이후 밀로세비치의 사임을 촉구하는 서방측과는 달리 선거개입 자제를 촉구하여 미 러간 이견이 끊이지 않았다.","chapter":1,"section":3,"page":1,"src":"2001 외교백서 제1장.hwp","id":"2000-s00325"},{"year":2001,"admin":"김대중","text":"한편, 미국 정부는 2001년에도 대이라크 제재를 통한 봉쇄정책을 계속하였고, 특히 9.11 테러사태 이후 미국내 일각에서는 이라크에 대해 더욱 강경한 자세를 취해야 한다고 주장하기도 하였다.","chapter":1,"section":3,"page":1,"src":"2002 외교백서 제1장.hwp","id":"2001-s00495"},{"year":2002,"admin":"김대중","text":"발 간 사 2002년도는 북한 핵문제가 다시 대두되고 이라크 전운이 고조 되는 등 국제 정세의 불확실성이 증대됨으로써 우리 외교환경에 커다란 변화가 초래된 한 해였습니다.","chapter":9,"section":4,"page":1,"src":"2003 외교백서 발간사_목차.hwp","id":"2002-s00001"}],"docCount":102},{"id":"이란","kind":"country","aliases":["이란"],"total":614,"byYear":{"1989":15,"1990":11,"1991":6,"1992":12,"1993":7,"1994":9,"1995":8,"1996":12,"1997":16,"1998":31,"1999":18,"2000":26,"2001":34,"2002":21,"2003":22,"2004":3,"2005":11,"2006":12,"2007":19,"2008":14,"2009":14,"2010":18,"2011":12,"2012":10,"2013":23,"2014":25,"2015":38,"2016":13,"2017":12,"2018":18,"2019":20,"2020":19,"2021":22,"2022":8,"2023":15,"2024":14,"2025":26},"rateByYear":{"1989":99.8,"1990":82.5,"1991":50.5,"1992":94.3,"1993":55.6,"1994":67.4,"1995":57.1,"1996":72.3,"1997":73.2,"1998":123.5,"1999":72.0,"2000":104.0,"2001":107.0,"2002":149.8,"2003":75.7,"2004":108.7,"2005":94.3,"2006":78.4,"2007":139.2,"2008":88.9,"2009":82.9,"2010":90.5,"2011":66.2,"2012":48.1,"2013":130.0,"2014":107.0,"2015":174.0,"2016":162.3,"2017":90.7,"2018":107.3,"2019":110.3,"2020":84.8,"2021":127.9,"2022":42.2,"2023":68.0,"2024":69.1,"2025":142.4},"byAdmin":{"김대중":130,"박근혜":99,"문재인":91,"이명박":68,"노무현":67,"김영삼":52,"노태우":44,"윤석열":37,"이재명":26},"focus":0.21,"first":1989,"last":2025,"peak":2015,"peakRate":"2015","docs":[{"year":1989,"admin":"노태우","text":"또한 비동맹권과의 관계강화시 위해 북 한이 주로 사용해 온 방법인 경제ㆍ군사협력도 꾸준히 지속한 바, 특히 이란 과의 경제군사협력 관계강화(1989. 5. 이란 대통령, 1989. 12. 이란 회교혁 명 근위대 총사령관 방북) 및 대이집트 군사협력(1989. 3. 이집트 총참모장 방북, 1989. 11. 북한 총참모장 이집트 방문)이 주목된다.","chapter":1,"section":null,"page":16,"src":"1990 외교백서 제1장.pdf","id":"1989-s00184"},{"year":1990,"admin":"노태우","text":"또한 장기적 협력기반 조성을 위한 한ㆍ사우디 항공운수소득 면세협정서명(1990.1) , 한ㆍ가나 경제기술협력 및 무역진홍협정 서명(1990.6) , 한ㆍ이란 체신협력의정서 서명(1990.8) , 한ㆍ자이르 투자보장 협정 서명(1990.8) 이 있었으며 사우디에서는 무역사절단(1990.5) 을, 콩고에서 는 우리나라와의 통상증진을 위해 관.민 통상사절단합 파견(1990.10)하기도 하였다.","chapter":2,"section":null,"page":19,"src":"1991 외교백서 제2장.pdf","id":"1990-s00239"},{"year":1991,"admin":"노태우","text":"중동구 국가들은 제3차 세계대전후 동서냉전의 와중에서 이데올로기의 희생물 이 되어 왔다는 점에서 우리나라와 공통성을 지니고 있으며 지난 40여년 이상 북한과 긴밀한 유대관계를 가졌던 국가들임에도 불구하고 수교후 불과 2-3년이란 단기간내 동구제국은 우리의 유엔가입 지원을 비롯, 국제무대에서 우리 입장을 적극 지지하는 등 대한국 친한내지는 우위정책을 견지하고 있어, 북한의 개방을 촉진하고 궁극적으로 한반도의 긴장완화와 평화통일에 기여하고 있다.","chapter":2,"section":null,"page":40,"src":"1992 외교백서 제2장.pdf","id":"1991-s00386"},{"year":1992,"admin":"노태우","text":". 중동구 국가들은 지난 40여년이상 북한과 긴밀한 유대관계를 가졌던 국 가들임에도 불구하고 수교후 불과 3-3년이란 단기간내 우리의 유엔가입 지원을 비롯, 국제무대에서 우리 입장을 적극 지지하는 등 친한정책을 견지 하고 있을뿐 아니라, 시장경제체제로의 이행기에 놓여있는 이들 국가 모두 우리나라의 개발경험 전수, 경제적 진출 및 기술협력 제공 등을 적극 요청 하고 있어 앞으로 우리나라와의 관계는 심화될 것으로 전망된다.","chapter":2,"section":null,"page":26,"src":"1993 외교백서 제2장.pdf","id":"1992-s00276"},{"year":1993,"admin":"김영삼","text":"특히 미하원의 인권문제와 연계한 2000 년 북경올림픽 개최 반대결의(1993. 7. 27) 및 이란행 중국 화물선 「은하 호」에 대한 미 함정의 추적사건(1993. 8.) 등 일련의 사태는 양국간 긴장관 계를 지속시켰다.","chapter":2,"section":2,"page":9,"src":"1994 외교백서 제2장.pdf","id":"1993-s00105"},{"year":1994,"admin":"김영삼","text":"한편, 이란은 Rafsanjani 정부의 경제정책 실패와 이에 따른 강경보수 세력의 의회다수 점유로 종전의 실용주의 노선에서 회교원리에 입각한 강경보수 정책으로 희귀하는 경향이 있으며, 국가 취고지도자인 Khameneie] 종교지도자 겸직 등 종정일치를 통해 회교체제를 강화해 나갈 것으로 예상된다.","chapter":2,"section":3,"page":64,"src":"1995 외교백서 제2장.pdf","id":"1994-s00556"},{"year":1995,"admin":"김영삼","text":"이러한 중국의 대미 견제는 1995년 6월 미국 정부의 리멍 후이 (소플빼) 대만 총통에 대한 입국비자 발급을 계기로 촉발된 미ㆍ중 간의 갈등에서 표면화되었으며, 상호간에 가지고 있던 기존의 부정적 인 식이 중국의 핵실험 실시, 파키스탄 및 이란에 대한 중국의 미사일 부품 판매, 인권 문제, 무역분쟁 등을 둘러싼 심각한 마찰로 인해 더욱 확산되 었다.","chapter":2,"section":2,"page":14,"src":"1996 외교백서 제2장.pdf","id":"1995-s00261"},{"year":1996,"admin":"김영삼","text":"1996년 9월 이라크는 이라크 북부지역 쿠르드족의 양대세력인 친이라 크계 쿠르드 민주당(107) 과 친이란계 쿠르드 애국동맹 (808) 사이의 세력다톰을 이용하여 쿠르드족 거점도시 Irbil창 점령하였으며, 이에 대해 미국은 이라크의 도발을 초기에 무력화시키기 위해 신속한 대이라크 미사 일 공격을 단행하였다.","chapter":1,"section":3,"page":84,"src":"1997 외교백서 제1장.pdf","id":"1996-s00624"},{"year":1997,"admin":"김영삼","text":"반면 이란, 이라크에 대한 경제제재의 지속에 관하여 미국 대 프랑스·러시아·중국·일본 등의 입장 차이가 노정되었고 미국과 이라크 관계가 유엔 무기사찰단의 이라크내 무기 사찰을 둘러싸고 1997년 11월부터 다시 긴장관계에 돌입하였다.","chapter":1,"section":1,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00045"},{"year":1998,"admin":"김대중","text":"또 9월 1∼3일간 모스크바에서 개최된 미.러 정상회담에서는 주로 러시아의 정치.경제위기 극복문제, 군축.핵비확산 문제, 중동 및 코소보 문제, 러시아의 대이란 핵협력 문제 등이 논의되었다.","chapter":1,"section":3,"page":1,"src":"1999 외교백서 제1장.doc","id":"1998-s00373"},{"year":1999,"admin":"김대중","text":"이란의 Khatami 대통령의 개방.개혁화 정책은 수구파의 반발에도 불구하고 가속화되고 있으며 서방과의 관계도 점진적으로 개선되고 있는 경향이다.","chapter":1,"section":3,"page":1,"src":"2000 외교백서 제1장.hwp","id":"1999-s00587"},{"year":2000,"admin":"김대중","text":"그간 미국의 대이란 제재조치를 둘러싼 갈등으로 미 이란간 뚜렷한 관계개선 조짐은 보이지 않고 있는 가운데, 미국은 이란에 대해 테러리즘 지원, 중동평화 과정방해, 대량 살상무기 제조 등을 중단할 것을 계속해서 요구하고 있는 반면, 이란측은 미국이 먼저 제재를 완화할 것을 주장해 왔다.","chapter":1,"section":3,"page":1,"src":"2001 외교백서 제1장.hwp","id":"2000-s00355"},{"year":2001,"admin":"김대중","text":"이러한 흐름 속에는 자유주의적 경제의 틀이 세계적인 복지수준을 향상시킬 것이란 기대가 대다수 국가들에 자리잡고 있었으며, 이를 부정할만한 두드러진 현상도 나타나지 않았다.","chapter":1,"section":1,"page":1,"src":"2002 외교백서 제1장.hwp","id":"2001-s00144"},{"year":2002,"admin":"김대중","text":"따라서 주요 석유 수출국 가운데 이란만이 2년 연속 5% 이상의 강한 성장세를 보였으며, 사우디아라비아, 쿠웨이트 등의 성장은 극히 저조하였다.","chapter":1,"section":3,"page":10,"src":"2003 외교백서 제1장.hwp","id":"2002-s00164"}],"docC 기도록 권유한 바 있으나 우리로서는 보다 충실히 회원국으로 서의 의무를 수행하기 위해서도 좀더 시간을 두고 가입여건을 개선해가면 서 단계적으로 추진한다는 입장을 견지하여 왔다.","chapter":3,"section":null,"page":30,"src":"1993 외교백서 제3장.pdf","id":"1992-s00527"},{"year":1993,"admin":"김영삼","text":"| 클린턴 행정부는 1993년 3월 중순부터 시작된 북미자유무역협정 (NAFTA) 상의 카나다, 멕시코와의 환경 및 노동분야 보완 협상이 8@ 13 일에 완료됨에 따라 11월 17일 하원 표결에 심혈을 기울였다.","chapter":2,"section":3,"page":35,"src":"1994 외교백서 제2장.pdf","id":"1993-s00288"},{"year":1994,"admin":"김영삼","text":"우선 정치면에 있어서 중남미 지역 대부분의 국가들이 1983년 아르헨 티나의 민정이양 이후 군부통치에서 문민정부로 이행되었으며, 1994년에 는 중미의 멕시코, 파나마, .코스타리카, 엘살바돌, 도미니카(공) 및 남 미의 콜롬비아, 브라질, 우루과이 등 8개국에서 평화적 정권 교체가 이루 어졌고， 아이티의 0608 군사정권 또한 국제사회의 압력으로 퇴진, | Aristide 대통령이 복귀함으로써 현재 이지역 33개국중 쿠바를 제외한 32개국이 문민정부 체제를 유지하고 있다.","chapter":2,"section":3,"page":42,"src":"1995 외교백서 제2장.pdf","id":"1994-s00436"},{"year":1995,"admin":"김영삼","text":"특히 개도국 경제의 경우, 멕시코 페소화 위기의 충격으로 중남 미 국가의 성장률은 크게 낮아졌지만 아시아 지역의 개도국이 8%를 상회 하는 높은 경제성장률을 시현하여 세계 경제 성장의 견인차 역할을 수행 하였다.","chapter":2,"section":1,"page":7,"src":"1996 외교백서 제2장.pdf","id":"1995-s00224"},{"year":1996,"admin":"김영삼","text":"지난 1994년 1월 멕시코 치아빠스주에서 발생한 농민들의 무장봉기도 1996년 11월 평화협정 이행을 감시하는 위원회가 출범함으로써 해결의 전망이 밝아지고 있다.","chapter":1,"section":3,"page":58,"src":"1997 외교백서 제1장.pdf","id":"1996-s00429"},{"year":1997,"admin":"김영삼","text":"중남미는 7월 멕시코 총선에서 제도혁명당의 장기 독재체제가 와해되는 등 안정적인 경제성장을 기반으로 정치적인 안정이 정착되어가고 있으나 베네수엘라, 콜롬비아, 파라과이, 페루 등이 정치불안을 경험하였다.","chapter":1,"section":1,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00047"},{"year":1998,"admin":"김대중","text":"그러나 경제적으로 중남미지역은 1998년에 아시아 경제위기와 러시아 금융위기의 여파로 인해 가장 큰 시장인 브라질 금융시장이 크게 동요함으로써, 아르헨티나를 비롯하여 멕시코 등 중남미 전체의 금융시장이 불안을 겪었다.","chapter":1,"section":3,"page":1,"src":"1999 외교백서 제1장.doc","id":"1998-s00436"},{"year":1999,"admin":"김대중","text":"12월 31일에는 미국.파나마간 조약에 따라 파나마 운하의 운영권이 파나마 정부측에 양도되었으며, 이밖에도 Clinton 대통령은 멕시코, 니카라과, 온두라스, 엘살바도르, 과테말라를 방문하고 아르헨티나, 베네수엘라, 파나마 등의 정상들을 초청하는 등 양자차원의 교류도 활발히 하고 있다.","chapter":1,"section":3,"page":1,"src":"2000 외교백서 제1장.hwp","id":"1999-s00350"},{"year":2000,"admin":"김대중","text":"또한 멕시코의 평화적이고 민주적인 정권 교체를 환영하고, 에쿠아돌의 군부 쿠데타 위험 및 페루 대선과정에서 드러난 문제점을 우려하는 등 이 지역에서의 민주주의 발전에 계속적인 관심을 피력하였다.","chapter":1,"section":3,"page":1,"src":"2001 외교백서 제1장.hwp","id":"2000-s00339"},{"year":2001,"admin":"김대중","text":"마) 대중남미 관계 Bush 대통령은 취임 이후 첫 해외 방문지로서 2001년 2월 16일 멕시코를 방문하여 Fox 대통령과 정상회담을 갖고 공동번영을 위한 동반자관계 지향 제하의 공동성명서를 발표하여 이민․국경 문제, 마약문제, 북미지역의 에너지자원 이용, NAFTA 지역 내의 빈곤타파, 미주자유무역지대(FTAA) 창설 등에 있어 양국간 협력을 계속할 것임을 천명하였다.","chapter":1,"section":3,"page":1,"src":"2002 외교백서 제1장.hwp","id":"2001-s00483"},{"year":2002,"admin":"김대중","text":"이러한 가운데서도, 멕시코와 칠레는 비교적 건실한 경제정책과 상대적으로 높은 세계경제로의 통합 수준을 반영하여 외부 금융여건 악화로 인한 부정적 영향을 피할 수 있었다.","chapter":1,"section":3,"page":10,"src":"2003 외교백서 제1장.hwp","id":"2002-s00172"}],"docCount":110},{"id":"브라질","kind":"country","aliases":["브라질"],"total":526,"byYear":{"1989":11,"1990":12,"1991":9,"1992":13,"1993":6,"1994":4,"1995":7,"1996":17,"1997":24,"1998":30,"1999":31,"2000":24,"2001":25,"2002":18,"2003":35,"2004":3,"2005":4,"2006":15,"2007":13,"2008":17,"2009":14,"2010":15,"2011":16,"2012":20,"2013":13,"2014":16,"2015":14,"2016":6,"2017":5,"2018":14,"2019":10,"2020":9,"2021":6,"2022":6,"2023":11,"2024":12,"2025":21},"rateByYear":{"1989":73.2,"1990":90.0,"1991":75.8,"1992":102.1,"1993":47.6,"1994":30.0,"1995":50.0,"1996":102.5,"1997":109.8,"1998":119.5,"1999":124.0,"2000":96.0,"2001":78.7,"2002":128.4,"2003":120.5,"2004":108.7,"2005":34.3,"2006":98.0,"2007":95.2,"2008":108.0,"2009":82.9,"2010":75.4,"2011":88.3,"2012":96.2,"2013":73.5,"2014":68.5,"2015":64.1,"2016":74.9,"2017":37.8,"2018":83.5,"2019":55.2,"2020":40.2,"2021":34.9,"2022":31.6,"2023":49.9,"2024":59.2,"2025":115.0},"byAdmin":{"김대중":128,"이명박":82,"노무현":70,"김영삼":58,"박근혜":49,"노태우":45,"문재인":44,"윤석열":29,"이재명":21},"focus":0.24,"first":1989,"last":2025,"peak":2003,"peakRate":"2002","docs":[{"year":1989,"admin":"노태우","text":"초봉 방한화신사과칠 Lucena 브라질 상원의장(1. 17일21), 10062 온두라스 회무장관(4. 19일23), Saenz 페루 감사원장(5. 15-19), Phillip 자메이카 국 무장관(10. 15일21), Rozental 멕시코 외무차관(11. 8-10) 등 12개국에서 42。 제2장 -퓨우트 평화정락 및 ※-을 들한 주요외교활동 18명의 방한이 있었다.","chapter":2,"section":null,"page":15,"src":"1990 외교백서 제2장.pdf","id":"1989-s00351"},{"year":1990,"admin":"노태우","text":"특히, 환경문제가 정치ㆍ경제적으로 1990년대의 중요 세계문제로 대두되고 있는 만큼, 1992년 브라질에서 개최 예정인 “유엔 환경과 개발 회의\"에 적극 참여하고, 환경오염산업 규제가 새로운 무역장벽으로 뿔뼈되고 있음으로 이에 사전 대비하면서, 마약 및 테러등 국제사회 공동의 문제해결에도 능동적으 로 참여해 나갈 것이다.","chapter":1,"section":null,"page":23,"src":"1991 외교백서 제1장.pdf","id":"1990-s00138"},{"year":1991,"admin":"노태우","text":"1991년중 중남미 국가와의 기존 유대관계를 강화하기 위한 고위인사 방문으로 는 김동영 특사의 과테말라 방문(1윌14일), 황영시 특사의 아이티 방문(2월7 일), 한우석 대사의 에쿠아돌, 멕시코, 알젠틴, 브라질 순방(4월9-23일), 이승윤 특사의 칠레, 아르헨티나, 도미니카(공), 볼리비아 방문(5월10일-6월2 일)이 있었다.","chapter":2,"section":null,"page":15,"src":"1992 외교백서 제2장.pdf","id":"1991-s00243"},{"year":1992,"admin":"노태우","text":"제3절 1992년도 외교시책이 1990년대 중장기 외교정책 방향 19 에너지 등 주요자원의 안정적 확보를 위하여 러시아, 중국, 호주, 캐나다, 미국, 인도네시아, 브라질 등 자원부국들에 대한 자원외교를 강화하고, 수출 시장 확대 및 다변화를 위하여 중ㆍ러 등 북방국가 및 제3세계 국가들에 대 해서도 적극 진출해야 하며, 1990년대 중반 0801) 가입 등 선진경제권 진입 을 위해서도 외교노력을 경주해야 한다.","chapter":1,"section":null,"page":19,"src":"1993 외교백서 제1장.pdf","id":"1992-s00125"},{"year":1993,"admin":"김영삼","text":"브라질(1788%)을 제외한 중남미 지역의 1993년도 평균 인플레이션은 15% 내외로 추정된다.","chapter":2,"section":3,"page":47,"src":"1994 외교백서 제2장.pdf","id":"1993-s00378"},{"year":1994,"admin":"김영삼","text":"우선 정치면에 있어서 중남미 지역 대부분의 국가들이 1983년 아르헨 티나의 민정이양 이후 군부통치에서 문민정부로 이행되었으며, 1994년에 는 중미의 멕시코, 파나마, .코스타리카, 엘살바돌, 도미니카(공) 및 남 미의 콜롬비아, 브라질, 우루과이 등 8개국에서 평화적 정권 교체가 이루 어졌고， 아이티의 0608 군사정권 또한 국제사회의 압력으로 퇴진, | Aristide 대통령이 복귀함으로써 현재 이지역 33개국중 쿠바를 제외한 32개국이 문민정부 체제를 유지하고 있다.","chapter":2,"section":3,"page":42,"src":"1995 외교백서 제2장.pdf","id":"1994-s00436"},{"year":1995,"admin":"김영삼","text":"공로명 외무장관이 우리 나라 외무장관 으로서는 1983년 이후 18년만에 처음으로 1995년 8월 21일부터 9월 2일 간 에쿠아돌, 페루, 칠레, 아르헨티나, 브라질 등 남미 5개국을 순방하였 다, 이 순방은 1996년 유엔안보리 비상임 이사국 진출을 눈앞에 둔 시점 에서 향후 국제사회에서 우리의 역량에 상응하는 역할을 수행한다는 신외 제3절 지역별 정세 / 91 교 구상에 따른 것이었으며, 이를 통해 동아시아에 이은 제8의 신홍경제 권으로 부상하고 있는 중남미 지역과의 실질협력 증진을 위한 기반을 공고히 하였다.","chapter":2,"section":3,"page":54,"src":"1996 외교백서 제2장.pdf","id":"1995-s00531"},{"year":1996,"admin":"김영삼","text":"한편 페루, 브라질, q마정익 등 중남미 지역에서는 민선 대통령들이 집권 연장을 도모하는 등 민주주의 발전을 저해하기도 하였다.","chapter":1,"section":1,"page":5,"src":"1997 외교백서 제1장.pdf","id":"1996-s00068"},{"year":1997,"admin":"김영삼","text":"5월 5일∼12일간 Clinton 대통령의 멕시코 및 코스타리카 방문시 중미 카리브 지역 정상들과의 회동 및 10월 12일∼18일간 브라질, 베네주엘라, 아르헨티나 남미 3개국 순방은 98년까지 3차례에 걸쳐 진행될 Clinton 대통령의 중남미 순방계획의 일부로, 미 행정부가 이 지역에 부여하는 중요성이 증가하고 있음을 입증하고 있다.","chapter":1,"section":3,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00377"},{"year":1998,"admin":"김대중","text":"중남미 지역은 1997년 7월부터 1998년 8월까지 아시아 및 러시아의 경제위기 여파로 브라질.콜롬비아.아르헨티나 등이 주로 금융 부문에서, 칠레를 비롯한 여타 국가들은 무역 부문에서 큰 타격을 받았음에도 불구하고 대부분 정치적 안정세가 지속되었다.","chapter":1,"section":1,"page":1,"src":"1999 외교백서 제1장.doc","id":"1998-s00051"},{"year":1999,"admin":"김대중","text":"러시아 및 브라질의 경제위기로 수출이 급감하였던 독일과 이탈리아 역시 하반기부터 경기회복 추세를 보였으며, 상대적으로 양호한 경제실적을 기록했던 프랑스도 1998년 하반기부터 경기둔화 조짐을 보였으나 1999년 하반기부터 회복세로 접어들었다.","chapter":1,"section":1,"page":1,"src":"2000 외교백서 제1장.hwp","id":"1999-s00050"},{"year":2000,"admin":"김대중","text":"2000년도 중남미 지역은 브라질의 금융위기 여파에도 불구하고 정치적으로 큰 동요가 없었으며, 1980년대 내전에 시달렸던 중미 지역도 정치세력간의 타협을 바탕으로 정치적 안정을 이루어가고 있다.","chapter":1,"section":1,"page":1,"src":"2001 외교백서 제1장.hwp","id":"2000-s00054"},{"year":2001,"admin":"김대중","text":"또한 Bush 대통령은 백악관에서 Pastrana 콜럼비아 대통령(2월 27일), Flores 엘살바도르 대통령(2월 28일), Cardoso 브라질 대통령(3월 30일) De La Rua 아르헨티나 대통령(4월 19일)등 중남미 지역 정상들을 잇달아 만나 민주주의, 미주자유무역지대 창설 등 상호 관심사에 대해 논의하는 등 중남미지역 국가들과의 관계 강화에 대한 강한 집념을 대내외에 과시하였다.","chapter":1,"section":3,"page":1,"src":"2002 외교백서 제1장.hwp","id":"2001-s00485"},{"year":2002,"admin":"김대중","text":"2002년 10월 Luiz Ignacio Lula da Silva 후보가 브라질 대통령에 당선되어 브라질 정치 사상 최초로 좌파정권이 등장한 데 이어, 11월에는 Lucio Gutierez 후보가 에콰도르 대통령으로 선출됨으로써 기존의 Fidel Castro 쿠바 대통령, Hugo Chavez 베네수엘라 대통령과 함께 중남미 좌파 정치세력의 기반을 넓혔다.","chapter":1,"section":3,"page":10,"src":"2003 외교백서 제1장.hwp","id":"2002-s00137"}],"docCount":110},{"id":"ARF","kind":"org" 고，아시아ㆍ태평양경제협력체(4880), 북미자유무역협정(4682), 아세안지역안보포럼(&88), 북대서양조약기구(40) 등 지역적 차원 의 협력이 가속화된 것은 이와 같은 추세를 반영하는 것이다.","chapter":1,"section":1,"page":5,"src":"1997 외교백서 제1장.pdf","id":"1996-s00072"},{"year":1997,"admin":"김영삼","text":"안보면에서는 아세안 지역안보포럼(ASEAN Regional Forum: ARF)을 중심으로 동 지역의 다자안보대화가 진행되고 있는데, 1997년도에도 동 포럼을 통해 한반도문제, 남중국해 영유권분쟁, 캄보디아 및 미얀마 정세 등 지역안보 문제와 핵군축, 대인지뢰 등 군축문제가 논의되었다.","chapter":1,"section":1,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00043"},{"year":1998,"admin":"김대중","text":"특히, 동남아시아의 경우, 아세안지역안보포럼(ASEAN Regional Forum：ARF)을 중심으로 안정적 역내 안보구조가 1998년에도 기본적으로 유지되었지만, 캄보디아의 쿠데타 발생, 인도네시아의 Suharto 대통령 하야, 말레이시아 Anwar 전 부총리 축출 등으로 인해 아세안 역내 국가들간의 내부결속력이 이완되는 현상이 노정되었다.","chapter":1,"section":1,"page":1,"src":"1999 외교백서 제1장.doc","id":"1998-s00046"},{"year":1999,"admin":"김대중","text":"이와 같은 시각에서 1999년 5월 김대중 대통령과 오부치(소연) 일본 총리간의 6자회담 논의, 7월 싱가포르 제6차 ASEAN 지역안보 포럼(ASEAN Regional Forum : ARF), 9월 알마아티 아시아교류 및 신뢰구축회의(Conference on Interaction and Confidence-Building Measures in Asia : CICA)를 위한 외무장관 준비회의 등의 다자안보 협의가 있었다.","chapter":1,"section":2,"page":1,"src":"2000 외교백서 제1장.hwp","id":"1999-s00125"},{"year":2000,"admin":"김대중","text":"G-8, 유엔 천년정상회의, ASEM, APEC, ASEAN+3 정상회의 등 주요 국제회의 계기시 남북 화해 협력 과정에 대한 국제사회의 지지를 확보하였고, 북한이 국제사회 참여도를 계속 높여가도록 북한의 대서방 수교 및 국제기구 진출을 지원한 결과 북한과 다수 서방국들간 수교가 이루어지고, ARF 가입도 실현되었습니다.","chapter":null,"section":null,"page":1,"src":"2001 외교백서 머리말.hwp","id":"2000-s00004"},{"year":2001,"admin":"김대중","text":"아시아 지역에서는 아․태경제협력체(Asia-Pacific Economic Cooperation ：APEC), 아세안지역안보포럼(ASEAN Regional Forum：ARF) 등 역내 지역협력체와는 별도로 ASEAN+3(한․중․일) 정상회의가 새로운 협력의 장으로 자리잡아 가고 있다.","chapter":1,"section":1,"page":1,"src":"2002 외교백서 제1장.hwp","id":"2001-s00127"},{"year":2002,"admin":"김대중","text":"한편 외교통상부는 APEC, ASEM, ASEAN+3, ARF 등 지역협력체에 능동적으로 참여하였으며, 유엔 총회의장직 수임 및 제2차 민주주의 공동체회의의 서울 개최 등을 통해 범세계적 문제의 해결과 인류보편적 가치의 신장을 위한 국제사회의 노력에 적극 동참하였습니다.","chapter":9,"section":4,"page":1,"src":"2003 외교백서 발간사_목차.hwp","id":"2002-s00008"},{"year":2003,"admin":"노무현","text":"한편 외교통상부는 APEC, ASEM, ASEAN+3, ARF 등 지역협력 활동에도 주도적으로 참여함과 아울러 인권, 민주주의 등 인류보편적 가치의 신장, 테러 예방, 대량살상무기의 확산 방지, 지속가능한 개발 등 범세계적 문제해결을 위한 유엔 등 국제사회의 노력에도 적극 동참 하였습니다.","chapter":null,"section":null,"page":2,"src":"2004 외교백서 발간사_목차.pdf","id":"2003-s00013"},{"year":2004,"admin":"노무현","text":"이러한공감대를토대로기존의아세안지역안보포럼(ARF) 21), 동북 아 협력대화(NEACD) 22) 외에 아태지역 및 동아시아 지역과 중첩∙연계된 다자협력 논의 움직임이 활 성화되었다.","chapter":1,"section":null,"page":6,"src":"2005 외교백서 제1장.pdf","id":"2004-s00169"},{"year":2005,"admin":"노무현","text":"또한 APEC, ASEAN+3, 동아시아 정상회의(EAS), ASEAN 지역안보포럼(ARF) 등 아·태 지역 내 지역협력체들의 활동에도 상당한 성과가 있었다.","chapter":1,"section":1,"page":6,"src":"2006 외교백서 제1장.pdf","id":"2005-s00154"},{"year":2006,"admin":"노무현","text":"이와 함께 일본, 중국, 러시아 등 한반도 주변 국가들과 미래지향적 관계를 구축하는 한편, 6자회담과 ASEAN 지역안보포럼(ARF: ASEAN Regional Forum), 동북아협력대화 (NEACD: Northeast Asia Cooperation Dialogue) 등을 통해 동북아 역내 다자안보 대화를 촉진하고, 동북아 지역의 평화 구축 기반을 조성하였다.","chapter":1,"section":2,"page":24,"src":"2007 외교백서 제1장.pdf","id":"2006-s00200"}],"docCount":98},{"id":"필리핀","kind":"country","aliases":["필리핀"],"total":514,"byYear":{"1989":13,"1990":13,"1991":12,"1992":7,"1993":9,"1994":12,"1995":11,"1996":19,"1997":18,"1998":17,"1999":22,"2000":17,"2001":28,"2002":10,"2003":18,"2004":2,"2005":8,"2006":20,"2007":11,"2008":3,"2009":4,"2010":9,"2011":10,"2012":7,"2013":19,"2014":12,"2015":27,"2016":16,"2017":24,"2018":20,"2019":15,"2020":10,"2021":11,"2022":18,"2023":16,"2024":14,"2025":12},"rateByYear":{"1989":86.5,"1990":97.5,"1991":101.0,"1992":55.0,"1993":71.4,"1994":89.9,"1995":78.6,"1996":114.5,"1997":82.4,"1998":67.7,"1999":88.0,"2000":68.0,"2001":88.1,"2002":71.3,"2003":62.0,"2004":72.5,"2005":68.6,"2006":130.7,"2007":80.6,"2008":19.1,"2009":23.7,"2010":45.2,"2011":55.2,"2012":33.7,"2013":107.4,"2014":51.3,"2015":123.6,"2016":199.8,"2017":181.4,"2018":119.3,"2019":82.7,"2020":44.6,"2021":64.0,"2022":94.9,"2023":72.5,"2024":69.1,"2025":65.7},"byAdmin":{"김대중":94,"문재인":80,"박근혜":74,"김영삼":69,"노무현":59,"윤석열":48,"노태우":45,"이명박":33,"이재명":12},"focus":0.18,"first":1989,"last":2025,"peak":2001,"peakRate":"2016","docs":[{"year":1989,"admin":"노태우","text":"소련은 고르바 초프의 크라스노야르스크 연설(1988. 9.)을 통해 이 지역에서의 해ㆍ공군 동 결, 동북아 관련국들이 참여하는 참자열 군축회의 개최, 수빅 미군 필리핀 기지와 소련이 사용하고 있는 베트남 캄란기지의 상호철폐 등을 주장했으나, 미ㆍ일은 소련의 이러한 군축 제의가 대륙세력인 소런에 일방적으로 유리한 제안이라고 완강한 거부 반응을 보였다.","chapter":1,"section":null,"page":7,"src":"1990 외교백서 제1장.pdf","id":"1989-s00097"},{"year":1990,"admin":"노태우","text":"즉 미국은 동아시아 지역에 있어서도 종래 「벌짜화해프\\%] 및 이에 . 규피「전진배치 방어전략」함 수정 내지 재조정, 1991년~2000년까지 한국, 일본, 필리핀 등 동아시아 주둔군병력 14만명에 대한 3단계의 부분감축안을 제2절 동북아 및 한반도 정세“11 확정시켰다.","chapter":1,"section":null,"page":10,"src":"1991 외교백서 제1장.pdf","id":"1990-s00063"},{"year":1991,"admin":"노태우","text":"4. 제3세계외생 관계 가. 동남아지역 1967년 8월 8일 「방콕선언」|에 의해 인도네시아, 말레이지아, 태국, 필리핀, 싱가폴등 5개국으로 발족한 아세안은 반공을 전면으로 내세우지는 않았으나, 기본적으로 반공 국가간의 정치협력체적 성격을 표방해왔다.","chapter":2,"section":null,"page":12,"src":"1992 외교백서 제2장.pdf","id":"1991-s00224"},{"year":1992,"admin":"노태우","text":"제1절 경제‧통상 가조 . 83 〈대el4M% 교역현황》 (단위 : 억불) |」 | 8 | 19 | 190 | 1001 | 1902 | (자료 : 관세청 통계) 우리나라는 대아세안 공산품 수출 호조에 힘입어 91년부터 대아세안 혹 자를 견지하고 있으며 국가별로는 필리핀, 태국, 싱가폴과 흑자를 기록하였 으며 인도네시아, 말레이지아와는 원자재 수입으로 인해 적자를 기록하고 있다.","chapter":3,"section":null,"page":21,"src":"1993 외교백서 제3장.pdf","id":"1992-s00486"},{"year":1993,"admin":"김영삼","text":"그러나 클라크 공군기지, 수빅 해군기지 등 필리핀내 미군사기지의 폐 쇄로 필리핀 주둔 미군이 철수하였고, 북한의 도 개발문제 등 한반도 안보 상황이 불확실한 상황에서 미국은 적어도 단기적 차원에서 681 계획에 따 라 이미 확정된 동아시아 주둔 미군의 부분감축정책 이상의 급격한 감축을 단행하지는 않을 것이다.","chapter":2,"section":2,"page":11,"src":"1994 외교백서 제2장.pdf","id":"1993-s00122"},{"year":1994,"admin":"김영삼","text":"필리핀의 경우, Ramos 대통령정부는 각종 개혁안 및 비젼제시, 비리 부패 척결시도 및 경제회복 등으로 국민들로부터 전반적인 호감을 받고 있으며, 필리핀 사회 내부의 문제점을 해결하기 위해 00100 대통령에 이어 국민화합 정책을 표방하고, 반군세력에 대한 사면, 회유, 소탕 등을 계속하여 성과를 보이고 있으며, 특히 경제회복과 더불어 반군활동이 줄 어들고, 치안상태가 양호하게 되어 외국인투자 증가 및 국내재투자 증가 추세로 이어지고 있다.","chapter":2,"section":3,"page":25,"src":"1995 외교백서 제2장.pdf","id":"1994-s00319"},{"year":1995,"admin":"김영삼","text":"한편, 정부는 우리의 역동적인 경제개발 경험을 전수하고 호혜적인 상호교류 체계 구축을 위하여 인도네시아, 필리핀 등 80여개 개발도상국 에 총 106명의 해외봉사단을 파견하여 높은 호응을 받고 있다.","chapter":1,"section":2,"page":9,"src":"1996 외교백서 제1장.pdf","id":"1995-s00143"},{"year":1996,"admin":"김영삼","text":"아시아ㆍ 태평양지역에서는 남사군도 영유권 분쟁과 관련해서 중국과 필리핀간에 마찰이 심화되고, 아프가니스탄 내전이 악화되는 등 역내 안 보상황이 유동적이 되었다.","chapter":1,"section":1,"page":5,"src":"1997 외교백서 제1장.pdf","id":"1996-s00069"},{"year":1997,"admin":"김영삼","text":"1997년도 하반기부터 동남아의 태국으로부터 시작된 외환·금융위기가 인도네시아, 말레이지아, 필리핀 등 동남아 국가들은 물론 한국에까지 확산되었고, 한국·태국·인도네시아 등 다수 국가들이 IMF 구조금융지원을 받는 사태로까지 번짐으로써, 앞으로 상당기간 경제성장은 물론 지역협력에도 부정적인 영향을 미칠 가능성이 있을 것으로 보인다.","chapter":1,"section":2,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00103"},{"year":1998,"admin":"김대중","text":"특히 남사군도(Spratly) 영유권을 둘러싼 중국-필리핀 관계도 중국의 도서내 구조물 설치.보강공사 등으로 양국간 긴장관계가 다소 고조되기도 하였으나, 양국 및 여타 아세안 국가들이 어떠한 무력마찰을 원치 않고 평화적으로 이 문제가 해결되어야 한다는 인식을 갖고 있어 별다른 변화없이 현상유지(Status quo)가 계속되었다.","chapter":1,"section":3,"page":1,"src":"1999 외교백서 제1장.doc","id":"1998-s00247"},{"year":1999,"admin":"김대중","text":"또한 　중국의 구조물 설치.보강 공사 등으로 남사군도(Spratly) 영유권을 둘러싼 중국과 필리핀간 긴장이 다소 고조되기도 하였으나, 양국과 여타 ASEAN 국가들이 어떠한 무력마찰도 원치 않으며 평화적으로 문제가 해결되어야 한다는 인식을 갖고 있어 별다른 변화없이 현상유지(status quo)가 계속되었다.","chapter":1,"section":3,"page":1,"src":"2000 외교백서 제1장.hwp","id":"1999-s00223"},{"year":2000,"admin":"김대중","text":"1999년이래 아프리카 등지에서 공관 축소를 단행하고 유럽 미주 등 서방접근을 강화하는 등 실리지향의 신 외교노선을 추구하여 온 북한은 2000년도에는 이탈리아와 대사급 외교관계 수립을 시작으로 오스트레일리아와 국교를 재개하고 필리핀, 영국과 국교를 수립했으며, 기타 구주연합(EU) 국가들과도 활발한 접촉을 시도했다.","chapter":1,"section":2,"page":1,"src":"2001 외교백서 제1장.hwp","id":"2000-s00155"},{"year":2001,"admin":"김대중","text":"엔화가치 급락에 따른 경쟁력 약화, 역내 국가들의 구조조정 부진, 정권교체 이전 필리핀과 인도네시아의 정치․사회적 불안 고조 등도 역시 동남아 경제에 부정적 요인으로 작용하였다.","chapter":1,"section":1,"page":1,"src":"2002 외교백서 제1장.hwp","id":"2001-s00182"},{"year":2002,"admin":"김대중","text":"3) 필리핀 딖잌몬 봊몕뫄 잉교봊 특히, 남부 민다나오지역에서 계속되고 있는 회교반군 모로이슬람 해방운동(MILF) 및 인질납치로 악명 높은 Abu Sayyaf 소탕작전 등으로 인한 정부군과 반군간 충돌 및 이에 따른 치안불안이 계속되고 있다.","chapter":1,"section":3,"page":10,"src":"2003 외교백서 제1장.hwp","id":"20 992 외교백서 제2장.pdf","id":"1991-s00243"},{"year":1992,"admin":"노태우","text":"경제면에서는 80년대 최악의 위기를 넘기면서 남미 다수국가의 대외개방 및 경제자율화를 근간으로 하는 경제개혁 정책을 추구, 아르헨티나, 칠레 등 을 중심으로 경제회복의 신호를 우슬9] 나타내고 있다.","chapter":4,"section":null,"page":33,"src":"1993 외교백서 제4장.pdf","id":"1992-s00947"},{"year":1993,"admin":"김영삼","text":"1993년 12월 11일 실시된 칠레 대통령 선거에서는 여당연합의 Eduardo Frei 후보가 58%의 지지로 당선되어 1994년 3월 11일 취임 예정이다.","chapter":2,"section":3,"page":47,"src":"1994 외교백서 제2장.pdf","id":"1993-s00370"},{"year":1994,"admin":"김영삼","text":"한편 94년중에는 일본총리, 중국총리, 카나다총독, 태국총리, 체코수상, 핀랜드수상, 칠레대통령, 폴란드대통령, 루마니아대통령, 이스라엘수상 등이 공식방한하여 경제통상협력을 포함한 상호 보완적인 협력관계를 구 축하였다.","chapter":1,"section":2,"page":12,"src":"1995 외교백서 머리말.pdf","id":"1994-s00067"},{"year":1995,"admin":"김영삼","text":"또한, 칠레 등의 가입을 통한 NAFTA 확대와 범미주지역 무역 자유화 추진 등 개방적 자유무역 질서와 다자간 경제협력의 틀을 형성하기 위한 주도적 노력을 전개하였다.","chapter":2,"section":3,"page":47,"src":"1996 외교백서 제2장.pdf","id":"1995-s00484"},{"year":1996,"admin":"김영삼","text":"APEC함 통한 아ㆍ태 지역 무역. 투자 자유화 추진, 칠레를 위시한 중남미 제국의 가입을 통한 NAFTA 확대 추진 등은 이러한 노력의 일환 으로 이루어졌다.","chapter":1,"section":3,"page":54,"src":"1997 외교백서 제1장.pdf","id":"1996-s00406"},{"year":1997,"admin":"김영삼","text":"(3) 칠레 1994년 3월 취임한 Frei 대통령은 좌파 세력과 여당연합(Concertacin)을 형성하여 콘센서스에 의한 정국운영을 하고 있다.","chapter":1,"section":3,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00430"},{"year":1998,"admin":"김대중","text":"중남미 지역은 1997년 7월부터 1998년 8월까지 아시아 및 러시아의 경제위기 여파로 브라질.콜롬비아.아르헨티나 등이 주로 금융 부문에서, 칠레를 비롯한 여타 국가들은 무역 부문에서 큰 타격을 받았음에도 불구하고 대부분 정치적 안정세가 지속되었다.","chapter":1,"section":1,"page":1,"src":"1999 외교백서 제1장.doc","id":"1998-s00051"},{"year":1999,"admin":"김대중","text":"정치적으로는 전반적인 안정세를 보였으나, 아르헨티나에서는 대통령 선거에 따른 정치적 불안정이 나타났고 칠레에서는 인권문제를 둘러싼 정부와 군부간 갈등이 표출되었다.","chapter":1,"section":1,"page":1,"src":"2000 외교백서 제1장.hwp","id":"1999-s00066"},{"year":2000,"admin":"김대중","text":"3. 중남미 지역 가. 지역 정세 중남미 지역은 2000년 멕시코, 칠레, 우루과이 등에서 민주적 선거를 통해 평화적 정권교체를 이룩하여 1990년대 이후 착실히 진행되어 온 민주주의 제도 정착과 정치적 안정이 더욱 공고화되었다.","chapter":1,"section":3,"page":1,"src":"2001 등을 통하여 기존 어장내 지속적인 입어 및 어업협력강화를 위해 노력하고 있다.","chapter":3,"section":null,"page":31,"src":"1991 외교백서 제3장.pdf","id":"1990-s00676"},{"year":1991,"admin":"노태우","text":"또한 기존어장의 계속적인 확보차 원에서도 정부는 호주, 뉴질랜드, 불란서등과 정부간 어업회담 개최를 통하여 지속적인 입어보장 및 어업분야 협력을 강화해나가고 있다.","chapter":3,"section":null,"page":39,"src":"1992 외교백서 제3장.pdf","id":"1991-s00688"},{"year":1992,"admin":"노태우","text":"4. 대양주 지역 가. 정세개관 호주, 뉴질랜드, 휘지, 파푸아뉴기니, 기타 다수의 소도서국 및 자치령으로 148. 제4장 지성정세 및 우리나라와의 관계 > 구성된 대양주 지역은 지역안보협력기구로 태평양 안전보장조약(4205), 남태평양 도서국간 결속과 협력목적의 남태평양포럼(58『') 및 전 식민열강 들이 동 지역의 경제, 사회, 문화분야에 대한 지원목적으로 결성한 남태평양 위원희(580) 등 다자간 협력기구를 중심으로 전반적으로 안정속에 평화를 유지해 오고 있다.","chapter":4,"section":null,"page":16,"src":"1993 외교백서 제4장.pdf","id":"1992-s00839"},{"year":1993,"admin":"김영삼","text":"라. 대양주 지역 1) 지역정세 호주, 뉴질랜드, 피지, 파푸아뉴기니, 기타 다수의 소도서국 및 자치령으 로 구성된 대양주 지역은 미국, 영국 등 전통적 우방국가와의 친선관계 유 지와 남태평양 포럼(8210) 및 남태평양 의원회(860) 등 다자간 협력기구를 중심으로 전반적으로 안정속에 평화를 유지해 오고 있다.","chapter":2,"section":8,"page":32,"src":"1994 외교백서 제2장.pdf","id":"1993-s00267"},{"year":1994,"admin":"김영삼","text":"94 7월 출범한 아세안지역안보포럼 (680) 은 아세안과 한국, 미국, 일본, 카나다, 호주, 뉴질랜드, 81) 동 아세안의 대화상대국들 뿐만 아니 라 중국, 러시아 등 이 지역의 안보 문제와 관련된 강대국들이 망라된 안보협의체로 동남아지역에서의 안보정세와 분쟁예방 등 안보관련 문제들 을 논의하는 장(8) 으로 활용될 것이 기대된다.","chapter":2,"section":3,"page":23,"src":"1995 외교백서 제2장.pdf","id":"1994-s00305"},{"year":1995,"admin":"김영삼","text":"마. 대양주 지역 1) 지역정세 호주, 뉴질랜드, 휘지, 파푸아뉴기니, 기타 다수의 소도서국 및 자치 령으로 구성된 대양주 지역은 미국, 영국 등 전통적인 우방국가와의 친선 관계를 유지하는 가운데, 역동적인 경제발전을 시현하고 있는 아시아 지 역과의 협력관계 강화를 적극적으로 추진하고 있다.","chapter":2,"section":3,"page":39,"src":"1996 외교백서 제2장.pdf","id":"1995-s00425"},{"year":1996,"admin":"김영삼","text":"마. 대양주 지역 1) 지역 정세 호주, 뉴질랜드, 파푸아뉴기니, 휘지, 기타 다수의 소규모 도서국가 및 자치령으로 구성된 대양주 지역은 미국, 영국 등 전통적인 우방과의 50 / 제 ]장 국제정세 및 한반도 주변정세 친선관계를 유지하는 가운데, 역동적인 경제발전을 시현하고 있는 동아시 아 지역과의 협력 강화를 적극적으로 추진하였다.","chapter":1,"section":3,"page":41,"src":"1997 외교백서 제1장.pdf","id":"1996-s00316"},{"year":1997,"admin":"김영삼","text":"뉴질랜드에서는 1996년10월 실시된 총선결과 Bolger 총리가 이끄는 국민당이 과반의석 확보에는 실패하였으나, 뉴질랜드 제 1당과 연립정부(뉴질랜드 최초의 연립정부)를 구성함으로써 1990년이래 세번째 연속 집권에 성공하였다.","chapter":1,"section":3,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00304"},{"year":1998,"admin":"김대중","text":"1996년 총선 결과 출범한 뉴질랜드 최초의 국민당-NZ제일당 연립정부는 웰링턴 공항의 민영화 계획에 대한 연립정부내 대립으로 인해 1998년 8월 와해되고, 국민당 주도의 단독 소수정부가 구성되었다.","chapter":1,"section":3,"page":1,"src":"1999 외교백서 제1장.doc","id":"1998-s00325"},{"year":1999,"admin":"김대중","text":"1999년중 개최 된 미국, 일본, 러시아, 몽골, 호주, 뉴질랜드 등과의 정상희담과 외 무장관회담을 통해 우리의 정책과 노력에 대한 국제적 지지를 확인 하였고, 특히 최초로 개최된 456&ㅅ18 + 한ㆍ중ㆍ일 정상희담을 통 해 우리의 포용정책에 대한 주변국들의 이해와 지지를 굳혔습니다.","chapter":null,"section":null,"page":2,"src":"2000 외교백서 머리말.pdf","id":"1999-s00010"},{"year":2000,"admin":"김대중","text":"한편, 뉴질랜드는 아시아 경제위기의 영향으로 경기침체를 겪었으며, 경제개발 및 경제개혁에 관심을 가지고 역내경제협력에 역점을 두고 있다.","chapter":1,"section":3,"page":1,"src":"2001 외교백서 제1장.hwp","id":"2000-s00280"},{"year":2001,"admin":"김대중","text":"뉴질랜드 역시 낙농제품의 국제가격이 상승함에 따라 수출이 크게 증가되었을 뿐만 아니라 교역수지를 개선하는 효과를 거두어 약 1%의 경제 성장을 유지하였다.","chapter":1,"section":1,"page":1,"src":"2002 외교백서 제1장.hwp","id":"2001-s00195"},{"year":2002,"admin":"김대중","text":"8) 몰디브 몺교봊 씵몽고 호주와 뉴질랜드는 또한 도서국가의 자산인 천연자원(임업, 광업, 수산업)에 대한 남획문제에 공동 대응할 것을 주창하고 도서국가의 권익보호를 위해 노력하고 있다.","chapter":1,"section":3,"page":10,"src":"2003 외교백서 제1장.hwp","id":"2002-s00281"}],"docCount":106},{"id":"태국","kind":"country","aliases":["태국"],"total":483,"byYear":{"1989":10,"1990":12,"1991":14,"1992":12,"1993":7,"1994":19,"1995":7,"1996":12,"1997":18,"1998":18,"1999":21,"2000":19,"2001":30,"2002":6,"2003":25,"2004":1,"2005":8,"2006":10,"2007":11,"2008":10,"2009":10,"2010":5,"2011":9,"2012":17,"2013":12,"2014":13,"2015":11,"2016":6,"2017":9,"2018":20,"2019":21,"2020":6,"2021":8,"2022":15,"2023":16,"2024":17,"2025":18},"rateByYear":{"1989":66.5,"1990":90.0,"1991":117.8,"1992":94.3,"1993":55.6,"1994":142.3,"1995":50.0,"1996":72.3,"1997":82.4,"1998":71.7,"1999":84.0,"2000":76.0,"2001":94.4,"2002":42.8,"2003":86.1,"2004":36.2,"2005":68.6,"2006":65.4,"2007":80.6,"2008":63.5,"2009":59.2,"2010":25.1,"20 포르, 태국, 베트남) 과 라오스, 캄보디아, 미얀마로 이루어진 동남 아 지역은 1995년에도 전반적인 정치적 안정을 바탕으로 경제적 성장을 지속하였으며, 아세안 회원국의 확대와 단결을 추구하면서 아시아ㆍ유럽 정상회의 (ASEM) 의 출범에 주도적 역할을 하는 등 국제 협력에 있어서 두드러진 역할을 수행한 것으로 평가된다.","chapter":2,"section":3,"page":28,"src":"1996 외교백서 제2장.pdf","id":"1995-s00348"},{"year":1996,"admin":"김영삼","text":"1967년 말레이지아, 인 도네시아, 태국, 필리핀 및 싱가포르 5개국으로 출범한 ASEAN위 1984 년 브루나이 가입에 이어 1995년에 베트남이 가입함으로써 회원국이 ?개 국으로 증가하였으며, 1996년 11월 자카르타에서 개최된 비공식 정상회 의에서 미얀마, 캄보디아, 라오스 3개국을 동시 가입시키기로 결정하여 ASEAN합 동남아 10개국으로 확대하려는 움직임을 보이고 있다.","chapter":1,"section":3,"page":25,"src":"1997 외교백서 제1장.pdf","id":"1996-s00199"},{"year":1997,"admin":"김영삼","text":"이처럼 각 세력들이 자국의 실리를 위한 적극적인 정책을 추진하면서 새로운 국제질서 형성을 위한 축을 형성해 가는 가운데 동아시아 지역은 97년 7월 태국에서 발생된 외환위기가 역내 각국으로 파급되는 경제적 어려움을 겪게 되었다.","chapter":1,"section":1,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00042"},{"year":1998,"admin":"김대중","text":"이처럼 각 세력들이 자국의 실리를 위한 적극적인 정책을 추진하면서 새로운 국제질서 형성을 위한 축을 형성해 가는 가운데 동아시아 지역에서는 1997년 7월 태국에서 발생한 경제위기의 확산 여파로 한국 등 다수 국가들이 IMF의 구제금융 지원을 받고, 1998년 경제성장률이 크게 둔화되는 등 경제 안정뿐만 아니라 정치.안보 관계에도 부정적 영향을 미쳤다.","chapter":1,"section":1,"page":1,"src":"1999 외교백서 제1장.doc","id":"1998-s00045"},{"year":1999,"admin":"김대중","text":"태국은 1997년 11월 출범한 Chuan 내각이 부실 금융기관에 대한 폐쇄조치 단행, 금융관련 긴급행정명령 채택 등 경제위기 극복을 위한 제반 경제개혁을 신속히 진행하고 1997년 10월 발효된 신헌법에 따른 정치개혁을 과감히 추진하고 있어, 일부 각료의 이권개입 의혹 등에도 불구하고, 안정적인 국민적 지지를 받고 있다.","chapter":1,"section":3,"page":1,"src":"2000 외교백서 제1장.hwp","id":"1999-s00245"},{"year":2000,"admin":"김대중","text":"ASEAN은 매년 7월 마지막 주에 주요 관련 회의를 정례적으로 개최해 오고 있으며, 2000년 7월 24～29일 태국 방콕에서 ASEAN 외무장관회의(ASEAN Ministerial Meeting：AMM), ASEAN 확대 외무장관회의(Post Ministerial Meeting：PMC), ASEAN 지역안보포럼(ASEAN Regional Forum：ARF) 외무장관 회의 등 주요 정례회의를 잇달아 개최하였다.","chapter":1,"section":3,"page":1,"src":"2001 외교백서 제1장.hwp","id":"2000-s00206"},{"year":2001,"admin":"김대중","text":"동남아 지역 1) 지역 동향 동남아 지역은 인도네시아, 필리핀, 태국 등 동남아 주요 국가에서의 평화적 정권교체를 통해 정치적으로 안정세를 유지하였으나, 경제적으로는 세계경제 하강, 국내 경제구조 개혁 부진 등으로 인해 어려움을 겪었다.","chapter":1,"section":3,"page":1," :"노태우","text":"폴란드에서는 1989년 9월 마조비에츠키 주도의 연립정부를 수립, 점진적인 개혁정책을 추진해 왔으나, 바원사측에서는 보다 급진적 개혁함 주장하면서 대통령 직선제 개헌과 조기 의회선거 실시를 주장함으로써 1990년 7월 자유노 조는 사실상 양분되었다, 11월-18월에 실시된 대통령 선거에서 Al 마조비에츠키 총리와 무명의 캐나다 교민 출신의 티민스키등과 대결, 고전하였 으나, 2차 결선투표에서 티민스키 후보를 누르고 대통령에 당선, 신진 비엘레츠 키를 총리에 임명함으로써 급진적 개혁에 박차를 가할 수 있었다.","chapter":4,"section":null,"page":36,"src":"1991 외교백서 제4장.pdf","id":"1990-s01128"},{"year":1992,"admin":"노태우","text":"제3절 1992년도 외교시책이 1990년대 중장기 외교정책 방향 19 에너지 등 주요자원의 안정적 확보를 위하여 러시아, 중국, 호주, 캐나다, 미국, 인도네시아, 브라질 등 자원부국들에 대한 자원외교를 강화하고, 수출 시장 확대 및 다변화를 위하여 중ㆍ러 등 북방국가 및 제3세계 국가들에 대 해서도 적극 진출해야 하며, 1990년대 중반 0801) 가입 등 선진경제권 진입 을 위해서도 외교노력을 경주해야 한다.","chapter":1,"section":null,"page":19,"src":"1993 외교백서 제1장.pdf","id":"1992-s00125"},{"year":1993,"admin":"김영삼","text":"경기 침체는 미국, 일본, 캐나다 등지에서 정치 지도자의 교체를 가져온 큰 요인 이 되었는바 1994년에 선거를 앞두고 있는 독일, 이태리 등 서방 주요국가 들의 집권당은 낮은 지지율로 고심하고 있다.","chapter":2,"section":1,"page":3,"src":"1994 외교백서 제2장.pdf","id":"1993-s00056"},{"year":1995,"admin":"김영삼","text":"또한 총리급 이상의 외 국 고위인사의 방중 활동은 무라야마(참|[) 일본 총리(5.2-0), Chretien 캐나다 총리 (11.5-10) 등 총 52회로 50여명의 세계 각국의 총리급 이상 고위인사가 중국을 방문하여 우호협력관계를 다지는 성과를 거두었다.","chapter":2,"section":3,"page":27,"src":"1996 외교백서 제2장.pdf","id":"1995-s00339"},{"year":1997,"admin":"김영삼","text":"이러한 다자차원의 통합이외에도 멕시코-칠레, 멕시코-코스타리카, 칠레-캐나다, 페루-칠레간의 다양한 양자 자유무역협정(FTA) 체결이 활발히 진전되고 있어 중남미지역 통합이 가속화되고 있다.","chapter":1,"section":3,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00461"},{"year":1998,"admin":"김대중","text":"한편, 동 회의 참석 계기에 통상교섭본부장은 미국, 프랑스, 캐나다, 스웨덴, 이태리, 멕시코 통상장관과 양자회담을 개최하여 양국간 통상현안을 논의하였다.","chapter":4,"section":5,"page":1,"src":"1999 외교백서 제4장.doc","id":"1998-s01228"},{"year":1999,"admin":"김대중","text":"FTAA 협상을 위한 제5차 미주통상장관회담이 11월 3일～4일간 캐나다 토론토에서 34개국 통상장관 참석하에 개최되는 등 미국과 중남미는 2005년에 FTAA를 창설하기 위해 지속적으로 노력하고 있다.","chapter":1,"section":3,"page":1,"src":"2000 외교백서 제1장.hwp","id":"1999-s00349"},{"year":2000,"admin":"김대중","text":"연이어 개최된 아세안 확대외무장관회의(Post Ministerial Conference : PMC)와 미국, 일본, 중국, 러시아, EU, 캐나다, 베트남 등 7개국과의 외무장관 회담을 통해 참가국들은 역사적인 남북정상회담 개최이후 한반도에 조성되고 있는 화해와 협력의 분위기에 대해 예외 없는 환영과 지지를 표명하였다.","chapter":3,"section":1,"page":1,"src":"2001 외교백서 제3장.hwp","id":"2000-s00837"},{"year":2001,"admin":"김대중","text":"미국의 테러전쟁 동참 호소에 부응하여 NATO는 사태 발생 다음날 비상회의를 소집하여 사상 최초로 NATO 조약상 집단적 자위권의 발동을 공포하였고 영국, 프랑스, 독일, 이탈리아, 캐나다, 호주 등 미국의 주요 동맹국들은 군사적 지원을 포함한 지원 의사를 표명하였으며 일본은 자위대에 의한 후방지원을 약속하였다.","chapter":1,"section":1,"page":1,"src":"2002 외교백서 제1장.hwp","id":"2001-s00204"},{"year":2002,"admin":"김대중","text":"몕몿핍 캐나다의 대외관계와 관련, 캐나다는 대테러 국제연대 적극 참여, 번영 추구, 캐나다 가치와 문화의 대외 확산 등을 대외정책의 기본방향으로 하고 있다.","chapter":1,"section":3,"page":10,"src":"2003 외교백서 제1장.hwp","id":"2002-s00336"},{"year":2003,"admin":"노무현","text":"반면, 캐나다 경제는 3월 이후 토론토와 밴쿠버 지역을 중심으로 발생한 SARS의 영향이 관광객 감소와 소비지출의 24 / 제 1 장 국제정세 및 한반도 주변정세 위축으로 이어졌으며, 여기에 광우병 발생, 브리티시 컬럼비아 지역 의 산불, 대규모 정전 사태 등의 악재가 겹침에 따라 약세를 면치 못 했다.","chapter":1,"section":1,"page":7,"src":"2004 외교백서 제1장.pdf","id":"2003-s00070"},{"year":2004,"admin":"노무현","text":"한편 2004년 12월 국제안보 위협의 대처 방안과 유엔 개혁 전반에 대한 권고를 담은 유엔 고위패널 (UN High-Level Panel)의보고서가발표됨에따라, 안보리확대를포함한유엔개혁문제가국제사회 1) NAFTA: 미국, 캐나다, 멕시코 등 북미 3국간에 광범위한 자유무역을 추진하기 위해 1994년 1월 1일 공식 출범한 협정으로, 이를 통해 탄생한 미주자유무역지대는 전세계 GDP의 36%를 차지하며 EU와 함께 세계 경제의 양대 축으로 자리잡고 있다.","chapter":1,"section":null,"page":2,"src":"2005 외교백서 제1장.pdf","id":"2004-s00042"},{"year":2005,"admin":"노무현","text":"112 | 2006년 외교백서 주요국 유엔 정규분담금 분담률 현황 (2002~2004년) 25% 미국 일본 미국 일본 20% 15% 10% 5% 캐나다 한국 중국 캐나다 한국 중국 0% 2002년 2004년 3) 제6차 정부혁신 세계포럼 우리 정부는 유엔과 공동으로 2005년 5월 24~27일간 서울에서 제6차 정부혁신 세계포럼 (6th Global Forum on Reinventing Government)을 개최하였다.","chapter":3,"section":3,"page":4,"src":"2006 외교백서 제3장.pdf","id":"2005-s00697"}],"docCount":92},{"id":"이스라엘","kind":"country","aliases":["이스라엘"],"total":449,"byYear":{"1989":2,"1990":4,"1991":3,"1992":4,"1993":7,"1994":18,"1995":10,"1996":19,"1997":23,"1998":19,"1999":21,"2000":32,"2001":23,"2002":20,"2003":25,"2004":1,"2005":7,"2006":5,"2007":7,"2008":6,"2009":9,"2010":10,"2011":10,"2012":22,  놓았다.","chapter":2,"section":1,"page":6,"src":"1994 외교백서 제2장.pdf","id":"1993-s00082"},{"year":1994,"admin":"김영삼","text":"' 또한 94년중 일본, 카나다, 중국, 태국, 이스라엘, 체코, 핀랜드, 폴랜드, 루마니아, 스리랑카 등 여러 국가 원수 및 수상이 연이어 방한함 으로써，우리외교의 지평이 그만큼 확대되고 있음을 입증하였다.","chapter":1,"section":3,"page":5,"src":"1995 외교백서 머리말.pdf","id":"1994-s00018"},{"year":1995,"admin":"김영삼","text":"그리고 미국, 일본, 이스라엘, 폴란드 등 과학기술 선진국 및 동구권 국가와는 과학기술 또는 원자력 분야에서의 협력을 확대하고 있으며, 주 요 자원 보유국인 러시아와는 사하 가스전 등 에너지개발 사업을, 중국, 30 / 제장 우리 외교정책의 기조와 목표 호주, 인도네시아 등 연안국과는 어업협력을 계속 확대해 나가고 있다.","chapter":1,"section":2,"page":9,"src":"1996 외교백서 제1장.pdf","id":"1995-s00150"},{"year":1996,"admin":"김영삼","text":"중동지역에서는 _1996년 _6월 대아랍_ 강경주의자인 이스라엘 Netanyahu 정권이 출범하여 중동평화 협상이 난항을 겪었으며, 아프리 카에서는 르완다, 부룬디내 종족분규가 자이르등 중부아프리카 지역으로 까지 확대되어 대량 난민 발생과 양민 학살이 심각한 상태에 이르렀다.","chapter":1,"section":1,"page":5,"src":"1997 외교백서 제1장.pdf","id":"1996-s00067"},{"year":1997,"admin":"김영삼","text":"중동지역에서는 이스라엘의 동예루살렘 정착촌 건설(1997년 3월)과 이에 대한 주변 아랍국가들의 반발로 인해 중동 평화협상이 교착상태에 들어가기도 하였으나, 1997년 9월 미국의 중재로 양측간에 팔레스타인 자치이행협상을 재개하기로 합의함에 따라 긴장이 어느 정도 완화되었다.","chapter":1,"section":1,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00044"},{"year":1998,"admin":"김대중","text":"중동 지역에서는 이스라엘의 동예루살렘 정착촌 건설(1997년 3월)과 이에 대한 주변 아랍국가들의 반발로 교착상태에 빠졌던 중동평화협상이 타결 되어 1998년 10월 '와이리버 협정(Wye River Memorandum)'을 체결함으로써 긴장이 해소되었다.","chapter":1,"section":1,"page":1,"src":"1999 외교백서 제1장.doc","id":"1998-s00047"},{"year":1999,"admin":"김대중","text":"정치적인 면에서는 이스라엘의 Barak 신정권이 팔레스타인 및 시리아와의 협상을 재개함으로써 중동평화 진전의 분위기가 조성되었다.","chapter":1,"section":1,"page":1,"src":"2000 외교백서 제1장.hwp","id":"1999-s00068"},{"year":2000,"admin":"김대중","text":"이스라엘의 남부 레바논 철수와 강경 입장을 고수하던 시리아 Assad 대통령의 6월 사망으로 중동 평화 구도가 새로운 국면으로 들어설 것이라는 전망이 있었지만, 7월 캠프데이비드 협상의 실패로 중동 분쟁해결이 더욱 지난하게 되었다.","chapter":1,"section":1,"page":1,"src":"2001 외교백서 제1장.hwp","id":"2000-s00055"},{"year":2001,"admin":"김대중","text":"중동 지역에서는 2000년 9월 29일 예루살렘에서 이스라엘․팔레스타인간 발생한 유혈 충돌이 2001년에도 지속되어 1993년 오슬로 평화원칙 선언 이후 영토와 평화의 교환(Land for Peace) 원칙에 따라 진행되어 오던 중동 평화협상의 기초가 흔들리고 있다.","chapter":1,"section":1,"page":1,"src":"2002 외교백서 제1장.hwp","id":"2001-s00139"},{"year":2002,"admin":"김대중","text":"이스라엘과 팔레스타인 양측의 분쟁은 2002년 들어서 더욱 악화 국면으로 접어들어, 텔아비브 인근 대학교를 비롯한 이스라엘 도심지에서 팔레스타인측 자살 폭탄 테러가 계속되었으며 이스라엘군의 보복공격으로 사상자가 속출했다.","chapter":1,"section":3,"page":10,"src":"2003 외교백서 제1장.hwp","id":"2002-s00140"}],"docCount":108},{"id":"우크라이나","kind":"country","aliases":["우크라이나"],"total":402,"byYear":{"1990":1,"1991":10,"1992":9,"1993":4,"1994":3,"1995":3,"1996":4,"1997":6,"1998":7,"1999":8,"2000":6,"2001":8,"2002":7,"2003":5,"2005":1,"2006":8,"2007":7,"2008":4,"2009":6,"2010":7,"2011":10,"2012":10,"2013":8,"2014":20,"2015":10,"2016":2,"2017":1,"2020":1,"2021":4,"2022":74,"2023":67,"2024":52,"2025":29},"rateByYear":{"1990":7.5,"1991":84.2,"1992":70.7,"1993":31.7,"1994":22.5,"1995":21.4,"1996":24.1,"1997":27.5,"1998":27.9,"1999":32.0,"2000":24.0,"2001":25.2,"2002":49.9,"2003":17.2,"2005":8.6,"2006":52.3,"2007":51.3,"2008":25.4,"2009":35.5,"2010":35.2,"2011":55.2,"2012":48.1,"2013":45.2,"2014":85.6,"2015":45.8,"2016":25.0,"2017":7.6,"2020":4.5,"2021":23.3,"2022":390.3,"2023":303.7,"2024":256.5,"2025":158.8},"byAdmin":{"윤석열":193,"박근혜":40,"이명박":37,"김대중":36,"이재명":29,"노무현":21,"노태우":20,"김영삼":20,"문재인":6},"focus":0.48,"first":1990,"last":2025,"peak":2022,"peakRate":"2022","docs":[{"year":1990,"admin":"노태우","text":"동 대회에서 고르바초프 대통령의 당 서기장 겸직에 대한 일부 비관이 제기되기도 하였으나 고르바초프 대통령이 당서기장에 압도적 지지로 재선되고 신설된 부서기장에 이바쉬코 우크라이나공화국 최고회의 의장이 선출되었다.","chapter":4,"section":null,"page":29,"src":"1991 외교백서 제4장.pdf","id":"1990-s01088"},{"year":1991,"admin":"노태우","text":"제1장 국제질서 39미과 우리 외교정책 71 제1절 세계화 주요정세 1.[회전이후시대」 (the Post-Cold War Era)희 국제정치질서 1991년 12월 8일 러시아연방, 우크라이나, 벨라루스 등 슬라브 민족 계열 의 공화국간 합의된 [독립국가연합 선언]을 바탕으로 1991년 128월 31일 11개 독립국가로 구성되는 새로운 [독립국가연합] (Commonwealth of Independent 5148165 : 015) 이 수립됨으로서 1922년 창설이래 69년동안 존속해 온 소연방체제가 공식적으로 종말을 고하였다.","chapter":1,"section":null,"page":1,"src":"1992 외교백서 제1장.pdf","id":"1991-s00027"},{"year":1992,"admin":"노태우","text":"' 제3절 1992년도 가조)6%과 1990년대 중장기 외교정책 방상 15 이상옥 외무장관은 6월 27일부터 월 4일까지 러시아, 우크라이나, 카자 흐스탄 등 독립국가 연합의 주요 3국을 각국 외무장관의 초청으로 공식 방 문하였다.","chapter":1,"section":null,"page":15,"src":"1993 외교백서 제1장.pdf","id":"1992-s00099"},{"year":1993,"admin":"김영삼","text":"미러 양국은 탈냉전 시대의 새로운 국제 환경에 맞추어 새로운 미ㆍ러 협 력 관계를 추진하였으며, 이에 따라 1994년 1월 3일에 8단계 전략무기감축 협정 (START) 협정이 서명되었고 우크라이나와 카자흐스탄 및 벨라루시의 핵무기 완전 해체도 추진되었다.","chapter":2,"section":3,"page":38,"src":"1994 외교백서 제2장.pdf","id":"1993-s00307"},{"year":1994,"admin":"김영삼","text":"구소련 국가인 우크라이나, 카자흐스탄, 벨라루스 등에서의 핵무기 페 기를 위한 협상이 성공적인 결실을 맺었고, 전략 핵무기 감축을 위한 START 1 이 발효됨으로써 핵무기 감축을 위한 중요한 진전을 이룩하였 다.","chapter":2,"section":3,"page":35,"src":"1995 외교백서 제2장.pdf","id":"1994-s00386"},{"year":1995,"admin":"김영삼","text":"그러나 흑해 함대를 둘러싼 러시아ㆍ우크라이나간의 긴장관계가 보여 주듯 015 체제내에는 이해관계가 상반되는 회원국들이 있으므로, 015 통합은 당분간 러시아를 중심으로 이해관계를 같이 하는 회원국간의 양자 또는 3-4개 회원국간의 협력을 주축으로 진전되어 갈 것으로 전망된다.","chapter":2,"section":3,"page":65,"src":"1996 외교백서 제2장.pdf","id":"1995-s00584"},{"year":1996,"admin":"김영삼","text":"우선 대량파괴무기 비확산 분야에서 Clinton 행정부는 미ㆍ러 정상회 담(1996. 4. 21, 모스크바) 및 핵안전 8-8 정상회담(1996.4, 19-20, 모스 크바), 우크라이나 대통령 방미(1996.2. 20-22) 등을 통해 핵무기 통제에 상당한 성과를 거두었다.","chapter":1,"section":3,"page":50,"src":"1997 외교백서 제1장.pdf","id":"1996-s00374"},{"year":1997,"admin":"김영삼","text":"한편, 러시아는 자국의 전략적 이해와 깊이 관련되어 있는 흑해함대 분할을 종결짓고 우크라이나와 우호협력협정을 체결하였으며, NATO와의 관계에 관한 기본규약에 서명하여 NATO의 확대를 수용하였는데, 이러한 제반 내용들은 주변 국가들과의 대립을 해소함으로써 실익을 확보하려는 러시아의 정책의지를 반영한 것이라 할 수 있다.","chapter":1,"section":1,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00038"},{"year":1998,"admin":"김대중","text":"특히 러시아는 사활적인 이익이 걸려있는 CIS 통합에 힘써 1998년 10월 러.카자흐스탄, 러.우크라이나간 정상회담 개최, 12월 러.벨라루스 연합강화 선언서 서명 및 러.우크라이나간 우호.협력 동반자협정 비준 등 중요 성과를 거두었다.","chapter":1,"section":3,"page":1,"src":"1999 외교백서 제1장.doc","id":"1998-s00564"},{"year":1999,"admin":"김대중","text":"< EDCF 기금 조성 현황 > (단위 :억원) 구 　분 '96 '97 '98 '99 '99년말 누계 정부출연 1,300 5,299 차 　　　입 △67 △73 2,783 운용수익 1,097 5,642 합 　　　계 2,587 1,691 1,030 13,724 우리나라는 1999년 인도네시아 폐수처리사업(4,000만불), 우크라이나 교육기자재사업(3,500만불), 몰도바 통신망 현대화사업(3,000만불) 등 9개국, 12개 사업에 대해 전년대비(금액기준) 46% 증가한 2,660억원(약2.26억불) 규모의 지원방침을 결정하였다.","chapter":4,"section":5,"page":58,"src":"2000 외교백서 제4장.hwp","id":"1999-s01478"},{"year":2000,"admin":"김대중","text":"<협의조사단 파견 실적> 시 기 지 역 파 견 국 가 2.27-3.11 서남아중동 파키스탄, 인도, 사우디, 예멘, 레바논 4.29-5.7 중구 터어키, 우크라이나 6.17-6.29 중남미 과테말라, 파나마, 도미니카, 베네수엘라 10.8-10.16 중구 체크, 불가리아, 루마니아 11.11-11.22 아중동 모로코, 튀니지, 요르단 12.5-12.13 동남아 베트남, 캄보디아, 말레이시아 다.","chapter":4,"section":1,"page":2000,"src":"2001 외교백서 제4장.hwp","id":"2000-s01013"},{"year":2001,"admin":"김대중","text":"한편, 러시아, 중국, 카자흐스탄, 키르기즈, 타지키스탄 등 5개국으로 구성된 샹하이 포럼은 2001년 6월 제6차 회의에서 우즈베키스탄을 가입시키고 샹하이 협력기구(SCO)로 재 출범하였으며 우크라이나, 우즈베키스탄, 아제르바이잔, 그루지아, 몰도바 등 5개국으로 구성된 GUUAM도 2001년 6월 얄타에서 개최된 GUUAM 정상회의에서 설립헌장을 채택하여 경제․사회분야 지역 협력기구로 정식 발족하였다.","chapter":1,"section":3,"page":1,"src":"2002 외교백서 제1장.hwp","id":"2001-s00703"},{"year":2002,"admin":"김대중","text":"향후에도 CIS 국가들은 구속력 있는 단일 단체의 형성보다는 유라시아 경제공동체(EAEC), 상하이 협력기구(SCO), GUUAM(그루지아, 우크라이나, 우즈베키스탄, 아제르바이쟌, 몰도바가 참여하는 지역협력기구), 중앙아 협력기구(CACO) 등과 같은 안보적, 경제적 이해에 따른 다양한 자발적 협의체를 중심으로 역내 협력을 강화하여 나갈 것으로 전망된다.","chapter":1,"section":3,"page":10,"src":"2003 외교백서 제1장.hwp","id":"2002-s00449"},{"year":2003,"admin":"노무현","text":"이와 더불어 2003년 9월에는 러시아∙우크라이나∙카자흐스탄∙벨 라루스 등 4개국 정상이 CIS 정상회의 계기에 공동경제권(Common Economic Space : CES)창설에 관한 협약에 서명함으로써 4개국간 경제협력의 골격과 방향이 제시되는 계기를 마련하였다.","chapter":1,"section":3,"page":103,"src":"2004 외교백서 제1장.pdf","id":"2003-s00691"}],"docCount":87},{"id":"NATO","kind":"org","aliases":["북대서양조약기구","NATO","나토"],"total":383,"byYear":{"1989":10,"1990":14,"1991":5,"1992":7,"1993":8,"1994":9,"1995":7,"1996":8,"1997":24,"1998":11,"1999":21,"2000":8,"2001":19,"2002":8,"2003":11,"2005":6,"2006":5,"2007":5,"2008":4,"2009":5,"2010":3,"2011":2,"2012":7,"2013":6,"2014":9,"2015":7,"2016":8,"2017":2,"2018":5,"2019":3,"2020":7,"2021":4,"2022":32,"2023":31,"2024":49,"2025":13},"rateByYear":{"1989":66.5,"1990":105.0,"1991":42.1,"1992":55.0,"1993":63.5,"1994":67.4,"1995":50.0,"1996":48.2,"1997":109.8,"1998":43.8,"1999":84.0,"2000":32.0,"2001":59.8,"2002":57.1,"2003":37.9,"2005":51.5,"2006":32.7,"2007":36.6,"2008":25.4,"2009":29.6,"2010":15.1,"2011":11.0,"2012":33.7,"2013":33.9,"2014":38.5,"2015":32.1,"2016":99.9,"2017":15.1,"2018":29.8,"2019":16.5,"2020":31.2,"2021":23.3,"2022":168.8,"2023":140.5,"2024":241.7,"2025":71.2},"byAdmin":{"윤석열":112,"김대중":67,"김영삼":56,"노태우":36,"박근혜":30,"노무현":27,"이명박":21,"문재인":21,"이재명":13},"focus":0.29,"first":1989,"last":2025,"peak":2024,"peakRate":"2024","docs":[{"year":1989,"admin":"노태우","text":"요컨대, 미소 신데땅트, 소련의 신사고 외교정책, 동구권의 본질적 변화 추세, 그리고 동서 군축협상의 성공적 진전 등으로 바르샤바체제(0000)의 붕괴 위기는 물론, 서구국가들의 대소 위협 인식이 현저히 저하됨에 따라 북 대서양조약기구WNATO)화 결속력도 크게 약화되어 그 성격 변화가 불가피 할 것으로 보인다.","chapter":1,"section":null,"page":3,"src":"1990 외교백서 제1장.pdf","id":"1989-s00067"},{"year":1990,"admin":"노태우","text":"더욱이 소런은 바르샤바조약기구(\\10)의 중추역할을 맡아 온 동독의 서독에 의한 흡수 통합 및 통일독일의 NATO 잔류를 승인, 독일통일의 실현을 가능케 함은 물론, 서독과 불가침 및 경제협력 조약을 체결함으로써 통일독일과의 관계강화 를 통한 「유럽 일가] (3 Common European 80150)정책을 추진하려고 한다.","chapter":1,"section":null,"page":1,"src":"1991 외교백서 제1장.pdf","id":"1990-s00008"},{"year":1991,"admin":"노태우","text":"카나다는 1991년 12월 서방국가로서는 최초로 우크라이나 공화국을 승인하고 전유고연방의 크로아티아와 슬로베니아 공화국을 승인(1992년 1월 15일)하는등 구소연방국가 및 동구권 국가와의 관계증진에 적극적으로 나서고 있으며, 구주지역의 새로운 안보환경에 맞추어 NATO 파견 카나다 주둔 병력 8천명을 1994년까지 철수시키기로 결정하는등 새로운 국제질서에 적응하는 대외정책을 시행해 가고 있다.","chapter":4,"section":null,"page":23,"src":"1992 외교백서 제4장.pdf","id":"1991-s00997"},{"year":1992,"admin":"노태우","text":"특히 NATO 회원국으 로서 유럽의 정치ㆍ안보문제에 계속 참여해 왔으며 유엔 평화유지 활동 (만<0)에도 적극적으로 관여하고 있다.","chapter":4,"section":null,"page":26,"src":"1993 외교백서 제4장.pdf","id":"1992-s00908"},{"year":1993,"admin":"김영삼","text":"국내문제 우선과 국제경제력 회복을 위한 외교 추구라는 대외 정책상의 변화속에서도 클린턴 행정부는 미국의 국제적 지도력을 유지하고 이를 위한 외교정책 수행의 수단으로서 강력한 군사력의 유지 필요성을 인정하는 등 미 역대 행정부의 전통적 대외정책을 유지하는 모습을 보이면서 경제적 안 보 확보, 러시아의 개혁 지원, 유럽 및 NATO외상 관계 발전, 아-태 지역 과의 협력강화, 중동 평화, 대량살상무기의 확산 방지에 정책의 우선 순위 를 두고 대외정책을 주진하였다.","chapter":2,"section":3,"page":37,"src":"1994 외교백서 제2장.pdf","id":"1993-s00305"},{"year":1994,"admin":"김영삼","text":"러시아는 Yeltsin 대통령의 강력한 지도아래 정국이 비교적 안정되고 인플레이션이 10%내외로 진정되는 등 경제상황도 호전되었으나, 국내 극우ㆍ민족세력이 부상하면서 독자적 외교노선을 추구하고 삼시인칙 등 30 / 제2장 국제정세 및 한반도 주변정세 CIS 내 민족분쟁, 보스니아내전, NATO 확대문제에 관해 서방과 이견을 보였다.","chapter":2,"section":1,"page":3,"src":"1995 외교백서 제2장.pdf","id":"1994-s00169"},{"year":1995,"admin":"김영삼","text":"또한, 미국은 동유럽 국가들의 NATO 가입을 지원함으로써 냉전이후 보다 안정된 유럽질서 구축을 위한 노력도 전개하였다.","chapter":2,"section":3,"page":47,"src":"1996 외교백서 제2장.pdf","id":"1995-s00488"},{"year":1996,"admin":"김영삼","text":"국제연합(011), 세계무 역기구(\\ㅠ0) 등 범세계적인 국제기구들의 역할과 업무영역이 확대되 고，아시아ㆍ태평양경제협력체(4880), 북미자유무역협정(4682), 아세안지역안보포럼(&88), 북대서양조약기구(40) 등 지역적 차원 의 협력이 가속화된 것은 이와 같은 추세를 반영하는 것이다.","chapter":1,"section":1,"page":5,"src":"1997 외교백서 제1장.pdf","id":"1996-s00072"},{"year":1997,"admin":"김영삼","text":"우선 미국은 냉전 이후 시대의 대유럽 통제전략구도 및 구 동구권의 장래 안보를 감안하여 북대서양 조약기구(North Atlantic Treaty Organization: NATO)를 확대 개편하는 소위 동방확대정책을 추구하고 있는 바, 1997년 7월 마드리드 NATO 정상회의에서 동 기구 창설 50주년 기념해인 1999년까지 폴란드, 체코, 헝가리를 NATO에 가입시키기로 하였다.","chapter":1,"section":1,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00026"},{"year":1998,"admin":"김대중","text":"또한, 냉전 이후 시대의 대유럽 통제전략 구도 및 동유럽권의 장래 안보를 감안하여 북대서양조약기구(North Atlantic Treaty Organization：NATO)를 확대 개편하는 소위 '동방확대정책'을 지속하면서 1998년 6, 9, 11월 각각 중국.러시아.일본과의 정상 회동을 통해 전략적 협력관계의 설정을 가속화시켰다.","chapter":1,"section":1,"page":1,"src":"1999 외교백서 제1장.doc","id":"1998-s00029"},{"year":1999,"admin":"김대중","text":"대외적으로는 NATO 확대에 따른 안보불안과 체첸사태에 대한 강경대응으로 인해 미국을 비롯한 서방국가들과 갈등 양상을 보였는데, 특히 미국과는 스파이 맞추방사건으로 인해 관계가 악화되었다.","chapter":1,"section":1,"page":1,"src":"2000 외교백서 제1장.hwp","id":"1999-s00046"},{"year":2000,"admin":"김대중","text":"그러나 양국이 공히 경제적으로 미국 등 서방국가들의 지원을 필요로 하고 있기 때문에 양국의 전략적 동반자 관계의 강도는 중 러 양국이 민감한 반응을 보이고 있는 MD, NATO의 동구확대 등에 대한 미국의 적극 추진여부 및 양국의 대미관계 진전 정도에 따라 결정될 것으로 보인다.","chapter":1,"section":2,"page":1,"src":"2001 외교백서 제1장.hwp","id":"2000-s00117"},{"year":2001,"admin":"김대중","text":"이에 미국의 기존 동맹세력인 남아지역은 명실상부한 비동맹 제3세계 중심권역으로서 의 위치를 그 대동단계에서 부터 확고히 하게 되었다.","chapter":2,"section":null,"page":15,"src":"1991 외교백서 제2장.pdf","id":"1990-s00221"},{"year":1991,"admin":"노태우","text":"미얀마는 소몽 군사정권이 1990년 5월 충선에서 야당의 암숭에도 불구, 정권이양 지연을 기도하고 반정부 세력을 탄압하여 미국 및 86등이 군사정부를 강력비난하였다.","chapter":4,"section":null,"page":15,"src":"1992 외교백서 제4장.pdf","id":"1991-s00952"},{"year":1993,"admin":"김영삼","text":"1988 대규모 반정부 소요사태후 군사정권이 5년째 통치중인 미얀마는 1993년 1월 신헌법 요강 마련을 위해 국민회의를 개최하고 1993 9월에는 군부의 주도적 역할을 강조하는 국가기본원칙 초안을 결정한 바 있다.","chapter":2,"section":3,"page":28,"src":"1994 외교백서 제2장.pdf","id":"1993-s00235"},{"year":1994,"admin":"김영삼","text":"아세안은 94년 7월 아세안 외무장관회담에서 베트남이 7번째 회원국으 로 가입하는데 사실상 합의함에 따라 아세안의 중요도가 더욱 커질 것으 로 보이며, 궁극적으로 인도지나 3국과 미얀마를 포함하는 10개 회원국의 아세안을 계속 추구해 나갈 것으로 보인다.","chapter":2,"section":3,"page":23,"src":"1995 외교백서 제2장.pdf","id":"1994-s00309"},{"year":1995,"admin":"김영삼","text":"동남아 지역 1) 지역정세 ol대(ASEAN) 7개국(브루나이, 말레이지아, 인도네시아, 필리핀, 싱가포르, 태국, 베트남) 과 라오스, 캄보디아, 미얀마로 이루어진 동남 아 지역은 1995년에도 전반적인 정치적 안정을 바탕으로 경제적 성장을 지속하였으며, 아세안 회원국의 확대와 단결을 추구하면서 아시아ㆍ유럽 정상회의 (ASEM) 의 출범에 주도적 역할을 하는 등 국제 협력에 있어서 두드러진 역할을 수행한 것으로 평가된다.","chapter":2,"section":3,"page":28,"src":"1996 외교백서 제2장.pdf","id":"1995-s00348"},{"year":1996,"admin":"김영삼","text":"1967년 말레이지아, 인 도네시아, 태국, 필리핀 및 싱가포르 5개국으로 출범한 ASEAN위 1984 년 브루나이 가입에 이어 1995년에 베트남이 가입함으로써 회원국이 ?개 국으로 증가하였으며, 1996년 11월 자카르타에서 개최된 비공식 정상회 의에서 미얀마, 캄보디아, 라오스 3개국을 동시 가입시키기로 결정하여 ASEAN합 동남아 10개국으로 확대하려는 움직임을 보이고 있다.","chapter":1,"section":3,"page":25,"src":"1997 외교백서 제1장.pdf","id":"1996-s00199"},{"year":1997,"admin":"김영삼","text":"안보면에서는 아세안 지역안보포럼(ASEAN Regional Forum: ARF)을 중심으로 동 지역의 다자안보대화가 진행되고 있는데, 1997년도에도 동 포럼을 통해 한반도문제, 남중국해 영유권분쟁, 캄보디아 및 미얀마 정세 등 지역안보 문제와 핵군축, 대인지뢰 등 군축문제가 논의되었다.","chapter":1,"section":1,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00043"},{"year":1998,"admin":"김대중","text":"미얀마는 국가평화발전위원회(State Peace and Development Council：SPDC)가 계속 권력을 장악한 가운데, 민주국민연맹(National League for Democracy：NLD)은 1998년 8월이래 의회소집을 요구하였고 9월에는 10인 위 0300"},{"year":1995,"admin":"김영삼","text":"한편 1995년에는 Do 14001 베트남 당서기장 방한과 1995년 10월 라오 스와의 수교 실현을 통해 인도차이나 진출 기반을 확충하는 한편, 향후 캄보디아와의 수교 여건을 조성하였으며, 남태평양포럼 (588) 의 대화상 대국 지위를 획득함으로써 대양주 국가들과의 관계를 증진시켰다.","chapter":1,"section":3,"page":11,"src":"1996 외교백서 제1장.pdf","id":"1995-s00162"},{"year":1996,"admin":"김영삼","text":"1967년 말레이지아, 인 도네시아, 태국, 필리핀 및 싱가포르 5개국으로 출범한 ASEAN위 1984 년 브루나이 가입에 이어 1995년에 베트남이 가입함으로써 회원국이 ?개 국으로 증가하였으며, 1996년 11월 자카르타에서 개최된 비공식 정상회 의에서 미얀마, 캄보디아, 라오스 3개국을 동시 가입시키기로 결정하여 ASEAN합 동남아 10개국으로 확대하려는 움직임을 보이고 있다.","chapter":1,"section":3,"page":25,"src":"1997 외교백서 제1장.pdf","id":"1996-s00199"},{"year":1997,"admin":"김영삼","text":"안보면에서는 아세안 지역안보포럼(ASEAN Regional Forum: ARF)을 중심으로 동 지역의 다자안보대화가 진행되고 있는데, 1997년도에도 동 포럼을 통해 한반도문제, 남중국해 영유권분쟁, 캄보디아 및 미얀마 정세 등 지역안보 문제와 핵군축, 대인지뢰 등 군축문제가 논의되었다.","chapter":1,"section":1,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00043"},{"year":1998,"admin":"김대중","text":"특히, 동남아시아의 경우, 아세안지역안보포럼(ASEAN Regional Forum：ARF)을 중심으로 안정적 역내 안보구조가 1998년에도 기본적으로 유지되었지만, 캄보디아의 쿠데타 발생, 인도네시아의 Suharto 대통령 하야, 말레이시아 Anwar 전 부총리 축출 등으로 인해 아세안 역내 국가들간의 내부결속력이 이완되는 현상이 노정되었다.","chapter":1,"section":1,"page":1,"src":"1999 외교백서 제1장.doc","id":"1998-s00046"},{"year":1999,"admin":"김대중","text":"그러나 인도네시아의 총선과 대통령 선거, 동티모르 분리독립, 아체(Aceh) 등의 분리독립 움직임과 유혈사태, 미얀마와 캄보디아의 정정불안 등으로 일부 국가는 사회 불안을 경험하였다.","chapter":1,"section":1,"page":1,"src":"2000 외교백서 제1장.hwp","id":"1999-s00063"},{"year":2000,"admin":"김대중","text":"캄보디아에서는 1998년 7월 치러진 총선을 통해 캄보디아 인민당(Cambodia People's Party：CPP)의 Hun Sen과 민족연합전선(Funcinpec)의 Ranaridh 왕자간의 연립정부가 출범하였다.","chapter":1,"section":3,"page":1,"src":"2001 외교백서 제1장.hwp","id":"2000-s00240"},{"year":2001,"admin":"김대중","text":"향후 ASEAN+3은 제5차 정상회의에서 한국이 제안한 동아시아 자유무역지대(East Asia Free Trade Area : EAFTA) 구상, ASEAN+3 정상회의의 동아시아 정상회의(East Asia Summit)로의 전환 문제, EAVG를 대체하는 동아시아 포럼(East Asia Forum : EAF) 등에 대한 타당성을 동아시아연구그룹(East Asia Study Group : EASG)이 중심이 되어 검토하여 그 결과를 제6차 캄보디아 정상회의에 보고하기로 되어 있다.","chapter":1,"section":1,"page":1,"sr
