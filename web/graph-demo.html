991,"admin":"노태우","text":"이러한 북한의 태도는 당면한 경제 위기 타개와 대일 수교, 대미 관계개선을 위한 상성 수 없는 선택이었다고 볼 수 있으며 또한 미국 등 주변세력의 압력과 핵확산방지조약(00021011661810ㅁ268? : 787) 체제의 강화추세에 비추어 결국 국제원자력기구([따60084101381 Atomic Energy Agency : IAEA) 와의 핵안전협정도 체결하게 되었고 현재 핵개발과 관련하여 국제사찰을 수용할 수 밖에 없는 상황에 처해 있다.","chapter":1,"section":null,"page":14,"src":"1992 외교백서 제1장.pdf","id":"1991-s00105"},{"year":1992,"admin":"노태우","text":"또한 미국 등 주변세력 의 압력과 핵확산방지조약(티00168ㄷ Nonproliferation Treaty : NPT)주출d 강 화추세에 비추어 북한은 결국 국제원자력기구(0ㅁ6600800081 Atomio Energy Agency : 168&)와 핵안전협정을 체결하게 되었고 현재 핵개발과 관련하여 국제사찰을 수용할 수 밖에 없는 상황에 처해 있다.","chapter":1,"section":null,"page":10,"src":"1993 외교백서 제1장.pdf","id":"1992-s00076"},{"year":1993,"admin":"김영삼","text":"또한 미국 등 주변세력의 압력과 핵확산방지조약(4000168『 Non-Proliferation Treaty or NPT)순 제의 강화추세에 비추어 북한은 결국 국제원자력기구(10867ㅁ3110031 Atomic Energy Agency : IAEA)지 핵안전협정을 체결하게 되었다.","chapter":2,"section":2,"page":15,"src":"1994 외교백서 제2장.pdf","id":"1993-s00154"},{"year":1994,"admin":"김영삼","text":"북한이 IAEA대 사찰을 계속 거부하고 대미직접협상을 주장함에 따라 고조된 핵위기는 유엔안보리에 의한 대북제재결의 일보직전 카터 전대통 제2절 평화통일외교 / 115 령의 방북외교를 통해 미ㆍ북간 협상의 돌과구가 마련되었으며, 김일성은 카터 대통령을 통해 김영삼 대통령과의 남ㆍ북정상회담을 제의하여 왔고 김대통령이 이를 즉시 수락함으로써 분단 반세기만에 최초의 정상회담개 최가 극적으로 합의되기도 하였다.","chapter":3,"section":2,"page":16,"src":"1995 외교백서 제3장.pdf","id":"1994-s00671"},{"year":1995,"admin":"김영삼","text":"바, 북한 핵동결 및 사찰 제네바 미ㆍ북 합의에 따른 북한의 핵활동 동결 조치를 감시하기 위해 국제원자력기구&8&ㅅ) 사찰관 2명이 교대로 영변에 체류하였다.","chapter":3,"section":3,"page":25,"src":"1996 외교백서 제3장.pdf","id":"1995-s00788"},{"year":1996,"admin":"김영삼","text":"이밖에도 한ㆍ카 양국은 국제정치무대에서 중요한 협력 파트너로서 UN, IAEA, 0801, WTO, APEC, ARF 등 다자기구에서 상호협력을 강화해 나가고 있다.","chapter":1,"section":3,"page":57,"src":"1997 외교백서 제1장.pdf","id":"1996-s00424"},{"year":1997,"admin":"김영삼","text":"우리 나라는 1997년중 각종 국제기구 회의활동에서 우리의 신장된 국력을 반영하듯이 각종 기구의 이사국으로 선출되는 빈도가 많아졌는데, 예를 들면 UNDP, IAEA, FAO 및 IMO등에 이사국으로 선출되어 동 기구활동에 더욱 적극적으로 참여하게 되었다.","chapter":2,"section":2,"page":1,"src":"1998 외교백서 제2장.doc","id":"1997-s00682"},{"year":1998,"admin":"김대중","text":"KEDO 집행이사국들은 또한 북한인력의 훈련과 관련한 제반사항을 결정하기 위하여 '훈련의정서'를 검토하고, 경수로 공급일정과 국제원자력기구 (International Atomic Energy Agency：IAEA)가 필요로 하는 모든 사찰의 수락 일정 결정을 위해 '인도일정의정서' 체결을 위한 내부협의를 진행 시켰다.","chapter":3,"section":2,"page":1,"src":"1999 외교백서 제3장.doc","id":"1998-s00839"},{"year":1999,"admin":"김대중","text":"이러한 측면에서 1999년중 정부는 포괄적 핵실험 금지조약(CTBT)을 비준하였으며, 국제원자력기구(International Atomic Energy Agency : IAEA) 안전조치 강화 추가 의정서(Additional Protocol)에 서명하는 등 새로운 국제규범 형성에 참여하고 있다.","chapter":2,"section":2,"page":1,"src":"2000 외교백서 제2장.hwp","id":"1999-s00671"},{"year":2000,"admin":"김대중","text":"이에 따라 정부는 2000년 4월 뉴욕에서 개최된 제6차 NPT(핵비확산조약) 평가회의, 생물무기금지협약(BWC) 검증의정서 협상 등에 참석하였으며, IAEA 안전조치 추가의정서(Additional Protocol) 비준을 위해 국내조치를 추진하고 있다.","chapter":2,"section":2,"page":1,"src":"2001 외교백서 제2장.hwp","id":"2000-s00721"},{"year":2001,"admin":"김대중","text":"우리나라는 미사일기술통제체제(MTCR) 가입, 한․IAEA간 추가의정서 비준을 위한 국내절차 추진, 특정재래식무기금지협약(CCW) 및 제2의정서(지뢰의정서) 가입 등을 통해 국제적인 군축․비확산 체제 강화에 기여하였다.","chapter":2,"section":1,"page":1,"src":"2002 외교백서 제2장.hwp","id":"2001-s00864"},{"year":2002,"admin":"김대중","text":"2002년에도 양국은 한국의 대북정책 기조를 지지하는 가운데, UN총회 및 IAEA 이사회의 북한 핵문제 토의시 우리정부와 긴밀한 협의, 대북한 성명 발표 및 서한 전달등 북한 핵개발 문제에 있어서도 우리와 공동 대응 노력을 경주하였다.","chapter":3,"section":null,"page":1,"src":"2003 외교백서 제3장.hwp","id":"2002-s00596"}],"docCount":104},{"id":"아르헨티나","kind":"country","aliases":["아르헨티나"],"total":332,"byYear":{"1989":9,"1990":7,"1991":11,"1992":11,"1993":8,"1994":2,"1995":9,"1996":11,"1997":18,"1998":14,"1999":25,"2000":17,"2001":24,"2002":14,"2003":21,"2004":1,"2005":1,"2006":11,"2007":3,"2008":7,"2009":12,"2010":6,"2011":5,"2012":8,"2013":3,"2014":2,"2015":3,"2016":8,"2017":6,"2018":16,"2019":5,"2020":5,"2021":5,"2022":10,"2023":8,"2024":4,"2025":2},"rateByYear":{"1989":59.9,"1990":52.5,"1991":92.6,"1992":86.4,"1993":63.5,"1994":15.0,"1995":64.3,"1996":66.3,"1997":82.4,"1998":55.8,"1999":100.0,"2000":68.0,"2001":75.5,"2002":99.9,"2003":72.3,"2004":36.2,"2005":8.6,"2006":71.9,"2007":22.0,"2008":44.5,"2009":71.0,"2010":30.2,"2011":27.6,"2012":38.5,"2013":17.0,"2014":8.6,"2015":13.7,"2016":99.9,"2017":45.4,"2018":95.4,"2019":27.6,"2020":22.3,"2021":29.1,"2022":52.7,"2023":36.3,"2024":19.7,"2025":11.0},"byAdmin":{"김대중":94,"김영삼":48,"노태우":38,"이명박":38,"노무현":37,"문재인":37,"윤석열":22,"박근혜":16,"이재명":2},"focus":0.28,"first":1989,"last":2025,"peak":1999,"peakRate":"1999","docs":[{"year":1989,"admin":"노태우","text":"고위인사 합랩으로는 1989년중 최광수 특사의 베네수엘라 대통령 취임식 참석(1. 29-2. 14), 김용식 특사의 아르헨티나 대통령 취임식 참석(7. 4일 13), 신동원 외무차관의 페루 및 베네수엘라 방문(6. 17일23), 강경식 특사 의 파라과이, 콜롬비아 등 중남미 4개국 방문(6. 26-\"7. 15)이 있었다.","chapter":2,"section":null,"page":15,"src":"1990 외교백서 제2장.pdf","id":"1989-s00350"},{"year":1990,"admin":"노태우","text":"1990년중에만도 우리나라는 칠레 (3월11일) , 브라질(3월15일) 대통령 취임식 에 박준규 대통령 특사, 페루(7월28일)， 콜롬비아(8월7일)ㆍ대통령 취임식에 노신영 대통령 특사를 각각 파견하였으며, 조순 특사의 브라질, 아르헨티나 방문 (5월5일-24일) 및 권익현 특사의 파라과이, 브라질, 아르헨티나 방문(11월 15일-12월4일) ,최광수 특사의 브라질, 아르헨티나 방문(7월24일-8월19일)등도 특기할 만한 사항들이다.","chapter":4,"section":null,"page":23,"src":"1991 외교백서 제4장.pdf","id":"1990-s01054"},{"year":1991,"admin":"노태우","text":"1991년중 중남미 국가와의 기존 유대관계를 강화하기 위한 고위인사 방문으로 는 김동영 특사의 과테말라 방문(1윌14일), 황영시 특사의 아이티 방문(2월7 일), 한우석 대사의 에쿠아돌, 멕시코, 알젠틴, 브라질 순방(4월9-23일), 이승윤 특사의 칠레, 아르헨티나, 도미니카(공), 볼리비아 방문(5월10일-6월2 일)이 있었다.","chapter":2,"section":null,"page":15,"src":"1992 외교백서 제2장.pdf","id":"1991-s00243"},{"year":1992,"admin":"노태우","text":"한편 1992년 18월 1일부터 이틀간 아르헨티나 수도 부에노스 아이레스에 서는 제6차 리오그룹 정상회의가 개최되어 페루사태, 쿠바문제, 지역평화, 역내 경제통합 등 32개 항목의 공동선언문을 채택함으로써 동 지역내의 문 제해결에 회망을 안겨주고 있다.","chapter":4,"section":null,"page":33,"src":"1993 외교백서 제4장.pdf","id":"1992-s00946"},{"year":1993,"admin":"김영삼","text":"경제면에서는 1980넌대 최악의 위기를 넘기면서 남미 각국은 민영화, 개 방화, 자율화를 핵심축으로 하는 신자유주의 성장 모델을 채택하고 거시적 인 경제 구조의 조정 정책을 추구, 아르헨티나, 칠레등을 중심으로 경제회 복의 신호를 축필9] 나타내고 있다.","chapter":2,"section":3,"page":47,"src":"1994 외교백서 제2장.pdf","id":"1993-s00372"},{"year":1994,"admin":"김영삼","text":"멕시코, 베네수엘라, 콜롬비아는 1994년 6월 G-3 자유무역협정을 체 、。 결, 1995년 1월 1일부터 매년 10%씩 관세를 인하하여 10년 후에는 완전 자유무역에 도달키로 합의하였고, 브라질, 아르헨티나, 우루과이, 파라 과이 4개국은 역내 관세철폐 대외공동관세를 설정하여 남미공동시장 (MERCOSUR) 을 1995 1월 1일부로 출범시킬 예정이다.","chapter":2,"section":3,"page":43,"src":"1995 외교백서 제2장.pdf","id":"1994-s00442"},{"year":1995,"admin":"김영삼","text":"우선 정치면에 있어서 중남미 지역 대부분의 국가들이 1983년 아르헨 티나의 민정이양 이후 군부통치에서 문민정부로 이행되었으며 1995년에 는 중미의 아이티, 과테말라 및 남미의 아르헨티나, 페루 등에서 평화적 정권 교체 또는 재창출이 이루어져 정치민주화의 전통이 확고히 뿌리내려 가고 있음을 보여주었다.","chapter":2,"section":3,"page":53,"src":"1996 외교백서 제2장.pdf","id":"1995-s00522"},{"year":1996,"admin":"김영삼","text":"파라과이에서는 1996년 4월 Oviedo 육군사령관이 40여년만의 민선정 권인 \\85105 대통령에게 항명하여 군사쿠데타의 위기가 있었으나, 브라질, 아르헨티나 등 남미공동시장(4[88ㅇ05008) 회원국들과 리오그 룹이 Wasmosy 정부를 강력히 지원, 쿠데타 위기를 극복하였다.","chapter":1,"section":3,"page":58,"src":"1997 외교백서 제1장.pdf","id":"1996-s00433"},{"year":1997,"admin":"김영삼","text":"5월 5일∼12일간 Clinton 대통령의 멕시코 및 코스타리카 방문시 중미 카리브 지역 정상들과의 회동 및 10월 12일∼18일간 브라질, 베네주엘라, 아르헨티나 남미 3개국 순방은 98년까지 3차례에 걸쳐 진행될 Clinton 대통령의 중남미 순방계획의 일부로, 미 행정부가 이 지역에 부여하는 중요성이 증가하고 있음을 입증하고 있다.","chapter":1,"section":3,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00377"},{"year":1998,"admin":"김대중","text":"중남미 지역은 1997년 7월부터 1998년 8월까지 아시아 및 러시아의 경제위기 여파로 브라질.콜롬비아.아르헨티나 등이 주로 금융 부문에서, 칠레를 비롯한 여타 국가들은 무역 부문에서 큰 타격을 받았음에도 불구하고 대부분 정치적 안정세가 지속되었다.","chapter":1,"section":1,"page":1,"src":"1999 외교백서 제1장.doc","id":"1998-s00051"},{"year":1999,"admin":"김대중","text":"특히 브라질과 함께 남미공동시장(MERCOSUR)의 회원국인 아르헨티나, 우루과이, 파라과이는 브라질의 자유변동환율제 채택의 영향으로 극심한 경기침체를 경험하였다.","chapter":1,"section":1,"page":1,"src":"2000 외교백서 제1장.hwp","id":"1999-s00065"},{"year":2000,"admin":"김대중","text":"그러나 아르헨티나(중남미 경제의 15% 점유)의 금융시장이 불안정한 모습을 보이면서 주변국으로 영향이 파급되고 있음을 감안할 때, 향후 중남미 경제에 대한 낙관은 어려운 실정이다.","chapter":1,"section":1,"page":1,"src":"2001 외교백서 제1장.hwp","id":"2000-s00089"},{"year":2001,"admin":"김대중","text":"또한 Bush 대통령은 백악관에서 Pastrana 콜럼비아 대통령(2월 27일), Flores 엘살바도르 대통령(2월 28일), Cardoso 브라질 대통령(3월 30일) De La Rua 아르헨티나 대통령(4월 19일)등 중남미 지역 정상들을 잇달아 만나 민주주의, 미주자유무역지대 창설 등 상호 관심사에 대해 논의하는 등 중남미지역 국가들과의 관계 강화에 대한 강한 집념을 대내외에 과시하였다.","chapter":1,"section":3,"page":1,"src":"2002 외교백서 제1장.hwp","id":"2001-s00485"},{"year":2002,"admin":"김대중","text":"1999년 칠레 아르헨티나간 국경분쟁의 평화적 해결을 계기로 중남미 국가간 무력분쟁 가능성은 희박해졌으나, 국제 마약 거래, 마약 조직의 국경선 침범, 환경 오염, 불법 노동자 입국, 용수 문제 등과 비전통적인 분야에서의 국가간 분쟁 가능성이 증대되고 있다.","chapter":1,"section":3,"page":10,"src":"2003 외교백서 제1장.hwp","id":"2002-s00139"}],"docCount":101},{"id":"경제위기","kind":"event","aliases":["경제 위기","경제위기"],"total":329,"byYear":{"1990":1,"1991":2,"1992":1,"1993":2,"1996":1,"1997":16,"1998":90,"1999":62,"2000":35,"2001":28,"2002":9,"2003":15,"2004":1,"2006":1,"2007":1,"2008":3,"2009":16,"2010":11,"2011":6,"2012":11,"2013":4,"2014":1,"2015":1,"2016":2,"2018":1,"2020":3,"2021":1,"2022":1,"2023":2,"2025":1},"rateByYear":{"1990":7.5,"1991":16.8,"1992":7.9,"1993":15.9,"1996":6.0,"1997":73.2,"1998":358.4,"1999":248.0,"2000":139.9,"2001":88.1,"2002":64.2,"2003":51.6,"2004":36.2,"2006":6.5,"2007":7.3,"2008":19.1,"2009":94.7,"2010":55.3,"2011":33.1,"2012":52.9,"2013":22.6,"2014":4.3,"2015":4.6,"2016":25.0,"2018":6.0,"2020":13.4,"2021":5.8,"2022":5.3,"2023":9.1,"2025":5.5},"byAdmin":{"김대중":224,"이명박":47,"김영삼":19,"노무현":18,"박근혜":8,"문재인":5,"노태우":4,"윤석열":3,"이재명":1},"focus":0.68,"first":1990,"last":2025,"peak":1998,"peakRate":"1998","docs":[{"year":1990,"admin":"노태우","text":"경제위기가 심화되고 민족문제가 계속 분출되고 있는 여건하에서 1990년 7월2일-13일간 조기 개최된 제28차 소런 공산당 전당대회에서는 페레스트로이카 의 미진한 성과에 대한 보수파의 반발이 표면화되고 열친등 급진개혁파인 민주강령이시o] 집단적으로 이탈하는 결과를 낳았다.","chapter":4,"section":null,"page":29,"src":"1991 외교백서 제4장.pdf","id":"1990-s01087"},{"year":1991,"admin":"노태우","text":"이러한 북한의 태도는 당면한 경제 위기 타개와 대일 수교, 대미 관계개선을 위한 상성 수 없는 선택이었다고 볼 수 있으며 또한 미국 등 주변세력의 압력과 핵확산방지조약(00021011661810ㅁ268? : 787) 체제의 강화추세에 비추어 결국 국제원자력기구([따60084101381 Atomic Energy Agency : IAEA) 와의 핵안전협정도 체결하게 되었고 현재 핵개발과 관련하여 국제사찰을 수용할 수 밖에 없는 상황에 처해 있다.","chapter":1,"section":null,"page":14,"src":"1992 외교백서 제1장.pdf","id":"1991-s00105"},{"year":1992,"admin":"노태우","text":"이러한 북한의 태도는 당면한 경제 위기 타개와 대일 수교, 대미 관계개 선을 위한 성 수 없는 선택이었다고 볼 수 있다.","chapter":1,"section":null,"page":10,"src":"1993 외교백서 제1장.pdf","id":"1992-s00075"},{"year":1993,"admin":"김영삼","text":"이러한 북한의 태도는 당면한 경제위기 타개와 대일 수교, 대미 관계개선 을 위해 9성 수 없는 선택이었다고 볼 수 있다.","chapter":2,"section":2,"page":15,"src":"1994 외교백서 제2장.pdf","id":"1993-s00153"},{"year":1996,"admin":"김영삼","text":"반면, 야당세가 이처럼 지속적으로 신장되 고 있음에도 불구하고 2681110 대통령의 법치주의 확립 강조 및 대통령 권한 분산 등 정치개혁 추진과 시장경제를 바탕으로 한 경제위기 극복 노력이 가시적인 성과를 거두어 정국이 안정됨에 따라 268110 대통령의 정치적 입지는 보다 강화되었다.","chapter":1,"section":3,"page":62,"src":"1997 외교백서 제1장.pdf","id":"1996-s00463"},{"year":1997,"admin":"김영삼","text":"1997년들어 일본경제는 극심한 내수부족으로 인한 경기침체와 금융기관의 연쇄도산으로 인해 전반적인 금융위기에 처하였으며, 특히 하반기부터 시작된 아시아 경제위기와 관련, 일본의 역할 증대를 위해 경기부양 압력이 가중되었다.","chapter":1,"section":3,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00162"},{"year":1998,"admin":"김대중","text":"외교통상부로서도 경제위기의 극복과 경제 재도약을 위한 기반 마련에 최우선 순위를 두고, 통상교섭본부의 신설과 함께 재외공관을 통상진흥의 전진기지로 삼아 적극적이고 개방지향적인 경제.통상 외교를 전개함으로써 우리 경제의 경쟁력과 대외 신인도 제고를 도모하고, 수출 증대와 외국인 투자 유치를 위한 노력을 경주하였습니다.","chapter":null,"section":null,"page":1,"src":"1999 외교백서 머리말.doc","id":"1998-s00003"},{"year":1999,"admin":"김대중","text":"1999년도에 외교통상부는 5대 외교정책 목표로서, 대북 포용정책 의 기조하에 포괄적 접근방안을 통한 한반도의 냉전종식과 남북 평 화공존을 모색하는 외교, 경제위기를 극복하고 경제성장의 잠재력 확충을 위해 시장 경제와 민주주의를 기반으로 하는 적극적이고 개 방 지향적인 경제ㆍ통상 외교, 인류의 공동 번영을 위하여 국제사회 에 기여하는 외교, 우리문화의 세계로의 발현을 추구하는 문화 외 교, 그리고 재외국민 보호 지원 외교를 설정하고 이를 적극 추진하 였습니다.","chapter":null,"section":null,"page":1,"src":"2000 외교백서 머리말.pdf","id":"1999-s00006"},{"year":2000,"admin":"김대중","text":"한때 권위주의 군사정치의 전형으로 인식되었던 중남미 지역 국가들은 이제 대부분 민주적 절차에 따른 정치체제를 갖추고 있으며, 민주주의와 시장경제체제가 불가분의 관계에 있는 것으로 인식하고 있기 때문에 심각한 경제위기가 재발하여 중남미 전역으로 파급되지 않는 한 군부 권위주의 통치체제로 복귀할 가능성은 희박하다고 볼 수 있다.","chapter":1,"section":1,"page":1,"src":"2001 외교백서 제1장.hwp","id":"2000-s00053"},{"year":2001,"admin":"김대중","text":"특히 9.11 테러사태 이후 2001년 10월과 11월 중국 샹하이와 미국 워싱턴 및 크로우포드에서 각각 개최된 미․러 정상회담을 통해 미국의 대아프간 전쟁에 적극 협력의사를 표명함으로써 확대된 외교지평을 바탕으로 경제위기 극복과 강대국 지위 회복 및 유지를 위한 전방위 실리 외교를 추진하였다.","chapter":1,"section":1,"page":1,"src":"2002 외교백서 제1장.hwp","id":"2001-s00126"},{"year":2002,"admin":"김대중","text":"중남미에서는 1998년 시작된 경제위기가 이 지역 대부분 국가에서 2002년에도 계속되었다.","chapter":1,"section":3,"page":10,"src":"2003 외교백서 제1장.hwp","id":"2002-s00135"},{"year":2003,"admin":"노무현","text":"▣ 태 국 2001년 1월 실시된 총선에서 압승을 거두면서 집권한 탁신 총리는 의회, 정부, 군부를 차례로 장악하면서 안정적 집권 기반을 마련한 후, 경제위기 극복, 빈곤해결, 마약퇴치 및 부패방지 등의 4대 국정 과제를 착실히 추진하고 있는 것으로 평가받고 있다.","chapter":1,"section":3,"page":38,"src":"2004 외교백서 제1장.pdf","id":"2003-s00278"},{"year":2004,"admin":"노무현","text":"이는 1990년대말 동아시아 경제위기 이후 가장 높은 수치로서 경제위기로 큰 타격을 받았던 태국과 필리핀을 포함하여 말레이시아, 홍콩, 싱가포르가 6-8%대에 이르는 성장률을 나타내었고, 저소득 국가로 분류되는 라오 스, 베트남 등도 성장활력이 되살아나는 현상을 보여주었다.","chapter":1,"section":null,"page":5,"src":"2005 외교백서 제1장.pdf","id":"2004-s00129"},{"year":2006,"admin":"노무현","text":"그러나 1997년 동 아시아 경제위기 이후 역내 국가들이 지역협력의 필요성을 크게 인식하게 됨에 따라, ASEAN+3를 비롯한 지역협력이 점차 강화되어 가고 있다.","chapter":3,"section":5,"page":132,"src":"2007 외교백서 제3장.pdf","id":"2006-s00869"}],"docCount":60},{"id":"폴란드","kind":"country","aliases":["폴란드"],"total":323,"byYear":{"1989":21,"1990":11,"1991":11,"1992":6,"1993":8,"1994":12,"1995":8,"1996":12,"1997":17,"1998":13,"1999":10,"2000":7,"2001":9,"2002":9,"2003":17,"2004":3,"2005":2,"2006":4,"2007":3,"2008":10,"2009":6,"2010":5,"2011":6,"2012":7,"2013":7,"2014":6,"2015":13,"2016":2,"2017":6,"2018":8,"2019":18,"2020":9,"2021":2,"2022":14,"2023":8,"2024":6,"2025":7},"rateByYear":{"1989":139.7,"1990":82.5,"1991":92.6,"1992":47.1,"1993":63.5,"1994":89.9,"1995":57.1,"1996":72.3,"1997":77.8,"1998":51.8,"1999":40.0,"2000":28.0,"2001":28.3,"2002":64.2,"2003":58.5,"2004":108.7,"2005":17.2,"2006":26.1,"2007":22.0,"2008":63.5,"2009":35.5,"2010":25.1,"2011":33.1,"2012":33.7,"2013":39.6,"2014":25.7,"2015":59.5,"2016":25.0,"2017":45.4,"2018":47.7,"2019":99.3,"2020":40.2,"2021":11.6,"2022":73.8,"2023":36.3,"2024":29.6,"2025":38.3},"byAdmin":{"김영삼":57,"노태우":49,"김대중":48,"문재인":43,"이명박":34,"노무현":29,"박근혜":28,"윤석열":28,"이재명":7},"focus":0.18,"first":1989,"last":2025,"peak":1989,"peakRate":"1989","docs":[{"year":1989,"admin":"노태우","text":"동구권과의 관계에 있어서는 폴란드의 아국과의 수교(1989. 11. 1)를 비난 한 바 있으나 헝가리의 경우(1989. 2. 1)보다는 완화된 태도를 보였으며 한- 8 영사처 설치 합의(1989. 11. 8) 및 한8유고 수교(1989. 12. 27)에 대해서 는 비난이나 논평을 않고 있다.","chapter":1,"section":null,"page":15,"src":"1990 외교백서 제1장.pdf","id":"1989-s00172"},{"year":1990,"admin":"노태우","text":"우선 1989년 2월 헝가리와의 수교를 그 첫번째 성과로 꼽을 수 있으며, 이후 폴란드, 유고와는 1989년 11월 및 1월에 각각 수교하였으며 1990년 3월에는 체코, 불가리아, 루마니아와도 수교하였고, 1991년 8월에는 알바니아 와 수교함으로써 동구의 모든 국가를 망라한 외교망전 구축할 수 있게 되었다。 또한 아시아지역의 몽골과도 1990년 3월 외교관계를 수림하였다.","chapter":2,"section":null,"page":21,"src":"1991 외교백서 제2장.pdf","id":"1990-s00247"},{"year":1991,"admin":"노태우","text":"폴란드와의 관계 증진 1989년 11월 최호중 외무장관과 폴란드 마이에프스키 외무차관이 각각 수교의정서에 서명함으로써 한ㆍ폴란드 양국은 외교관계를 수립한데 이어, 주폴란드 한국 대사관과 주한 폴란드 대사관이 1989년 11월 27일 및 1990년 1월 16일 각각 게설됨으로써 관계증진 활동이 본격화 되기 시작했다.","chapter":2,"section":null,"page":41,"src":"1992 외교백서 제2장.pdf","id":"1991-s00394"},{"year":1992,"admin":"노태우","text":". 4. 한‧중동구권 관계 출개 관 제6공화국이 북방외교를 주요 외교목표로 설정하고, 중ㆍ동구 제국과의 46 제2장 한우조 평화정기 및 통일합 위한 주요 외교활동 관계개선을 적극 추진한 결과, 헝가리(89. 2. 1), 폴란드(89. 11. 1), 유고슬 라비아(89. 12. 27), 체코슬로바키아(90. 3. 22), 불가리아(90. 3. 23), 루마니 아(90. 3. 30) 및 알바니아(91. 8. 22) 등 증ㆍ동구권 ?개국 모두와 외교관계 를 수립하였다.","chapter":2,"section":null,"page":25,"src":"1993 외교백서 제2장.pdf","id":"1992-s00274"},{"year":1993,"admin":"김영삼","text":"유럽과의 관계에 있어서는 유럽의 경제-정치 통합을 지지하면서 변화된 안보 환경에 맞추어 북대서양조약기구(시사0)의 새로운 역할을 모색하고 있으며, 헝가리, 체코, 폴란드 등 동유럽 국가들의 NATO 가입 요구에 대 해서는 러시아의 우려를 반영, “평화를 위한 동반자 관계\"(03ㅁ618010 for 86806)를 제안하였다.","chapter":2,"section":3,"page":38,"src":"1994 외교백서 제2장.pdf","id":"1993-s00309"},{"year":1994,"admin":"김영삼","text":"한편 94년중에는 일본총리, 중국총리, 카나다총독, 태국총리, 체코수상, 핀랜드수상, 칠레대통령, 폴란드대통령, 루마니아대통령, 이스라엘수상 등이 공식방한하여 경제통상협력을 포함한 상호 보완적인 협력관계를 구 축하였다.","chapter":1,"section":2,"page":12,"src":"1995 외교백서 머리말.pdf","id":"1994-s00067"},{"year":1995,"admin":"김영삼","text":"그리고 미국, 일본, 이스라엘, 폴란드 등 과학기술 선진국 및 동구권 국가와는 과학기술 또는 원자력 분야에서의 협력을 확대하고 있으며, 주 요 자원 보유국인 러시아와는 사하 가스전 등 에너지개발 사업을, 중국, 30 / 제장 우리 외교정책의 기조와 목표 호주, 인도네시아 등 연안국과는 어업협력을 계속 확대해 나가고 있다.","chapter":1,"section":2,"page":9,"src":"1996 외교백서 제1장.pdf","id":"1995-s00150"},{"year":1996,"admin":"김영삼","text":"1996년 현재 헝가리, 폴란드에서 좌과세력이 집권하고 있긴 하나, 중ㆍ동구 국가의 좌ㆍ우파 세력은 이념 에 상관없이 모두 경제개혁을 최대 국가목표로 설정하고 민주주의와 시장 경제체제로의 전환 노력을 경주하고 있다.","chapter":1,"section":3,"page":79,"src":"1997 외교백서 제1장.pdf","id":"1996-s00588"},{"year":1997,"admin":"김영삼","text":"우선 미국은 냉전 이후 시대의 대유럽 통제전략구도 및 구 동구권의 장래 안보를 감안하여 북대서양 조약기구(North Atlantic Treaty Organization: NATO)를 확대 개편하는 소위 동방확대정책을 추구하고 있는 바, 1997년 7월 마드리드 NATO 정상회의에서 동 기구 창설 50주년 기념해인 1999년까지 폴란드, 체코, 헝가리를 NATO에 가입시키기로 하였다.","chapter":1,"section":1,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00026"},{"year":1998,"admin":"김대중","text":"한편 체제전환 8년째인 중.동유럽에서는 지역별.국가별로 상당한 경제력 격차를 보이고 있지만, 대부분 자본주의 시장경제가 정착되고 있으며, 체코.폴란드.헝가리 등은 서유럽권으로의 편입을 위해 적극적으로 노력하고 있다.","chapter":1,"section":1,"page":1,"src":"1999 외교백서 제1장.doc","id":"1998-s00044"},{"year":1999,"admin":"김대중","text":"한편 폴란드, 헝가리, 체코 등 먼저 체제개혁을 시행한 국가에서는 경제개혁의 성과가 나타나기 시작한 반면 늦게 개혁을 시행한 국가들은 경제정책 실패와 외자유치의 어려움으로 경제가 후퇴하는 등 동유럽 내에서 국가간 경제적 차이가 심화되었다.","chapter":1,"section":1,"page":1,"src":"2000 외교백서 제1장.hwp","id":"1999-s00055"},{"year":2000,"admin":"김대중","text":"특히, 폴란드, 헝가리 등이 1999년 하반기부터 EU 경기 회복세가 두드러지면서 대EU 수출이 급증, 높은 성장률을 기록하였으며, 에스토니아, 라트비아 등 발틱 국가들도 러시아 경제의 점진적 회복에 따른 대러 수출 증가에 힘입어 높은 GDP 성장률을 나타내었다.","chapter":1,"section":1,"page":1,"src":"2001 외교백서 제1장.hwp","id":"2000-s00091"},{"year":2001,"admin":"김대중","text":"라) 대유럽 관계 Bush 대통령은 NATO와의 동맹관계 및 EU와의 동반자관계를 재확인할 목적으로 2001년 6월 11일~16일간 스페인, 벨기에, 스웨덴, 폴란드 및 슬로베니아등 유럽 5개국을 순방하고, 순방 기간중 양자 정상회담 외에 NATO 본부 방문, 미국-EU 정상회담 참석 및 Putin 러시아 대통령과의 정상회담 개최(슬로베니아)등의 일정을 가졌다.","chapter":1,"section":3,"page":1,"src":"2002 외교백서 제1장.hwp","id":"2001-s00475"},{"year":2002,"admin":"김대중","text":"봊구봊 계몺뫁 유럽연합(EU)은 2002년 1월 1일 단일통화인 유로(Euro)화를 전면 통용시킨데 이어 12월 13일 체코, 폴란드, 헝가리, 에스토니아, 라트비아, 리투아니아, 슬로바키아, 슬로베니아, 몰타, 키프로스 등 10개국의 신규가입을 확정하였다.","chapter":1,"section":3,"page":10,"src":"2003 외교백서 제1장.hwp","id":"2002-s00130"}],"do  협약을 체결하였으며. 멕시코와 가서명하였고 중국, 베트남, 쿠웨이트 등과 협정 체결을 위한 실무회담을 개최하였다.","chapter":5,"section":3,"page":32,"src":"1994 외교백서 제5장.pdf","id":"1993-s00944"},{"year":1994,"admin":"김영삼","text":"나. 지역 환경협력을 위한 제도적 틀 마련 우리나라의 주도로 1993년 2월에 최초로 동북아 환경협력을 위한 정부 ㅇ 간회의가 서울에서 개최된데 이어 제8차 정부간회의가 우리나라, 북한, 일본, 중국, 러시아, 몽골 6개국 대표들의 참석하에 1994. 11월 북경에서 개최되었다.","chapter":4,"section":5,"page":52,"src":"1995 외교백서 제4장.pdf","id":"1994-s00992"},{"year":1995,"admin":"김영삼","text":"이와 더불어 1995년 12월에는 한국, 북한, 중국, 몽골, 러시아 등 5개국이 두만강지역 공동개발을 위한 사업협의위원회 설립에 합의함으로써 두만강지역 개발사업이 본격적인 투자이행단계로 진입하기 위한 법적, 제도적 기반이 마련되는 성과가 거두어지기도 하였 다.","chapter":2,"section":2,"page":11,"src":"1996 외교백서 제2장.pdf","id":"1995-s00246"},{"year":1996,"admin":"김영삼","text":"동북아 지역내 다자간 경제협력 사업의 일환으로 남북한ㆍ중국ㆍ러시아ㆍ몽골이 참여하고 유엔 개발계획 (UNDP) 이 주도해 온 두만강지역개발계획(78108) 은 1996년 후반에 일본이 추가됨으로써 동 프로젝트의 추진과 관련, 주요재원 및 기술 공급 처가 마련되는 등 새로운 전기를 맞이하였다.","chapter":1,"section":2,"page":11,"src":"1997 외교백서 제1장.pdf","id":"1996-s00113"},{"year":1997,"admin":"김영삼","text":"현재 회원국으로는 한국, 북한, 중국, 러시아, 몽골이, 주요 옵저버로는 미국, 일본, 카나다, 호주, 핀랜드, 스웨덴 등이 참여하고 있다.","chapter":3,"section":4,"page":30,"src":"1998 외교백서 제3장.doc","id":"1997-s00933"},{"year":1998,"admin":"김대중","text":"실제로 자연적 경제지역(Natural Economic Territory：NET)의 개념하에서 소지역 협력의 필요성에 따라 유엔개발계획(United Nations Development Programme：UNDP) 주도로 남북한, 중국, 러시아, 일본, 몽골이 참여하는 두만강지역 개발계획(Tumen River Area Development Plan：TRADP)의 진전은 난항을 겪고 있다.","chapter":1,"section":2,"page":1,"src":"1999 외교백서 제1장.doc","id":"1998-s00117"},{"year":1999,"admin":"김대중","text":"1999년중 개최 된 미국, 일본, 러시아, 몽골, 호주, 뉴질랜드 등과의 정상희담과 외 무장관회담을 통해 우리의 정책과 노력에 대한 국제적 지지를 확인 하였고, 특히 최초로 개최된 456&ㅅ18 + 한ㆍ중ㆍ일 정상희담을 통 해 우리의 포용정책에 대한 주변국들의 이해와 지지를 굳혔습니다.","chapter":null,"section":null,"page":2,"src":"2000 외교백서 머리말.pdf","id":"1999-s00010"},{"year":2000,"admin":"김대중","text":"<'신흥시장 경제ㅗ투자환경 설명회' 개최실적> <'신흥시장 경제.투자환경 설명회' 개최실적> - 아시아 : 인도네시아, 태국, 말레이시아, 필리핀, 몽골, 베트남 (3월 28일) - 중남미 : 칠레, 브라질, 과테말라, 엘살바도르(5월 26일) - 아중동 : 이란, 알제리, 튀니지, 남아공(10월 16일) 3. 외국인 투자유치 활동의 적극 전개 문(4.16-21)하였다.","chapter":6,"section":null,"page":6,"src":"1990 외교백서 제6장.pdf","id":"1989-s01478"},{"year":1990,"admin":"노태우","text":"대표적인 방문 초청외교부 예로는 강영훈 국무총리가 1990년 7월 16일부터 31일까지 아일랜드, 벨지움, 터키, 80등을 공식 방문하여 방문국 국가원수 예방, 총리회담등을 통하여 방문국과의 우호협력관계를 증진하였으며 1989년 노태우 대통령의 때8 성과를 더욱 확산하는데 기여하였다.","chapter":2,"section":null,"page":13,"src":"1991 외교백서 제2장.pdf","id":"1990-s00206"},{"year":1993,"admin":"김영삼","text":"유고사태는 차치하고라도 루마니아내 헝가리계 소수민족 문제, 불가리 아내 터키계 소수민족 문제 , 루마니아-몰도바 통합문제, 신유고연방내 코 소보 독립문제, 슬로바키아내 헝가리 소수민족 문제등을 둘러싼 지역국가간 . 의 갈등은 앞으로도 계속될 것으로 보인다.","chapter":2,"section":3,"page":61,"src":"1994 외교백서 제2장.pdf","id":"1993-s00476"},{"year":1994,"admin":"김영삼","text":"보스니아사태는 차치하고라도 루마니아와 슬로바키아내 ： 헝가리 소수민족문제, 불가리아내 터키계 소수민족문제, 루마니아-몰도 바 통함문제, 신유고 연방내 코소보 독립문제, 마케도니아 국호문제 등 지역국가간의 갈등은 앞으로도 계속될 것으로 보인다.","chapter":2,"section":3,"page":59,"src":"1995 외교백서 제2장.pdf","id":"1994-s00532"},{"year":1995,"admin":"김영삼","text":"264 / 제 7장 문화교류 및 홍보활동 한편, 문화공동위를 개최하지 않고 외교경로를 통해 문화교류 시행계획 서를 2-3년 주기로 작성, 서명하여 시행하는 나라로는 이집트, 이란, 불가리아, 가나, 터키, 요르단, 파키스탄, 방글라데시, 쿠웨이트 등 9개 국에 이르고 있으며, 사우디아라비아, 수단 등 중동ㆍ아프리카 국가들과 는 경제공동위원회 개최시 학술, 문화, 체육, 청소년 분야의 교류 증진 방안을 함께 협의하고 있다.","chapter":7,"section":2,"page":6,"src":"1996 외교백서 제7장.pdf","id":"1995-s01403"},{"year":1996,"admin":"김영삼","text":"우리 나라도 WTO 분정해결절차를 적극적으로 황용하여 브라질의 자 176 / 제4장 1996년도 분야별 외교활동 동차 산업보호조치 및 브라질, 터키 및 에쿠아돌의 섬유 수입제한 조치에 대해, \\10의 관련 위원회에서 이를 제기하거나 WTO 분쟁해결 과정에 제 3자로 참여하여 우리 나라의 통상이익을 확보하였다.","chapter":4,"section":1,"page":23,"src":"1997 외교백서 제4장.pdf","id":"1996-s01023"},{"year":1997,"admin":"김영삼","text":"이러한 배경하에 96년에는 개도국과는 처음으로 아르헨티나 및 베트남과 원자력 협력 협정이 체결되었고, 현재 터키, 브라질, 체코 등과도 원자력 협정 체결을 추진중에 있다.","chapter":4,"section":2,"page":1995,"src":"1998 외교백서 제4장.doc","id":"1997-s01436"},{"year":1998,"admin":"김대중","text":"특히 우리나라에 대한 이해가 부족한 국가를 대상으로 우리나라 소개자료를 현지어로 번역.발간하고 있는데, 특히 1990년부터는 영어, 일어, 독어, 불어 등 주요언어뿐 만 아니라 스와힐리어, 터키어, 마인어, 그리스어, 루마니아어, 체크어, 이란어, 슬로바키아어 등 9개 언어로 'Facts about Korea' 등을 발간.배포하였다.","chapter":5,"section":6,"page":1,"src":"1999 외교백서 제5장.doc","id":"1998-s02361"},{"year":1999,"admin":"김대중","text":"특히 우리나라에 대한 이해가 부족한 국가를 대상으로 우리나라 소개자료를 현지어로 번역․발간하고 있는데, 특히 1990년부터는 영어, 일어, 독어, 불어 등 주요언어뿐만 아니라 스와힐리어, 터키어, 말레이.인도네시아어, 그리스어, 루마니아어, 체크어, 이란어, 슬로바키아어 등 9개 언어로 \"Facts about Korea\" 등을 발간․배포하였다.","chapter":5,"section":6,"page":622,"src":"2000 외교백서 제5장.hwp","id":"1999-s02408"},{"year":2001,"admin":"김대중","text":"그러나 한편으로는 NATO 확대 문제, 회교원리주의 확산 우려, 카스피해 유전 개발 등 에너지 천연자원에 대한 관심증가 등 요인으로 미국, 러시아, 이란, 터키 등의 역내 경쟁도 심화되고 있는 추세에 있다.","chapter":1,"section":3,"page":1,"src":"2002 외교백서 제1장.hwp","id":"2001-s00697"},{"year":2002,"admin":"김대중","text":"그러나 한편으로는 NATO 확대 문제, 회교원리주의 확산 우려, 카스피해 유전 개발 등 에너지 자원에 대한 관심 증가 등의 요인으로 미국, 러시아, 이란, 터키 등과의 관계 강화를 위한 역내 경쟁 또한 심화되고 있는 추세이다.","chapter":1,"section":3,"page":10,"src":"2003 외교백서 제1장.hwp","id":"2002-s00447"},{"year":2003,"admin":"노무현","text":"한편, 크로아티아, 루마니아, 불가리아는 2007년 EU 가입을 목표 로 협상을 계속하고 있으며, 터키의 경우 2004년 12월 EU 정상회의 에서 가입 협상 개시여부가 결정될 예정이다.","chapter":1,"section":3,"page":104,"src":"2004 외교백서 제1장.pdf","id":"2003-s00699"},{"year":2004,"admin":"노무현","text":"한∙불 정상회담 7. 주요국 국가원수 접수를 통한 정상외교 성과 가. 한∙말레이시아 정상회담 나. 한∙터키 정상회담 다.","chapter":2,"section":5,"page":56,"src":"2005 외교백서 발간사_목차.pdf","id":"2004-s00020"},{"year":2005,"admin":"노무현","text":"EU는 2005년 불가리아, 루마니아, 크로아티아, 터키 등의 국가들과 EU 가입 협상을 개시 하는 등 회원국 확대를 위해 노력해 왔다.","chapter":1,"section":1,"page":4,"src":"2006 외교백서 제1장.pdf","id":"2005-s00100"}],"docCount":85},{"id":"콜롬비아","kind":"country","aliases":["콜롬비아"],"total":309,"byYear":{"1989":8,"1990":8,"1991":1,"1992":4,"1993":3,"1994":6,"1996":6,"1997":6,"1998":9,"1999":5,"2000":4,"2001":6,"2002":8,"2003":8,"2004":1,"2006":2,"2007":3,"2008":10,"2009":15,"2010":22,"2011":19,"2012":26,"2013":6,"2014":7,"2015":13,"2016":8,"2017":4,"2018":10,"2019":10,"2020":16,"2021":17,"2022":13,"2023":15,"2024":6,"2025":4},"rateByYear":{"1989":53.2,"1990":60.0,"1991":8.4,"1992":31.4,"1993":23.8,"1994":44.9,"1996":36.2,"1997":27.5,"1998":35.8,"1999":20.0,"2000":16.0,"2001":18.9,"2002":57.1,"2003":27.5,"2004":36.2,"2006":13.1,"2007":22.0,"2008":63.5,"2009":88.8,"2010":110.6,"2011":104.8,"2012":125.0,"2013":33.9,"2014":30.0,"2015":59.5,"2016":99.9,"2017":30.2,"2018":59.6,"2019":55.2,"2020":71.4,"2021":98.8,"2022":68.6,"2023":68.0,"2024":29.6,"2025":21.9},"byAdmin":{"이명박":92,"문재인":57,"박근혜":34,"윤석열":34,"김대중":32,"노태우":21,"김영삼":21,"노무현":14,"이재명":4},"focus":0.3,"first":1989,"last":2025,"peak":2012,"peakRate":"2012","docs":[{"year":1989,"admin":"노태우","text":"고위인사 합랩으로는 1989년중 최광수 특사의 베네수엘라 대통령 취임식 참석(1. 29-2. 14), 김용식 특사의 아르헨티나 대통령 취임식 참석(7. 4일 13), 신동원 외무차관의 페루 및 베네수엘라 방문(6. 17일23), 강경식 특사 의 파라과이, 콜롬비아 등 중남미 4개국 방문(6. 26-\"7. 15)이 있었다.","chapter":2,"section":null,"page":15,"src":"1990 외교백서 제2장.pdf","id":"1989-s00350"},{"year":1990,"admin":"노태우","text":"의원외교 활동으로는 김봉호(평민당) 의원외 10명의 알젠틴 및 브라질 방문(1.16-23)과 국회 예결위 의원단의 중남미 국가 방문이 있었으며 Morales 콜롬비아 하원의장 일행이 방한(4.17-22)하였다.","chapter":2,"section":null,"page":18,"src":"1991 외교백서 제2장.pdf","id":"1990-s00232"},{"year":1992,"admin":"노태우","text":": 1992년 2월 베네수엘라에서는 개혁을 요구하는 군부쿠데타 기도와 민주 화를 요구하는 각종 시위의 발생으로 정부가 개혁안을 발표하였으나, 정부 인사에 대한 테러 등으로 아직 정정이 불안한 형편이며 콜롬비아에서는 마 약밀매단 Medellin 카르텔의 거두 Pablo 850068가 1991년 6월 체포 감금되 었다가 19928년 ?월 탈옥하는 사태가 발생하였다.","chapter":4,"section":null,"page":32,"src":"1993 외교백서 제4장.pdf","id":"1992-s00941"},{"year":1993,"admin":"김영삼","text":"콜롬비아에서는 Medellin 카르텔의 거두 Pablo Escobar재 1993 19월 2일 사살됨으로써 Medellin 마약세력이 약화되고 또 하나의 마약조직인 Cali 카르텔 소탕에 주력하고 있으나 게릴라 및 마약단의 준동 으로 야기된 불안한 사회 및 치안불안상태가 계속되는 등 몇몇 국가들의 민 주적 문민정부를 향한 앞길에는 여러 장애요소가 가로놓여 있다.","chapter":2,"section":3,"page":46,"src":"1994 외교백서 제2장.pdf","id":"1993-s00367"},{"year":1994,"admin":"김영삼","text":"우선 정치면에 있어서 중남미 지역 대부분의 국가들이 1983년 아르헨 티나의 민정이양 이후 군부통치에서 문민정부로 이행되었으며, 1994년에 는 중미의 멕시코, 파나마, .코스타리카, 엘살바돌, 도미니카(공) 및 남 미의 콜롬비아, 브라질, 우루과이 등 8개국에서 평화적 정권 교체가 이루 어졌고， 아이티의 0608 군사정권 또한 국제사회의 압력으로 퇴진, | Aristide 대통령이 복귀함으로써 현재 이지역 33개국중 쿠바를 제외한 32개국이 문민정부 체제를 유지하고 있다.","chapter":2,"section":3,"page":42,"src":"1995 외교백서 제2장.pdf","id":"1994-s00436"},{"year":1996,"admin":"김영삼","text":"우선 중요한 정치적 현안이 되어 왔던 퀘벡 분리ㆍ독립 문제와 관련해 자유당 정부는 퀘벡 분리주의 세력을 연방체제로 흡수하여 국가적 단합을 도모하기 위한 일런의 조치를 취하여 왔다, 이러한 노력의 일환으로 1996년 2월 퀘벡주, 온타리오주, 브리티 쉬 콜롬비아주와 동부 4개주 및 서부 3개주 등 5개 지역에 대해 헌법개정 비토권을 부여하는 법률안을 제정하였다.","chapter":1,"section":3,"page":52,"src":"1997 외교백서 제1장.pdf","id":"1996-s00392"},{"year":1997,"admin":"김영삼","text":"중남미는 7월 멕시코 총선에서 제도혁명당의 장기 독재체제가 와해되는 등 안정적인 경제성장을 기반으로 정치적인 안정이 정착되어가고 있으나 베네수엘라, 콜롬비아, 파라과이, 페루 등이 정치불안을 경험하였다.","chapter":1,"section":1,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00047"},{"year":1998,"admin":"김대중","text":"중남미 지역은 1997년 7월부터 1998년 8월까지 아시아 및 러시아의 경제위기 여파로 브라질.콜롬비아.아르헨티나 등이 주로 금융 부문에서, 칠레를 비롯한 여타 국가들은 무역 부문에서 큰 타격을 받았음에도 불구하고 대부분 정치적 안정세가 지속되었다.","chapter":1,"section":1,"page":1,"src":"1999 외교백서 제1장.doc","id":"1998-s00051"},{"year":1999,"admin":"김대중","text":"이를 위해 미국은 세계 최대 코카인 생산국가인 콜롬비아의 마약방지 노력을 위하여 포괄적인 정치, 경제, 사회, 개발 계획인 'Plan Colombia'를 대대적으로 지원하고 있다.","chapter":1,"section":3,"page":1,"src":"2000 외교백서 제1장.hwp","id":"1999-s00343"},{"year":2000,"admin":"김대중","text":"미국은 세계 최대 코카인 생산국가인 콜롬비아의 마약방지 노력을 위하여 그 동안 'Plan Colombia'를 지원해 왔었는 바, Clinton 대통령은 2000년 1월 11일 'Plan Colombia'를 위해 총 15억 7400만달러의 원조 제공 계획을 공표하였다.","chapter":1,"section":3,"page":1,"src":"2001 외교백서 제1장.hwp","id":"2000-s00341"},{"year":2001,"admin":"김대중","text":"4월 20일~22일간 캐나다 퀘벡에서 개최된 제3차 미주정상회의에서 Bush 대통령은 34개국 미주국가 정상들과 함께 최종선언문을 채택하고 2005년까지 미주자유무역지대를 출범시키고 민주주의 발전, 빈곤 퇴치, 마약 퇴치, 부패 방지 등을 위해 계속 노력하는 한편 콜롬비아의 평화 프로세스에 지지를 표명하고 역내 지식기반 산업 발전을 위한 공동 연구기관을 창설하는데 합의하였다.","chapter":1,"section":3,"page":1,"src":"2002 외교백서 제1장.hwp","id":"2001-s00486"},{"year":2002,"admin":"김대중","text":"또한 미국은 콜롬비아 정부의 마약퇴치 노력을 지원하면서, 마약퇴치와 대테러전과의 인위적 구분을 없애고 민주주의에 대한 위협문제를 해결하는 방향으로 정책을 재정립하였다.","chapter":1,"section":3,"page":10,"src":"2003 외교백서 제1장.hwp","id":"2002-s00326"},{"year":2003,"admin":"노무현","text":"또한 콜롬비아 및 아이티는 게릴라 단체 및 반정부 무장세력의 활동으로 향후 정국 운영에 난관이 예상되고 있다.","chapter":1,"section":1,"page":5,"src":"2004 외교백서 제1장.pdf","id":"2003-s00054"},{"year":2004,"admin":"노무현","text":"2) p. 79 길라잡이 참조 3) 카르타헤나 협정(1969년 10월 발효)에 의해 1969년 창설되었으며, 현재 볼리비아, 에콰도르, 칠레, 콜롬비아, 베네수엘라 등 5개국으로 구성 되어 있다.","chapter":1,"section":null,"page":2,"src":"2005 외교백서 제1장.pdf","id":"2004-s00043"}],"docCount":97},{"id":"파키스탄","kind":"country","aliases":["파키스탄"],"total":301,"byYear":{"1989":9,"1990":12,"1991":8,"1992":6,"1993":9,"1994":5,"1995":7,"1996":17,"1997":15,"1998":17,"1999":13,"2000":19,"2001":27,"2002":10,"2003":18,"2004":2,"2005":8,"2006":7,"2007":4,"2008":5,"2009":6,"2010":5,"2011":3,"2012":8,"2013":4,"2014":9,"2015":12,"2016":5,"2017":2,"2018":2,"2019":3,"2020":4,"2021":5,"2022":5,"2023":3,"2024":2,"2025":5},"rateByYear":{"1989":59.9,"1990":90.0,"1991":67.3,"1992":47.1,"1993":71.4,"1994":37.5,"1995":50.0,"1996":102.5,"1997":68.6,"1998":67.7,"1999":52.0,"2000":76.0,"2001":85.0,"2002":71.3,"2003":62.0,"2004":72.5,"2005":68.6,"2006":45.8,"2007":29.3,"2008":31.8,"2009":35.5,"2010":25.1,"2011":16.5,"2012":38.5,"2013":22.6,"2014":38.5,"2015":54.9,"2016":62.4,"2017":15.1,"2018":11.9,"2019":16.5,"2020":17.9,"2021":29.1,"2022":26.4,"2023":13.6,"2024":9.9,"2025":27.4},"byAdmin":{"김대중":86,"김영삼":53,"노무현":39,"노태우":35,"박근혜":30,"이명박":27,"문재인":16,"윤석열":10,"이재명":5},"focus":0.29,"first":1989,"last":2025,"peak":2001,"peakRate":"1996","docs":[{"year":1989,"admin":"노태우","text":"나. 서남아지역 서남아지역의 인도, 파키스탄, 스리랑카, 버마(1989. 6. 미얀마로 국명 변 경)는 비동맹운동의 모체인 1955년 반둥회의를 인도네시아와 함께 주최하였 으며, 1961년 카이로에서 열린 제1차 비동맹 준비회의부터는 상기 4개국외 에 네팔이 추가로 참석함으로써 서남아지역은 명실상부한 비동맹 제3세계 중심권역으로서의 위치를 그 태동단계에서부터 확고히 하게 되었다.","chapter":2,"section":null,"page":13,"src":"1990 외교백서 제2장.pdf","id":"1989-s00335"},{"year":1990,"admin":"노태우","text":"나. 서남아지역 서남아지역의 인도, 파키스탄, 스리랑카, 버마 (1989.6. 미얀마로 국명변경) 는 비동맹 운동의 모체인 1955년 반등회의를 인도네시아와 함께 주최하였으며, | 제1절 우방이상 협력。39 1961년 카이로에서 열린 제1차 비동맹 준비회의부터는 상기 4개국외에 네팔이 추가로 참석함으로써 서남아지역은 명실상부한 비동맹 제3세계 중심권역으로서 의 위치를 그 대동단계에서 부터 확고히 하게 되었다.","chapter":2,"section":null,"page":15,"src":"1991 외교백서 제2장.pdf","id":"1990-s00221"},{"year":1991,"admin":"노태우","text":"나. 서남아지역 서남아지역의 인도, 파키스탄, 스리랑카, 미안마는 비동맹 운동의 모체인 1955년 반등회의를 인도네시아와 함께 주최하였으며, 1961년 카이로에서 열린 제1차 비동맹 준비회의부터는 상기 4개국외에 네괄이 추가로 참석함으로써 서남아지역은 비동맹 제3세계 중심권역으로서의 위치를 그 태동단계에서 부터 확고히 하게 되었다.","chapter":2,"section":null,"page":14,"src":"1992 외교백서 제2장.pdf","id":"1991-s00235"},{"year":1992,"admin":"노태우","text":"일 파키스탄은 1990년 11월 나와즈 샤리프 수상이 집권한후 경제개발을 국 정최우선과제로 선정, 외자유치, 수출중대, 민영화정책 등을 과감히 시도하 여 어느정도 성과를 거두고 있다.","chapter":4,"section":null,"page":14,"src":"1993 외교백서 제4장.pdf","id":"1992-s00827"},{"year":1993,"admin":"김영삼","text":"첫째로 동구변화, 소련의 붕괴 등에 영향을 받은 세계적인 민주화 추세에 따라 민주적 총선에 의한 정권교체가 이루어졌으며, 둘째로 강대국간의 협 조분위기에 따른 아프간 사태의 해결가능성 및 인도, 파키스탄의 화해노력 등으로 서남아 지역에서의 긴장완화 조짐이 보이고 있으며, 셋째로는 사회 주의 경제를 탈피하고 시장경제 체제를 도입, 경제개발에 노력하고 있는 점 이다.","chapter":2,"section":3,"page":30,"src":"1994 외교백서 제2장.pdf","id":"1993-s00252"},{"year":1994,"admin":"김영삼","text":"4. 서아시아ㆍ아프리카지역 가. 서남아지역 | 1) 지역정세 。 서남아지역은 냉전종식 이후에도 인도ㆍ파키스탄간의 핵 및 미사일 개 발 경쟁과 카시미르문제를 둘러싼 양국간 긴장관계의 영향으로 전반적 정세불안을 겪고 있다.","chapter":2,"section":3,"page":62,"src":"1995 외교백서 제2장.pdf","id":"1994-s00545"},{"year":1995,"admin":"김영삼","text":"이러한 중국의 대미 견제는 1995년 6월 미국 정부의 리멍 후이 (소플빼) 대만 총통에 대한 입국비자 발급을 계기로 촉발된 미ㆍ중 간의 갈등에서 표면화되었으며, 상호간에 가지고 있던 기존의 부정적 인 식이 중국의 핵실험 실시, 파키스탄 및 이란에 대한 중국의 미사일 부품 판매, 인권 문제, 무역분쟁 등을 둘러싼 심각한 마찰로 인해 더욱 확산되 었다.","chapter":2,"section":2,"page":14,"src":"1996 외교백서 제2장.pdf","id":"1995-s00261"},{"year":1996,"admin":"김영삼","text":"한편 서남아 지역 최대 불안요소인 인도ㆍ파키스탄 관계에 있어서 1996년도는 지난 1994년이후 중단된 양국 정부간 공식대화 재개 를 모색하는 등 인ㆍ파간 긴장 완화를 위해 매우 고무적인 해가 되었다.","chapter":1,"section":3,"page":33,"src":"1997 외교백서 제1장.pdf","id":"1996-s00252"},{"year":1997,"admin":"김영삼","text":"그러나, 역내 최대 불안요소인 인도·파키스탄 관계는 두 차례의 정상회담과 3년만에 재개된 외무차관회담을 통한 양국의 대화노력에도 불구하고 카시미르 문제를 둘러싼 근본적인 입장차이로 인하여 구체적인 진전을 보지 못하였으며, 1978년이래 20년째 내전이 계속되고 있는 아프가니스탄에서도 Taliban 세력과 반Taliban 세력간의 내전이 계속되었다.","chapter":1,"section":3,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00254"},{"year":1998,"admin":"김대중","text":"또한, 1998년 5월 인도와 파키스탄의 핵실험을 위요한 핵비확산 등 범세계적 문제에 대한 적극 대응 및 국제문제의 평화적 해결을 강조하고, 이라크 및 코소보 사태 등에 대한 무력 및 압력 사용에 반대하기도 하였다.","chapter":1,"section":3,"page":1,"src":"1999 외교백서 제1장.doc","id":"1998-s00237"},{"year":1999,"admin":"김대중","text":"중국 등 주변 국가들과의 관계를 재정립하고 역내협력을 증진하기 위한 움직임을 보이고 있는 가운데, 비동맹의 퇴색, 인도․파키스탄간 핵 경쟁 및 영토분쟁, 인구과밀, 빈곤, 환경오염, 마약, 테러리즘 문제 등 지역 전반에 걸친 불안정 요인이 병존하고 있다.","chapter":1,"section":3,"page":1,"src":"2000 외교백서 제1장.hwp","id":"1999-s00255"},{"year":2000,"admin":"김대중","text":"서남아 지역 국가들은 한편으로는, 개별국가별로 사회간접자본 확충, 서방국가 및 국제기구와의 협력, 경제개방 등 경제개발정책을 추구하고, 다른 한편으로는 남아시아 7개국(인도, 파키스탄, 스리랑카, 방글라데시, 네팔, 몰디브, 부탄)간 남아시아 지역협력연합(South Asian Association for Regional Cooperation：SAARC)을 결성하여 지역경제협력을 추진하여 왔다.","chapter":1,"section":3,"page":1,"src":"2001 외교백서 제1장.hwp","id":"2000-s00247"},{"year":2001,"admin":"김대중","text":"한편, 서남아시아 국가들은 지속적으로 추진하여 온 경제개혁이 성과를 나타내고 인도와 파키스탄이 미국의 대테러전 협조의 대가로 각종 경제제재 조치로부터 벗어남에 따라 4%의 성장을 기록하였다.","chapter":1,"section":1,"page":1,"src":"2002 외교백서 제1장.hwp","id":"2001-s00184"},{"year":2002,"admin":"김대중","text":"서남아 지역은 약 13억의 인구와 방대한 영토 및 자원을 보유하고 있는 지역으로서, 냉전 종식후 경제개발 추진 노력과 함께 미 러 등 주요국가들과의 관계 재정립, 역내 협력관계 강화 등을 위한 움직임을 보이고 있으나, 비동맹 세력의 퇴색으로 인한 역내 정치적 단결 약화, 인도 파키스탄의 대량파괴무기 비확산 문제 등 국지적 분쟁 상존, 인구 환경오염 테러 문제 등으로 지역 전반에 걸쳐 불안정 불확실성이 지속되고 있다.","chapter":1,"section":3,"page":10,"src":"2003 외교백서 제1장.hwp","id":"2002-s00262"}],"docCount":99},{"id":"이집트","kind":"country","aliases":["이집트"],"total":301,"byYear":{"1989":10,"1990":5,"1991":6,"1992":12,"1993":8,"1994":5,"1995":8,"1996":5,"1997":10,"1998":11,"1999":12,"2000":11,"2001":15,"2002":5,"2003":12,"2005":10,"2006":11,"2007":8,"2008":4,"2009":5,"2010":5,"2011":8,"2012":10,"2013":9,"2014":19,"2015":7,"2016":6,"2017":8,"2018":5,"2020":7,"2021":5,"2022":8,"2023":7,"2024":7,"2025":17},"rateByYear":{"1989":66.5,"1990":37.5,"1991":50.5,"1992":94.3,"1993":63.5,"1994":37.5,"1995":57.1,"1996":30.1,"1997":45.8,"1998":43.8,"1999":48.0,"2000":44.0,"2001":47.2,"2002":35.7,"2003":41.3,"2005":85.8,"2006":71.9,"2007":58.6,"2008":25.4,"2009":29 중동평화를 적극 추진해 온 8801 이스라엘 총리가 암살되어 중동평화 협상 전도에 우려가 제기되기도 했으나, Rabin 총리 의 영결식에 미국을 비롯한 이집트, 요르단의 국가원수와 모로코, 오만, 카타르 등의 각료급 인사가 조문사절로 참석하고, Rabin 총리의 뒤를 이은 86265 총리가 이스라엘군의 요르단강 철수일정을 준수하고 적극적 으로 평화협상을 지속하겠다는 입장을 표명함으로써 오히려 평화협상 기 조를 더욱 강화하는 계기가 되었다.","chapter":2,"section":3,"page":71,"src":"1996 외교백서 제2장.pdf","id":"1995-s00625"},{"year":1996,"admin":"김영삼","text":"특히, 이스라엘과 아랍권간 평화협상의 부진에 의한 상호대립, 알제리 와 이집트 등에서의 과격 회교원리주의 세력에 의한 테러의 빈발, 이라 크，리비아 등에 대한 유엔 제재 장기화를 둘러싼 국가간의 입장차이도 중동정세 전망을 불투명하게 하는 요인이라 할 수 있다.","chapter":1,"section":3,"page":83,"src":"1997 외교백서 제1장.pdf","id":"1996-s00616"},{"year":1997,"admin":"김영삼","text":"또 Albright 국무장관은 9월 이스라엘, 이집트, 요르단, 시리아, 사우디 아라비아를 순방, 중동 평화협상, 걸프지역 정세 및 양자관계 증진 문제 등을 광범위하게 논의했다.","chapter":1,"section":3,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00371"},{"year":1998,"admin":"김대중","text":"특히, 아랍권과 이스라엘간 평화협상의 부진에 의한 상호대립, 알제리와 이집트 등에서의 과격 회교원리주의 세력에 의한 테러의 발생, 이란, 이라크 등에 대한 제재 장기화를 둘러싼 강대국간의 입장차이도 중동정세 전망을 불투명하게 하는 요인으로 볼 수 있다.","chapter":1,"section":3,"page":1,"src":"1999 외교백서 제1장.doc","id":"1998-s00600"},{"year":1999,"admin":"김대중","text":"9월 1일-5일간 모로코, 이집트, 이스라엘, 등을 방문한 Albright 미 국무장관은 이집트 Mubarak 대통령과 함께 Arafat 팔레스타인 자치정부 수반과 Barak 이스라엘 수상간의 회담을 중재한 결과 이스라엘-팔레스타인간 Sharm El-Sheikh 합의에 이르는데 크게 기여하였다.","chapter":1,"section":3,"page":1,"src":"2000 외교백서 제1장.hwp","id":"1999-s00360"},{"year":2000,"admin":"김대중","text":"이 원조 액수는 미국의 대외원조액으로는 이스라엘과 이집트에 이어 세번째로 큰 규모이다.","chapter":1,"section":3,"page":1,"src":"2001 외교백서 제1장.hwp","id":"2000-s00342"},{"year":2001,"admin":"김대중","text":"2000년 9월 이․팔 유혈사태 격화로 인한 평화 협상의 중단과 이스라엘과 아랍권의 상호대립 격화, 알제리, 이집트, 사우디 등 이슬람 국가에서 이슬람 근본주의 세력의 증대, 이란과 이라크에 대한 미국의 제재 장기화를 둘러싼 주요국간의 입장차이도 중동정세 불안의 요소로 작용하고 있다.","chapter":1,"section":3,"page":1,"src":"2002 외교백서 제1장.hwp","id":"2001-s00740"},{"year":2002,"admin":"김대중","text":"국가 경제가 관광 수입에 크게 의존하고 있는 이집트의 경우 2002년도 후반에 들어서야 9.11 테러사태의 여파로부터 벗어나기 시작하였으나 대이라크 전쟁 가능성 고조 등 지역 불안정 요인 지속으로 성장세가 완전히 정착되지 못하는 한계를 드러내었다.","chapter":1,"section":3,"page":10,"src":"2 안과 사우디아라비아의 고유가 정책 추진 움직임 등으로 일시 상승한 것을 제외하고는 하향안정세를 보였다.","chapter":3,"section":null,"page":3,"src":"1993 외교백서 제3장.pdf","id":"1992-s00395"},{"year":1993,"admin":"김영삼","text":"걸프전쟁을 통해서 미국은 다국적군을 결성하여 사우디를 비롯, 걸프주변 국 왕정을 수호하고 쿠웨이트 왕정을 회복하는데 주도적 역할을 수행함으로 써 걸프ㆍ아랍국가들과 미국의 관계는 한층 더 긴밀해졌으며, 이들 지역에 대한 미국의 영향력이 크게 강화되었다.","chapter":2,"section":3,"page":63,"src":"1994 외교백서 제2장.pdf","id":"1993-s00492"},{"year":1994,"admin":"김영삼","text":"또한 동 기간중 김영삼 대통령의 러시아 및 우즈베키스탄 순방, 한승주 외무장관의 필리 핀, 태국, 베트남, 인도네시아 순방 그리고 스웨덴, 사우디아라비아, 필리핀, 뉴질랜드, 호주 등과의 양국 공동위원회 또는 정책협의회 등 모든 외교채널을 전면 가동, 우리 안보리 입후보에 대한 지지교섭을 전개 해 나갔다.","chapter":6,"section":1,"page":5,"src":"1995 외교백서 제6장.pdf","id":"1994-s01077"},{"year":1995,"admin":"김영삼","text":"이와 관련해 우리의 대중동 경협관계를 확대시키 。 려는 노력도 지속되어 1995 9월 박재윤 통상산업부 장관을 단장으로 하는 민ㆍ관 에너지사절단이 사우디, 오만, 카타르, 쿠웨이트, 예멘을 방문하였다.","chapter":2,"section":3,"page":73,"src":"1996 외교백서 제2장.pdf","id":"1995-s00633"},{"year":1996,"admin":"김영삼","text":"마) 걸프협력이사회(900) 지역 1996년 6월 사우디 다란의 미공군기지 폭발물 테러사건은 전통적으로 94 / 제 ｌ장 국제정세 및 한반도 주변정세 보수ㆍ안정적이던 60 지역이 테러 안전지대가 아님을 보여주었다.","chapter":1,"section":3,"page":85,"src":"1997 외교백서 제1장.pdf","id":"1996-s00631"},{"year":1997,"admin":"김영삼","text":"아프가니스탄 내전은 Taliban과 반Taliban 세력간의 입장차이, 반Taliban 세력내 복잡한 이해관계의 상충, 그리고 Taliban을 지원하는 파키스탄 및 사우디아라비아와 반Taliban 세력을 지원하는 것으로 알려진 러시아, 이란, 우즈베키스탄 등 외부세력의 개입으로 좀처럼 해결의 실마리를 찾지 못하고 있다.","chapter":1,"section":3,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00286"},{"year":1998,"admin":"김대중","text":"1997년 12월 제 8차 테헤란 이슬람회의기구(Organization of the Islamic Conference：OIC) 정상회의를 계기로 사우디아라비아 등 주변 아랍 제국과의 관계가 획기적으로 개선되었으며 GCC와의 관계 발전의 걸림돌인 아랍에미리트연합(UAE)과의 Abu Musa섬 등 영토분쟁 해결에 적극적인 태도를 보이고 있고, 특히 1999년 5월 Khatami 대통령의 사우디, 카타르 등 순방을 통해 주변국들과의 관계개선을 추진하고 있다.","chapter":1,"section":3,"page":1,"src":"1999 외교백서 제1장.doc","id":"1998-s00619"},{"year":1999,"admin":"김대중","text":"또한 사우디 등 걸프지역국들은 안보에 있어서 미국과 공조를 하면서 현체제와 질서를 유지해 나가고 있으며 미국을 위시한 EU 등 서방국들은 중동평화와 안정을 위한 국제적 노력을 계속하고 있다.","chapter":1,"section":3,"page":1,"src":"2000 외교백서 제1장.hwp","id":"1999-s00588"},{"year":2000,"admin":"김대중","text":"또한 미국은 이라크측이 남부 이라크를 초계중인 미 영 공군기에 대해 방공포를 발사했다고 주장하며 8월 11일～12일 남부 이라크 방공기지를 폭격했고, 9월 4일 이라크 전투기가 사우디아라비아 영공을 침범했다며 이라크의 비행 금지구역 침범에 대한 보복으로 이라크 남부 레이더 기지들을 공습하는 등 강경한 대이라크 정책을 계속 추진했다.","chapter":1,"section":3,"page":1,"src":"2001 외교백서 제1장.hwp","id":"2000-s00354"},{"year":2001,"admin":"김대중","text":"사우디를 비롯한 중동 산유국들은 국제유가가 상승한 기간동안 과거와 달리 거시경제의 안정에 정책의 중점을 둠으로써 세계경제 침체로부터의 부정적 영향을 감소시킬 수 있었다.","chapter":1,"section":1,"page":1,"src":"2002 외교백서 제1장.hwp","id":"2001-s00191"},{"year":2002,"admin":"김대중","text":"따라서 주요 석유 수출국 가운데 이란만이 2년 연속 5% 이상의 강한 성장세를 보였으며, 사우디아라비아, 쿠웨이트 등의 성장은 극히 저조하였다.","chapter":1,"section":3,"page":10,"src":"2003 외교백서 제1장.hwp","id":"2002-s00164"}],"docCount":100},{"id":"인태전략","kind":"policy","aliases":["인태 전략","인태전략"],"total":248,"byYear":{"2018":5,"2019":6,"2020":3,"2021":3,"2022":87,"2023":119,"2024":24,"2025":1},"rateByYear":{"2018":29.8,"2019":33.1,"2020":13.4,"2021":17.4,"2022":458.9,"2023":539.4,"2024":118.4,"2025":5.5},"byAdmin":{"윤석열":230,"문재인":17,"이재명":1},"focus":0.93,"first":2018,"last":2025,"peak":2023,"peakRate":"2023","docs":[{"year":2018,"admin":"문재인","text":"한편 인태 전략을 대외전략으로 공식화해 동맹국·우방국과 협력을 강화하고 역내 관여 의지를 재확인했다.","chapter":1,"section":1,"page":9,"src":"2019 외교백서 국문_제1장.pdf","id":"2018-s00021"},{"year":2019,"admin":"문재인","text":"특히 미국의 인태 전략과 중국의 일대일로 (-\\ 16) 구상 등 지역구상에 기반을 눈 미ㆍ중 간 영향력 확대 경쟁도 한층 뚜멋해지는 경향을 보였다.","chapter":1,"section":1,"page":9,"src":"2020 외교백서 국문_제1장.pdf","id":"2019-s00038"},{"year":2020,"admin":"문재인","text":"제3장 한반도 평화와 역내 협력 증진 한·미 양국은 우리의 신남방정책과 미국의 인태전략 간 협력을 강화하는 등 한·미 동맹을 포괄적이고 호혜적인 동맹으로 발전시켜 왔다.","chapter":3,"section":null,"page":74,"src":"2021 외교백서(국문).pdf","id":"2020-s00717"},{"year":2021,"admin":"문재인","text":"영국은 3월 인태 지역을 중시하는 기조를 담은 종합 외교정책 문서인 ‘안보·국방·개발·외교 정책 통합검토 보고서’를 발표했고, 프랑스는 4월 기존의 인태 전략을 갱신하는 새로운 ‘인도·태 평양 파트너십 전략’을 발표했다.","chapter":1,"section":1,"page":14,"src":"2021년도 국제정세와 외교활동(외교백서)_홈페이지 게시.pdf","id":"2021-s00099"},{"year":2022,"admin":"윤석열","text":"이러한 비전의 상세 이행을 위해 정 부는 대한민국 외교 역사상 처음으로 포괄적 지역전략인 ‘인태 전략’을 발표하였 습니다.","chapter":null,"section":null,"page":2,"src":"2022년도 국제정세와 외교활동(외교백서).pdf","id":"2022-s00005"},{"year":2023,"admin":"윤석열","text":"제1장 미국은 인태 전략에 기반하여 주요 국가와의 파트너십을 증진하고, 한·미·일 정상회의, AUKUS 및 쿼드(Quad) 정상회의 등을 통해 소다자 협력을 심화했다.","chapter":1,"section":1,"page":9,"src":"2023년도 국제정세와 외교활동.pdf","id":"2023-s00042"},{"year":2024,"admin":"윤석열","text":"2. 지역별 동향 1) 미국 2024년에도 조 바이든(Joe Biden) 행정부는 2022년 발표한 「인태 전략」에 따라 제1장 2024년 국제정세 및 외교정책 기조 인태 지역 주요 국가와의 파트너십을 강화하였다.","chapter":1,"section":1,"page":11,"src":"2024년도 국제정세와 외교활동.pdf","id":"2024-s00074"},{"year":2025,"admin":"이재명","text":"한-라트비아 안보 협력 세미나 (10.8, 라트비아) 한-리투아니아 인태 전략 학술 세미나 (11.4, 리투아니아) 글로벌 사우스 지역에서는 현지 수요를 반영한 실질 협력 중심의 정책공공외교를 진행하였다.","chapter":5,"section":null,"page":228,"src":"2025년도 국제정세와 외교활동.pdf","id":"2025-s01611"},{"year":2018,"admin":"문재인","text":"문재인 대통령은 11월 동아시아정상회의(EAS)를 계기로 펜스 부통령을 접견하고 한반도의 완전한 비핵화를 위한 한·미 간 공조 방안과 신남방정책 및 인태 전략을 비롯한 지역·글로벌 이슈와 관련한 협력 방안을 논의했다.","chapter":2,"section":3,"page":45,"src":"2019 외교백서 국문_제2장.pdf","id":"2018-s00311"},{"year":2019,"admin":"문재인","text":"아울러 한ㆍ미 농 맹 현안의 합리적 해결 방안을 모색하고 신남방정책-인태전략 간 연계협력 능 글로 벌 이슈에 대한 소동과 공조를 강화해 호혜적ㆍ포괄적 전락농맹 관계를 발전시켜 나갔다.","chapter":1,"section":2,"page":20,"src":"2020 외교백서 국문_제1장.pdf","id":"2019-s00149"},{"year":2020,"admin":"문재인","text":"양국은 11월 14일 개 최된 동아시아정상회의(EAS)를 계기로 개발협력, 인프라, 에너지, 스마트시티, 반부패, 기후변화, 보건·코로나19, 물안보 등 지난 1년간 신남방정책과 인태전략 간 연 계협력 관련 실질협력사업의 성과를 총망라한 제2차 설명서(Fact Sheet)를 발표했다.","chapter":3,"section":null,"page":74,"src":"2021 외교백서(국문).pdf","id":"2020-s00718"},{"year":2021,"admin":"문재인","text":"양 정상은 기후변화 대응 기술 협력 및 수소 경제 등 관련 협력 방안을 논의하고, 신남방정책과 호 주의 인태 전략 간의 공조 방안, 믹타(MIKTA) 국가 간 협력, 지역 정세에 관한 의 견도 교환했다.","chapter":4,"section":null,"page":66,"src":"2021년도 국제정세와 외교활동(외교백서)_홈페이지 게시.pdf","id":"2021-s00489"},{"year":2022,"admin":"윤석열","text":"제1절 국제정세 개관 둘째, 미국은 2022년 2월 「인태 전략」, 10월 「국가안보전략」 보고서 등을 발표 하며 인태지역 중시, 전략적 우선순위에 따른 동맹·파트너십 강화, 공급망 재편 등 기조를 제1장 이어갔다.","chapter":1,"section":1,"page":9,"src":"2022년도 국제정세와 외교활동(외교백서).pdf","id":"2022-s00039"},{"year":2023,"admin":"윤석열","text":"2. 지역별 동향 1) 미국 2023년 조 바이든(Joe Biden) 행정부는 2022년 발표한 「인태 전략」에 기반하여 인태 지역 주요 국가와의 파트너십을 증진하였다.","chapter":1,"section":1,"page":11,"src":"2023년도 국제정세와 외교활동.pdf","id":"2023-s00079"}],"docCount":20},{"id":"테러사태","kind":"event","aliases":["테러 사태","테러사태"],"total":188,"byYear":{"2001":124,"2002":38,"2003":23,"2006":1,"2007":1,"2009":1},"rateByYear":{"2001":390.3,"2002":271.0,"2003":79.2,"2006":6.5,"2007":7.3,"2009":5.9},"byAdmin":{"김대중":162,"노무현":25,"이명박":1},"focus":0.86,"first":2001,"last":2009,"peak":2001,"peakRate":"2001","docs":[{"year":2001,"admin":"김대중","text":"특히, 국제질서에 심대한 영향을 미친 9.11 테러 사태는 우리 외교환경에도 큰 변화를 초래하였습니다.","chapter":9,"section":4,"page":1,"src":"2002 외교백서 발간사_목차.hwp","id":"2001-s00002"},{"year":2002,"admin":"김대중","text":"또한 우리는 9.11 테러사태 이후 국제사회 공통의 안보위협으로 대두된 테러에 대응하기 위한 국제연대에도 능동적으로 참여하였습니다.","chapter":9,"section":4,"page":1,"src":"2003 외교백서 발간사_목차.hwp","id":"2002-s00004"},{"year":2003,"admin":"노무현","text":"또한 중국은 9.11 테러 사태 이후 2002년 10월 쟝쩌민(江澤民)의 미국 방문에 이어 2003년 6월 후진타오 국가주석과 Bush 대통령과 정상회담(프랑스 에비앙), 원자바오 총리의 미국 방문을 통해 대미 관계 개선을 적극 적으로 모색하고 있다.","chapter":1,"section":1,"page":3,"src":"2004 외교백서 제1장.pdf","id":"2003-s00035"},{"year":2006,"admin":"노무현","text":"미국은 9.11 테러 사태 이후 변화된 안보 환경에 효과적으로 대응하기 위 해 전략적 노력을 경주하는 가운데, 안보리, 북핵실험 제재 결의 채택(2006.10.15, 유엔본부) 기존의 동맹관계 재조정과 세계적인 미군의 구조 개편을 모색하고 있다.","chapter":1,"section":1,"page":20,"src":"2007 외교백서 제1장.pdf","id":"2006-s00178"},{"year":2007,"admin":"노무현","text":"전술한 바와 같이, 미국은 9.11 테러 사태 이후 반테러 및 반확산 등 비전통적 안보 위협 대응에 정책적 최우선 순위를 부여하고, 자유와 민주주의의 확산을 대외정책의 중심 기조로 삼았다.","chapter":1,"section":null,"page":17,"src":"2008 외교백서 제1장.pdf","id":"2007-s00142"},{"year":2009,"admin":"이명박","text":"인도와 파키스탄의 관계는 2008년 11월 27일 뭄바이 테러사태 이후 냉각상태가 지속되고 있다.","chapter":1,"section":1,"page":16,"src":"2010 외교백서_제1장.pdf","id":"2009-s00048"},{"year":2001,"admin":"김대중","text":"또한, 우리는 9.11 테러사태 이후 대테러 국제연대에 적극 참여하여, 아프카니스탄에 비전투 병력을 파견하고 아프카니스탄 재건 지원 사업에 동참하는 등 새로운 국제공조체제 형성에 능동적으로 대처하였습니다.","chapter":9,"section":4,"page":1,"src":"2002 외교백서 발간사_목차.hwp","id":"2001-s00006"},{"year":2002,"admin":"김대중","text":"또한 중국은 9.11 테러사태 이후 2002년 10월 장쩌민의 미국 방문과 미 중 정상회담을 계기로 대미관계 개선을 적극적으로 모색하고 있다.","chapter":1,"section":3,"page":10,"src":"2003 외교백서 제1장.hwp","id":"2002-s00129"},{"year":2003,"admin":"노무현","text":"9.11 테러 사태 이후 동남 아 지역에 대한 역외 강대국들의 영향력 확보 경쟁은‘ASEAN+3’ 협력 구도를 중심으로 이루어지고 있는 일∙중간 경쟁 양상에 더하 여 동남아 지역에서 대테러전을 수행하는 미국의 입장으로 더욱 강화 되고 있다.","chapter":1,"section":1,"page":4,"src":"2004 외교백서 제1장.pdf","id":"2003-s00043"},{"year":2001,"admin":"김대중","text":"2001년 9월 11일 미국에서 발생한 테러사태 이후 미국을 중심으로 대테러 국제연대가 형성되었고, 이러한 국제협력관계는 테러분야에만 국한되지 않고, 국제정치 다방면에 걸친 강대국간 협조체제(concert of powers)를 형성할 기회를 제공하고 있다.","chapter":1,"section":1,"page":1,"src":"2002 외교백서 제1장.hwp","id":"2001-s00108"},{"year":2002,"admin":"김대중","text":"EU는 9.11 테러사태 이후 새로운 국제안보 환경 하에서 미국과의 결속 및 상호협력 강화의 필요성을 인식하여 동반자관계를 유지하는 한편, 냉전 시대의 대미 의존을 벗어나고자 유럽방위의 주체성 확립을 모색하고 있다.","chapter":1,"section":3,"page":10,"src":"2003 외교백서 제1장.hwp","id":"2002-s00134"},{"year":2003,"admin":"노무현","text":"EU는 9.11 테러 사태 이후 새로운 국제 안보 환경 하에서 미국 과의 결속 및 상호 협력 강화의 필요성을 인식하여 동반자 관계를 유지 하는 한편, 냉전 시대의 대미 의존을 벗어나고자 유럽 방위의 주체 성 확립을 모색하고 있다.","chapter":1,"section":1,"page":5,"src":"2004 외교백서 제1장.pdf","id":"2003-s00049"}],"docCount":12},{"id":"IMF","kind":"org","aliases":["국제통화기금","IMF"],"total":183,"byYear":{"1989":1,"1990":1,"1991":1,"1992":1,"1994":1,"1995":2,"1996":3,"1997":28,"1998":21,"1999":16,"2000":11,"2001":20,"2002":13,"2003":18,"2007":2,"2008":5,"2009":6,"2010":8,"2011":6,"2012":6,"2013":3,"2014":1,"2015":2,"2016":2,"2022":2,"2023":1,"2025":2},"rateByYear":{"1989":6.7,"1990":7.5,"1991":8.4,"1992":7.9,"1994":7.5,"1995":14.3,"1996":18.1,"1997":128.1,"1998":83.6,"1999":64.0,"2000":44.0,"2001":63.0,"2002":92.7,"2003":62.0,"2007":14.7,"2008":31.8,"2009":35.5,"2010":40.2,"2011":33.1,"2012":28.8,"2013":17.0,"2014":4.3,"2015":9.2,"2016":25.0,"2022":10.5,"2023":4.5,"2025":11.0},"byAdmin":{"김대중":81,"김영삼":34,"이명박":31,"노무현":20,"박근혜":8,"노태우":4,"윤석열":3,"이재명":2},"focus":0.44,"first":1989,"last":2025,"peak":1997,"peakRate":"1997","docs":[{"year":1989,"admin":"노태우","text":"ㅇ 개도국 채무문제 해결을 위해서 1989년 4월 @-?7 회의에서 채택되어 그 후 파리 정상회담에서 확인된 「# 상무전략J」사 위에서 기술한 선진국과 채 무국간의 역할 분담을 주요 내용으로 하고 있는 바, 이는 1989년 3월 Brady 미국 재무장관이 제안한 채무 삭감 및 이자 지불 경감 촉진, IMF, 세계은행 의 역할 강화를 주축으로 하고 있다.","chapter":3,"section":null,"page":3,"src":"1990 외교백서 제3장.pdf","id":"1989-s00625"},{"year":1991,"admin":"노태우","text":"0801측은 2876 사무총장이 10월 15일 태국 방콕에서 개최되는 IMF/World Bank 연차총회 참석 기회를 이용하여, 태국, 홍콩, 한국등 3개국을 방문키로 하고 한국 정부의 공식 초청을 회망해 왔다.","chapter":3,"section":null,"page":28,"src":"1992 외교백서 제3장.pdf","id":"1991-s00629"},{"year":1992,"admin":"노태우","text":"그러나 신드주 인종갈등동의 치안상태악 146 ” 제4장 지역정세 및 우리나라와의 관계 화, 야당과의 극한대립 및 IMF 금융스캔들로 인한 집권여당내 분열로 정치 적 입지가 약화되었으며, 성급한 민영화 정책추진에 대한 비판과 기존대지 주들의 새 경제정책에 대한 반발 또한 만만치 않아 가시적 성과가 없을 경 우 정치적, 경제적 불안상태는 지속될 것으로 예상되고 있다.","chapter":4,"section":null,"page":14,"src":"1993 외교백서 제4장.pdf","id":"1992-s00828"},{"year":1994,"admin":"김영삼","text":"이들 아프리카 제국은 지역별로 대별하여 살펴보면 우선, 서부아프리카의 프랑 세파권 국가들은 IMF 및 프랑스 .정부의 권유 등에 따라 94. 1 프랑세파 50% 평가절하를 단행, 물가상승, 대외부채 상환부담 가중등의 경제적 어려움을 겪고 있으나, 전체적으로는 평가절하의 긍정적 효과가 나타나고 있으며 물가상승률도 40% 내외로 진정되고 있다.","chapter":2,"section":3,"page":69,"src":"1995 외교백서 제2장.pdf","id":"1994-s00588"},{"year":1995,"admin":"김영삼","text":"1995년초 국제통화기금 (0000) 의 러시아에 대한 65억달러 규모의 대기성 차관 제공 결정은 러시아 경제의 앞날에 대한 국제사회의 신뢰를 보여주는 중요한 사건이었다.","chapter":2,"section":3,"page":64,"src":"1996 외교백서 제2장.pdf","id":"1995-s00577"},{"year":1996,"admin":"김영삼","text":"6107 대비 재정적자율은 5. 3%로서 IMF재 제시한 수준을 충족시켰으 며, 인플레율도 경제성장의 한계 수준인 40%보다 훨씬 낮은 23%로 기록 되었고, 경상수지도 50억달러의 흑자를 달성하였다.","chapter":1,"section":3,"page":76,"src":"1997 외교백서 제1장.pdf","id":"1996-s00571"},{"year":1997,"admin":"김영삼","text":"민주주의의 자랑스러운 발전이 있었던 반면에 1997년은 동남아시아 외환 금융위기의 발생과 더불어 지난 30여년간 고도 성장과정에서의 우리 경제의 구조적 모순이 표출되어 우리나라가 국제통화기금(IMF)의 대규모 자금지원을 받게되는 어려운 처지에 처하는 한 해가 되었습니다.","chapter":null,"section":null,"page":1,"src":"1998 외교백서 머리말.doc","id":"1997-s00003"},{"year":1998,"admin":"김대중","text":"이처럼 각 세력들이 자국의 실리를 위한 적극적인 정책을 추진하면서 새로운 국제질서 형성을 위한 축을 형성해 가는 가운데 동아시아 지역에서는 1997년 7월 태국에서 발생한 경제위기의 확산 여파로 한국 등 다수 국가들이 IMF의 구제금융 지원을 받고, 1998년 경제성장률이 크게 둔화되는 등 경제 안정뿐만 아니라 정치.안보 관계에도 부정적 영향을 미쳤다.","chapter":1,"section":1,"page":1,"src":"1999 외교백서 제1장.doc","id":"1998-s00045"},{"year":1999,"admin":"김대중","text":"관련 논의는 국제통화기금(IMF)/세계은행(IBRD)을 중심으로 이루어졌는데, 9월 연차총회에서는 금융위기 재발방지책, 국제금융시스템 개혁 방안 등이 논의되고, 극빈채무 36개국의 부채 탕감이 합의되었다.","chapter":1,"section":1,"page":1,"src":"2000 외교백서 제1장.hwp","id":"1999-s00074"},{"year":2000,"admin":"김대중","text":"2) 브라질 Cardoso 2기 행정부는 1999년 1월 출범 초기부터 아시아 및 러시아 경제위기 여파로 IMF 관리체제에 편입되는 등 대내외적으로 어려운 여건에 봉착하였다.","chapter":1,"section":3,"page":1,"src":"2001 외교백서 제1장.hwp","id":"2000-s00402"},{"year":2001,"admin":"김대중","text":"지난해에는 우리 국민과 정부가 합심하여 노력한 결과, 세계 경기의 둔화 속에서도 3%의 경제성장 시현, 95억불의 무역흑자와 1,028억불의 외환보유고 달성, IMF 차입금의 조기 상환 등 괄목할 만한 성과들을 거둘 수 있었습니다.","chapter":9,"section":4,"page":1,"src":"2002 외교백서 발간사_목차.hwp","id":"2001-s00009"},{"year":2002,"admin":"김대중","text":"특히, 아르헨티나의 경우 거시경제적 구조조정을 위한 국내 정치적 컨센서스가 제대로 형성되지 못함으로써 IMF의 구제금융 지원을 지연시켰으며, 경제적 불안정이 우루과이와 파라과이 등 인접 소규모경제 국가에까지 확산되었다.","chapter":1,"section":3,"page":10,"src":"2003 외교백서 제1장.hwp","id":"2002-s00170"},{"year":2003,"admin":"노무현","text":"▣ 동티모르 동티모르 민주공화국은 2002년 5월 20일 독립을 선포하고 국제사 회의 일원이 된 후 191번째 UN 회원국 가입(1992년)을 비롯하여 세계 은행 및 국제통화기금, 아시아개발은행 회원국으로 가입하고, 모든 ASEAN 회원국들과 국교를 수립하였다.","chapter":1,"section":3,"page":42,"src":"2004 외교백서 제1장.pdf","id":"2003-s00298"},{"year":2007,"admin":"노무현","text":"이로써 재외공관의 숫자는 146개를 기록, 지난 90년대 후반 IMF 사태 이후 재외공관망을 대폭 축소하기 전인 1997년 수준으로 회복하였다.","chapter":6,"section":2,"page":196,"src":"2008 외교백서 제6장.pdf","id":"2007-s01437"}],"docCount":59},{"id":"신남방정책","kind":"policy","aliases":["신남방 정책","신남방정책"],"total":159,"byYear":{"2017":12,"2018":46,"2019":50,"2020":31,"2021":20},"rateByYear":{"2017":90.7,"2018":274.3,"2019":275.8,"2020":138.4,"2021":116.3},"byAdmin":{"문재인":159},"focus":1.0,"first":2017,"last":2021,"peak":2019,"peakRate":"2019","docs":[{"year":2017,"admin":"문재인","text":"외교 다변화라는 기조 아래 '신북방정책'과 '신남방정책'을 표방하고 우리 외교지평 을 확대하고자 했으며, 동시에 국제사회의 책임 있는 일원으로서 다양한 글로벌 이 슈들에 대한 우리의 역할과 기여도 보다 심화해 나갔습니다.","chapter":null,"section":null,"page":2,"src":"2018 외교백서 국문_발간사 목차.pdf","id":"2017-s00008"},{"year":2018,"admin":"문재인","text":"특히 2017년 9월 문재인 대통령의 러시아 방문 및 11월 동남아시아 순방 에서 각각 천명한 신북방정책과 신남방정책을 실현하기 위해 범정부 차원의 노력을 적 극 경주했다.","chapter":1,"section":2,"page":21,"src":"2019 외교백서 국문_제1장.pdf","id":"2018-s00137"},{"year":2019,"admin":"문재인","text":"특히 11월 한ㆍ아세안 특별정상회의와 제1자 한ㆍ메콩 정상회의를 성공적으로 개최함으로써 신남방정책의 이행 동력을 강화했습니다.","chapter":null,"section":null,"page":2,"src":"2020 외교백서 국문_표지, 발간사, 목차.pdf","id":"2019-s00009"},{"year":2020,"admin":"문재인","text":"‘신남방 정책’은 ‘신남방정책플러스’로 고도화 하였고, 아세안 국가들과 정치·안보·경제·사회 등 전방위 적 협력을 심화하였습니다.","chapter":null,"section":null,"page":3,"src":"2021 외교백서(국문).pdf","id":"2020-s00013"},{"year":2021,"admin":"문재인","text":"한편 외교부는 세계 국가의 지원 요청, 우리 재외국민 안전 확보, 신남방정책, 코로나 19 피해 상황 등을 종합적으로 고려해 베트남에 110만 회분, 태국에 47만 회분, 이란에 100만 회분, 필리핀에 53만 9,000회분의 백신을 공여해 개발도상국의 백신 접종률을 높 이는 데 기여했다.","chapter":2,"section":1,"page":23,"src":"2021년도 국제정세와 외교활동(외교백서)_홈페이지 게시.pdf","id":"2021-s00184"},{"year":2017,"admin":"문재인","text":"특히 우리 정부는 9월 정상 방러를 계기로 신북방정책, 11월 정상 동남아 순방을 계기로 신남방정책을 각각 천명함으로써 동북아를 넘어서 유라시아 지역 및 488&ㅅ1\\41ㆍ인도와 공동 번영을 추구하겠다는 지역협력 비전을 제시하였다.","chapter":1,"section":2,"page":8,"src":"2018 외교백서 국문_1장.pdf","id":"2017-s00160"},{"year":2018,"admin":"문재인","text":"또한 신남방정책을 내실 있게 추진하기 위해 8월 범정부적 이행 기구인 신남방정책 특별위원회를 발족하고, 한·아세안 협력기금을 2배(700만 달러→1,400만 달러)로 증액 하는 등 제도적, 재정적 기반을 한층 더 강화했다.","chapter":1,"section":2,"page":21,"src":"2019 외교백서 국문_제1장.pdf","id":"2018-s00140"},{"year":2019,"admin":"문재인","text":"아울러 한ㆍ미 농 맹 현안의 합리적 해결 방안을 모색하고 신남방정책-인태전략 간 연계협력 능 글로 벌 이슈에 대한 소동과 공조를 강화해 호혜적ㆍ포괄적 전락농맹 관계를 발전시켜 나갔다.","chapter":1,"section":2,"page":20,"src":"2020 외교백서 국문_제1장.pdf UNICEF(아동 영양공급사업 300만달러 및 홍역예방사업 60만달러)등 여러 UN기구를 활용하여 대북지원 분야를 넓혀나갔다.","chapter":3,"section":4,"page":30,"src":"1998 외교백서 제3장.doc","id":"1997-s00912"},{"year":1998,"admin":"김대중","text":"바. 보 건 우리나라는 보건 및 의료분야에서 국제협력을 강화하기 위해 세계보건기구(World Health Organization：WHO)와의 협력관계를 발전시켜 나가고 있으며, 이를 위해 제 51차 WHO 총회(1998년 5월 11∼16일, 제네바), 제 102차 WHO 집행이사회(1998년 5월 18∼19일, 제네바) 및 제 49차 WHO 서태평양 지역회의(1998년 9월 14∼18일, 마닐라) 등 보건관련 주요 국제회의에 참석하였다.","chapter":5,"section":4,"page":1,"src":"1999 외교백서 제5장.doc","id":"1998-s02005"},{"year":1999,"admin":"김대중","text":"바. 보 　건 우리나라는 보건․의료수준을 높이고 개도국 등에 대한 지원을 통해 국제사회의 보건향상에 기여하기 위해 세계보건기구(World Health Organization : WHO)등 보건분야의 주요 국제기구와 협력을 강화하고 있다.","chapter":5,"section":4,"page":622,"src":"2000 외교백서 제5장.hwp","id":"1999-s02196"},{"year":2000,"admin":"김대중","text":"4. 기타 국제기구 활동 가. 주요 국제기구 참여 활동 우리나라는, 2000년 2월 ECOSOC 조직회의에서 유엔난민고등판무관실(UNHCR) 이사국으로, 2000년 9월 세계보건기구(WHO) 서태평양지역회의에서 WHO 이사국으로, 2000년 4월 UNESCO 총회에서 불법소유문화재반환촉진위원회(ICPRCP) 위원국으로 각각 피선되는 등 경제 사회분야 국제기구에 활발히 참여하고 있다.","chapter":6,"section":2,"page":1,"src":"2001 외교백서 제6장.hwp","id":"2000-s02109"},{"year":2001,"admin":"김대중","text":"사. 보 건 우리나라는 보건․의료수준을 높이고 개도국 등에 대한 지원을 통해 국제사회의 보건향상에 기여하기 위해 세계보건기구(World Health Organization : WHO) 등 보건분야의 주요 국제기구와 협력을 강화하고 있다.","chapter":6,"section":3,"page":1,"src":"2002 외교백서 제6장.hwp","id":"2001-s02325"},{"year":2002,"admin":"김대중","text":"이외에도 WFP를 통해 10만톤의 옥수수를 제공하였으며, WHO를 통한 말라리아 방역사업에 약 67만 달러를 기여하였다.","chapter":3,"section":null,"page":1,"src":"2003 외교백서 제3장.hwp","id":"2002-s00621"},{"year":2003,"admin":"노무현","text":"이 외에 도 우리나라는 세계식량기구(WFP)를 통해 옥수수 10만톤을 지원하 는 한편, 세계보건기구(WHO)를 통한 말라리아 방역사업에 70만 달 러, UNICEF의 어린이 등 취약계층 지원사업에 50만 달러 등을 지 원하였다.","chapter":3,"section":3,"page":24,"src":"2004 외교백서 제3장.pdf","id":"2003-s01103"},{"year":2005,"admin":"노무현","text":"세계보건기구(WHO)는 주로 병원시설 및 필수의약품 지 원, 의약교육 강화 지원, 전염병 통제, 결핵 및 말라리아 퇴치 등의 사업을 해 왔는바, 2005 년에는 약 218만 달러 규모의 지원을 제공하였다.","chapter":2,"section":4,"page":2000,"src":"2006 외교백서 제2장.pdf","id":"2005-s00401"},{"year":2006,"admin":"노무현","text":"세계보건기구(WHO)와 유엔아동 기금(UNICEF)의 산모 및 영유아 보건·영양개선사업, 식수·환경개선 사업, 교육사업에 1990년대 중반부터 매년참여해오고있으며, 2006년에는 WHO와 UNICEF에 각각 1,200만 불과 223만불을 지원하였다.","chapter":2,"section":4,"page":64,"src":"2007 외교백서 제2장.pdf","id":"2006-s00443"},{"year":2007,"admin":"노무현","text":"우리 정부는 세계보건기구(WHO)와 유엔아동기금(UNICEF)의 산모 및 영·유아 보건·영양개선 사업, 식수·환경개선 사업, 교육 사업 등 대북 관련 사업에 1990년대 중반부터 매년 참여해 오고 있으며, 2007년에는 세계보건기구와 유엔아동기금에 각각 938만 불과 315만 불을 지원하였다.","chapter":2,"section":4,"page":20,"src":"2008 외교백서 제2장.pdf","id":"2007-s00398"}],"docCount":65},{"id":"국제협약","kind":"treaty","aliases":["국제 협약","국제협약"],"total":109,"byYear":{"1992":1,"1993":2,"1994":3,"1995":2,"1996":2,"1997":3,"1998":4,"1999":5,"2000":4,"2001":7,"2002":4,"2003":7,"2005":3,"2006":9,"2007":8,"2008":6,"2009":6,"2010":5,"2011":3,"2012":3,"2013":3,"2014":4,"2015":4,"2016":1,"2017":1,"2018":1,"2019":1,"2020":1,"2021":1,"2022":2,"2023":2,"2025":1},"rateByYear":{"1992":7.9,"1993":15.9,"1994":22.5,"1995":14.3,"1996":12.1,"1997":13.7,"1998":15.9,"1999":20.0,"2000":16.0,"2001":22.0,"2002":28.5,"2003":24.1,"2005":25.7,"2006":58.8,"2007":58.6,"2008":38.1,"2009":35.5,"2010":25.1,"2011":16.5,"2012":14.4,"2013":17.0,"2014":17.1,"2015":18.3,"2016":12.5,"2017":7.6,"2018":6.0,"2019":5.5,"2020":4.5,"2021":5.8,"2022":10.5,"2023":9.1,"2025":5.5},"byAdmin":{"노무현":27,"김대중":24,"이명박":23,"김영삼":12,"박근혜":12,"문재인":5,"윤석열":4,"노태우":1,"이재명":1},"focus":0.25,"first":1992,"last":2025,"peak":2006,"peakRate":"2006","docs":[{"year":1992,"admin":"노태우","text":"점차 그 중요성이 부각되고 있는 환경문제는 장기적으로는 하나뿐인 지 구의 생태계를 보전한다는 의미가 있고, 그보다 더 가깝게는 우리의 경제활 동에 큰 영향을 미치는 당면 과제이므로 정부는 환경에 관한 국제협약 제정 과정에 적극 참여하고 있다.","chapter":3,"section":null,"page":66,"src":"1993 외교백서 제3장.pdf","id":"1992-s00717"},{"year":1993,"admin":"김영삼","text":"점차 중요성이 부각되고 있는 환경문제는 하나뿐인 지구의 생태계를 보존 한다는 의미가 있고, 동시에 우리의 경제활동에 큰 영향을 미치는 당면과제 이므로, 정부는 환경관련 국제협약에 적극 가입하여 왔다.","chapter":6,"section":4,"page":19,"src":"1994 외교백서 제6장.pdf","id":"1993-s01141"},{"year":1994,"admin":"김영삼","text":"바. 법률문제 법률위원회 (제6위원회)는 제49차 총회기간중 「유엔요원 및 관련요원의 안전에 관한 협약,과 「국제테러리즘 근절조치에 관한 선언」을 채택하였으 며, 국제형사법원000) 설립 논의를 위한 특위를 95년중 2차례 개최키로 결정함으로써 100) 설립을 위한 기초를 마련하는 실질적 성과를 이룩하였다 또한 비항행 국제수로에 관해서도 96년 51차 총회에서 3주간 실무그룹 을 운영키로 함으로써, 이 분야에 관한 국제협약 채택을 위한 작업의 기초를 마련하였다.","chapter":6,"section":1,"page":13,"src":"1995 외교백서 제6장.pdf","id":"1994-s01126"},{"year":1995,"admin":"김영삼","text":"〉 5. 국제 비확산체제 참여 . 세계적 차원에서의 대량파괴무기 확산방지를 위하여 국제협약이라는 일반적 도구와 병행하여 대량파괴무기 제조에 직ㆍ간접으로 연관이 있는 물품, 기술 및 장비를 공급하는 국가들에 의한 수출통제체제가 설치, 운영되고 있다.","chapter":6,"section":3,"page":29,"src":"1996 외교백서 제6장.pdf","id":"1995-s01313"},{"year":1996,"admin":"김영삼","text":"'1973년 선박으로부터의 해양오염방지를 위한 국제협약에 관한 1978년 의정서 (약칭 73/78 해양오염방지협약 또는 MARPOL 73/78) '의 선택부 속서인 제 3 및 제 5부속서에 가입하였으며, 동 부속서 가입으로 해양오 염 방지 및 해양환경보호를 위한 법적 기반을 강화한 것으로 평가할 수 있다.","chapter":4,"section":4,"page":88,"src":"1997 외교백서 제4장.pdf","id":"1996-s01391"},{"year":1997,"admin":"김영삼","text":"두만강개발계획은 초기단계에서부터 남북한간 공동논의를 통해 설립된 최초의 국제협약으로 이미 사업추진의 법적, 제도적 기반이 마련되었는바, 유역 3개국의 법·제도 정비 및 조화, 인프라 건설을 통해 투자환경이 개선되면 개발이 가속화 될 것으로 전망된다.","chapter":3,"section":4,"page":30,"src":"1998 외교백서 제3장.doc","id":"1997-s00936"},{"year":1998,"admin":"김대중","text":"UNEP와 각국 정부는 POPs의 유해성으로부터 인간과 환경을 보호하기 위해 1998년 6월부터 총 5차례의 정부간 협상회의를 개최하며 2000년까지 국제협약을 채택하기로 하였다.","chapter":5,"section":4,"page":1,"src":"1999 외교백서 제5장.doc","id":"1998-s02123"},{"year":1999,"admin":"김대중","text":"특히 우리나라는 유엔 범죄예방 및 형사사법위원회, 마약위원회 등 주요 국제기구의 위원국으로서 관련 국제회의에 적극 참여하여 범죄, 마약 등의 문제에 효과적으로 대처하기 위한 국제협력방안 마련을 위해 노력하고 있으며, 유엔 국제조직범죄협약 등 관련 국제협약의 성안과정에서도 우리의 입장을 적극 개진하고 있다.","chapter":2,"section":2,"page":1,"src":"2000 외교백서 제2장.hwp","id":"1999-s00673"},{"year":2000,"admin":"김대중","text":"1998년 6월 카나다 몬트리올에서 개최된 제1차 협상회의에서 12개 POPs물질의 규제를 위한 국제협약을 2000년까지 마련한다는 데 모든 국가들에 의해 컨센서스가 형성되었으며, UNEP이 선정한 12개 물질 외에 별도의 전문가그룹 회의를 통해 POPs 추가선정기준 및 절차를 마련해 나가기로 하였다.","chapter":4,"section":3,"page":2000,"src":"2001 외교백서 제4장.hwp","id":"2000-s01326"},{"year":2001,"admin":"김대중","text":"북한은 또한 11월 테러자금 조달 억제를 위한 국제협약과 인질억류 방지를 위한 국제협약에 서명하였다.","chapter":1,"section":2,"page":1,"src":"2002 외교백서 제1장.hwp","id":"2001-s00283"},{"year":2002,"admin":"김대중","text":"특히, 비동맹측의 다자주의 신장을 촉구하는 결의안과 미국의 비확산 의무이행을 강조하는 결의안 논의과정에서 강경노선의 비동맹 국가들이 국제협약 불이행 문제 해결에 있어 다자적 접근 이외의 대안을 부인함에 따라 서방그룹과 대립을 초래하였다.","chapter":6,"section":null,"page":1,"src":"2003 외교백서 제6장.hwp","id":"2002-s01176"},{"year":2003,"admin":"노무현","text":"우리 재외국민 과 해외 시설에 대한 테러위협 가능성에 철저한 대비 노력을 기울였으 며, 12개 대테러 국제협약을 모두 비준하였습니다.","chapter":null,"section":null,"page":2,"src":"2004 외교백서 발간사_목차.pdf","id":"2003-s00010"},{"year":2005,"admin":"노무현","text":"2) 우리 정부의 활동 우리 정부는 모든 주요 군축·비확산 관련 국제협약과 다자 수출통제체제의 회원국으로 IAEA의 전면 안전조치협정(CSA)을 강화한 것으로 1997년 채택되었다.","chapter":3,"section":3,"page":5,"src":"2006 외교백서 제3장.pdf","id":"2005-s00737"},{"year":2006,"admin":"노무현","text":"2) 우리 정부의 활동 우리 정부는 모든 주요 군축·비확산 관련 국제협약과 다자 수출통제체제의 회원국으로서, WMD 확산이 국제안보와 국가 안보에 직접적인 위협이 된다는 판단 아래 이러한 국제사회의 노력에 적극적으로 동참하고 있다.","chapter":3,"section":4,"page":46,"src":"2007 외교백서 제3장.pdf","id":"2006-s00756"}],"docCount":69},{"id":"포용정책","kind":"policy","aliases":["포용 정책","포용정책"],"total":106,"byYear":{"1994":2,"1996":2,"1998":44,"1999":39,"2000":15,"2001":3,"2006":1},"rateByYear":{"1994":15.0,"1996":12.1,"1998":175.2,"1999":156.0,"2000":60.0,"2001":9.4,"2006":6.5},"byAdmin":{"김대중":101,"김영삼":4,"노무현":1},"focus":0.95,"first":1994,"last":2006,"peak":1998,"peakRate":"1998","docs":[{"year":1994,"admin":"김영삼","text":"이러한 점을 감안, 클린턴 행정부는 대중국 최혜국대우 부여에 인권문제를 연계하는 정책을 철폐 (1994. 5) 함 과 아울러 Perry 국방장관의 중국 방문(1994.10) 을 계기로 미ㆍ중간 _ 새로운 관계모색 등 대중국 포용정책을 펴고 있다.","chapter":2,"section":2,"page":8,"src":"1995 외교백서 제2장.pdf","id":"1994-s00204"},{"year":1996,"admin":"김영삼","text":"김대통령은 경축사에서 우리가 0 북한의 불안정이 아니라 「안정』 을 @ 북한의 고립 이 아니라 「국제사회 참여」 를 (3) 일방적 통일이 아니라 점진적인 「합의통 일』 을 추구하고 있음을 밝힘으로써, 우리가 흡수통일을 추구한다는 일부 의 오해를 불식시키는 한편, 적극적인 대북 포용정책을 천명하였다.","chapter":3,"section":2,"page":18,"src":"1997 외교백서 제3장.pdf","id":"1996-s00862"},{"year":1998,"admin":"김대중","text":"남북한 관계에 있어서는 확고한 안보태세를 바탕으로 한반도 냉전구조를 해체하고 남북한 평화공존을 목표로 하는 대북 포용정책을 추진하는 한편, 북한의 도발에 대해서는 강력히 대처하였습니다.","chapter":null,"section":null,"page":1,"src":"1999 외교백서 머리말.doc","id":"1998-s00004"},{"year":1999,"admin":"김대중","text":"한 2000년 6월 분단 반세기만에 실현된 역사적 인 남북 정상희담으로 그동안 '국민의 정부' 가 일관되게 추진해온 대북 포용정책이 결실 을 보았습니다.","chapter":null,"section":null,"page":1,"src":"2000 외교백서 머리말.pdf","id":"1999-s00002"},{"year":2000,"admin":"김대중","text":"3. 국제사회의 협력과 지지 가. 한 미 협력 한 미 양국은 2000년중 3회의 정상회담과 4회의 외무장관회담 그리고 6회의 한 미 일 대북정책조정그룹(Trilateral Coordination & Oversight Group : TCOG) 회의 등 고위급 실무차원의 협의를 통해 전통적인 한 미 동맹관계를 강화하기 위한 노력을 계속하는 동시에 한반도 냉전구조 종식과 평화공존 체제 구축을 위한 대북 포용정책을 공동으로 추진하였다.","chapter":3,"section":1,"page":1,"src":"2001 외교백서 제3장.hwp","id":"2000-s00790"},{"year":2001,"admin":"김대중","text":"2001년중 4차례 개최된 대북정책조정그룹(TCOG) 회의를 통해 한․일 양국은 대북 포용정책의 일관성 있는 추진이 한반도와 동북아지역의 안정과 평화에 긴요하다는데 인식을 같이 하는 한편, 남북간 교류․협력과 일․북관계 개선과정이 상호 긍정적인 영향을 미칠 수 있도록 한․일간 긴밀한 공조체제를 계속 유지해 나간다는 기존의 입장을 재확인하였다.","chapter":3,"section":1,"page":1,"src":"2002 외교백서 제3장.hwp","id":"2001-s00947"},{"year":2006,"admin":"노무현","text":"우리 정부는 개성공단 추가분양 유보, 금강산 체험학습에 대한 보조금 지급 중단 등 경협 사업의 추진 속도를 조절하면서도 대북 포용정책의 기조를 유지하는 가운데 남북 교류협력의 모멘텀을 유지하기 위한 노력을 지속해 왔다.","chapter":2,"section":4,"page":62,"src":"2007 외교백서 제2장.pdf","id":"2006-s00434"},{"year":1994,"admin":"김영삼","text":"그러 나 Clinton 미행정부의 대중국 최혜국대우 부여와 인권문제의 연계 조치 철폐, 페리 국방장관의 중국방문을 계기로 형성된 미ㆍ중 신전략관계의 모색 등 일련의 대중국 포용정책은 중국이 미국에 대한 부정적 시각에서 벗어나는데 다소 기여할 것으로 보인다.","chapter":2,"section":2,"page":10,"src":"1995 외교백서 제2장.pdf","id":"1994-s00218"},{"year":1996,"admin":"김영삼","text":"정부 의 이러한 포용정책은 우리 대북정책의 기본이기는 하나, 잠수함 사건에 서 나타난 바와 같이 우리의 포용정책이 제기능을 발휘하기 위하여는 북한의 태도에 근본적 변화가 있어야 할 것이다, 3. 국제사회의 대북지원 참여 제2절 우리의 남북관계 개선 노력 / 139 1996년 초반 세계식량계획(\\##), 국제적십자연맹(18) 등 국제기 구들과 가 국제개발처 (054ㅅ11)) 는 북한이 1995년 수해로 인한 곡물 생산 량 감소로 1996년에도 상당량의 식량 도입이 필요하다는 내용의 보고서를 발표하였다.","chapter":3,"section":2,"page":18,"src":"1997 외교백서 제3장.pdf","id":"1996-s00863"},{"year":1998,"admin":"김대중","text":"이러한 대북 포용정책의 일관된 추진은 미국 및 일본과의 긴밀한 공조와 특히, 한반도 분단이래 처음 으로 우리의 대북정책에 대한 중국과 러시아의 지지를 확보함으로써 가능하였습니다.","chapter":null,"section":null,"page":1,"src":"1999 외교백서 머리말.doc","id":"1998-s00005"},{"year":1999,"admin":"김대중","text":"1999년도에 외교통상부는 5대 외교정책 목표로서, 대북 포용정책 의 기조하에 포괄적 접근방안을 통한 한반도의 냉전종식과 남북 평 화공존을 모색하는 외교, 경제위기를 극복하고 경제성장의 잠재력 확충을 위해 시장 경제와 민주주의를 기반으로 하는 적극적이고 개 방 지향적인 경제ㆍ통상 외교, 인류의 공동 번영을 위하여 국제사회 에 기여하는 외교, 우리문화의 세계로의 발현을 추구하는 문화 외 교, 그리고 재외국민 보호 지원 외교를 설정하고 이를 적극 추진하 였습니다.","chapter":null,"section":null,"page":1,"src":"2000 외교백서 머리말.pdf","id":"1999-s00006"},{"year":2000,"admin":"김대중","text":"그러나, 중국의 신중하고도 조심스러운 입장 표명은 1998년을 계기로 보다 적극적으로 변화하여 우리 정부의 대북 포용정책 등 한반도 정책을 적극적으로 지지하기 시작하였다.","chapter":3,"section":1,"page":1,"src":"2001 외교백서 제3장.hwp","id":"2000-s00812"},{"year":2001,"admin":"김대중","text":"2001년 9일 남북대화가 재개되었을 때도 러시아 외무부는 이를 환영하는 성명을 발표하였으며 2001년 10월 APEC 정상회의 계기 한․러 정상회담에서도 러시아측은 대북 포용정책에 대한 지지와 한반도 평화와 안정을 위한 건설적 기여 약속을 거듭 확인하였다.","chapter":3,"section":1,"page":1,"src":"2002 외교백서 제3장.hwp","id":"2001-s00967"},{"year":1998,"admin":"김대중","text":"우선 대북 포용정책의 일관된 추진과 주변 4강과의 협력관계 강화를 통해 한반도를 포함한 동북아의 평화와 안정을 유지하는 한편, 시장경제의 확산과 급속한 국제질서의 변화과정에 능동적으로 대처해 나가야 할 것입니다.","chapter":null,"section":null,"page":1,"src":"1999 외교백서 머리말.doc","id":"1998-s00015"}],"docCount":17},{"id":"우크라이나전쟁","kind":"event","aliases":["우크라이나 전쟁","우크라이나전쟁"],"total":88,"byYear":{"2022":21,"2023":25,"2024":25,"2025":17},"rateByYear":{"2022":110.8,"2023":113.3,"2024":123.3,"2025":93.1},"byAdmin":{"윤석열":71,"이재명":17},"focus":0.81,"first":2022,"last":2025,"peak":2023,"peakRate":"2024","docs":[{"year":2022,"admin":"윤석열","text":"외교백서 2022년도 국제정세와 외교활동 인사말 2022년 전 세계는 미중 간 전략경쟁 심화, 우크라이나 전쟁, 글로벌 팬데믹, 그 과정에 서 강화된 자국중심주의와 공급망 교란 등 복합위기 상황을 경험하며, 70년 넘게 유지되 었던 전후 질서의 재편을 목도했습니다.","chapter":null,"section":null,"page":1,"src":"2022년도 국제정세와 외교활동(외교백서).pdf","id":"2022-s00001"},{"year":2023,"admin":"윤석열","text":"외교백서 2023년도 국제정세와 외교활동 인사말 2023년은 미중 전략경쟁과 우크라이나 전쟁이 지속되는 가운데 이스라엘과 하마스 간 무력충돌까지 겹쳐, 국제정세의 불안정성이 한층 심화된 한 해였습니다.","chapter":null,"section":null,"page":1,"src":"2023년도 국제정세와 외교활동.pdf","id":"2023-s00001"},{"year":2024,"admin":"윤석열","text":"미중 전략경쟁은 한층 치열하게 전개되었고, 우크라이나 전쟁이 장기화하면 서 시작된 러북 불법 군사협력은 냉전 시대에도 목도하지 못했던 북한의 러시아 파병으 로까지 이어져 인태 지역과 유럽 간 안보 연계가 심화되고 있음을 여실히 보여주었습니 다.","chapter":null,"section":null,"page":2,"src":"2024년도 국제정세와 외교활동.pdf","id":"2024-s00002"},{"year":2025,"admin":"이재명","text":"미국 트럼프 2기 행정부 출범과 더불어 경제·안보·기술 질서 등의 불확실성이 한층 확대되었으며, 우크라이나 전쟁과 중동 분쟁 등 주요 무력 충돌이 장기화되고, 미국이 이란의 핵 시설을 직접 폭격하였다.","chapter":1,"section":1,"page":8,"src":"2025년도 국제정세와 외교활동.pdf","id":"2025-s00002"},{"year":2022,"admin":"윤석열","text":"여덟째, 러시아는 우크라이나 전쟁 발발 이후 고강도 제재에 동참한 국가들을 ‘비우호 국’으로 지정하고 대응 조치를 취하였으며, 러시아와 미국, EU 등 서방국가와의 대립은 심화되고 있다.","chapter":1,"section":null,"page":10,"src":"2022년도 국제정세와 외교활동(외교백서).pdf","id":"2022-s00058"},{"year":2023,"admin":"윤석열","text":"2년차에 접 어든 우크라이나 전쟁의 조기 종식과 평화 회복을 위한 국제사회의 노력에 적극 동참하 기 위해 대통령의 우크라이나 방문 계기에 「우크라이나 평화연대 이니셔티브」를 발표(7 월)하였고, 한편으로는 러시아에 진출한 우리 국민과 기업을 보호하기 위한 노력을 지속 적으로 경주하였습니다.","chapter":null,"section":null,"page":2,"src":"2023년도 국제정세와 외교활동.pdf","id":"2023-s00009"},{"year":2024,"admin":"윤석열","text":"3년차에 접어든 우크라이나 전쟁의 조기 종식과 평화 회복을 위해 인도적·재정적 지원을 포함한 「우크라이나 평화 연대 이니셔티브」 후속 조치를 적극 이행하는 한편, 러 북 군사협력 등 우리의 안보 이익에 직결된 사안에 대해서는 단호히 대응하면서, 러시아 와의 관계를 전략적으로 관리하기 위해 노력하였습니다.","chapter":null,"section":null,"page":2,"src":"2024년도 국제정세와 외교활동.pdf","id":"2024-s00018"},{"year":2025,"admin":"이재명","text":"우크라이나 전쟁이 4년 차를 맞이하며 장기화 국면에 접어든 가운데, 트럼프 행정부 출범 이후 종전･휴전 논의가 본격화되었으나 영토 및 안전보장 등 핵심 쟁점을 두고 러시아-우크라이나 간 이견이 지속되었다.","chapter":1,"section":1,"page":8,"src":"2025년도 국제정세와 외교활동.pdf","id":"2025-s00008"},{"year":2022,"admin":"윤석열","text":"한편 우크라이나 전쟁 발발 이후 중앙아시아가 러시아의 대체 시장으로 주목받게 되면서 중앙아 지역 진출 외국 기업이 증가하는 양상을 보였으 며, 전쟁의 영향으로 러시아인들의 중앙아 이주가 대폭 증가하였다.","chapter":1,"section":null,"page":10,"src":"2022년도 국제정세와 외교활동(외교백서).pdf","id":"2022-s00060"},{"year":2023,"admin":"윤석열","text":"수단 내전, 우크라이나 전쟁 장기화와 이스라엘-하마스 무력 충돌로 촉발된 중동정 세 악화, 대만해협 등을 둘러싼 양안관계 긴장 등 지구촌 곳곳이 긴장과 불안에 잠긴 지정 학적 대전환을 겪었으며, 이러한 다양한 위기와 도전의 여파는 한반도에도 영향을 미치게 되었다.","chapter":1,"section":1,"page":8,"src":"2023년도 국제정세와 외교활동.pdf","id":"2023-s00034"},{"year":2024,"admin":"윤석열","text":"우크라이나 전쟁이 3년차에 접어들며 소모전으로 장기화되는 가운데, 전장은 러시아 쿠르스크 지역으로 확대되고 우크라이나는 전황 타개를 위해 HIMARS 등 다연장 로켓포, ATACMS 등 지대지 미사일을 포함한 주요 무기체계 확보를 위한 노력을 경주하였다.","chapter":1,"section":1,"page":10,"src":"2024년도 국제정세와 외교활동.pdf","id":"2024-s00063"},{"year":2025,"admin":"이재명","text":"아울러, 서반구 지역에서 트럼프식 먼로주의 부활을 통한 역내 패권 강화, 인태지역에서 대중 억제 전략 중심을 기반으로 대만해협 및 남중국해에서의 평화 안정 유지, 유럽 지역에서 러시아와의 전략적 안정성에 기반한 우크라이나 전쟁 종전을 핵심 이익으로 규정하였다.","chapter":1,"section":1,"page":11,"src":"2025년도 국제정세와 외교활동.pdf","id":"2025-s00041"}],"docCount":12},{"id":"기후변화협약","kind":"treaty","aliases":["기후변화 협약","기후변화협약"],"total":87,"byYear":{"1991":3,"1992":7,"1993":6,"1994":3,"1995":2,"1996":2,"1997":6,"1998":7,"1999":8,"2000":6,"2001":10,"2002":1,"2003":2,"2005":2,"2006":1,"2007":3,"2008":1,"2009":6,"2010":2,"2011":1,"2012":1,"2015":5,"2024":1,"2025":1},"rateByYear":{"1991":25.3,"1992":55.0,"1993":47.6,"1994":22.5,"1995":14.3,"1996":12.1,"1997":27.5,"1998":27.9,"1999":32.0,"2000":24.0,"2001":31.5,"2002":7.1,"2003":6.9,"2005":17.2,"2006":6.5,"2007":22.0,"2008":6.4,"2009":35.5,"2010":10.1,"2011":5.5,"2012":4.8,"2015":22.9,"2024":4.9,"2025":5.5},"byAdmin":{"김대중":32,"김영삼":19,"이명박":11,"노태우":10,"노무현":8,"박근혜":5,"윤석열":1,"이재명":1},"focus":0.37,"first":1991,"last":2025,"peak":2001,"peakRate":"1992","docs":[{"year":1991,"admin":"노태우","text":"몬트리올의정서는 규제물질인 프레온가스와 할론의 생산ㆍ소비의 감축 스케즐과 비가입국에 대한 교역 규제를 규정하고 있고, 현재 체결교섭중인 기후변화협약은 지구온난화 방지를 위하여, 화석연료의 사용규제와 에너지의 국별 사용한도를 설정하는 문제에 대한 격렬한 토의가 진행되고 있다.","chapter":3,"section":null,"page":43,"src":"1992 외교백서 제3장.pdf","id":"1991-s00704"},{"year":1992,"admin":"노태우","text":"100)회의를 계기로 1989년부터 2년간 유엔을 중심으로 개최되었던 UNCED 준비회의, 기후변화협약 및 생물다양성협약 채택을 위한 정부간 협 상위원회 회의가 종결되었다.","chapter":3,"section":null,"page":46,"src":"1993 외교백서 제3장.pdf","id":"1992-s00611"},{"year":1993,"admin":"김영삼","text":"그 결과 빠르면 1994년 하반기경에 발효될 것이라고 예상되던 기후변화협약 (94.3.21 발효 예정), 생물다양성 협약(93.12.29 발효)등이 예상을 앞당겨 발효하게 되었다.","chapter":5,"section":4,"page":46,"src":"1994 외교백서 제5장.pdf","id":"1993-s01017"},{"year":1994,"admin":"김영삼","text":"2. 지구환경협력에의 적극적 동참 가. 지구몬난화 방지 1994년 2월 및 8월에 1995년 3월 개최예정인 기후변화협약 제1차 당사 : 국총회를 _대비한 _제9차, 。. 제10차 、 정부간_ 협상위원회 회의 (Intergovernmental Negotiating Committee) 가 개최되었다.","chapter":4,"section":5,"page":47,"src":"1995 외교백서 제4장.pdf","id":"1994-s00963"},{"year":1995,"admin":"김영삼","text":"이에 따라 유엔 등 각종 국제기구 및 기후변화협약, 생물다양성 협약 ㄱ 등의 각종 환경협약 차원에서, 그리고 소지역별 차원에서 04081 결과 의 이행을 위한 논의가 이루어졌다.","chapter":4,"section":5,"page":35,"src":"1996 외교백서 제4장.pdf","id":"1995-s00985"},{"year":1996,"admin":"김영삼","text":"1996년 5월에는 무역위원회의 정책검토 및 환경위원회의 심사가 진행 되었는데 기후변화협약 등 0801 가입후 한국의 개도국지위 유지문제가 중점 토의되었으나, 0801 가입후에도 개별협정에서의 한국의 개도국 지위문제는 계속 유지하기로 합의하여 0801) 가입에 따른 경제적 충격을 최소화하였다.","chapter":4,"section":1,"page":5,"src":"1997 외교백서 제4장.pdf","id":"1996-s00930"},{"year":1997,"admin":"김영삼","text":"한편 환경분야에서는 1992년 리우 환경정상회의 이후 5년만에 지구환경문제를 재점검하는 유엔환경특총에 김영삼 대통령이 참석하여 환경문제 해결노력에 동참하려는 우리 정부의 의지를 표시하였고, 97년 12월 토쿄 기후변화협약 채택과정에도 계속 참여하여 환경분야의 국제규범작성 노력에 기여하였다.","chapter":2,"section":2,"page":1,"src":"1998 외교백서 제2장.doc","id":"1997-s00679"},{"year":1998,"admin":"김대중","text":"Clinton 대통령의 아시아 순방기간중에 이루어진 1998년 11월 정상회담에서는 미측으로부터 각 분야에 걸친 개혁노력에 대한 평가가 있었으며, 그 외에 Y2K, 전자상거래, 기후변화협약 등의 문제에 있어서 양국간 협력 필요성에 동감하였다.","chapter":4,"section":1,"page":1,"src":"1999 외교백서 제4장.doc","id":"1998-s01043"},{"year":1999,"admin":"김대중","text":"특히, 양국은 기후변화협약 공동 협력사업 추진의 일환으로 온실가스 절감관련 협력사업 추진을 위한 실무작업반 구성 및 개최에 합의하였으며, 이에 따라 2000년 2월 한․카 온실가스 절감 실무대책반 회의가 개최되어 양국간 및 민간 차원의 온실가스 절감관련 협력 방안이 논의된 바 있다.","chapter":4,"section":1,"page":58,"src":"2000 외교백서 제4장.hwp","id":"1999-s01067"},{"year":2000,"admin":"김대중","text":"우리나라는 이러한 국제환경보전 논의에 적극 참여하기 위해 기후변화협약, 생물다양성협약, 몬트리올의정서, 바젤협약 등의 주요 국제환경협약에 가입하여 관련 후속이행 논의에 적극 참여하고 있으며, 국제산림보전, 유해 화학물질의 국가간 이동통제 등 새로운 분야에서의 협약채택 협상에도 참여해왔다.","chapter":4,"section":3,"page":2000,"src":"2001 외교백서 제4장.hwp","id":"2000-s01229"},{"year":2001,"admin":"김대중","text":"우선 미국의 경우, 2001년 1월 취임한 Bush 행정부는 동맹 우선의 대외정책 노선을 표방하고 유엔 활동, 기후변화 협약 등의 다자 문제에 있어서는 소극적인 자세를 견지해 왔다.","chapter":1,"section":1,"page":1,"src":"2002 외교백서 제1장.hwp","id":"2001-s00110"},{"year":2002,"admin":"김대중","text":"4) 지구환경금융(GEF)에서의 환경 재원 마련 동향 주몺봍 봊몼딘 봊몼딘 우리나라는 기후변화협약, 생물다양성협약, 몬트리올의정서, 바젤협약, 유해 화학물질의 국가간 이동 통제 등의 주요 국제환경협약 관련 논의에 적극 참여하는 한편 바이오안전성, 국제산림보전, 잔류성 유기오염 물질의 통제 등 새로운 분야에서의 협약채택 협상에도 참여해 왔다.","chapter":4,"section":3,"page":1,"src":"2003 외교백서 제4장.hwp","id":"2002-s00831"},{"year":2003,"admin":"노무현","text":"한편 정부는 무역환경협상이 우리 산업계에 미치는 영향을 파악하 276 / 제 4 장 경제∙통상 외교 고 우리 협상 대응방안 모색에 민간참여를 도모하기 위해 DDA 환경 분야 민관 합동포럼 산하에 정부관계자, 학계, 업계, 시민단체가 참 여하는 주제별 실무회의(Working Group)를 운영하기로 하였으며, 기후변화협약과 WTO 규범과의 관계 등을 주제로 9월 및 10월에 회 의를 개최하였다.","chapter":4,"section":3,"page":71,"src":"2004 외교백서 제4장.pdf","id":"2003-s01600"},{"year":2005,"admin":"노무현","text":"해외 의존도가 매우 높은 에너지·자원의 안정적인 확보를 위한 자원외교, 기후변화협약 관련 대응을 위한 환경외교도 강화하였다.","chapter":1,"section":2,"page":14,"src":"2006 외교백서 제1장.pdf","id":"2005-s00177"}],"docCount":50},{"id":"외환위기","kind":"event","aliases":["외환 위기","외환위기"],"total":77,"byYear":{"1997":16,"1998":18,"1999":8,"2000":9,"2001":9,"2002":4,"2003":8,"2008":1,"2009":1,"2011":1,"2012":1,"2018":1},"rateByYear":{"1997":73.2,"1998":71.7,"1999":32.0,"2000":36.0,"2001":28.3,"2002":28.5,"2003":27.5,"2008":6.4,"2009":5.9,"2011":5.5,"2012":4.8,"2018":6.0},"byAdmin":{"김대중":48,"김영삼":16,"노무현":8,"이명박":4,"문재인":1},"focus":0.62,"first":1997,"last":2018,"peak":1998,"peakRate":"1997","docs":[{"year":1997,"admin":"김영삼","text":"이처럼 각 세력들이 자국의 실리를 위한 적극적인 정책을 추진하면서 새로운 국제질서 형성을 위한 축을 형성해 가는 가운데 동아시아 지역은 97년 7월 태국에서 발생된 외환위기가 역내 각국으로 파급되는 경제적 어려움을 겪게 되었다.","chapter":1,"section":1,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00042"},{"year":1998,"admin":"김대중","text":"말레이시아는 외환위기 해법을 둘러싸고 Mahathir 총리와 Anwar 부총리간 갈등이 표출되어 1998년 9월 Anwar 부총리가 해임, 구속되었으며 이어 외환통제조치가 발표되는 등 정치.경제정세가 안정되지 못하였으나 1998년 11월 APEC 정상회의를 무난히 치루어 냈다.","chapter":1,"section":3,"page":1,"src":"1999 외교백서 제1장.doc","id":"1998-s00267"},{"year":1999,"admin":"김대중","text":"이와 같이 대북포용정책을 통해 한반도 정세를 안정적으로 관리함으로써 외환위기 등 경제난 극복에도 기여할 수 있었다.","chapter":3,"section":1,"page":245,"src":"2000 외교백서 제3장.hwp","id":"1999-s00697"},{"year":2000,"admin":"김대중","text":"2. 개방 경제에 입각한 통상외교 내실화 정부는 외환위기의 극복과 경제재도약에서 얻은 자신감과 그간 축적된 통상외교역량을 바탕으로 세계화 개방화시대에 부합하는 '개방된 통상국가의 지향'이라는 목표 하에 양자 다자 및 지역차원에서 활발한 대외경제 통상외교를 전개하고 수출증대 및 투자유치 확대를 위한 각종 세일즈외교 활동을 강화하는 등 통상외교의 내실화에 주력하였다.","chapter":2,"section":2,"page":1,"src":"2001 외교백서 제2장.hwp","id":"2000-s00697"},{"year":2001,"admin":"김대중","text":"브라질은 정치불안과 과도한 외채 및 만성적 재정적자 등 구조적인 경제 취약성이 노정된 상황에서 동남아 및 러시아 외환위기의 여파로 경제가 악화되어 1998년 12월 IMF 관리체제로 편입되는 등 최대의 경제 위기에 직면하였다.","chapter":1,"section":3,"page":1,"src":"2002 외교백서 제1장.hwp","id":"2001-s00538"},{"year":2002,"admin":"김대중","text":"한편, 아시아 외환위기 이래 침체되었던 경기는 최근 유가상승 및 아시아 경기의 회복추세에 따라 석유수출이 증가하고 2002년부터 정부 재정지출이 확연히 늘어 경기회복조짐을 보이고 있다.","chapter":1,"section":3,"page":10,"src":"2003 외교백서 제1장.hwp","id":"2002-s00251"},{"year":2003,"admin":"노무현","text":"특히, 러시아 경제는 약 7% 내외의 성장 률을 기록함으로써 5년간의 높은 성장세를 이어갈 수 있었는데, 이는 1998년 외환 위기에 따른 루블화의 평가절하와 이에 따른 수입대체 효과, 석유∙가스 등 주요 수출 상품의 세계적 고가 추세, 경제 개혁, 엄격한 재정 정책, 비용 감소를 가져온 실질 임금의 하락 등에서 비 롯된 결과이다.","chapter":1,"section":1,"page":10,"src":"2004 외교백서 제1장.pdf","id":"2003-s00096"},{"year":2008,"admin":"이명박","text":"한편 금번 정상회의 계기에 개최된‘APEC CEO Summit’에서 이명박 대통령은 기조 연설을 통하여 최근의 세계 금융위기 해소를 위한 지역적 및 세계적 차원의 정책 공조 필 요성을 강조하였고, 위기 대응의 한 해법으로서 1997년 동아시아의 외환위기 극복 경험 을 소개하였다.","chapter":3,"section":5,"page":34,"src":"2009 외교백서_제3장.pdf","id":"2008-s00695"},{"year":2009,"admin":"이명박","text":"이명박 대통령은 런던 정상회의에서 거시경제정책공조, 보호주의 저지 공조 노력과 함께 금융시장 안정과 관련하여 1990년 말 우리나라 외환위기 시 부실 채권 처리경험과 교훈을 공유하고, 금융권의 부실자산 처리 원칙을 수립하여 국제적으로 공조해나갈 것을 역설하였으며 이는 G20 정상들의 큰 호응을 얻었다.","chapter":4,"section":1,"page":3,"src":"2010 외교백서_제4장.pdf","id":"2009-s00689"},{"year":2011,"admin":"이명박","text":"우선 유럽재정위기 해결을 위해 우리나라는 1998년 외환위기 당시 우리나라의 과감 한 구조개혁 경험을 소개하며 그리스 등 유로지역 당사국들의 단호한 구조조정을 요구하 고 또다른 위기를 예방할 수 있는 IMF 재원확충이 필요하다는 주장을 제기하여 합의도출 에 기여하였다.","chapter":4,"section":1,"page":119,"src":"2012 외교백서 04.pdf","id":"2011-s00750"},{"year":2012,"admin":"이명박","text":"이명박 대통령은 1997년도 외환위기를 성공적으로 극복한 경험을 토대로 유럽의 위기 당사국들이 과감하게 구조개혁을 해야 한다는 것과 유로존의 불완전한 시스템을 개혁해 나가야 할 필요성을 강조하였다.","chapter":4,"section":1,"page":161,"src":"2013 외교백서_제4장.pdf","id":"2012-s01030"},{"year":2018,"admin":"문재인","text":"2) 제21차 아세안+3 정상회의(아세안 10개국 + 한·일·중) 참석 11월 15일에 개최된 제21차 아세안+3 정상회의에서 문 대통령과 아세안 10개국 및 일본, 중국 정상은 1997년 아시아 외환위기 극복의 구심점 역할을 한 아세안+3가 그 간 금융, 식량안보, 무역자유화 등 다양한 분야에서 의미 있는 성과를 낸 점을 높이 평가하고, 최근 보호무역주의 및 반세계화 기조가 퍼지고 있는 가운데 상생번영의 협 력체로서 아세안+3의 역할을 더욱 확대해야 한다는 점에 공감했다.","chapter":5,"section":1,"page":176,"src":"2019 외교백서 국문_제5장.pdf","id":"2018-s01190"},{"year":1997,"admin":"김영삼","text":"경제면에서도 중국은 동아시아 외환위기의 여파에도 불구, 97년은 고성장(8.8%), 저물가(0.8%), 국제수지(403억달러 흑자) 등 3가지면에서 양호한 경제 실적을 거양하였으며, 외국인 투자도 미국 다음으로 세계 2위인 470억 달러(실제투자기준)를 유치하고, 외환보유고도 1,400억 달러 상당에 달함으로써 안정적인 경제성장을 실현하였다.","chapter":1,"section":3,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00195"},{"year":1998,"admin":"김대중","text":"1998년 파키스탄 경제는 핵실험에 따른 서방의 경제제재와 국제금융기관의 금융지원 중단으로 심각한 외환위기를 겪었으며, 채무불이행 상황에 직면하기도 하였다.","chapter":1,"section":3,"page":1,"src":"1999 외교백서 제1장.doc","id":"1998-s00295"}],"docCount":26},{"id":"신북방정책","kind":"policy","aliases":["신북방 정책","신북방정책"],"total":72,"byYear":{"2017":21,"2018":14,"2019":21,"2020":10,"2021":6},"rateByYear":{"2017":158.7,"2018":83.5,"2019":115.8,"2020":44.6,"2021":34.9},"byAdmin":{"문재인":72},"focus":1.0,"first":2017,"last":2021,"peak":2017,"peakRate":"2017","docs":[{"year":2017,"admin":"문재인","text":"외교 다변화라는 기조 아래 '신북방정책'과 '신남방정책'을 표방하고 우리 외교지평 을 확대하고자 했으며, 동시에 국제사회의 책임 있는 일원으로서 다양한 글로벌 이 슈들에 대한 우리의 역할과 기여도 보다 심화해 나갔습니다.","chapter":null,"section":null,"page":2,"src":"2018 외교백서 국문_발간사 목차.pdf","id":"2017-s00008"},{"year":2018,"admin":"문재인","text":"특히 2017년 9월 문재인 대통령의 러시아 방문 및 11월 동남아시아 순방 에서 각각 천명한 신북방정책과 신남방정책을 실현하기 위해 범정부 차원의 노력을 적 극 경주했다.","chapter":1,"section":2,"page":21,"src":"2019 외교백서 국문_제1장.pdf","id":"2018-s00137"},{"year":2019,"admin":"문재인","text":"주변 4국과 전략적 소통을 통해 협력외교를 확대하고, 신남방ㆍ신북방정책 등 외교 다변화 노력노 더욱 심화했습니다.","chapter":null,"section":null,"page":2,"src":"2020 외교백서 국문_표지, 발간사, 목차.pdf","id":"2019-s00008"},{"year":2020,"admin":"문재인","text":"이와 함께 정부는 2020년 ‘신북방 협력의 해’를 맞아 러시아 및 중앙아시아 5개국 과 우호협력 관계를 지속 발전시키고, 신북방정책의 성과가 가시화될 수 있도록 힘썼 다.","chapter":1,"section":null,"page":24,"src":"2021 외교백서(국문).pdf","id":"2020-s00197"},{"year":2021,"admin":"문재인","text":"신북방정책 신북방정책은 유라시아 지역과 연계성을 강화해 신성장 동력을 창출하고 공동번영을 추구하는 외교다 변화 전략이자 대외경제 정책이다.","chapter":4,"section":2,"page":77,"src":"2021년도 국제정세와 외교활동(외교백서)_홈페이지 게시.pdf","id":"2021-s00580"},{"year":2017,"admin":"문재인","text":"18 _ 제1장 2017년 국제 정세 및 외교정책 기조 이러한 배경으로 우리 정부는 쇼주변 4국과 정상외교 공백 복원 쇼한반도 평화와 안정 을 위한 동력 확보 쇼신남방ㆍ신북방정책 등 외교 다변화 추진을 통한 외교지평 확대 쇼국 제사회 내 역할 확대 및 위상 제고 쇼국민과 함께하는 외교라는 주요 기조 아래 외교정책을 추진하였다.","chapter":1,"section":2,"page":7,"src":"2018 외교백서 국문_1장.pdf","id":"2017-s00136"},{"year":2018,"admin":"문재인","text":"신북방정책의 핵심 파트너인 러시아와 미래 성장 동력을 창출하고 극동개발에 실질협력을 증진하기로 하는 한편 우즈베키스탄, 카 자흐스탄 등 중앙아 5개국과 협력을 강화해 신북방정책의 외연을 확대했다.","chapter":1,"section":2,"page":21,"src":"2019 외교백서 국문_제1장.pdf","id":"2018-s00139"},{"year":2019,"admin":"문재인","text":"신북방정책의 핵심파트너인 러시아와는 3019년 월 북방경제 분야별 협력 비전과 실 행계획을 담은 '9개 다리(9-811886) 행동계획'에 서명하고, 한ㆍ러 혁신센터 개소 및 한ㆍ 러 서비스 투자, 026. 추진 등 미래 성장 동력 확충 및 극동 개발과 관련한 실질혐력 증진 을 위해 노력했다.","chapter":1,"section":2,"page":21,"src":"2020 외교백서 국문_제1장.pdf","id":"2019-s00155"},{"year":2020,"admin":"문재인","text":"2017년 우리 대통령의 국빈 방중 및 2019년 한·일·중 정상회의를 계기로 개최된 한·중 정상회담에서 우리의 신남방정책 및 신북방정책과 중국의 일대일로 구상의 연 계협력 추진에 대한 한·중 정상 간 공감대가 형성됐다.","chapter":3,"section":null,"page":84,"src":"2021 외교백서(국문).pdf","id":"2020-s00804"},{"year":2021,"admin":"문재인","text":"외교부는 러시아, 중앙아시아 5개국 등 유라시아 국가들과의 정상· 고위급 교류가 신북방정책 추진에 기여할 수 있도록 노력해 왔다.","chapter":4,"section":2,"page":77,"src":"2021년도 국제정세와 외교활동(외교백서)_홈페이지 게시.pdf","id":"2021-s00581"},{"year":2017,"admin":"문재인","text":"특히 우리 정부는 9월 정상 방러를 계기로 신북방정책,
