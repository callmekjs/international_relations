<title>외교백서 지식그래프</title>
<style>
:root{
  --ground:#f6f4ef; --panel:#fffdf9; --line:#ddd7c9; --line-soft:#eae5d9;
  --ink:#1c1a17; --ink-2:#57524a; --ink-3:#8b8478;
  --country:#1f6f6b; --org:#8a6a1f; --policy:#7b3a68; --event:#a8442a; --treaty:#3a5a8f;
  --협력:#2f7d5e; --갈등:#b23a2e; --대화:#3a5a8f; --지원:#8a6a1f;
  --edge:rgba(90,84,74,.18); --edge-hot:rgba(28,26,23,.55);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#14161a; --panel:#1b1e24; --line:#2f343d; --line-soft:#252a31;
  --ink:#eceae5; --ink-2:#a8a49b; --ink-3:#726d64;
  --country:#5fc7bd; --org:#d8ae53; --policy:#cf8ab6; --event:#e58a68; --treaty:#7fa8e0;
  --협력:#5fbf92; --갈등:#e5715f; --대화:#7fa8e0; --지원:#d8ae53;
  --edge:rgba(200,196,187,.15); --edge-hot:rgba(236,234,229,.6);
}}
:root[data-theme="dark"]{
  --ground:#14161a; --panel:#1b1e24; --line:#2f343d; --line-soft:#252a31;
  --ink:#eceae5; --ink-2:#a8a49b; --ink-3:#726d64;
  --country:#5fc7bd; --org:#d8ae53; --policy:#cf8ab6; --event:#e58a68; --treaty:#7fa8e0;
  --협력:#5fbf92; --갈등:#e5715f; --대화:#7fa8e0; --지원:#d8ae53;
  --edge:rgba(200,196,187,.15); --edge-hot:rgba(236,234,229,.6);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
.serif{font-family:"Nanum Myeongjo","Apple SD Gothic Neo",Batang,serif}
.wrap{display:grid;grid-template-columns:244px minmax(0,1fr) 312px;height:100vh;height:100dvh}
@media(max-width:1040px){.wrap{grid-template-columns:1fr;grid-template-rows:auto 60vh auto;height:auto}}

aside,.detail{background:var(--panel);overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:18px}
aside{border-right:1px solid var(--line)}
.detail{border-left:1px solid var(--line)}
h1{font-size:18px;line-height:1.25;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--ink-3);font-size:11px;margin-top:5px;letter-spacing:.02em}
.grp{display:flex;flex-direction:column;gap:8px}
.lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.13em;color:var(--ink-3);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--line-soft);
  border-radius:6px;background:none;color:var(--ink);cursor:pointer;font:inherit;font-size:11.5px;
  transition:border-color .15s,opacity .15s}
.chip:hover{border-color:var(--line)}
.chip[aria-pressed="false"]{opacity:.32}
.chip:focus-visible{outline:2px solid var(--ink-2);outline-offset:2px}
.chip .n{color:var(--ink-3);font-size:10px;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.seg{display:flex;border:1px solid var(--line-soft);border-radius:6px;overflow:hidden}
.seg button{flex:1;padding:6px 8px;text-align:left;border:0;background:none;color:var(--ink-2);font:inherit;
  font-size:11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ground);color:var(--ink);font-weight:700}
.seg button:focus-visible{outline:2px solid var(--ink-2);outline-offset:-2px}
.yr{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.searchbox{width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:6px;
  background:var(--ground);color:var(--ink);font:inherit;font-size:12px}
.searchbox:focus-visible{outline:2px solid var(--ink-2);outline-offset:1px}
.crumb{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:11.5px}
.crumb button{border:0;background:none;color:var(--ink-3);font:inherit;font-size:11.5px;
  padding:1px 3px;border-radius:4px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.crumb button:hover{color:var(--ink)}
.crumb button:focus-visible{outline:2px solid var(--ink-2);outline-offset:1px}
.crumb .sep{color:var(--ink-3);opacity:.6}
.crumb .now{color:var(--ink);font-weight:700}
.gap{font-size:11px;line-height:1.55;color:var(--ink-2);border:1px solid var(--event);
  border-radius:6px;padding:8px 10px}
.gap b{color:var(--event)}
.note{font-size:10.5px;color:var(--ink-3);line-height:1.55;border-top:1px solid var(--line-soft);
  padding-top:10px;margin-top:auto}
.note b{color:var(--ink-2)}

main{position:relative;overflow:hidden;background:var(--ground)}
canvas{display:block;width:100%;height:100%;cursor:grab}
canvas:active{cursor:grabbing}
.badge{position:absolute;left:12px;top:11px;font-size:10.5px;color:var(--ink-3);background:var(--panel);
  border:1px solid var(--line-soft);border-radius:20px;padding:3px 10px;
  font-variant-numeric:tabular-nums;pointer-events:none}

.name{font-size:21px;letter-spacing:-.015em;margin:0;line-height:1.2}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink-2);margin-top:4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-soft);
  border:1px solid var(--line-soft);border-radius:7px;overflow:hidden}
.stat{background:var(--panel);padding:8px 10px}
.stat .k{font-size:9px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3)}
.stat .v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.spark{width:100%;height:48px;display:block}
.quote{font-size:12px;line-height:1.7;color:var(--ink-2);border-left:2px solid var(--line);padding-left:10px}
.quote cite{display:block;font-style:normal;font-size:10px;color:var(--ink-3);margin-top:6px}
.rel button{display:flex;align-items:center;gap:7px;width:100%;padding:4px 6px;border:0;border-radius:5px;
  background:none;color:var(--ink);font:inherit;font-size:12px;cursor:pointer;text-align:left}
.rel button:hover{background:var(--ground)}
.rel button:focus-visible{outline:2px solid var(--ink-2);outline-offset:-2px}
.rel .w{margin-left:auto;color:var(--ink-3);font-size:10.5px;font-variant-numeric:tabular-nums}
.rel .kind{font-size:9.5px;padding:0 5px;border-radius:9px;border:1px solid currentColor;flex:0 0 auto}
.empty{color:var(--ink-3);font-size:12px;line-height:1.7}
.docs{display:flex;flex-direction:column;gap:0}
.doc{border-top:1px solid var(--line-soft);padding:9px 0}
.doc:first-child{border-top:0}
.doc p{margin:0;font-size:12px;line-height:1.68;color:var(--ink)}
.doc .meta{display:flex;gap:6px;flex-wrap:wrap;font-size:9.5px;color:var(--ink-3);
  margin-top:5px;font-variant-numeric:tabular-nums}
.doc .meta b{color:var(--ink-2);font-weight:600}
.doc mark{background:color-mix(in srgb,currentColor 18%,transparent);color:inherit;
  border-radius:2px;padding:0 1px}
.more{border:1px solid var(--line-soft);border-radius:6px;background:none;color:var(--ink-2);
  font:inherit;font-size:11.5px;padding:6px;cursor:pointer;width:100%}
.more:hover{border-color:var(--line);color:var(--ink)}
.more:focus-visible{outline:2px solid var(--ink-2);outline-offset:1px}
</style>

<div class="wrap">
<aside>
  <div>
    <h1 class="serif">외교백서 지식그래프</h1>
    <div class="sub" id="scope"></div>
  </div>

  <div class="grp">
    <div class="lbl">무엇을 볼까</div>
    <div class="seg" id="view" style="flex-direction:column">
      <button type="button" data-v="country" aria-pressed="true">🌍 나라 중심</button>
      <button type="button" data-v="policy"  aria-pressed="false">📋 정책 중심</button>
      <button type="button" data-v="event"   aria-pressed="false">⚡ 사건 중심</button>
      <button type="button" data-v="all"     aria-pressed="false">전부 한 판에</button>
    </div>
    <div class="sub" id="viewNote" style="margin:0"></div>
  </div>

  <div class="grp"><div class="lbl">점의 종류</div><div class="chips" id="kinds"></div></div>

  <div class="grp">
    <div class="lbl">시기</div>
    <nav class="crumb" id="crumb" aria-label="시기 이동"></nav>
    <div class="chips" id="periods"></div>
  </div>

  <div id="gap"></div>

  <div class="grp">
    <div class="lbl">선의 굵기</div>
    <div class="seg" id="metric">
      <button type="button" data-m="weight" aria-pressed="true">함께 나온 횟수</button>
      <button type="button" data-m="pmi" aria-pressed="false">특별함</button>
    </div>
  </div>

  <div class="grp"><div class="lbl">관계 종류</div><div class="chips" id="rels"></div></div>

  <div class="grp">
    <div class="lbl">찾기</div>
    <input class="searchbox" id="q" placeholder="북한, 신남방정책…" aria-label="개체 찾기">
  </div>

  <div class="note" id="note"></div>
</aside>

<main><canvas id="cv"></canvas><div class="badge" id="badge"></div></main>

<div class="detail" id="detail"></div>
</div>

er":null,"section":null,"page":3,"src":"1994 외교백서 머리말_목차.pdf","id":"1993-s00005"},{"year":1994,"admin":"김영삼","text":"정부는 94년도에 신외교의 5대 기조와 다섯가지 외교목표를 구현하기 위한 주요시책으로서 “핵 문제 해결과 평화정착 모색”, “새로운 경제환경 에 능동적 대처”, “아ㆍ뿌 협력심화”, 유엔 등 국제기구 외교 강화\", \"문화외교의 내실화”, “재외한인지원”, “세계화 지원과 외교의 국제 경 쟁력 강화” 및 “정상외교 추진” 등 8가지를 설정하고, 이를 적극 추진하 였다.","chapter":1,"section":1,"page":3,"src":"1995 외교백서 머리말.pdf","id":"1994-s00003"},{"year":1995,"admin":"김영삼","text":"우리 외교 는 지난 한 해 동안 국제환경의 변화가 가져다 준 많은 도전과 과제에 직면한 가운데서도 유엔 안보리 진출로 우리의 국제적 위상을 한층 높였으 며, 한반도 평화정착과 통일을 위한 국제적 공조 체제를 더욱 공고히 하는 등의 소중한 결실을 거두었습니다.","chapter":null,"section":null,"page":3,"src":"1996 외교백서 머리말_목차.pdf","id":"1995-s00002"},{"year":1996,"admin":"김영삼","text":"또한, 1996년은 우리 나라가 선진제국의 경제협의체인 경제험력개발기 구(0801) 에 가입하고, 2000년 제 3차 아시아유럽 정상회의 (5814) 를 유치하는 한편, 유엔 안보리 비상임이사국으로서 세계의 안정과 평화에 대한 건설적인 기여를 함으로써 우리의 국제적 위상을 제고하고 외교적 입지를 더욱 강화한 한 해였습니다.","chapter":null,"section":null,"page":4,"src":"1997 외교백서 머리말_목차.pdf","id":"1996-s00009"},{"year":1997,"admin":"김영삼","text":"96년-97년간 UN안보리 비상임 이사국으로 적극적으로 활동해 온 우리나라는 여러 국제적 분쟁의 해결 과정에 직접 참여할 기회를 갖게 됨으로써 우리 외교의 차원을 한단계 격상시켰다고 생각합니다.","chapter":null,"section":null,"page":1,"src":"1998 외교백서 머리말.doc","id":"1997-s00005"},{"year":1998,"admin":"김대중","text":"이와 함께 국제사회의 책임있는 일원으로서 인류 보편적 가치를 추구하고 우리의 위치에 상응한 역할을 수행한다는 목표하에 UN 등 다자외교 활동에 적극 참여하였으며, WTO, OECD 등에의 참여를 통해 우리경제의 세계화와 경쟁력 강화에도 노력하였습니다.","chapter":null,"section":null,"page":1,"src":"1999 외교백서 머리말.doc","id":"1998-s00010"},{"year":1999,"admin":"김대중","text":"UN은 리비아가 테러용의자를 인도함에 따라 경제제재를 중지하여 리비아가 국제사회의 정상적인 일원이 되는 길을 열어주었으며, 이라크 역시 UN의 사찰에 협조하면 제재를 잠정 중단할 수 있다는 결의안을 안보리에서 채택함으로써 사찰 재개의 실마리를 마련하였다.","chapter":1,"section":1,"page":1,"src":"2000 외교백서 제1장.hwp","id":"1999-s00069"},{"year":2000,"admin":"김대중","text":"G-8, 유엔 천년정상회의, ASEM, APEC, ASEAN+3 정상회의 등 주요 국제회의 계기시 남북 화해 협력 과정에 대한 국제사회의 지지를 확보하였고, 북한이 국제사회 참여도를 계속 높여가도록 북한의 대서방 수교 및 국제기구 진출을 지원한 결과 북한과 다수 서방국들간 수교가 이루어지고, ARF 가입도 실현되었습니다.","chapter":null,"section":null,"page":1,"src":"2001 외교백서 머리말.hwp","id":"2000-s00004"},{"year":2001,"admin":"김대중","text":"한편, 적극적인 다자외교를 통해 범세계적 문제해결에 동참하면서 UN 총회의장직 수임, UN 평화유지활동 참여 등으로 국제무대에서의 활동을 강화하여 우리의 국제적 위상을 제고하였습니다.","chapter":9,"section":4,"page":1,"src":"2002 외교백서 발간사_목차.hwp","id":"2001-s00011"},{"year":2002,"admin":"김대중","text":"한편 외교통상부는 APEC, ASEM, ASEAN+3, ARF 등 지역협력체에 능동적으로 참여하였으며, 유엔 총회의장직 수임 및 제2차 민주주의 공동체회의의 서울 개최 등을 통해 범세계적 문제의 해결과 인류보편적 가치의 신장을 위한 국제사회의 노력에 적극 동참하였습니다.","chapter":9,"section":4,"page":1,"src":"2003 외교백서 발간사_목차.hwp","id":"2002-s00008"}],"docCount":111},{"id":"미국","kind":"country","aliases":["미합중국","美國","미국"],"total":4750,"byYear":{"1989":152,"1990":138,"1991":132,"1992":136,"1993":126,"1994":116,"1995":155,"1996":162,"1997":207,"1998":221,"1999":223,"2000":220,"2001":315,"2002":136,"2003":283,"2004":24,"2005":106,"2006":117,"2007":113,"2008":116,"2009":95,"2010":101,"2011":85,"2012":83,"2013":77,"2014":107,"2015":98,"2016":45,"2017":70,"2018":74,"2019":96,"2020":124,"2021":102,"2022":95,"2023":107,"2024":93,"2025":100},"rateByYear":{"1989":1011.3,"1990":1035.3,"1991":1111.1,"1992":1068.3,"1993":1000.0,"1994":868.9,"1995":1107.1,"1996":976.5,"1997":947.4,"1998":880.1,"1999":892.0,"2000":879.6,"2001":991.5,"2002":970.0,"2003":974.2,"2004":869.6,"2005":909.1,"2006":764.7,"2007":827.8,"2008":737.0,"2009":562.5,"2010":507.8,"2011":468.8,"2012":399.0,"2013":435.3,"2014":457.9,"2015":448.7,"2016":561.8,"2017":529.1,"2018":441.3,"2019":529.5,"2020":553.6,"2021":593.0,"2022":501.1,"2023":485.0,"2024":458.8,"2025":547.6},"byAdmin":{"김대중":1115,"김영삼":766,"노무현":643,"노태우":558,"이명박":480,"문재인":466,"박근혜":327,"윤석열":295,"이재명":100},"focus":0.23,"first":1989,"last":2025,"peak":2001,"peakRate":"1991","docs":[{"year":1989,"admin":"노태우","text":"미국도 상대적 국력 약화 추세는 물론, 무역 및 재정적자의 누적, 노동생산 성의 저하, 산업구조 조정의 지연 등으로 인한 국제경쟁력의 약화 등 구조적 경제난관에 봉착해 있다.","chapter":1,"section":null,"page":1,"src":"1990 외교백서 제1장.pdf","id":"1989-s00045"},{"year":1990,"admin":"노태우","text":"제1절”세계화 주요정세 3 소련은 과도한 군사비 지출에 따른 경제적 난관, 스탈린식 중앙계획 경제체제하 에서의 생산성의 저하, 기술의 낙후 등 체제출괴인7]ol 직면하였고, 미국도 상대적인 국력약화 추세는 물론, 무역 및 재정적자의 누적, 노동생산성 의 저하, 산업구조 조정의 지연 등으로 인한 국제경쟁력의 약화 등의 문제에 직면하고 있다.","chapter":1,"section":null,"page":3,"src":"1991 외교백서 제1장.pdf","id":"1990-s00017"},{"year":1991,"admin":"노태우","text":"서 교 백 외교 귀한번커 외 무 머 리 말 | 지난 1991뚜을 돌이켜 보건대 동서 냉전체제생 프류속에 ※때퀴의 해체약 새로운 독립국가련합(CIS) 화 등장, 그리고 이에 따른 미국 주도하생 신국제 질서 형성 등 국제정세중 있어 실로 엄청난 기화재 있었습니다.","chapter":null,"section":null,"page":1992,"src":"1992 외교백서 머리말_목차.pdf","id":"1991-s00001"},{"year":1992,"admin":"노태우","text":"제1절 세계생 주궤정세 “1 제1장 국제질서 동향생 우리 외교정책 방향 제1절 세계변 주요정세 90년대 『냉전이후시대」』에 들어와 미국은 걸프전쟁을 승리로 이끌고 새로 운 세계질서 구축을 시도했으나 미국의 구조적 경제 난관은 물론, 대통령 선거(1992. 11. 3)운동에 습방정 새로운 세계질서 수립 문제는 1991년도에 비하여 1992년도중 더욱 불확실해졌다.","chapter":1,"section":null,"page":1,"src":"1993 외교백서 제1장.pdf","id":"1992-s00009"},{"year":1993,"admin":"김영삼","text":"지난해 우리 외교는, 전통 우방인 미국과의 두차례에 걸친 정상회담, 가 장 가까운 이웃인 일본과의 경주 정상회담 그리고 씨애틀에서 개최된 APEC 지도자 회의에 즈음한 중국과의 정상회담을 통하여, 우리의 안보와 교역면에서 중요한 세 나라와의 협력관계를 다지는 계기를 마련하였습니다.","chapter":null,"section":null,"page":3,"src":"1994 외교백서 머리말_목차.pdf","id":"1993-s00004"},{"year":1994,"admin":"김영삼","text":"한편 냉전 종식에 따른 새로운 국제질서 형성 과정에 있어 한국과 미국 은 양국간 기존 동맹관계의 중요성을 새롭게 인식하고 과거 정치ㆍ안보 위주의 관계에서 벗어나 경제ㆍ통상ㆍ과학ㆍ문화 등 모든 분야에 걸친 성숙한 동반자 관계를 발전시키고자 노력하였다.","chapter":1,"section":3,"page":5,"src":"1995 외교백서 머리말.pdf","id":"1994-s00011"},{"year":1995,"admin":"김영삼","text":"이러한 대북정책을 실효성있고 효율적으로 추진하기 위해서는 미국, 일본, 중국, 러시아에 대한 균형된 4각 외교를 전개하는 것이 매우 중요 하므로 우리는 기본적으로 전통 우방국인 미국, 일본과의 관계를 주축으 로 하여 중국과 러시아와의 관계를 발전시킬 계획이다.","chapter":1,"section":2,"page":4,"src":"1996 외교백서 제1장.pdf","id":"1995-s00111"},{"year":1996,"admin":"김영삼","text":"우선, 지난 해 4월 정부는 남ㆍ북한간에 평화체제를 정착시켜 평화통 일을 향한 안정적 기틀을 마련하기 위해 미국과 공동으로 북한에 대해 4자회담을 제의하였습니다.","chapter":null,"section":null,"page":3,"src":"1997 외교백서 머리말_목차.pdf","id":"1996-s00005"},{"year":1997,"admin":"김영삼","text":"제 1 절 1997년도 국제정세 일반 오늘날의 국제질서는 탈냉전, 탈이념을 표방하고 있는 가운데 미국이 초강대국으로서의 우월한 정치 군사력을 바탕으로 새로운 국제질서 관리를 주도해 가고 있으나, 구주통합의 진전과 일본 중국의 정치 경제적 부상으로 다극화 양상이 대두되고 있으며, 이러한 다극화 현상은 미국이 국제문제 해결에 있어서 여타 강대국들과 협의 협력하는 단일-다극체제의 성격을 띠고 있다.","chapter":1,"section":1,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00017"},{"year":1998,"admin":"김대중","text":"이러한 대북 포용정책의 일관된 추진은 미국 및 일본과의 긴밀한 공조와 특히, 한반도 분단이래 처음 으로 우리의 대북정책에 대한 중국과 러시아의 지지를 확보함으로써 가능하였습니다.","chapter":null,"section":null,"page":1,"src":"1999 외교백서 머리말.doc","id":"1998-s00005"},{"year":1999,"admin":"김대중","text":"대북 포용정책은 또한 미국, 일본과의 긴밀한 공조와 함께 중국의 협조와 6, 러시아를 포함한 전 국제사회의 전폭적인 지지로 효과 적이고 일관성있는 대북정책으로 자리를 잡았습니다.","chapter":null,"section":null,"page":2,"src":"2000 외교백서 머리말.pdf","id":"1999-s00009"},{"year":2000,"admin":"김대중","text":"미국, 일본 등 우리 전통 우방국들과의 긴밀한 공조체제 유지와 중국, 러시아, EU, ASEAN 등의 지지 및 건설적인 기여 확보가 그것입니다.","chapter":null,"section":null,"page":1,"src":"2001 외교백서 머리말.hwp","id":"2000-s00003"},{"year":2001,"admin":"김대중","text":"2001년 9월 11일 미국에서 발생한 테러사태 이후 미국을 중심으로 대테러 국제연대가 형성되었고, 이러한 국제협력관계는 테러분야에만 국한되지 않고, 국제정치 다방면에 걸친 강대국간 협조체제(concert of powers)를 형성할 기회를 제공하고 있다.","chapter":1,"section":1,"page":1,"src":"2002 외교백서 제1장.hwp","id":"2001-s00108"},{"year":2002,"admin":"김대중","text":"미국, 일본과 긴밀한 대북정책 공조를 유지하는 가운데 중국, 러시아 등 주변국들 및 국제사회로부터 북한 핵문제의 평화적 해결과 우리의 대북정책에 대해 지지와 협조를 확보하였습니다.","chapter":9,"section":4,"page":1,"src":"2003 외교백서 발간사_목차.hwp","id":"2002-s00003"}],"docCount":111},{"id":"북한","kind":"country","aliases":["조선민주주의인민공화국","북한","北韓"],"total":4440,"byYear":{"1989":173,"1990":126,"1991":119,"1992":118,"1993":129,"1994":136,"1995":157,"1996":154,"1997":170,"1998":206,"1999":214,"2000":155,"2001":141,"2002":87,"2003":179,"2004":14,"2005":86,"2006":85,"2007":52,"2008":68,"2009":98,"2010":175,"2011":89,"2012":141,"2013":127,"2014":155,"2015":146,"2016":78,"2017":138,"2018":73,"2019":67,"2020":90,"2021":54,"2022":118,"2023":127,"2024":135,"2025":60},"rateByYear":{"1989":1151.0,"1990":945.2,"1991":1001.7,"1992":926.9,"1993":1023.8,"1994":1018.7,"1995":1121.4,"1996":928.3,"1997":778.0,"1998":820.4,"1999":856.0,"2000":619.8,"2001":443.8,"2002":620.5,"2003":616. d":"1994-s00004"},{"year":1995,"admin":"김영삼","text":"우리 정부는 특히 반목과 대결로 점철되었던 남북한 관계를 화해와 혐력의 차원으로 전환시키려는 의지에서 북한 핵문제와 식량난 해결을 위한 모든 외교적 노력을 경주하였습니다.","chapter":null,"section":null,"page":3,"src":"1996 외교백서 머리말_목차.pdf","id":"1995-s00003"},{"year":1996,"admin":"김영삼","text":"한 편, 동북아 지역의 정세는 대체적으로 안정적인 경향을 보이고 있으나, 우리가 살고 있는 한반도 는 냉전의 마지막 유산으로서 북한 문제가 여전히 가장 큰 불안정 요인으 로 남아있는 것이 현실입니다.","chapter":null,"section":null,"page":3,"src":"1997 외교백서 머리말_목차.pdf","id":"1996-s00002"},{"year":1997,"admin":"김영삼","text":"제 2 절 동북아 및 한반도 정세 1. 1997년도 동북아 정세 2. 북한정세 1. 1997년도 동북아 정세 미국의 주도적 지위와 중국의 대두, 일본의 독자적 위상 추구와 러시아의 강대국 지위 회복 노력 등으로 특정지워지는 동북아 국제정세는 전반적으로 안정적인 관계를 유지하고 있는 가운데 주변 4국의 전략적 이해에 기초한 새로운 국제질서 형성을 모색하는 과정에 있다.","chapter":1,"section":2,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00062"},{"year":1998,"admin":"김대중","text":"남북한 관계에 있어서는 확고한 안보태세를 바탕으로 한반도 냉전구조를 해체하고 남북한 평화공존을 목표로 하는 대북 포용정책을 추진하는 한편, 북한의 도발에 대해서는 강력히 대처하였습니다.","chapter":null,"section":null,"page":1,"src":"1999 외교백서 머리말.doc","id":"1998-s00004"},{"year":1999,"admin":"김대중","text":"이처럼 한반도에서 새롭게 전개되고 있는 남북한 관계의 진전과 함께 경제도약과 성장에 대한 자신감을 바탕으로, 우리는 한반도 뿐 만아니라 동북아 나아가 세계의 평화와 번영을 위해 보다 원대한 비젼을 가지고 한차원 높은 외교를 펼쳐나가야 한다는 소명을 부여 받고 있습니다.","chapter":null,"section":null,"page":1,"src":"2000 외교백서 머리말.pdf","id":"1999-s00004"},{"year":2000,"admin":"김대중","text":"G-8, 유엔 천년정상회의, ASEM, APEC, ASEAN+3 정상회의 등 주요 국제회의 계기시 남북 화해 협력 과정에 대한 국제사회의 지지를 확보하였고, 북한이 국제사회 참여도를 계속 높여가도록 북한의 대서방 수교 및 국제기구 진출을 지원한 결과 북한과 다수 서방국들간 수교가 이루어지고, ARF 가입도 실현되었습니다.","chapter":null,"section":null,"page":1,"src":"2001 외교백서 머리말.hwp","id":"2000-s00004"},{"year":2001,"admin":"김대중","text":"2000년 7월 북한의 ARF 가입 이후 아․태 지역차원의 다자안보대화와 소지역 수준의 동북아 다자안보대화도 진전될 수 있을 것으로 기대된다.","chapter":1,"section":2,"page":1,"src":"2002 외교백서 제1장.hwp","id":"2001-s00255"},{"year":2002,"admin":"김대중","text":"발 간 사 2002년도는 북한 핵문제가 다시 대두되고 이라크 전운이 고조 되는 등 국제 정세의 불확실성이 증대됨으로써 우리 외교환경에 커다란 변화가 초래된 한 해였습니다.","chapter":9,"section":4,"page":1,"src":"2003 외교백서 발간사_목차.hwp","id":"2002-s0000 차.pdf","id":"1991-s00003"},{"year":1992,"admin":"노태우","text":"특히 우리는 지난 92년 8월 중국이 풋함으로써 북방 사회주의권촌화 수교를 마무리하였으며, 이를 기반으로 확대된 외교지평에서 주변사강생화 관계를 보다 폭 넓게 추구할 수 있게 되었습니다.","chapter":null,"section":null,"page":3,"src":"1993 외교백서 머리말_목차.pdf","id":"1992-s00004"},{"year":1993,"admin":"김영삼","text":"지난해 우리 외교는, 전통 우방인 미국과의 두차례에 걸친 정상회담, 가 장 가까운 이웃인 일본과의 경주 정상회담 그리고 씨애틀에서 개최된 APEC 지도자 회의에 즈음한 중국과의 정상회담을 통하여, 우리의 안보와 교역면에서 중요한 세 나라와의 협력관계를 다지는 계기를 마련하였습니다.","chapter":null,"section":null,"page":3,"src":"1994 외교백서 머리말_목차.pdf","id":"1993-s00004"},{"year":1994,"admin":"김영삼","text":"중국과는 교역ㆍ 투자ㆍ인적교류가 증대하고 있는 가운데 94년 3월 김영삼 대통령의 중국 공식방문을 통해 실질협력관계를 보다 강화하였다.","chapter":1,"section":3,"page":5,"src":"1995 외교백서 머리말.pdf","id":"1994-s00015"},{"year":1995,"admin":"김영삼","text":"이러한 대북정책을 실효성있고 효율적으로 추진하기 위해서는 미국, 일본, 중국, 러시아에 대한 균형된 4각 외교를 전개하는 것이 매우 중요 하므로 우리는 기본적으로 전통 우방국인 미국, 일본과의 관계를 주축으 로 하여 중국과 러시아와의 관계를 발전시킬 계획이다.","chapter":1,"section":2,"page":4,"src":"1996 외교백서 제1장.pdf","id":"1995-s00111"},{"year":1996,"admin":"김영삼","text":"4자회담은 남ㆍ북한이 협의의 주역이 되고 미국과 중국은 휴전협정의 당사국으로서 남북한간의 대화를 지원하는 방 식으로 제안된, 가장 합리적이고 현실적인 한반도 문제 해결방안이라 하 겠습니다.","chapter":null,"section":null,"page":3,"src":"1997 외교백서 머리말_목차.pdf","id":"1996-s00006"},{"year":1997,"admin":"김영삼","text":"제 1 절 1997년도 국제정세 일반 오늘날의 국제질서는 탈냉전, 탈이념을 표방하고 있는 가운데 미국이 초강대국으로서의 우월한 정치 군사력을 바탕으로 새로운 국제질서 관리를 주도해 가고 있으나, 구주통합의 진전과 일본 중국의 정치 경제적 부상으로 다극화 양상이 대두되고 있으며, 이러한 다극화 현상은 미국이 국제문제 해결에 있어서 여타 강대국들과 협의 협력하는 단일-다극체제의 성격을 띠고 있다.","chapter":1,"section":1,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00017"},{"year":1998,"admin":"김대중","text":"이러한 대북 포용정책의 일관된 추진은 미국 및 일본과의 긴밀한 공조와 특히, 한반도 분단이래 처음 으로 우리의 대북정책에 대한 중국과 러시아의 지지를 확보함으로써 가능하였습니다.","chapter":null,"section":null,"page":1,"src":"1999 외교백서 머리말.doc","id":"1998-s00005"},{"year":1999,"admin":"김대중","text":"대북 포용정책은 또한 미국, 일본과의 긴밀한 공조와 함께 중국의 협조와 6, 러시아를 포함한 전 국제사회의 전폭적인 지지로 효과 적이고 일관성있는 대북정책으로 자리를 잡았습니다.","chapter":null,"section":null,"page":2,"src":"2000 외교백서 머리말.pdf","id":"1999-s00009"},{"year":2000,"admin":"김대중","text":"미국, 일본 등 우리 전통 우방국들과의 긴밀한 공조체제 유지와 중국, 러시아, EU, ASEAN 등의 지지 및 건설적인 기여 확보가 그것입니다.","chapter":null,"section":null,"page":1,"src":"2001 외교백서 머리말.hwp","id":"2000-s00003"},{"year":2001,"admin":"김대중","text":"그 결과, 한․미 동맹관계를 더욱 공고히 발전시키고 대북정책에 대한 한․미․일 3국간 긴밀한 공조체제도 견실하게 다졌으며, 한반도의 평화와 안정을 확보해 나가는데 중국과 러시아의 건설적인 기여를 확보하였습니다.","chapter":9,"section":4,"page":1,"src":"2002 외교백서 발간사_목차.hwp","id":"2001-s00004"},{"year":2002,"admin":"김대중","text":"미국, 일본과 긴밀한 대북정책 공조를 유지하는 가운데 중국, 러시아 등 주변국들 및 국제사회로부터 북한 핵문제의 평화적 해결과 우리의 대북정책에 대해 지지와 협조를 확보하였습니다.","chapter":9,"section":4,"page":1,"src":"2003 외교백서 발간사_목차.hwp","id":"2002-s00003"}],"docCount":111},{"id":"일본","kind":"country","aliases":["日本","일본"],"total":3136,"byYear":{"1989":81,"1990":94,"1991":88,"1992":73,"1993":87,"1994":106,"1995":103,"1996":113,"1997":147,"1998":162,"1999":149,"2000":152,"2001":207,"2002":61,"2003":145,"2004":10,"2005":65,"2006":56,"2007":58,"2008":74,"2009":65,"2010":84,"2011":96,"2012":72,"2013":61,"2014":81,"2015":105,"2016":42,"2017":41,"2018":45,"2019":68,"2020":64,"2021":48,"2022":45,"2023":71,"2024":62,"2025":55},"rateByYear":{"1989":538.9,"1990":705.2,"1991":740.7,"1992":573.4,"1993":690.5,"1994":794.0,"1995":735.7,"1996":681.1,"1997":672.8,"1998":645.2,"1999":596.0,"2000":607.8,"2001":651.6,"2002":435.1,"2003":499.1,"2004":362.3,"2005":557.5,"2006":366.0,"2007":424.9,"2008":470.1,"2009":384.8,"2010":422.3,"2011":529.5,"2012":346.2,"2013":344.8,"2014":346.6,"2015":480.8,"2016":524.3,"2017":309.9,"2018":268.3,"2019":375.1,"2020":285.7,"2021":279.1,"2022":237.3,"2023":321.8,"2024":305.9,"2025":301.2},"byAdmin":{"김대중":731,"김영삼":556,"이명박":391,"노태우":336,"노무현":334,"박근혜":289,"문재인":266,"윤석열":178,"이재명":55},"focus":0.23,"first":1989,"last":2025,"peak":2001,"peakRate":"1994","docs":[{"year":1989,"admin":"노태우","text":"6 제1장 국제질서 동향이 우리 외교희 기본과제 제2인절 “동북아 및 한절조 정세 1. 동북아 정세 일반 미소ㆍ중ㆍ일 등 이른바 속북아 4강간 군사ㆍ외교ㆍ정치ㆍ경제 등 복잡한 이 해관계로 유계선 있는 동북아 정세는 미소 신데땅트, 중ㆍ소화해(1989. 5.), 소련의 대일본 관계개선 노력 등 주로 양자간 관계의 재정립을 통해서 지역 적 데땅트가 이루어지는 추세로 나가고 있다.","chapter":1,"section":null,"page":6,"src":"1990 외교백서 제1장.pdf","id":"1989-s00088"},{"year":1990,"admin":"노태우","text":"미ㆍ소는 1990년대에도 상당한 군사ㆍ전략적 영향력을 보유할 것이나 「준전 이후시대J생 『하위정치] 중심의 국제관계에 있어서 일ㆍ유럽 등의 경제력 및 정치적 영향력 신장과 소련의 초강대국으로서의 지위 약화, 그리고 미국 \"지도력의 상대적 약화로 1990년대 국제체제는 미ㆍ소ㆍ중ㆍ[통합된 유럽」을 중심으로 한 다극화 양상을 보일 것이나, 소ㆍ중의 국내문제 우선주의에 따른 대외적 영향력 약화로 실제로는 미국과 일본, 그리고 독일을 주축으로 한 통합된 유럽이 중추적 역할을 담당할 것으로 보인다.","chapter":1,"section":null,"page":7,"src":"1991 외교백서 제1장.pdf","id":"1990-s00047"},{"year":1991,"admin":"노태우","text":"앞으로 우리는 미국, 일본, 80, 아세안씀 전통우방슬상생 우호협력 관계람 유지 및 강화를 바탕으로 하여 러시아, 중국호십 실질적 협력관계정 지속적층 증진시켜 나감으로써 북방외교설 내실화정 기함과 동시에 이러한 다각적 외교변 적극추진방 통해 궁극적으로 남북한 관계개선동 하화적 통일전 이룩해야 하겠습니다.","chapter":null,"section":null,"page":3,"src":"1992 외교백서 머리말_목차.pdf","id":"1991-s00004"},{"year":1992,"admin":"노태우","text":"소연방의 해체와 「독립국가연합(016)」의 출범 후 구소련을 계승하고 있 으나 산적한 국내문제로 인하여 초강대국지위를 상실한 러시아, 범세계적 핵심 역할을 수행하는 미국, 새 질서로 재편되는 유럽, 경제적 강대국으로서 국제정치적 역할을 증대하고 있는 일본, 현대화 지속으로 고속성장중인 중 국 등으로 새로운 세계질서는 점차 「단일ㆍ다극적(ㅁ1ㅁㅁㅁ000!8『0)」구조로 변모되어 가고 있다.","chapter":1,"section":null,"page":2,"src":"1993 외교백서 제1장.pdf","id":"1992-s00017"},{"year":1993,"admin":"김영삼","text":"지난해 우리 외교는, 전통 우방인 미국과의 두차례에 걸친 정상회담, 가 장 가까운 이웃인 일본과의 경주 정상회담 그리고 씨애틀에서 개최된 APEC 지도자 회의에 즈음한 중국과의 정상회담을 통하여, 우리의 안보와 교역면에서 중요한 세 나라와의 협력관계를 다지는 계기를 마련하였습니다.","chapter":null,"section":null,"page":3,"src":"1994 외교백서 머리말_목차.pdf","id":"1993-s00004"},{"year":1994,"admin":"김영삼","text":"우리의 인접국인 일본과는 93년 11월 경주에서 개최된 양국 정상회담 후 총 3차례의 정상희담 개최를 통해 양국간의 과거사 문제를 정리하고 미래지향적인 선린우호관계 구축의 기반을 조성하였다.","chapter":1,"section":3,"page":5,"src":"1995 외교백서 머리말.pdf","id":"1994-s00014"},{"year":1995,"admin":"김영삼","text":"이러한 대북정책을 실효성있고 효율적으로 추진하기 위해서는 미국, 일본, 중국, 러시아에 대한 균형된 4각 외교를 전개하는 것이 매우 중요 하므로 우리는 기본적으로 전통 우방국인 미국, 일본과의 관계를 주축으 로 하여 중국과 러시아와의 관계를 발전시킬 계획이다.","chapter":1,"section":2,"page":4,"src":"1996 외교백서 제1장.pdf","id":"1995-s00111"},{"year":1996,"admin":"김영삼","text":"그 밖에도 지난 해 6월에는 전국민의 성원리에 우리 나라가 2002 월드컵 는 것을 의미한다.","chapter":1,"section":1,"page":4,"src":"1994 외교백서 제1장.pdf","id":"1993-s00022"},{"year":1994,"admin":"김영삼","text":"러시아와는 94 6월 김대통령의 공식 방문을 통해 건설적이고 상호 보완적인 동반자 관계 구축을 위한 기반을 조성하였다.","chapter":1,"section":3,"page":5,"src":"1995 외교백서 머리말.pdf","id":"1994-s00016"},{"year":1995,"admin":"김영삼","text":"이러한 대북정책을 실효성있고 효율적으로 추진하기 위해서는 미국, 일본, 중국, 러시아에 대한 균형된 4각 외교를 전개하는 것이 매우 중요 하므로 우리는 기본적으로 전통 우방국인 미국, 일본과의 관계를 주축으 로 하여 중국과 러시아와의 관계를 발전시킬 계획이다.","chapter":1,"section":2,"page":4,"src":"1996 외교백서 제1장.pdf","id":"1995-s00111"},{"year":1996,"admin":"김영삼","text":"아울러 중국에 대한 경제지원을 재개하고, 러시아에 대한 5억달러의 차관지원을 약속하는 등 중국, 러시아와의 관계 개선에도 주력하였다.","chapter":1,"section":1,"page":4,"src":"1997 외교백서 제1장.pdf","id":"1996-s00060"},{"year":1997,"admin":"김영삼","text":"아울러 일본은 주변 강대국들과의 우호적인 관계를 유지함과 동시에 시장확보 및 현안문제에 대한 접근의 필요성을 인식, 1997년 9월 중국, 1997년 11월 러시아 등과 정상회담을 가졌다.","chapter":1,"section":1,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00030"},{"year":1998,"admin":"김대중","text":"이러한 대북 포용정책의 일관된 추진은 미국 및 일본과의 긴밀한 공조와 특히, 한반도 분단이래 처음 으로 우리의 대북정책에 대한 중국과 러시아의 지지를 확보함으로써 가능하였습니다.","chapter":null,"section":null,"page":1,"src":"1999 외교백서 머리말.doc","id":"1998-s00005"},{"year":1999,"admin":"김대중","text":"대북 포용정책은 또한 미국, 일본과의 긴밀한 공조와 함께 중국의 협조와 6, 러시아를 포함한 전 국제사회의 전폭적인 지지로 효과 적이고 일관성있는 대북정책으로 자리를 잡았습니다.","chapter":null,"section":null,"page":2,"src":"2000 외교백서 머리말.pdf","id":"1999-s00009"},{"year":2000,"admin":"김대중","text":"미국, 일본 등 우리 전통 우방국들과의 긴밀한 공조체제 유지와 중국, 러시아, EU, ASEAN 등의 지지 및 건설적인 기여 확보가 그것입니다.","chapter":null,"section":null,"page":1,"src":"2001 외교백서 머리말.hwp","id":"2000-s00003"},{"year":2001,"admin":"김대중","text":"그 결과, 한․미 동맹관계를 더욱 공고히 발전시키고 대북정책에 대한 한․미․일 3국간 긴밀한 공조체제도 견실하게 다졌으며, 한반도의 평화와 안정을 확보해 나가는데 중국과 러시아의 건설적인 기여를 확보하였습니다.","chapter":9,"section":4,"page":1,"src":"2002 외교백서 발간사_목차.hwp","id":"2001-s00004"},{"year":2002,"admin":"김대중","text":"미국, 일본과 긴밀한 대북정책 공조를 유지하는 가운데 중국, 러시아 등 주변국들 및 국제사회로부터 북한 핵문제의 평화적 해결과 우리의 대북정책에 대해 지지와 협조를 확보하였습니다.","chapter":9,"section":4,"page":1,"src" 한 조선 노동당 간첩사건은 정부내의 대북화해분위기에 찬물을 끼없는 결과를 가져왔다.","chapter":2,"section":null,"page":30,"src":"1993 외교백서 제2장.pdf","id":"1992-s00296"},{"year":1993,"admin":"김영삼","text":"시장경제개혁은 중국, 베트남, 라오스 등 아시아 사회주의권 뿐만 아니라 인도 등 서남아시아와 에티오피아와 가나 등 아프리카에서도 성공적으로 이 루어지고 있는 반면, 구 동구권에서는 체코와 헝가리를 제외하고는 전반적 으로 부진을 면치 못하고 있다.","chapter":2,"section":1,"page":5,"src":"1994 외교백서 제2장.pdf","id":"1993-s00077"},{"year":1994,"admin":"김영삼","text":"APEC 보고르 정상회의에 대비하여, 우리정부는 회의 주최국인 인도 네시아 및 여타 6880 핵심국가들과의 긴밀한 협의를 바탕으로, 회의준 비과정에 능동적으로 참여하여, 우리의 입장을 적극 반영하였으며, 성공 적인 정상회의가 되도록 지원하였다.","chapter":1,"section":2,"page":9,"src":"1995 외교백서 머리말.pdf","id":"1994-s00051"},{"year":1995,"admin":"김영삼","text":"한편 1995년에는 Do 14001 베트남 당서기장 방한과 1995년 10월 라오 스와의 수교 실현을 통해 인도차이나 진출 기반을 확충하는 한편, 향후 캄보디아와의 수교 여건을 조성하였으며, 남태평양포럼 (588) 의 대화상 대국 지위를 획득함으로써 대양주 국가들과의 관계를 증진시켰다.","chapter":1,"section":3,"page":11,"src":"1996 외교백서 제1장.pdf","id":"1995-s00162"},{"year":1996,"admin":"김영삼","text":"서남아지역에서는 인도, 과키스탄간 군비경 쟁과 카슈미르 분쟁 등으로 안보환경이 경색된 가운데, 인도와 방글라데 시의 정권교체 등 각국내에서 불안정한 정국이 계속되었다.","chapter":1,"section":1,"page":5,"src":"1997 외교백서 제1장.pdf","id":"1996-s00070"},{"year":1997,"admin":"김영삼","text":"그러나, 역내 최대 불안요소인 인도·파키스탄 관계는 두 차례의 정상회담과 3년만에 재개된 외무차관회담을 통한 양국의 대화노력에도 불구하고 카시미르 문제를 둘러싼 근본적인 입장차이로 인하여 구체적인 진전을 보지 못하였으며, 1978년이래 20년째 내전이 계속되고 있는 아프가니스탄에서도 Taliban 세력과 반Taliban 세력간의 내전이 계속되었다.","chapter":1,"section":3,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00254"},{"year":1998,"admin":"김대중","text":"외교통상부로서도 경제위기의 극복과 경제 재도약을 위한 기반 마련에 최우선 순위를 두고, 통상교섭본부의 신설과 함께 재외공관을 통상진흥의 전진기지로 삼아 적극적이고 개방지향적인 경제.통상 외교를 전개함으로써 우리 경제의 경쟁력과 대외 신인도 제고를 도모하고, 수출 증대와 외국인 투자 유치를 위한 노력을 경주하였습니다.","chapter":null,"section":null,"page":1,"src":"1999 외교백서 머리말.doc","id":"1998-s00003"},{"year":1999,"admin":"김대중","text":"또한 러시아는 인도 및 중동국가들과도 군사․기술 협력을 확대하였으며, 러․벨라루스 통합 조약에 서명하는 등 독립국가연합(Commonwealth of Independent States : CIS)의 결속 강화를 도모하였다.","chapter":1,"section":1,"page":1,"src":"2000 외교백서 제1장.hwp","id":"1999-s00048"},{"year":2000,"admin":"김대중","text":"한편, 군사 안보적인 협력체제 구축을 위한 노력과 함께 오늘날 국제정치 질서에서 나타나고 있는 커다란 특징 가운데 하나는 인도주의적 개입의 확대라고 할 수 있다.","chapter":1,"section":1,"page":1,"src":"2001 외교백서 제1장.hwp","id":"2000-s00026"},{"year":2001,"admin":"김대중","text":"한편, 서남아시아 국가들은 지속적으로 추진하여 온 경제개혁이 성과를 나타내고 인도와 파키스탄이 미국의 대테러전 협조의 대가로 각종 경제제재 조치로부터 벗어남에 따라 4%의 성장을 기록하였다.","chapter":1,"section":1,"page":1,"src":"2002 외교백서 제1장.hwp","id":"2001-s00184"},{"year":2002,"admin":"김대중","text":"촚뫔몶 서남아시아의 인도는 GDP의 10%에 달하는 재정적자 문제를 비롯하여 여타 핵심 분야에 대한 개혁 과제를 안고 있으나, 석유화학산업 부문의 민영화를 통한 정부 재정 확보와 기업 경쟁력 향상 및 외국인투자 유치 노력에 힘입어 성장세가 강화되었다.","chapter":1,"section":3,"page":10,"src":"2003 외교백서 제1장.hwp","id":"2002-s00155"}],"docCount":111},{"id":"아세안","kind":"org","aliases":["ASEAN","아세안"],"total":1901,"byYear":{"1989":18,"1990":15,"1991":36,"1992":25,"1993":31,"1994":48,"1995":52,"1996":40,"1997":63,"1998":47,"1999":53,"2000":73,"2001":114,"2002":33,"2003":86,"2004":11,"2005":49,"2006":62,"2007":57,"2008":45,"2009":53,"2010":52,"2011":34,"2012":43,"2013":39,"2014":79,"2015":36,"2016":20,"2017":45,"2018":67,"2019":78,"2020":60,"2021":48,"2022":79,"2023":68,"2024":73,"2025":69},"rateByYear":{"1989":119.8,"1990":112.5,"1991":303.0,"1992":196.4,"1993":246.0,"1994":359.6,"1995":371.4,"1996":241.1,"1997":288.3,"1998":187.2,"1999":212.0,"2000":291.9,"2001":358.8,"2002":235.4,"2003":296.0,"2004":398.6,"2005":420.2,"2006":405.2,"2007":417.6,"2008":285.9,"2009":313.8,"2010":261.4,"2011":187.5,"2012":206.7,"2013":220.5,"2014":338.0,"2015":164.8,"2016":249.7,"2017":340.1,"2018":399.5,"2019":430.2,"2020":267.9,"2021":279.1,"2022":416.7,"2023":308.3,"2024":360.1,"2025":377.9},"byAdmin":{"김대중":320,"문재인":298,"노무현":265,"김영삼":234,"이명박":227,"윤석열":220,"박근혜":174,"노태우":94,"이재명":69},"focus":0.17,"first":1989,"last":2025,"peak":2001,"peakRate":"2019","docs":[{"year":1989,"admin":"노태우","text":"1989년 10월 20일 재개되어 1990년 2월 7일까지 6회 개최된 돌급습※은 제6차회담(1989. 12. 22)시까지 북경 아세안게임 남북단일팀 구성을 위한 단 일팀 호칭, 단기, 단가, 선수선발 방법 등 10개항 기본사항에 원칙적 합의를 보았으나 제6차회담 이후부터 10개항 합의사항 이행 보장문제에 대해 쌍방 의 이견이 계속되었다.","chapter":1,"section":null,"page":20,"src":"1990 외교백서 제1장.pdf","id":"1989-s00211"},{"year":1990,"admin":"노태우","text":"한편, 우리의 기존 우방국과의 결속을 강화하기 위하여 초청, 방문외교를 적극 전개함으로써 서구 우방과의 전통적인 우호협력관계를 재확인 하고 아시 아ㆍ태평양 국가와의 협력을 강화하였으며 제1차 한ㆍ아세안 공동 위원회홍 개최하여 아세안과 실질협력관계를 가일충 증진하였을 뿐만 아니라 제3세계에서 : 의 우리의 외교기반을 확충하기 위한 노력을 계속한 결과, 1990년도에 7개국과 33380 1990주홈 외교시책조 2000뚜을 향한 기본 외교시책 방향“19 새로이 외교관계를 수립하였다.","chapter":1,"section":null,"page":18,"src":"1991 외교백서 제1장.pdf","id":"1990-s00115"},{"year":1991,"admin":"노태우","text":"앞으로 우리는 미국, 일본, 80, 아세안씀 전통우방슬상생 우호협력 관계람 유지 및 강화를 바탕으로 하여 러시아, 중국호십 실질적 협력관계정 지속적층 증진시켜 나감으로써 북방외교설 내실화정 기함과 동시에 이러한 다각적 외교변 적극추진방 통해 궁극적으로 남북한 관계개선동 하화적 통일전 이룩해야 하겠습니다.","chapter":null,"section":null,"page":3,"src":"1992 외교백서 머리말_목차.pdf","id":"1991-s00004"},{"year":1992,"admin":"노태우","text":"한편 「냉전이후시대」에 있어서 한ㆍ소 수교 및 한ㆍ중 수교를 통한 냉전 구조의 종식 등 동북아에 새로운 질서 재편을 가속화시키는 요인과 미ㆍ소 (러시아) 대결 구조의 종식 등 역외 세력의 영향력 감소와 함께 중ㆍ일 등 지역강대세력간 패권 경쟁 가능성 및 일부 ASEAN 국가들의 군비 증강 추 세와 관련, 지역 불안정 및 불확실성이 중대되고 있다.","chapter":1,"section":null,"page":2,"src":"1993 외교백서 제1장.pdf","id":"1992-s00014"},{"year":1993,"admin":"김영삼","text":"한국, 대만, 중국 그리고 태국ㆍ말레이지아를 중심으로 하는 ASEAN호 동아시아 지역은 1993 역동적인 성장을 거듭하였다.","chapter":2,"section":1,"page":6,"src":"1994 외교백서 제2장.pdf","id":"1993-s00085"},{"year":1994,"admin":"김영삼","text":"아세안과의 교역은 93년도에 165억불을 기록하였으며, 교역규모가 94 년말에는 191억불 수준으로 급속도로 신장되었다.","chapter":1,"section":3,"page":7,"src":"1995 외교백서 머리말.pdf","id":"1994-s00031"},{"year":1995,"admin":"김영삼","text":"또한 다가오는 아시아ㆍ태평양시대를 맞아 점점 그 중요성이 증대되어 가고 있는 지역협력을 심화시키기 위해 우리는 오사카 6880 정상회의를 비롯하여 아세안 확대외무장관회의 (ASEAN-PMC), 아세안지역안보포 럼(&007) 등의 지역협력체제에서 적극적인 역할을 수행하였습니다.","chapter":null,"section":null,"page":4,"src":"1996 외교백서 머리말_목차.pdf","id":"1995-s00012"},{"year":1996,"admin":"김영삼","text":"1967년 말레이지아, 인 도네시아, 태국, 필리핀 및 싱가포르 5개국으로 출범한 ASEAN위 1984 년 브루나이 가입에 이어 1995년에 베트남이 가입함으로써 회원국이 ?개 국으로 증가하였으며, 1996년 11월 자카르타에서 개최된 비공식 정상회 의에서 미얀마, 캄보디아, 라오스 3개국을 동시 가입시키기로 결정하여 ASEAN합 동남아 10개국으로 확대하려는 움직임을 보이고 있다.","chapter":1,"section":3,"page":25,"src":"1997 외교백서 제1장.pdf","id":"1996-s00199"},{"year":1997,"admin":"김영삼","text":"안보면에서는 아세안 지역안보포럼(ASEAN Regional Forum: ARF)을 중심으로 동 지역의 다자안보대화가 진행되고 있는데, 1997년도에도 동 포럼을 통해 한반도문제, 남중국해 영유권분쟁, 캄보디아 및 미얀마 정세 등 지역안보 문제와 핵군축, 대인지뢰 등 군축문제가 논의되었다.","chapter":1,"section":1,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00043"},{"year":1998,"admin":"김대중","text":"특히, 동남아시아의 경우, 아세안지역안보포럼(ASEAN Regional Forum：ARF)을 중심으로 안정적 역내 안보구조가 1998년에도 기본적으로 유지되었지만, 캄보디아의 쿠데타 발생, 인도네시아의 Suharto 대통령 하야, 말레이시아 Anwar 전 부총리 축출 등으로 인해 아세안 역내 국가들간의 내부결속력이 이완되는 현상이 노정되었다.","chapter":1,"section":1,"page":1,"src":"1999 외교백서 제1장.doc","id":"1998-s00046"},{"year":1999,"admin":"김대중","text":"대외적으로는 코소보 사태, TMD 개발 문제 등으로 미․일을 비롯한 서방국가들과 갈등을 보였으나, WTO 가입 협상타결을 계기로 이들 국가와의 협력을 도모하는 한편, 동남아시아국가연합(Association of South-East Asian Nations : ASEAN)과의 정상외교를 통한 관계 강화로 지역 강대국으로서의 역할을 모색하였다.","chapter":1,"section":1,"page":1,"src":"2000 외교백서 제1장.hwp","id":"1999-s00042"},{"year":2000,"admin":"김대중","text":"미국, 일본 등 우리 전통 우방국들과의 긴밀한 공조체제 유지와 중국, 러시아, EU, ASEAN 등의 지지 및 건설적인 기여 확보가 그것입니다.","chapter":null,"section":null,"page":1,"src":"2001 외교백서 머리말.hwp","id":"2000-s00003"},{"year":2001,"admin":"김대중","text":"또한, 대외의존도가 높은 우리의 경제여건을 감안하여 다자무역 체제의 확립을 위해 도하개발아젠다 협상이 출범될 수 있도록 다각적인 노력을 전개하는 한편, APEC, ASEAN+3, ASEM 등 지역협력체에도 적극 참여하였습니다.","chapter":9,"section":4,"page":1,"src":"2002 외교백서 발간사_목차.hwp","id":"2001-s00010"},{"year":2002,"admin":"김대중","text":"한편 외교통상부는 APEC, ASEM, ASEAN+3, ARF 등 지역협력체에 능동적으로 참여하였으며, 유엔 총회의장직 수임 및 제2차 민주주의 공동체회의의 서울 개최 등을 통해 범세계적 문제의 해결과 인류보편적 가치의 신장을 위한 국제사회의 노력에 적극 동참하였습니다.","chapter":9,"section":4,"page":1,"src":"2003 외교백서 발간사_목차.hwp","id":"2002-s00008"}],"docCount":111},{"id":"유럽연합","kind":"org","aliases":["유럽연합","EU"],"total":1861,"byYear":{"1991":1,"1992":2,"1993":11,"1994":23,"1995":11,"1996":17,"1997":95,"1998":90,"1999":104,"2000":110,"2001":155,"2002":80,"2003":174,"2004":21,"2005":24,"2006":63,"2007":39,"2008":63,"2009":76,"2010":86,"2011":77,"2012":62,"2 ,{"year":1996,"admin":"김영삼","text":"4. 구주지역 가. 서구지역 1) 구주통합의 진전 1995년 1월을 기해 스웨덴, 오스트리아, 핀랜드가 구주연합(80) 에 가입함으로써, EU 회원국은 15개국으로 확대되었으며 80)는 세계 최대의 교역시장을 형성하게 되었다.","chapter":1,"section":3,"page":67,"src":"1997 외교백서 제1장.pdf","id":"1996-s00504"},{"year":1997,"admin":"김영삼","text":"유럽에서는 유럽연합(European Union: EU)이 암스텔담 정상회의에서 마스트리히트조약을 개정하는 신유럽연합 조약안에 합의하는 등 역내 정치·경제적 통합을 진전시키면서 국제질서 형성에 독자적인 영향력을 확보해 갔다.","chapter":1,"section":1,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00039"},{"year":1998,"admin":"김대중","text":"서유럽에서는 1997년 영국.프랑스.이탈리아에 이어 1998년에도 독일.이탈리아에서 중도좌파 정권이 들어서면서 EU 15개 회원국 중 스페인과 아일랜드를 제외한 13개국에서 중도좌파 정당들이 단독 내지 연정 형태로 집권하였다.","chapter":1,"section":1,"page":1,"src":"1999 외교백서 제1장.doc","id":"1998-s00041"},{"year":1999,"admin":"김대중","text":"경제면에서는 정보.통신분야의 급속한 발전과 세계무역기구(World Trade Organization: WTO)를 중심으로 국가간 상품․자본․서비스 이동의 자유화와 각국 국내시장의 투명성 제고를 통한 경제개방의 가속화로 국경을 초월하는 세계화(globalization)를 진행시키고 있으나, 유럽연합(European Union : EU), 북미자유무역지대(North American Free Trade Area : NAFTA)를 중심으로 하는 지역통합 추세도 보이고 있다.","chapter":1,"section":1,"page":1,"src":"2000 외교백서 제1장.hwp","id":"1999-s00029"},{"year":2000,"admin":"김대중","text":"미국, 일본 등 우리 전통 우방국들과의 긴밀한 공조체제 유지와 중국, 러시아, EU, ASEAN 등의 지지 및 건설적인 기여 확보가 그것입니다.","chapter":null,"section":null,"page":1,"src":"2001 외교백서 머리말.hwp","id":"2000-s00003"},{"year":2001,"admin":"김대중","text":"구주연합(EU)은 2000년 12월 7일～11일 Nice 정상회의에서 채택된 Nice 조약을 통해 EU 확대의 전제 조건인 제도 개혁의 틀을 마무리하고, 2001년 12월 14일～15일 Laeken 정상회의에서는 EU 통합의 가속화와 장기 발전계획 수립을 위한 EU 헌법회의 창설을 골자로 한 Laeken 선언을 채택하는 한편, 2002년 1월부터 유로화 공식 유통에 대비한 준비 작업을 본격화하였다.","chapter":1,"section":1,"page":1,"src":"2002 외교백서 제1장.hwp","id":"2001-s00131"},{"year":2002,"admin":"김대중","text":"봊구봊 계몺뫁 유럽연합(EU)은 2002년 1월 1일 단일통화인 유로(Euro)화를 전면 통용시킨데 이어 12월 13일 체코, 폴란드, 헝가리, 에스토니아, 라트비아, 리투아니아, 슬로바키아, 슬로베니아, 몰타, 키프로스 등 10개국의 신규가입을 확정하였다.","chapter":1,"section":3,"page":10,"src":"2003 외교백서 제1장.hwp","id":"2002-s00130"},{"year":2003,"admin":"노무현","text":"대외적으로 Putin 정부 는 9.11 테러 이후 반테러 협력을 토대로 미∙러간 및 러∙EU간 관계 개 내 참가국들은 서울 각료회의가 우루과이라운드의 막바지 단계, 1992년 80 통합 직전에 개최된다는 점에서 APEC 발전의 중요한 계기가 될 것으로 기대하고 있다.","chapter":3,"section":null,"page":57,"src":"1991 외교백서 제3장.pdf","id":"1990-s00814"},{"year":1991,"admin":"노태우","text":"특히 서울 APEC 선언채택 _ ：。 으로 APECol 앞으로 나가야 할 방향이 설정되었고 향후 발전기반이 마련되었으 며, 중국, 중화민국, 홍콩의 6886 가입 실현으로 &4880은 세계총생산의 절반, 세계총교역량의 40%를 점유하는 경제권으로 확대되어 아ㆍ태 지역의 광역적 협력의 구심체로서의 국제적 위상을 확보하게 되었다.","chapter":1,"section":null,"page":21,"src":"1992 외교백서 제1장.pdf","id":"1991-s00140"},{"year":1992,"admin":"노태우","text":"동시에 유럽 경제지역(884)과 북미자유무역 협정 (NAFTA) 등 지역경제권 형성에 효율적으로 대처하며, APEC함 중심으로 한 아ㆍ태지역 협의체 발전을 도모하고, 유엔 환경개발회의(904080)) 등 국 제환경규범 정립에도 적극 참여하였다.","chapter":1,"section":null,"page":16,"src":"1993 외교백서 제1장.pdf","id":"1992-s00108"},{"year":1993,"admin":"김영삼","text":"지난해 우리 외교는, 전통 우방인 미국과의 두차례에 걸친 정상회담, 가 장 가까운 이웃인 일본과의 경주 정상회담 그리고 씨애틀에서 개최된 APEC 지도자 회의에 즈음한 중국과의 정상회담을 통하여, 우리의 안보와 교역면에서 중요한 세 나라와의 협력관계를 다지는 계기를 마련하였습니다.","chapter":null,"section":null,"page":3,"src":"1994 외교백서 머리말_목차.pdf","id":"1993-s00004"},{"year":1994,"admin":"김영삼","text":"이러한 한ㆍ미 동맹관계의 중요성은 94년 11월 APEC 경제지도자회의 참석계기에 개최된 김영삼 대통령과 클린턴 대통령간의 한ㆍ미 정상회담 에서도 재인식되었다.","chapter":1,"section":3,"page":5,"src":"1995 외교백서 머리말.pdf","id":"1994-s00012"},{"year":1995,"admin":"김영삼","text":"앞으로 아세안과는 아시아ㆍ태평양 경제협력체 (APEC) 등에서의 협력과 함께 상호보완적인 협력을 통해 실 질혐력관계를 더욱 강화해 나갈 것이다.","chapter":1,"section":2,"page":8,"src":"1996 외교백서 제1장.pdf","id":"1995-s00138"},{"year":1996,"admin":"김영삼","text":"또한, 11월에는 제 4차 APEC 정상회의가 개최되어 회원국간 무역ㆍ투자 자유화를 위한 구체적 인 실행계획인 마닐라 행동계획([^2&) 이 채택되었다.","chapter":1,"section":1,"page":7,"src":"1997 외교백서 제1장.pdf","id":"1996-s00090"},{"year":1997,"admin":"김영삼","text":"한편, WTO를 통한 다자주의 추세와는 별도로 APEC, ASEM, EU, NAFTA 등 지역 단위로 협력을 추구하는 지역주의화 추세 역시 여전히 지속되고 그 기능 또한 꾸준히 확대 심화되어 오고 있음도 사실이다.","chapter":1,"section":1,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00056"},{"year":1998,"admin":"김대중","text":"또한, APEC, ASEM 등을 통한 지역 및 지역간 경제협력 활동에서도 주도적 역할을 수행하였습니다.","chapter":null,"section":null,"page":1,"src":"1999 외 n":"김영삼","text":"그리고 미국, 일본, 이스라엘, 폴란드 등 과학기술 선진국 및 동구권 국가와는 과학기술 또는 원자력 분야에서의 협력을 확대하고 있으며, 주 요 자원 보유국인 러시아와는 사하 가스전 등 에너지개발 사업을, 중국, 30 / 제장 우리 외교정책의 기조와 목표 호주, 인도네시아 등 연안국과는 어업협력을 계속 확대해 나가고 있다.","chapter":1,"section":2,"page":9,"src":"1996 외교백서 제1장.pdf","id":"1995-s00150"},{"year":1996,"admin":"김영삼","text":"마. 대양주 지역 1) 지역 정세 호주, 뉴질랜드, 파푸아뉴기니, 휘지, 기타 다수의 소규모 도서국가 및 자치령으로 구성된 대양주 지역은 미국, 영국 등 전통적인 우방과의 50 / 제 ]장 국제정세 및 한반도 주변정세 친선관계를 유지하는 가운데, 역동적인 경제발전을 시현하고 있는 동아시 아 지역과의 협력 강화를 적극적으로 추진하였다.","chapter":1,"section":3,"page":41,"src":"1997 외교백서 제1장.pdf","id":"1996-s00316"},{"year":1997,"admin":"김영삼","text":"우선 1947년 출범한 남태평양 위원회(South Pacific Commission : SPC)의 26개 회원국들은 97년 10월 19일∼21일간 호주의 캔버라에 모여 남태평양 지역의 최대·최고지역기구의 탄생 50주년 기념행사를 대대적으로 거행하였다.","chapter":1,"section":3,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00289"},{"year":1998,"admin":"김대중","text":"한편, 인권유린국가라는 이미지를 불식하기 위해 왕단과 같은 민주화 인사를 석방하고, 영국 및 호주 등 주요 서방국과 적극적 인권대화를 추진하는 등의 노력을 기울이기도 하였다.","chapter":1,"section":3,"page":1,"src":"1999 외교백서 제1장.doc","id":"1998-s00238"},{"year":1999,"admin":"김대중","text":"1999년중 개최 된 미국, 일본, 러시아, 몽골, 호주, 뉴질랜드 등과의 정상희담과 외 무장관회담을 통해 우리의 정책과 노력에 대한 국제적 지지를 확인 하였고, 특히 최초로 개최된 456&ㅅ18 + 한ㆍ중ㆍ일 정상희담을 통 해 우리의 포용정책에 대한 주변국들의 이해와 지지를 굳혔습니다.","chapter":null,"section":null,"page":2,"src":"2000 외교백서 머리말.pdf","id":"1999-s00010"},{"year":2000,"admin":"김대중","text":"1999년이래 아프리카 등지에서 공관 축소를 단행하고 유럽 미주 등 서방접근을 강화하는 등 실리지향의 신 외교노선을 추구하여 온 북한은 2000년도에는 이탈리아와 대사급 외교관계 수립을 시작으로 오스트레일리아와 국교를 재개하고 필리핀, 영국과 국교를 수립했으며, 기타 구주연합(EU) 국가들과도 활발한 접촉을 시도했다.","chapter":1,"section":2,"page":1,"src":"2001 외교백서 제1장.hwp","id":"2000-s00155"},{"year":2001,"admin":"김대중","text":"호주는 주택경기의 활성화를 중심으로 시드니 올림픽이후 다소 침체되었던 내수를 회복하고 상반기부터 수출 증가 및 흑자 기조를 유지하여 약 2%의 경제성장을 이룰 수 있었다.","chapter":1,"section":1,"page":1,"src":"2002 외교백서 제1장.hwp","id":"2001-s00194"},{"year":2002,"admin":"김대중","text":"8) 몰디브 몺교봊 씵몽고 호주와 뉴질랜드는 또한 도서국가의 자산인 천연자원(임업, 광업, 수산업)에 대한 남획문제에 공동 대응할 것을 주창하고 도서국가의 권익보호를 위해 노력하고 있다.","chapter":1,"section ter":1,"section":1,"page":7,"src":"1997 외교백서 제1장.pdf","id":"1996-s00088"},{"year":1997,"admin":"김영삼","text":"전반적인 국제경제의 측면에서는 경제적 상호의존성 증대와 국제투자의 급속한 확대 등 경제의 세계화 현상이 가속되는 가운데 WTO 중심의 교역체제가 어느 정도 정착하고 WTO가 자유화 협상 및 새로운 의제에 대한 논의를 주도해 나감에 따라 그 위상이 점차 강화되고 있다.","chapter":1,"section":1,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00053"},{"year":1998,"admin":"김대중","text":"이와 함께 국제사회의 책임있는 일원으로서 인류 보편적 가치를 추구하고 우리의 위치에 상응한 역할을 수행한다는 목표하에 UN 등 다자외교 활동에 적극 참여하였으며, WTO, OECD 등에의 참여를 통해 우리경제의 세계화와 경쟁력 강화에도 노력하였습니다.","chapter":null,"section":null,"page":1,"src":"1999 외교백서 머리말.doc","id":"1998-s00010"},{"year":1999,"admin":"김대중","text":"경제면에서는 정보.통신분야의 급속한 발전과 세계무역기구(World Trade Organization: WTO)를 중심으로 국가간 상품․자본․서비스 이동의 자유화와 각국 국내시장의 투명성 제고를 통한 경제개방의 가속화로 국경을 초월하는 세계화(globalization)를 진행시키고 있으나, 유럽연합(European Union : EU), 북미자유무역지대(North American Free Trade Area : NAFTA)를 중심으로 하는 지역통합 추세도 보이고 있다.","chapter":1,"section":1,"page":1,"src":"2000 외교백서 제1장.hwp","id":"1999-s00029"},{"year":2000,"admin":"김대중","text":"또한, 새로운 국제통상 환경에 맞는 새로운 무역질서 수립을 위해 포괄적인 의제의 WTO 뉴라운드 협상이 조기 출범되도록 하기 위한 노력을 전개하였으며, OECD 등 다자 차원의 새로운 규범 제정 과정에도 적극 참여해 나갔습니다.","chapter":null,"section":null,"page":1,"src":"2001 외교백서 머리말.hwp","id":"2000-s00007"},{"year":2001,"admin":"김대중","text":"이러한 자유주의적 경제질서는 1999년 시애틀 WTO 각료회의를 계기로 본격화되기 시작한 반세계화 시위와 9.11 테러사태로 인해 어느 정도 제동이 걸리게 되었다.","chapter":1,"section":1,"page":1,"src":"2002 외교백서 제1장.hwp","id":"2001-s00145"},{"year":2002,"admin":"김대중","text":"아울러 WTO 도하개발아젠다 협상의 본격화에 대비하여 범국민적인 협상 체제를 수립하였고, 우리나라 최초의 자유무역협정인 한․칠레 FTA를 체결하였습니다.","chapter":9,"section":4,"page":1,"src":"2003 외교백서 발간사_목차.hwp","id":"2002-s00007"},{"year":2003,"admin":"노무현","text":"외교통상부는 우리 경제가 2만 달러 시대로의 도약을 할 수 있도록 지속적인 대외 개방 정책을 지향하면서 WTO 도하개발아젠다 협상 과정 에서 우리의 입장을 최대한 반영하기 위하여 노력하였으며, 해외시장 개척과 외국인 투자 유치를 지원하는 데에도 적극적인 노력을 기울였 습니다.","chapter":null,"section":null,"page":2,"src":"2004 외교백서 발간사_목차.pdf","id":"2003-s00011"},{"year":2004,"admin":"노무현","text":"아울러 세계경제의 개방화와 지역화 추세라는 패러다임 변화에 대응하기 위해 WTO 도 하개발아젠다 협상에 적극적으로 참여하고, 동시다발적인 FTA를 추진하는 등 우리 경 제의선진개방경제화를위해노력했으며, 이러한노력이국민들이체감할수있는실질 적인일자리창출로이어질수있도록하는경제∙통상외교를활발히펼쳤습니다.","chapter":null,"section":null,"page":3,"src":"2005 외교백서 발간사_목차.pdf","id":"2004-s00007"},{"year":2005,"admin":"노무현","text":"FTA 체결, WTO 도하개 발어젠다(DDA) 협상 과정에서 외교통상부는 국민적 이해와 합의를 구하기 위해 노력하는 동 시에 우리 국익을 최대한 실현하는 방향으로 협상에 임하였습니다.","chapter":null,"section":null,"page":7,"src":"2006 외교백서 발간사_목차.pdf","id":"2005-s00011"},{"year":2006,"admin":"노무현","text":"3. 한반도 및 동북아 정세 2006년 동북아 지역은 북한 핵문제 및 역내 국가간 역사인식, 영유권 주장 등 잠재적 갈등 요인이 상존하는 가운데, 미국 주도의 대테러·비확산 정책에 대한 공감대가 확산되고 5) WTO 회원국중 농업 및 비농산물 분야 협상을 주도하는 6개국 : 미국, EC, 인도, 브라질, 호주, 일본 제 1 절 국제 정세 개관 19 한·중·일 3국간 협력이 활성화되는 등 주요 국가간 전략적 견제와 공조가 병존하는 양상이 지속되었다.","chapter":1,"section":1,"page":5,"src":"2007 외교백서 제1장.pdf","id":"2006-s00173"}],"docCount":94},{"id":"OECD","kind":"org","aliases":["경제협력개발기구","OECD"],"total":806,"byYear":{"1989":4,"1990":4,"1991":11,"1992":6,"1993":17,"1994":2,"1995":6,"1996":8,"1997":56,"1998":44,"1999":50,"2000":43,"2001":106,"2002":35,"2003":42,"2004":1,"2005":4,"2006":18,"2007":31,"2008":13,"2009":20,"2010":18,"2011":29,"2012":26,"2013":20,"2014":26,"2015":28,"2016":16,"2017":3,"2018":19,"2019":2,"2020":14,"2021":24,"2022":18,"2023":12,"2024":14,"2025":16},"rateByYear":{"1989":26.6,"1990":30.0,"1991":92.6,"1992":47.1,"1993":134.9,"1994":15.0,"1995":42.9,"1996":48.2,"1997":256.3,"1998":175.2,"1999":200.0,"2000":171.9,"2001":333.6,"2002":249.6,"2003":144.6,"2004":36.2,"2005":34.3,"2006":117.6,"2007":227.1,"2008":82.6,"2009":118.4,"2010":90.5,"2011":160.0,"2012":125.0,"2013":113.1,"2014":111.3,"2015":128.2,"2016":199.8,"2017":22.7,"2018":113.3,"2019":11.0,"2020":62.5,"2021":139.5,"2022":94.9,"2023":54.4,"2024":69.1,"2025":87.6},"byAdmin":{"김대중":278,"이명박":106,"노무현":96,"박근혜":90,"김영삼":89,"문재인":62,"윤석열":44,"노태우":25,"이재명":16},"focus":0.34,"first":1989,"last":2025,"peak":2001,"peakRate":"2001","docs":[{"year":1989,"admin":"노태우","text":"4. 경제협력개발기구(OECD)외화 협력 0801와의 협력문제는 1970년대 후반 한국을 비롯한 신흥공업국들의 경 제가 급속히 성장하고 철강, 조선 등 \\종사따에서 아국 등 중진국의 시설확 102 제3장 실리외교 추구반 풋미롤쑥에의 기여 장 및 경쟁력 제고를 통한 세계시장 진출이 두드러지게 되자 이들 부문에 있어서 선진국과 신홍공업국간의 협조체제량 마련한다는 취지하에 08022측 의 주도로 1978년을 전후하여 최초로 제기 되었다.","chapter":3,"section":null,"page":22,"src":"1990 외교백서 제3장.pdf","id":"1989-s00726"},{"year":1990,"admin":"노태우","text":"제1위 경제‧통상외교。103 4. 경제협력개발기구(OECD) 와의 협력 가. 0OECD-ANICs Workshop 1989종 1월24일-25일 기간중 전세계의 관심속에 치루어졌던 0801와 선발개 도국간의 \\속표빨릅는 그 포럼이 갖는 비공식적 성격이, 선진국과 선발개도국 간의 이슈화되어 있던 무역 마찰 및 구조조정등의 문제와 관련, 사안의 민감성을 중화시키는 유력한 수단이 된다는 점에 참가자들의 견해가 일치하여 1990년 2월-4윌에 걸쳐 4회에 걸친 정책대화(Workshop) 프로그램으로 발전하였다.","chapter":3,"section":null,"page":20,"src":"1991 외교백서 제3장.pdf","id":"1990-s00612"},{"year":1991,"admin":"노태우","text":"한편, 지역경제 블럭화 등 새로운 국제경제질서 경향에 대처하면서 태평양 연안 협력을 발전시켜 나가기 위하여 아ㆍ태 경제 협력체 구성을 점진적으로 추진하고 미국ㆍ일본을 중심으로 하는 아ㆍ태 경제권과 중국ㆍ러시아 등 북방 경제권간의 가교 역할을 모색헤 나가겠으며 1990년대 후반에는 선진국 그룹인 경제협력개발기구(0+[881712814101ㅁ of 선conomic Cooperation and Development : 0861))에 가입하여 선진 경제권 진입을 실현하고자 한다.","chapter":1,"section":null,"page":24,"src":"1992 외교백서 제1장.pdf","id":"1991-s00150"},{"year":1992,"admin":"노태우","text":"제1절 경제‧통상 가조 . 89 “4. 경제협력개발기구 (0800))와의 협력 가 요 1992년은 우리의 대0800 접근의 실질적인 전기를 마련한 해였다.","chapter":3,"section":null,"page":27,"src":"1993 외교백서 제3장.pdf","id":"1992-s00514"},{"year":1993,"admin":"김영삼","text":"_, , 제 8 절 경제협력 외교 / 167 제 3 절 경제협력 외교 1. 0801)와의 협력 가. 개 요 1991년 10월 Paye OECD 사무총장 방한시, 우리 정부는 “90넌대 중반 가입추진\" 이라는 원칙적인 입장을 표명 (대통령. 외무장관)하였으며, 1992 년 4월 OECD 가입의사를 공식적으로 표명함으로써, ()00)]1)와의 협력관계 가 활발하게 전개되기 시작하였다.","chapter":5,"section":2,"page":24,"src":"1994 외교백서 제5장.pdf","id":"1993-s00920"},{"year":1994,"admin":"김영삼","text":"제 3절 선진경제 진입 준비 / 151 제 3절 선진경제 진임 준비 1. 0801 가입 준비 { 가 개 요 1991년 10월 8876 OECD 사무총장 방한시 우리정부가 \"90년대 중반 가입추진\"이라는 원칙적인 입장을 표명한 이래 0801 조사단 파견, 0801 산하 위원회 참가 확대, 0801)/주요개도국간 워크샵 참여, 08601 고위인사 방한 등을 통해 0801와의 협력관계를 심화시켜 왔다.","chapter":4,"section":3,"page":23,"src":"1995 외교백서 제4장.pdf","id":"1994-s00845"},{"year":1995,"admin":"김영삼","text":"더 나아가 우리는 국민총생산 세계11위, 교역규모 세계18위의 국력에 걸맞게 경제협력개발기구(0801) 가입을 추진하면서 국내 경제 제도의 선진화를 이끌었습니다.","chapter":null,"section":null,"page":4,"src":"1996 외교백서 머리말_목차.pdf","id":"1995-s00010"},{"year":1996,"admin":"김영삼","text":"제4장 200. 1996넌도 분야별 외교활동 제 Ｌ절 경제ㆍ통상 외교 / 155 제 1절 .경제ㆍ통상 외교 1. 경제협력개발기구(0801)) 가입 가. 0600 가입을 위한 기반 조성 1991년 10월 2876 OECD 사무총장의 한국 방문시 우리 정부가 \"1990 년대 중반 0801)가입 추진”이라는 원칙적인 입장을 표명한 이래 우리 나라는 0801)조사단 파견, 080)])산하위원회 참가 확대, 0801와 주요 개도국간 워크샵 참여, 0801고위인사 및 사무국 관계자들의 방한 등을 통해 0801와의 협력관계를 심화시켜 왔다.","chapter":4,"section":null,"page":1,"src":"1997 외교백서 제4장.pdf","id":"1996-s00921"},{"year":1997,"admin":"김영삼","text":"또한 OECD 다자간 투자협정(MAI) 협상 등에 본격적으로 참여함으로써 OECD 외교활동도 적극 전개하였습니다.","chapter":null,"section":null,"page":1,"src":"1998 외교백서 머리말.doc","id":"1997-s00008"},{"year":1998,"admin":"김대중","text":"이와 함께 국제사회의 책임있는 일원으로서 인류 보편적 가치를 추구하고 우리의 위치에 상응한 역할을 수행한다는 목표하에 UN 등 다자외교 활동에 적극 참여하였으며, WTO, OECD 등에의 참여를 통해 우리경제의 세계화와 경쟁력 강화에도 노력하였습니다.","chapter":null,"section":null,"page":1,"src":"1999 외교백서 머리말.doc","id":"1998-s00010"},{"year":1999,"admin":"김대중","text":"호주의 경우는 아시아 경제위기에도 불구하고 OECD 국가들중 최고인 4% 이상의 GDP성장률을 보이고 있는 데 반해, 대부분 국가들은 아시아 경제위기의 영향으로 경기침체를 겪었으며, 경기침체와 공적 개발원조(ODA) 축소라는 새로운 경제여건하에서 경제개발 및 제도개혁에 중점을 두는 등 경제개혁에 관심을 가지고 경제문제에 관한 역내협력문제에 역점을 두었다.","chapter":1,"section":3,"page":1,"src":"2000 외교백서 제1장.hwp","id":"1999-s00284"},{"year":2000,"admin":"김대중","text":"또한, 새로운 국제통상 환경에 맞는 새로운 무역질서 수립을 위해 포괄적인 의제의 WTO 뉴라운드 협상이 조기 출범되도록 하기 위한 노력을 전개하였으며, OECD 등 다자 차원의 새로운 규범 제정 과정에도 적극 참여해 나갔습니다.","chapter":null,"section":null,"page":1,"src":"2001 외교백서 머리말.hwp","id":"2000-s00007"},{"year":2001,"admin":"김대중","text":"아울러 WTO와 경제개발협력기구(OECD) 등의 국제기구에서 이루어지고 있는 다자규범 논의에서 우리의 입장을 최대한 반영하기 위해 노력하였으며, 환경, 투자, 경쟁정책, 노동기준, 부패방지, 전자상거래 등 새로운 이슈와 G20회의 등 국제금융질서 개편을 위한 국제적 논의에도 적극적으로 참여하였다.","chapter":2,"section":2,"page":1,"src":"2002 외교백서 제2장.hwp","id":"2001-s00894"},{"year":2002,"admin":"김대중","text":"2) 호 주 2001년 11월 총선에서 압승함으로써 출범한 제3기 Howard 정부(자유당 국민당 연립정부)는 OECD 국가중 높은 경제성장을 지속적으로 실현하고 테러 및  및 지역분쟁을 조장하는 요인이 일부 제3세계 국가들에 의한 국제적 테러의 위험성을 중대시키는 동시에, 이들 국가의 핵무기 등 첨단무기의 개발ㆍ수입 노력 증대 및 미국, 러시아연방, 영국, 프랑스, 중국 등 군사대국들의 이들 제3세계 국가들에 대한 무기판매가 이러한 지역분쟁을 확대시켜 1990년대 국제질서의 안정 유지에 역기능적으로 6 제1장 국은질서 회[이과 우리 외교정책 방향 작용할 가능성도 잔존하고 있다.","chapter":1,"section":null,"page":5,"src":"1992 외교백서 제1장.pdf","id":"1991-s00052"},{"year":1992,"admin":"노태우","text":"서유럽 경제도 독일경제의 성장세가 크게 둔화되고 영국경제가 전년에 이어 2년 연속 마이너스 성장을 기록하는등 대다수의 국가가 부진을 면치. 못하였다.","chapter":3,"section":null,"page":1,"src":"1993 외교백서 제3장.pdf","id":"1992-s00380"},{"year":1993,"admin":"김영삼","text":"또 12월에 영국과 아일랜드는 북아일랜드 문제해결의 실 마리를 찾게 되었다, 그러나 유고슬라비아, 특히 보스니아와 구소련 일부지 역에서 분쟁이 격화되었다.","chapter":2,"section":1,"page":6,"src":"1994 외교백서 제2장.pdf","id":"1993-s00084"},{"year":1994,"admin":"김영삼","text":"라. 대양주지역 1) 지역정세 호주, 뉴질랜드, 휘지, 파푸아뉴기니, 기타 다수의 소도서국 및 자치 령으로 구성된 대양주 지역은 미국, 영국 등 전통적 우방국가와의 친선관 계를 유지하고 있으며, 아시아지역과의 협력관계를 강화하고 있다.","chapter":2,"section":3,"page":28,"src":"1995 외교백서 제2장.pdf","id":"1994-s00343"},{"year":1995,"admin":"김영삼","text":"마. 대양주 지역 1) 지역정세 호주, 뉴질랜드, 휘지, 파푸아뉴기니, 기타 다수의 소도서국 및 자치 령으로 구성된 대양주 지역은 미국, 영국 등 전통적인 우방국가와의 친선 관계를 유지하는 가운데, 역동적인 경제발전을 시현하고 있는 아시아 지 역과의 협력관계 강화를 적극적으로 추진하고 있다.","chapter":2,"section":3,"page":39,"src":"1996 외교백서 제2장.pdf","id":"1995-s00425"},{"year":1996,"admin":"김영삼","text":"선진국의 고용사정은 미국과 영국을 제외한 대부분의 국가에서 지난 해보다 악화된 반면, 물가는 임금 및 국제원자재 가격의 안정과 수요 부진 등을 반영하여 대체로 안정된 모습 을 나타내었다.","chapter":1,"section":1,"page":6,"src":"1997 외교백서 제1장.pdf","id":"1996-s00082"},{"year":1997,"admin":"김영삼","text":"아울러, 중국은 97년 7월 1일을 기해 영 중간 최대 외교현안인 동시에 세계적 관심사이었던 홍콩 주권회복을 \"1국 2체제\" 및 \"홍콩인에 의한 홍콩통치\" 방식에 입각해 순조롭게 마무리 지음으로써, 156년간 영국의 홍콩 식민통치에 종지부를 찍고 중국의 대외적 위상을 제고하는 계기가 되었다.","chapter":1,"section":3,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00191"},{"year":1998,"admin":"김대중","text":"서유럽에서는 1997년 영국.프랑스.이탈리아에 이어 1998년에도 독일.이탈리아에서 중도좌파 정권이 들어서면서 EU 15개 회원국 중 스페인과 아일랜드를 제외한 13개국에서 중도좌파 정당들이 단독 내지 연정 형태로 집권하였다.","chapter":1,"section":1,"page":1,"src":"1999 외교백서 제1장.doc","id":"1998-s00041"},{"year":1999,"admin":"김대중","text":"정치적으로 서유럽은 좌파정부가 우세를 보인 가운데, 영국, 프랑스, 독일을 중심으로「제3의 길」을 표방하는 신중도좌파 노선에 대한 활발한 토의가 이루어졌다.","chapter":1,"section":1,"page":1,"src":"2000 외교백서 제1장.hwp","id":"1999-s00051"},{"year":2000,"admin":"김대중","text":"한편, EU 전 회원국의 유럽통화동맹(European Monetary Union：EMU) 가입문제도 유럽 통합에 있어 주요한 과제가 되고 있는 바, 2000년 1월 1일 그리스의 EMU 가입으로 유로화 가입국이 12개국으로 늘어나면서 스웨덴과 영국의 EMU 가입여부가 유럽통합과 관련한 난제로 부상하였다.","chapter":1,"section":1,"page":1,"src":"2001 외교백서 제1장.hwp","id":"2000-s00049"},{"year":2001,"admin":"김대중","text":"한편, EU 전 회원국의 구주경제통화동맹(Economic and Monetary Union: EMU) 가입 문제도 유럽 통합에 있어 주요한 과제가 되고 있는 가운데, 2000년 1월 1일 그리스의 EMU 가입으로 유로화 가입국이 12개국으로 늘어났으나, 영국․덴마크․스웨덴이 가입을 유보하고 있다.","chapter":1,"section":1,"page":1,"src":"2002 외교백서 제1장.hwp","id":"2001-s00134"},{"year":2002,"admin":"김대중","text":"뽖몽뫆 뭥뫔부 몾몬콂 ) 미국과 영국은 2003년 2월 중순이후 이라크에 대한 군사공격 승인을 요청하는 새 안보리 결의안 상정을 추진하기 시작하고 아라크내 군사기지들을 물색하는 등 전쟁준비를 가속화하였다.","chapter":1,"section":3,"page":10,"src":"2003 외교백서 제1장.hwp","id":"2002-s00191"}],"docCount":110},{"id":"베트남","kind":"country","aliases":["베트남"],"total":676,"byYear":{"1989":7,"1990":4,"1991":12,"1992":19,"1993":18,"1994":28,"1995":23,"1996":19,"1997":20,"1998":20,"1999":14,"2000":17,"2001":45,"2002":7,"2003":16,"2004":3,"2005":7,"2006":24,"2007":13,"2008":9,"2009":13,"2010":26,"2011":12,"2012":20,"2013":18,"2014":22,"2015":16,"2016":6,"2017":25,"2018":28,"2019":21,"2020":29,"2021":23,"2022":25,"2023":24,"2024":19,"2025":24},"rateByYear":{"1989":46.6,"1990":30.0,"1991":101.0,"1992":149.3,"1993":142.9,"1994":209.7,"1995":164.3,"1996":114.5,"1997":91.5,"1998":79.6,"1999":56.0,"2000":68.0,"2001":141.6,"2002":49.9,"2003":55.1,"2004":108.7,"2005":60.0,"2006":156.9,"2007":95.2,"2008":57.2,"2009":77.0,"2010":130.7,"2011":66.2,"2012":96.2,"2013":101.8,"2014":94.1,"2015":73.3,"2016":74.9,"2017":189.0,"2018":167.0,"2019":115.8,"2020":129.5,"2021":133.7,"2022":131.9,"2023":108.8,"2024":93.7,"2025":131.4},"byAdmin":{"문재인":126,"김영삼":108,"김대중":103,"이명박":80,"윤석열":68,"노무현":63,"박근혜":62,"노태우":42,"이재명":24},"focus":0.19,"first":1989,"last":2025,"peak":2001,"peakRate":"1994","docs":[{"year":1989,"admin":"노태우","text":"이러한 미ㆍ소의 대외정책경향은 주 련군의 아프가니스탄에서의 철수(1989. 2.), 베트남군의 캄보디아에서의 철 수(1989. 9.) 및 소련의 대리군으로서 앙골라에 주둔하고 있던 쿠바군의 철 수 등으로 지역분쟁의 해소 및 세계의 긴장완화에 순기능적e오 기여하고 있다.","chapter":1,"section":null,"page":2,"src":"1990 외교백서 제1장.pdf","id":"1989-s00056"},{"year":1990,"admin":"노태우","text":"특히 「공산당지배체제」의 원칙을 고수하고 있는 중국, 베트남, 북한 등 [아시아 레닌주의국가들] (Asian Leninist States) 의 경우에도 각국의 사정에 따라 정도의 차이는 있겠지만 중장기적 관점에서 볼 때 동구 및 소런의 변혁으로부터 직ㆍ간접적인 영향을 받게될 것으로 보인다.","chapter":1,"section":null,"page":6,"src":"1991 외교백서 제1장.pdf","id":"1990-s00043"},{"year":1991,"admin":"노태우","text":"그러나 범세계적인 공산주의 세력의 몰락에도 불구하고 북한, 베트남 등 아시아 레닌주의 국가가 존속하고 있는 상황에서 중국의 사회주의 체제 고수 여부는 아ㆍ태지역 정세에 영향을 미칠 중요한 요인이라고 할 수 있다.","chapter":1,"section":null,"page":3,"src":"1992 외교백서 제1장.pdf","id":"1991-s00042"},{"year":1992,"admin":"노태우","text":"또한 우리나라와 베트남 양국은 18월 22일자로 대사급 외교관계를 수립 하기로 합의하였다.","chapter":1,"section":null,"page":15,"src":"1993 외교백서 제1장.pdf","id":"1992-s00102"},{"year":1993,"admin":"김영삼","text":"시장경제개혁은 중국, 베트남, 라오스 등 아시아 사회주의권 뿐만 아니라 인도 등 서남아시아와 에티오피아와 가나 등 아프리카에서도 성공적으로 이 루어지고 있는 반면, 구 동구권에서는 체코와 헝가리를 제외하고는 전반적 으로 부진을 면치 못하고 있다.","chapter":2,"section":1,"page":5,"src":"1994 외교백서 제2장.pdf","id":"1993-s00077"},{"year":1994,"admin":"김영삼","text":"러시아, 중국, 베트남 등과는 시장 다변화, 안정적인 자원공급 확보 등 상호 보완적인 협력관계를 위한 외교노력을 경주하였으며, 아울러 장 기적인 관점에서 원유와 가스, 주요 원자재 및 어업자원의 지속적 확보를 위한 노력도 강화하였다.","chapter":1,"section":2,"page":9,"src":"1995 외교백서 머리말.pdf","id":"1994-s00046"},{"year":1995,"admin":"김영삼","text":"한편 1995년에는 Do 14001 베트남 당서기장 방한과 1995년 10월 라오 스와의 수교 실현을 통해 인도차이나 진출 기반을 확충하는 한편, 향후 캄보디아와의 수교 여건을 조성하였으며, 남태평양포럼 (588) 의 대화상 대국 지위를 획득함으로써 대양주 국가들과의 관계를 증진시켰다.","chapter":1,"section":3,"page":11,"src":"1996 외교백서 제1장.pdf","id":"1995-s00162"},{"year":1996,"admin":"김영삼","text":"1967년 말레이지아, 인 도네시아, 태국, 필리핀 및 싱가포르 5개국으로 출범한 ASEAN위 1984 년 브루나이 가입에 이어 1995년에 베트남이 가입함으로써 회원국이 ?개 국으로 증가하였으며, 1996년 11월 자카르타에서 개최된 비공식 정상회 의에서 미얀마, 캄보디아, 라오스 3개국을 동시 가입시키기로 결정하여 ASEAN합 동남아 10개국으로 확대하려는 움직임을 보이고 있다.","chapter":1,"section":3,"page":25,"src":"1997 외교백서 제1장.pdf","id":"1996-s00199"},{"year":1997,"admin":"김영삼","text":"APEC 회원국 확대와 관련해서도 1997년 벤쿠버 정상회의에서 러시아, 베트남, 페루의 가입이 결정되어 1998년 쿠알라룸푸르 각료회의 및 정상회의시 부터 정회원으로 참가하게 됨에 따라 다양성이 심화되는 동시에 APEC내 한 중 일 러 중심의 북서태평양권의 영향력이 증대될 것으로 예상되고 있다.","chapter":1,"section":1,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00058"},{"year":1998,"admin":"김대중","text":"한편, 아시아 지역에서 일본 외교의 입지 강화를 위해 오부치 총리가 1998년 12월 베트남 방문시 아세안+3(한.중.일)회의에 참석하고, 대아시아 외교정책 연설을 통해 '비젼 2020 일.아세안 협의회' 설치를 제안하는 등 대아세안 외교 강화에도 중점을 두었다.","chapter":1,"section":3,"page":1,"src":"1999 외교백서 제1장.doc","id":"1998-s00211"},{"year":1999,"admin":"김대중","text":"한편, 동북아 지역 차원에서 러시아는 1998년 9월 모스크바 일.러 정상회담, 1999년 12월 베이징 중.러 정상회담, 1999년 3월 「북.러 우호.선린 및 협력에 관한 조약」 가조인, 2000년 2월의 Ivanov 러시아 외무장관의 북한, 일본, 베트남 방문 등을 통해 러시아가 동북아 정세변화 과정에서 소외될 수 없는 강국이며, 러시아의 경제난에도 불구하고 러시아와의 협력 없이는 지역정세의 안정을 꾀할 수 없다는 점을 미국에게 인식시키려 하였다.","chapter":1,"section":2,"page":1,"src":"2000 외교백서 제1장.hwp","id":"1999-s00113"},{"year":2000,"admin":"김대중","text":"베트남은 1997년 아시아 경제위기의 영향, 베트남내 부실국영 기업과 부실금융기관문제 등으로 1998년과 1999년에는 각각 5% 전후의 저성장추세를 보였고, 2000년에는 연초 목표인 4.8%～5.2%를 상회하는 6.7%의 성장을 이룩하였으나, 금융개혁부진과 부실기업정리문제 등이 남아 있는 실정이다.","chapter":1,"section":3,"page":1,"src":"2001 외교백서 제1장.hwp","id":"2000-s00227"},{"year":2001,"admin":"김대중","text":"베트남은 그동안 공산당 1당체제(집단지도체제)를 유지하면서 정치체제의 부분적 수정을 통해 신중한 개혁정책을 추진해 온 바, 2001년도에도 사회주의 노선 및 공산당 1당체제 견지 등 정치체제상의 급속한 변화는 없었다.","chapter":1,"section":3,"page":1,"src":"2002 외교백서 제1장.hwp","id":"2001-s00369"},{"year":2002,"admin":"김대중","text":"뭆구봊 베트남은 그동안 공산당 1당 체제(집단지도체제)를 유지하면서 정치체제의 부분적 수정을 통해 신중한 개혁정책을 추진해 왔으며, 2002년도에도 사회주의 노선과 공산당 1당 체제를 견지하여 정치체제상의 급속한 변화는 없었다.","chapter":1,"section":3,"page":10,"src":"2003 외교백서 제1장.hwp","id":"2002-s00245"}],"docCount":111},{"id":"독일","kind":"country","aliases":["獨逸","독일","서독","동독"],"total":659,"byYear":{"1989":35,"1990":47,"1991":21,"1992":20,"1993":9,"1994":12," "page":1,"src":"1993 외교백서 제1장.pdf","id":"1992-s00012"},{"year":1993,"admin":"김영삼","text":"경기 침체는 미국, 일본, 캐나다 등지에서 정치 지도자의 교체를 가져온 큰 요인 이 되었는바 1994년에 선거를 앞두고 있는 독일, 이태리 등 서방 주요국가 들의 집권당은 낮은 지지율로 고심하고 있다.","chapter":2,"section":1,"page":3,"src":"1994 외교백서 제2장.pdf","id":"1993-s00056"},{"year":1994,"admin":"김영삼","text":"한편, 1994년도 독일의 경제는 93년의 마이너스 성장으로부터 확고한 회복ㆍ상승국면을 보였다.","chapter":2,"section":3,"page":48,"src":"1995 외교백서 제2장.pdf","id":"1994-s00464"},{"year":1995,"admin":"김영삼","text":"이밖에 독일 성기 동아시아 박물관 및 뉴욕 메트로폴리탄 박물관과 한국실 설치를 위한 약정서를 체결하였다.","chapter":1,"section":3,"page":13,"src":"1996 외교백서 제1장.pdf","id":"1995-s00174"},{"year":1996,"admin":"김영삼","text":"： 이밖에 북한은 영국, 독일, 프랑스 등 구주국가와의 수교문제도 중점 타진하였으나 성과를 거두지 못했으며, 고위인사 순방을 통해 서구국가로 부터의 대북투자유치와 동남아 지역국가들과의 교역증진을 추진하였다.","chapter":1,"section":2,"page":15,"src":"1997 외교백서 제1장.pdf","id":"1996-s00144"},{"year":1997,"admin":"김영삼","text":"요컨대 1997년도에 러시아는 미국, 중국, 일본, 독일 등 14개국 정상들과 회담을 가졌으며, 서방 선진국 정상회담(G-7)에 정식회원으로 가입하였다.","chapter":1,"section":1,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00036"},{"year":1998,"admin":"김대중","text":"서유럽에서는 1997년 영국.프랑스.이탈리아에 이어 1998년에도 독일.이탈리아에서 중도좌파 정권이 들어서면서 EU 15개 회원국 중 스페인과 아일랜드를 제외한 13개국에서 중도좌파 정당들이 단독 내지 연정 형태로 집권하였다.","chapter":1,"section":1,"page":1,"src":"1999 외교백서 제1장.doc","id":"1998-s00041"},{"year":1999,"admin":"김대중","text":"러시아 및 브라질의 경제위기로 수출이 급감하였던 독일과 이탈리아 역시 하반기부터 경기회복 추세를 보였으며, 상대적으로 양호한 경제실적을 기록했던 프랑스도 1998년 하반기부터 경기둔화 조짐을 보였으나 1999년 하반기부터 회복세로 접어들었다.","chapter":1,"section":1,"page":1,"src":"2000 외교백서 제1장.hwp","id":"1999-s00050"},{"year":2000,"admin":"김대중","text":"니스 정상회의 결과, 독일은 프랑스, 영국 등과 동일한 이사회 투표수를 보유하게 되었으나, 구주의회에서는 99석이라는 최대의 의석수를 확보함으로써 독일의 위상이 제고되었으며, 또한 앞으로 EU가 중 동구로 확대될 경우 독일의 영향력은 더욱 강화될 것으로 예상된다.","chapter":1,"section":3,"page":1,"src":"2001 외교백서 제1장.hwp","id":"2000-s00475"},{"year":2001,"admin":"김대중","text":"2000년 하반기 이후 독일경제를 중심으로 둔화추세를 보이기 시작한 유로(Euro)권 경제는 세계 경제의 침체에 따른 수출 증가세 둔화 및 IT 산업과 주식시장의 침체 등으로 경기 부진이 지속되었다.","chapter":1,"section":1,"page":1,"s
