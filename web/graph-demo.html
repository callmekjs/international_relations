":8.0,"2000":4.0,"2001":3.1,"2002":7.1,"2009":5.9,"2015":4.6},"byAdmin":{"노태우":22,"김영삼":7,"김대중":6,"이명박":1,"박근혜":1},"focus":0.59,"first":1990,"last":2015,"peak":1991,"peakRate":"1991","docs":[{"year":1990,"admin":"노태우","text":"나. 개최내용 (1 제1차 남북고위급회담(1990.9.4-7, 서울) 우리측은 남북관계 개선을 위한 합의기반 마련을 위해 8개항의 「남북관계 랐종을 위한 기본합의서J시 제시하고, 정치ㆍ군사적 대결상태 해소와 교류협력 실시 문제를 병행 토의한다는 입장에서 10개항의 「다각적인 교류협력실시 방안]과 8개항의 「정치 군사적 신뢰구축 방안」을 제시하였다.","chapter":2,"section":null,"page":45,"src":"1991 외교백서 제2장.pdf","id":"1990-s00425"},{"year":1991,"admin":"노태우","text":"한반조정세인 있어서도 1991년사 역사적다 남북한 UN 동시가입, 그리고 「남북간 기본합의서」기「한반도 비핵화 공동선언J인 채택을 통하여 남북한 날화공존체제오 구축하고 나아가 통일도 시대와 다가서는 첫걸음을 내디딘 한 해로 기록 될 것입니다.","chapter":null,"section":null,"page":3,"src":"1992 외교백서 머리말_목차.pdf","id":"1991-s00002"},{"year":1992,"admin":"노태우","text":"또한 남북고위급 회담을 통한 「남북간 기본합의서」와 「한반도 비핵화선언」』의 채택 발효에 이 어 북한이 남북한 핵사찰을 수용, 핵개발 의혹이 해소된다면 한반도 평화공 존체제 수립이 본격화되고, 이는 동북아 질서 재편에 크게 기여할 것이다.","chapter":1,"section":null,"page":5,"src":"1993 외교백서 제1장.pdf","id":"1992-s00034"},{"year":1993,"admin":"김영삼","text":"한편, 1993년 9월 14일에는 이스라엘과 요르단이 평 화협정 체결을 위한 기본합의서에 서명함으로써 동 지역의 평화정착을 위한 기본구도가 점차 형성되어 가고 있는 중이다.","chapter":2,"section":3,"page":65,"src":"1994 외교백서 제2장.pdf","id":"1993-s00502"},{"year":1994,"admin":"김영삼","text":"또한 대북한 정책에 있어서 미국은 제네바 미ㆍ북한 핵 기본합의서 체결을 계기로 북한을 국제사회에 끌어내기 위한 정책을 펴고 있다.","chapter":2,"section":2,"page":8,"src":"1995 외교백서 제2장.pdf","id":"1994-s00205"},{"year":1997,"admin":"김영삼","text":"Clinton 대통령은 유럽순방(5월 27일∼30일)시 NATO-Russia간 기본합의서 서명식 참석, 마샬플랜 50주년 기념식 참석, 미 불, 미 영, 미 EU 및 미 러 정상회담 등 일정을 갖고 유럽의 지도자들과 NATO 확대문제, 북아일랜드 문제, 보스니아 문제 등을 논의했다.","chapter":1,"section":3,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00365"},{"year":1998,"admin":"김대중","text":"우리 대표단은 기조연설을 통하여 공고한 평화체제 구축을 목표로 실질적인 신뢰구축과 긴장완화 조치가 이루어져야 하며, 이를 효과적으로 논의하기 위해서는 합의된 의제에 상응하는 2개 분과위를 구성하는 것이 바람직하다고 제의하는 한편, 남북 기본합의서 이행 및 공동위를 가동하자고 촉구 하였다.","chapter":3,"section":3,"page":1,"src":"1999 외교백서 제3장.doc","id":"1998-s00915"},{"year":1999,"admin":"김대중","text":"한편 한.미 양국은 북방한계선이 1953년 유엔사에 의해 설정된 이래 실질적으로 남.북 해상분계선 역할을 해왔으며 북한도 남.북 기본합의서 등에서 이를 확인한 만큼, 북방한계선은 계속 준수되어야 하고 침범되어서는 안되며, 새로운 해상분계선 문제는 남.북간에 논의되어야 한다는 데 견해를 같이하고 있다.","chapter":3,"section":1,"page":245,"src":"2000 외교백서 제3장.hwp","id":"1999-s00729"},{"year":2000,"admin":"김대중","text":"2000년 10월 우리 국무총리의 방러 계기에 양국간 한 러 에너지 협력 협정이 체결되었고, 2000년 11월에는 북경에서 한 러 중 3국간 '이르쿠츠크 가스전 개발사업 타당성조사에 대한 기본합의서'가 성공적으로 체결됨에 따라 양국간 에너지 자원분야의 협력이 활발히 진행되고 있다.","chapter":4,"section":2,"page":2000,"src":"2001 외교백서 제4장.hwp","id":"2000-s01100"},{"year":2001,"admin":"김대중","text":"이에 대해 북한은 2월 미국의 정책방향에 따라 미사일 발사유예조치와 제네바 기본합의서를 파기할 수도 있다고 외무성 대변인의 담화를 통해 밝힘으로써 미국을 압박하려는 강경한 입장을 견지했다.","chapter":1,"section":2,"page":1,"src":"2002 외교백서 제1장.hwp","id":"2001-s00278"},{"year":2002,"admin":"김대중","text":"또한, 회원국들은 제2차 남북 정상회담 개최 및 북 미대화 재개를 희망했으며, 1994년 제네바 기본합의서의 완전한 이행의 중요성을 강조하였다.","chapter":6,"section":null,"page":1,"src":"2003 외교백서 제6장.hwp","id":"2002-s01149"},{"year":2009,"admin":"이명박","text":"특히 금번 방문 계기 외교관 사증면제협정, 5개 신규광구 탐사 기본합의서, 나보이 경제특구 운영협력 MOU, 수르길 가스사업 금융협력 MOU 등 20여 건의 정부 간 협정 및 기관 간 MOU가 체결됨으로써 향후 협력강화를 위한 기반이 마련되었다.","chapter":3,"section":1,"page":65,"src":"2010 외교백서_제3장.pdf","id":"2009-s00453"},{"year":2015,"admin":"박근혜","text":"이번 정상회담에서는 ‘이중과세방지협정’, ‘과학기술협력협정’, ‘투르크멘바쉬 정유공장 2차 현대화 사업 계약(10억 달러)’, ‘가스액화 플랜트 건설 기본합의서 (40억 달러)’, ‘철강생산 플랜트 건설사업 양해각서(MOU)’ 등이 체결되었다.","chapter":3,"section":1,"page":120,"src":"2016 외교백서 3장.pdf","id":"2015-s00646"},{"year":1990,"admin":"노태우","text":"。. ㆍ 2. 한편 쌍방은 3차회답시 함의서 채택을 위해 세자례에 걸쳐 실무대표접촉을 개최하였으나, 우리측은 선 기본합의서 채택; 후 불가침문제 협의 해결을 주장하고 북한측은 불가첨문제를 우선 해결할 것을 주장함으로써 성과를. 보지 못하였다.","chapter":2,"section":null,"page":47,"src":"1991 외교백서 제2장.pdf","id":"1990-s00432"}],"docCount":23},{"id":"담대한구상","kind":"policy","aliases":["담대한 구상","담대한구상"],"total":35,"byYear":{"2022":22,"2023":11,"2024":2},"rateByYear":{"2022":116.0,"2023":49.9,"2024":9.9},"byAdmin":{"윤석열":35},"focus":1.0,"first":2022,"last":2024,"peak":2022,"peakRate":"2022","docs":[{"year":2022,"admin":"윤석열","text":"윤석열 대통령께서 제시하신 「담대한 구상」을 바 탕으로 북한의 핵 위협을 억제하고, 핵 개발은 단념시키며, 대화와 외교를 통해 비핵화를 추진해 나가는 총체적 접근을 견지하고 있습니다.","chapter":null,"section":null,"page":2,"src":"2022년도 국제정세와 외교활동(외교백서).pdf","id":"2022-s00009"},{"year":2023,"admin":"윤석열","text":"정부는 이 에 대응하여 억지·단념·대화의 ‘3D 접근’을 골자로 한 ‘담대한 구상’을 바탕으로 동맹국 인 미국은 물론 한미일간 긴밀한 공조를 통해 북한의 도발에 대한 억제와 대응태세를 견 고히 했다.","chapter":1,"section":2,"page":24,"src":"2023년도 국제정세와 외교활동.pdf","id":"2023-s00227"},{"year":2022,"admin":"윤석열","text":"이어 윤석열 대통령은 광복절 경축사(8.15)에서 북한의 완 제1장 전한 비핵화를 통해 한반도의 지속 가능한 평화와 번영을 구현하기 위한 「비핵·평화·번 영의 한반도를 위한 담대한 구상」을 북한에 제안하였다.","chapter":1,"section":1,"page":23,"src":"2022년도 국제정세와 외교활동(외교백서).pdf","id":"2022-s00208"},{"year":2023,"admin":"윤석열","text":"‘담대한 구상’은 북한의 어떠한 도발에도 대응할 수 있도록 대북 억제력을 강화하고, 국제사회와 공조하여 핵개발 의지를 단념시키며, 대화·외교를 통해 북한이 비핵화의 길로 복귀하도록 한다는 우리 정부의 대북 정책이다.","chapter":2,"section":1,"page":34,"src":"2023년도 국제정세와 외교활동.pdf","id":"2023-s00289"},{"year":2022,"admin":"윤석열","text":"북한이 전례 없는 도발을 지속하 며 우리 정부의 지속적인 대화 제의를 거부하는 상황에서, 우리 정부는 「담대한 구상」을 바탕으로 북한이 비핵화 대화로 복귀할 수밖에 없는 전략적 환경을 조성하기 위해 북한 의 핵 위협을 억제하고, 핵 개발은 단념시키며, 대화와 외교를 통해 비핵화를 추진해 나간 다는 총체적인 접근을 견지하였다.","chapter":1,"section":1,"page":23,"src":"2022년도 국제정세와 외교활동(외교백서).pdf","id":"2022-s00209"},{"year":2023,"admin":"윤석열","text":"아세안 측은 한·아세안 외교장관회의 의장성명을 통해 대화를 통한 북핵문제의 해결과 「담대한 구상」을 통한 우리 정부의 노력에 지지를 표명하였다.","chapter":2,"section":1,"page":35,"src":"2023년도 국제정세와 외교활동.pdf","id":"2023-s00303"}],"docCount":6},{"id":"북미자유무역협정","kind":"treaty","aliases":["북미자유무역 협정","북미자유무역협정"],"total":35,"byYear":{"1990":2,"1991":3,"1992":7,"1993":4,"1994":2,"1995":3,"1996":2,"1997":2,"1998":3,"1999":2,"2000":1,"2001":2,"2003":1,"2004":1},"rateByYear":{"1990":15.0,"1991":25.3,"1992":55.0,"1993":31.7,"1994":15.0,"1995":21.4,"1996":12.1,"1997":9.2,"1998":11.9,"1999":8.0,"2000":4.0,"2001":6.3,"2003":3.4,"2004":36.2},"byAdmin":{"김영삼":13,"노태우":12,"김대중":8,"노무현":2},"focus":0.37,"first":1990,"last":2004,"peak":1992,"peakRate":"1992","docs":[{"year":1990,"admin":"노태우","text":"동 북미자유무역협정의 체결은 176 제4장 각 지성정세 및 우리나라와의 관계 알래스카에서 유카탄 반도까지를 포함하는 인구 3억 6천만 규모의 세계 최대규 모 광역교역권의 성립을 의미하는 바, 우리나라는 산업구조상 상당부분이 멕시코와 경쟁관계 있으므로 이에 대비한 다각적인 대책 마련이 필요할 것으로 보인다.","chapter":4,"section":null,"page":20,"src":"1991 외교백서 제4장.pdf","id":"1990-s01039"},{"year":1991,"admin":"노태우","text":"한편, 의 1992년도 단일시장 결성 추진, 8ㆍ동구 제국간 경제활성화, 일본의 세계시장 지배력 확대, 세계 보호무역주의 심화등 국제경제 구조의 전반적인 동요ㆍ재편 추세에 대처하기 위해 미국은 카나다를 포함한 멕시코와의 북미자유무역협정 체결을 추진하고 있다.","chapter":4,"section":null,"page":26,"src":"1992 외교백서 제4장.pdf","id":"1991-s01011"},{"year":1992,"admin":"노태우","text":"동시에 유럽 경제지역(884)과 북미자유무역 협정 (NAFTA) 등 지역경제권 형성에 효율적으로 대처하며, APEC함 중심으로 한 아ㆍ태지역 협의체 발전을 도모하고, 유엔 환경개발회의(904080)) 등 국 제환경규범 정립에도 적극 참여하였다.","chapter":1,"section":null,"page":16,"src":"1993 외교백서 제1장.pdf","id":"1992-s00108"},{"year":1993,"admin":"김영삼","text":"| 클린턴 행정부는 1993년 3월 중순부터 시작된 북미자유무역협정 (NAFTA) 상의 카나다, 멕시코와의 환경 및 노동분야 보완 협상이 8@ 13 일에 완료됨에 따라 11월 17일 하원 표결에 심혈을 기울였다.","chapter":2,"section":3,"page":35,"src":"1994 외교백서 제2장.pdf","id":"1993-s00288"},{"year":1994,"admin":"김영삼","text":"즉 94년 1월에 출범한 북미자유무역협정 (NAFTA), 81의 통합확대ㆍ심화 및 94 년 11월 8080[에서 개최된 APEC 정상회의에서 선진ㆍ개도국에 따라 2010년 및 2020년까지 역내무역 자유화를 위한 시한을 설정했는 바, 이 : 러한 것은 지역협력을 위한 국제적 움직임의 대표적 사례라고 할 수 있 제 1절 1994년도 국제정세 일반 / 31 다.","chapter":2,"section":1,"page":4,"src":"1995 외교백서 제2장.pdf","id":"1994-s00178"},{"year":1995,"admin":"김영삼","text":"구주연합 (60) 과 북미자유무역협정 (NAFTA) 으로 대표되는 지역주의 흐름속에서 아시아ㆍ태평양 지역의 경제협력체인 아시아ㆍ태평양 경제협 력체 (42680) 는 꾸준히 그 발전을 거듭하고 있으며, 1995년 11월 오사카 APEC 정상회의에서는 '무역ㆍ투자 자유화 및 원활화를 위한 보고르 선언(1994년 11월)'을 이행하기 위한 “오사카 행동지침(&ㅇ010 Agenda) '이 채택되기에 이르렀다.","chapter":1,"section":2,"page":10,"src":"1996 외교백서 제1장.pdf","id":"1995-s00153"},{"year":1996,"admin":"김영삼","text":"국제연합(011), 세계무 역기구(\\ㅠ0) 등 범세계적인 국제기구들의 역할과 업무영역이 확대되 고，아시아ㆍ태평양경제협력체(4880), 북미자유무역협정(4682), 아세안지역안보포럼(&88), 북대서양조약기구(40) 등 지역적 차원 의 협력이 가속화된 것은 이와 같은 추세를 반영하는 것이다.","chapter":1,"section":1,"page":5,"src":"1997 외교백서 제1장.pdf","id":"1996-s00072"},{"year":1997,"admin":"김영삼","text":"EU와 북미자유무역협정 NAFTA로 대표되는 지역주의 흐름속에서 아시아·태평양 경제협력체인 APEC은 꾸준히 그 발전을 도모하였다.","chapter":2,"section":2,"page":1,"src":"1998 외교백서 제2장.doc","id":"1997-s00736"},{"year":1998,"admin":"김대중","text":"나. 한.칠레 자유무역협정(FTA) WTO로 대표되는 다자 무역규범 질서가 있음에도 불구하고 세계는 북미자유무역협정(NAFTA), 유럽연합(EU), 남미경제공동체(MERCOSUR) 등의 경제공동체에 의하여 블록화되는 추세이며, 이러한 지역별 경제통합은 더욱 가속화되고 있다.","chapter":4,"section":3,"page":1,"src":"1999 외교백서 제4장.doc","id":"1998-s01159"},{"year":1999,"admin":"김대중","text":"4. 전략적 양자 통상협정 추진 가. 자유무역협정(FTA) 추진 WTO로 대표되는 다자무역규범 질서가 있음에도 불구하고 세계는 북미자유무역협정(NAFTA), 구주연합(EU), 남미공동시장(MERCOSUR) 등의 경제공동체에 의하여 블록화되는 추세이며, 이러한 지역별 경제통합은 더욱 가속화되고 있다.","chapter":4,"section":3,"page":58,"src":"2000 외교백서 제4장.hwp","id":"1999-s01262"},{"year":2000,"admin":"김대중","text":"4. 전략적 양자 통상협정 추진 가. 자유무역협정(FTA) 추진 1995년 WTO 출범에 따라 다자무역체제가 강화되었음에도 불구하고 세계경제는 오히려 북미자유무역협정(NAFTA), 구주연합(EU), 남미공동시장(MERCOSUR) 등의 지역경제통합에 의하여 블록화되는 추세가 더욱 가속화되고 있다.","chapter":4,"section":3,"page":2000,"src":"2001 외교백서 제4장.hwp","id":"2000-s01376"},{"year":2001,"admin":"김대중","text":"3. 전략적 양자 통상협정 추진 가. 자유무역협정(FTA) 추진 오늘날의 세계경제는 1995년 WTO 출범에 따라 다자무역체제가 강화되었음에도 불구하고 2002년초 뉴라운드(도하개발아젠다)의 출범으로 대표되는 다자주의 움직임과 북미자유무역협정(NAFTA)과 구주공동체(EU)의 통합 심화, 아세안자유무역협정(AFTA) 출범 등에서 볼 수 있는 지역주의 확대추세가 병행하면서 큰 흐름을 형성해 나가고 있다.","chapter":4,"section":3,"page":1,"src":"2002 외교백서 제4장.hwp","id":"2001-s01434"},{"year":2003,"admin":"노무현","text":"2. 지역주의 대응을 위한 FTA 등 적극 추진 가. 자유무역협정(FTA) 1) 추진 배경 오늘날의 세계경제는 WTO로 대표되는 다자주의(multilateralism) 와 북미자유무역협정(NAFTA)의 출범과 유럽연합(EU)의 심화∙확 대, 아세안자유무역협정(AFTA) 출범 등의 지역주의(regionalism) 확대 추세의 두가지 양상이 병행되고 있다.","chapter":4,"section":3,"page":57,"src":"2004 외교백서 제4장.pdf","id":"2003-s01495"},{"year":2004,"admin":"노무현","text":"미주지역에서는 기존의 북미자유무역협정(NAFTA) 1), 남미공동시장 (MERCOSUR) 2),안데스공동체 3),등 지역 경제통합 움직임과 함께 북미와 남미를 연계하는 미주자유 무역지대(FTAA)를 창설하고자 하는 논의가 진행되었다.","chapter":1,"section":null,"page":2,"src":"2005 외교백서 제1장.pdf","id":"2004-s00040"}],"docCount":27},{"id":"경제동반자협정","kind":"treaty","aliases":["경제동반자 협정","경제동반자협정"],"total":35,"byYear":{"2006":1,"2007":1,"2008":1,"2009":3,"2010":2,"2011":1,"2012":8,"2013":1,"2015":2,"2016":1,"2021":1,"2022":1,"2023":4,"2024":6,"2025":2},"rateByYear":{"2006":6.5,"2007":7.3,"2008":6.4,"2009":17.8,"2010":10.1,"2011":5.5,"2012":38.5,"2013":5.7,"2015":9.2,"2016":12.5,"2021":5.8,"2022":5.3,"2023":18.1,"2024":29.6,"2025":11.0},"byAdmin":{"이명박":15,"윤석열":11,"박근혜":4,"노무현":2,"이재명":2,"문재인":1},"focus":0.43,"first":2006,"last":2025,"peak":2012,"peakRate":"2012","docs":[{"year":2006,"admin":"노무현","text":"2005년 1월부터 2006년 1월까지 총 4차례 진행된 공동연구그룹회의 결과 2006년 1월 포괄적 경제동반자 협정(CEPA: Comprehensive Economic Partnership Agreement) 추진을 양국 정부에 건의하는 공동연구보고서가 채택되었다.","chapter":4,"section":1,"page":20,"src":"2007 외교백서 제4장.pdf","id":"2006-s01183"},{"year":2007,"admin":"노무현","text":"4) 한·인도 CEPA 협상 한·인도간 포괄적 경제동반자 협정(CEPA: Comprehensive Economic Partnership Agreement) 체결을 위한 협상은 2006년 3월 개시된 이후 2007년 12월까지 총 9차례 진행되었다.","chapter":4,"section":1,"page":129,"src":"2008 외교백서 제4장.pdf","id":"2007-s01014"},{"year":2008,"admin":"이명박","text":"양국 정상은 한₩인 도 포괄적 경제동반자협정(CEPA: Comprehensive Economic Partnership Agreement) 이 체결되면 양국 경제관계 발전에 큰 도움이 될 것이라는 데 인식을 같이하고 동 협정의 조속 타결을 위해 노력해나가기로 하였다.","chapter":3,"section":1,"page":8,"src":"2009 외교백서_제3장.pdf","id":"2008-s00487"},{"year":2009,"admin":"이명박","text":"그 결과, 작년에 한₩EU FTA를 타결하고 한₩인도 CEPA(포괄적 경제동반자 협정)를 체결함으로써 인구 17억 이 상의 거대한 해외시장에 대한 우리 기업의 접근을 더욱 용이하게 하였습니다.","chapter":1,"section":null,"page":8,"src":"2010 외교백서_제1장.pdf","id":"2009-s00015"},{"year":2010,"admin":"이명박","text":"3) 한·인도 CEPA 발효 한·인도 양국 정부는 갈수록 긴밀해지는 양국 경제통상 관계를 한 단계 격상하기 위 한 새로운 제도적 틀로서 FTA 체결이 필요하다는데 인식을 같이하고, 2006년 3월부터 “포괄적 경제동반자 협정” (CEPA: Comprehensive Economic Partnership Agreement) 체결을 위한 협상을 개시하였다.","chapter":4,"section":2,"page":131,"src":"2011 외교백서_제4장.pdf","id":"2010-s01023"},{"year":2011,"admin":"이명박","text":"이에 12차례의 공 식협상과 3차례의 회기간 회의를 거쳐“포괄적 경제동반자 협정(CEPA: Comprehensive Economic Partnership Agreement)”을 체결하였으며, 2010년 1월 1일 한·인도 CEPA가 발효되었다.","chapter":4,"section":2,"page":138,"src":"2012 외교백서 04.pdf","id":"2011-s00934"},{"year":2012,"admin":"이명박","text":"양 정상은 전투기 공동개발 및 잠수함 사업 등 방산분야 협력 성과를 평가 하고 관련 협력을 지속하기로 하는 한편, 양국 간 경제, 통상 투자 분야 협력 역시 순조롭게 진행되고 있다는 데 의견을 같이하고, 양국 간 자유무역협정인 ‘포괄적 경제동반자 협정’ 협상의 연내 개시 및 양국 교역 2015년 500억 불, 2020년 1,000억 불 달성 목표 설정에 합의하였다.","chapter":3,"section":1,"page":74,"src":"2013 외교백서_제3장.pdf","id":"2012-s00506"},{"year":2013,"admin":"박근혜","text":"아울러 양 정상은 2015년 500억 불, 2020년 1,000억 불 교역액 달성을 위해 한·인도네시아 포괄적 경제동반자 협정(CEPA: Comprehensive Economic Partnership Agreement) 연내 타결에 합의하고, 산림, 창조산업 등 실질협력 분야 확대를 위한 양해각서를 체결, 인도네시아 진출 우리 기업의 애로 사항 해소를 인도네시아 측에 요청하는 등 세일즈 외교 기반을 조성하는 데 성공 하였다.","chapter":3,"section":1,"page":92,"src":"2014 외교백서_제3장.pdf","id":"2013-s00515"},{"year":2015,"admin":"박근혜","text":"이에 돈 장 관은 방산협력뿐 아니라 경제 분야에서도 한·태국 외교장관회담(2015.9.29, 뉴욕) 한·태국 포괄적 경제동반자협정(CEPA: Comprehensive Economic Partnership Agreement) 협상이 개시되어 양국 간 경제협력이 더욱 심화되기를 희망한다고 하였다.","chapter":3,"section":1,"page":106,"src":"2016 외교백서 3장.pdf","id":"2015-s00568"},{"year":2021,"admin":"문재인","text":"또한 대외경제의 불확실성이 확대되고 글로벌 공급망이 지역화되는 상황 속에서도 2021년 6월 한·인도네시아 포괄적 경제동반자협정(CEPA: Comprehensive Economic Partnership Agreement)과 12월 RCEP 비준 등을 통해 교역·투자 활성화를 위한 체계적 제1절 경제안보외교 및 주요국 경제외교 이고 안정적인 기반을 확보해 나갔다.","chapter":5,"section":null,"page":118,"src":"2021년도 국제정세와 외교활동(외교백서)_홈페이지 게시.pdf","id":"2021-s00914"},{"year":2022,"admin":"윤석열","text":"양 정상은 한·싱 가포르 디지털동반자협정(DPA: Digital Partnership Agreement) 체결과 한국의 디지털 경제동반자협정(DEPA: Digital Economy Partnership Agreement) 가입 등에 대해 논의 하는 한편, 코로나19 이후 양국 국민 간 교류를 활성화하는 방안에 대해서도 의견을 나누 었다.","chapter":3,"section":null,"page":72,"src":"2022년도 국제정세와 외교활동(외교백서).pdf","id":"2022-s00572"},{"year":2023,"admin":"윤석열","text":"양국 정상은 교역·투자, 금융, 철도 등 분야에서의 실질협력 강화뿐만 아니라, 한·태국 경제동반자협정(EPA)이 조속히 체결될 수 있도록 협력해 나가기로 하였다.","chapter":3,"section":null,"page":74,"src":"2023년도 국제정세와 외교활동.pdf","id":"2023-s00645"},{"year":2024,"admin":"윤석열","text":"또 한, 양국 정상은 ‘한·태 경제동반자협정(EPA: Economic Partnership Agreement)’의 조속 한 체결을 위해 함께 노력해 나가기로 하였다.","chapter":2,"section":2,"page":72,"src":"2024년도 국제정세와 외교활동.pdf","id":"2024-s00561"},{"year":2025,"admin":"이재명","text":"인도네시아는 산업구조의 고부가가치화를 위해 국부펀드 다난타라를 출범시켜 전략적 산업 육성 등을 추진하고 EU･캐나다･페루와 포괄적 경제동반자협정(CEPA)에 합의하는 등 경제 다변화 정책을 전개하였다.","chapter":1,"section":null,"page":14,"src":"2025년도 국제정세와 외교활동.pdf","id":"2025-s00078"}],"docCount":24},{"id":"재정위기","kind":"event","aliases":["재정 위기","재정위기"],"total":34,"byYear":{"1994":1,"1995":1,"1996":1,"1999":1,"2000":1,"2010":1,"2011":14,"2012":13,"2015":1},"rateByYear":{"1994":7.5,"1995":7.1,"1996":6.0,"1999":4.0,"2000":4.0,"2010":5.0,"2011":77.2,"2012":62.5,"2015":4.6},"byAdmin":{"이명박":28,"김영삼":3,"김대중":2,"박근혜":1},"focus":0.82,"first":1994,"last":2015,"peak":2011,"peakRate":"2011","docs":[{"year":1994,"admin":"김영삼","text":"90년대 들어 아프리카 전체적으로 시장경제화 계획에 따라 국영기업의 민영화, 재정지출 축소를 통한 재정위기 타개 등 노력이 이루어지고 있으나 성과가 미흡하며, 1차산품에 편중된 산업구조로 인하 여 해결전망이 어려운 실정이다.","chapter":2,"section":3,"page":69,"src":"1995 외교백서 제2장.pdf","id":"1994-s00586"},{"year":1995,"admin":"김영삼","text":"1990년대 들어 아프리카지역 국가들은 전체적으로 세계은행 (World Bank), 국제통화기금 000『) 등의 협조로 시장경제화 계획에 따라 국영 기업의 민영화, 재정지출 축소를 통한 재정위기 타개 등의 노력을 기울이 고 있으나 아직까지는 성과가 미흡한 편이다.","chapter":2,"section":3,"page":76,"src":"1996 외교백서 제2장.pdf","id":"1995-s00654"},{"year":1996,"admin":"김영삼","text":"102 / 제 1장 국제정세 및 한반도 주변정세 1990년대 들어 아프리카 전체적으로 시장경제화 계획에 따라 국영기업의 민영화, 재정지출 축소를 통한 재정위기 타개 등 노력이 이루어지고 있으 나 성과가 미흡하며, 1차 산품에 편중된 산업구조로 인하여 해결전망이 어려운 실정이다.","chapter":1,"section":3,"page":94,"src":"1997 외교백서 제1장.pdf","id":"1996-s00683"},{"year":1999,"admin":"김대중","text":"제54차 총회에서는 유엔의 재정위기 관련, 16억달러에 달하는 미국의 미납분담금 처리문제가 최대 관심사의 하나였는 바, Holbrooke 미국대사 부임 후 적극적인 대의회 설득결과 미국 의회는 조건부로 1999년 11월 9억 2,600만달러 유엔 미납분담금 지출법안을 통과시킴으로써, 미국의미납분담금 해결에 다소의 돌파구를 마련하였다.","chapter":5,"section":3,"page":622,"src":"2000 외교백서 제5장.hwp","id":"1999-s02012"},{"year":2000,"admin":"김대중","text":"어려운 협상 끝에 유엔 재정위기(미국의 미납 분담금 문제) 해결을 위해서 정치적 타결이 필요하다는 방향으로 각국의 입장이 수렴되었으며, 이에 따라 미국의 분담율 인하를 내용으로 하는 2001년～2003년 정규분담율 결의 및 현 4개의 PKO 분담율 그룹을 10개 그룹으로 재조정하는 PKO 분담율 개편 결의가 채택된 것은 유엔 재정개혁 차원에서 큰 성과로 평가된다.","chapter":6,"section":2,"page":1,"src":"2001 외교백서 제6장.hwp","id":"2000-s02066"},{"year":2010,"admin":"이명박","text":"세계 경제는 신흥시장의 약진에도 불구하고 국제원자재가격 상승, 유럽 재정위기 확 산 우려 등으로 그 향방이 매우 불투명하였다.","chapter":1,"section":1,"page":13,"src":"2011 외교백서_제1장.pdf","id":"2010-s00060"},{"year":2011,"admin":"이명박","text":"미국의 전세계적 영향력 이 유지되는 가운데 중국의 부상, 유로존 재정위기 심화, 아랍 국가들의 민주화 운동 등이 국제 정세의 큰 주제였다.","chapter":1,"section":1,"page":10,"src":"2012 외교백서 01.pdf","id":"2011-s00032"},{"year":2012,"admin":"이명박","text":"2011년 그리스에서 시작된 유럽 재정위기가 주변국으로 확산됨에 따라 2012년 유럽 국가들은 자국 경제 살리기에 주력하였다.","chapter":1,"section":1,"page":13,"src":"2013 외교백서_제1장.pdf","id":"2012-s00074"},{"year":2011,"admin":"이명박","text":"서남아 지역은 2011년 유럽발 재정위기의 여파에도 불구, 인도의 6.5%에 달하는 고 성장률을 바탕으로 비교적 안정적인 성장세를 유지하였다.","chapter":1,"section":1,"page":11,"src":"2012 외교백서 01.pdf","id":"2011-s00046"},{"year":2012,"admin":"이명박","text":"유럽 국가들은 국제무대에서 ‘통합된 EU’로서의 책임과 역할을 확대하기 위하여 노력중이나, 재정위기 해소 과정에서 회원국간, 산업간, 계층간 갈등이 심화된 만큼 역내 정치경제적 신뢰회복이 주요한 과제로 대두되었다.","chapter":1,"section":1,"page":13,"src":"2013 외교백서_제1장.pdf","id":"2012-s00076"},{"year":2011,"admin":"이명박","text":"재정위기가 심각한 아일랜드, 그리스, 포르투갈, 스페인에서는 정권이 교체되 었고, 반EU 정서가 유럽 각국의 국내정치에서 주요 이슈로 등장하기도 하였다.","chapter":1,"section":1,"page":12,"src":"2012 외교백서 01.pdf","id":"2011-s00051"},{"year":2012,"admin":"이명박","text":"2. 국제 경제 동향 1) 개관 2012년 세계 경제는 2008년 세계 금융위기의 여파가 지속된 가운데, 유로지역의 재정위기 심화로 2011년 3.9%보다 낮은 3.2% 수준의 성장률을 기록할 것으로 보인다.","chapter":1,"section":1,"page":15,"src":"2013 외교백서_제1장.pdf","id":"2012-s00092"}],"docCount":12},{"id":"천안문사태","kind":"event","aliases":["천안문 사태","천안문사태"],"total":33,"byYear":{"1989":13,"1990":4,"1991":3,"1992":4,"1993":1,"1997":3,"1998":3,"1999":1,"2009":1},"rateByYear":{"1989":86.5,"1990":30.0,"1991":25.3,"1992":31.4,"1993":7.9,"1997":13.7,"1998":11.9,"1999":4.0,"2009":5.9},"byAdmin":{"노태우":24,"김영삼":4,"김대중":4,"이명박":1},"focus":0.73,"first":1989,"last":2009,"peak":1989,"peakRate":"1989","docs":[{"year":1989,"admin":"노태우","text":"중국도 계엄 해제(1990. 1.)로 미-중국간 관계회복 기미를 보이고 있으나, 인권문제el 대하여는 중국의 내정간섭이라고 완강한 태도를 보임으로써 미ㆍ 중관계가 천안문사태 이전으로 회복되기 위하여는 상당한 시간이 걸릴 것으 로 보인다.","chapter":1,"section":null,"page":8,"src":"1990 외교백서 제1장.pdf","id":"1989-s00114"},{"year":1990,"admin":"노태우","text":"중국은 천안문 사태(1989, 6) 의 후유증에서 벗어나기 위하여 인도네시아와 사우디아라비아와의 관계개선, 이라크의 쿠웨이트 침공에 대한 유엔안보리 제재 결의 지지, 캄보디아 폴포트 세력에 대한 지지 철회, 그리고 한국과의 무역대표부 설치 합의 등 아시안게임 개최를 전후하여 종래의 실용주의적 외교 노력을 전개하고 있다.","chapter":1,"section":null,"page":10,"src":"1991 외교백서 제1장.pdf","id":"1990-s00061"},{"year":1991,"admin":"노태우","text":"제2절 동북아 및 휴쑤트 정세 13 북한은 중국의 천안문 사태와 같은 주민 봉기의 가능성을 철저히 봉쇄하고 체제위협 요소를 제거하기 위헤 사회적 통제를 계속할 것이다.","chapter":1,"section":null,"page":13,"src":"1992 외교백서 제1장.pdf","id":"1991-s00095"},{"year":1992,"admin":"노태우","text":"나루 국 (1) 정치정세 1989년 6월 천안문사태 이후 사회주의 체제 유지를 위한 각 분야에 대한 통제가 강화되었으며 중국 지도부는 경제안정 유지 및 사회주의 고취, 이념 제1절 아주지역 。 137 교육 강화 등을 강조하면서 개혁ㆍ개방의 속도를 일시적으로 조정하면서 정국안정을 도모하려는 노력을 보여왔다.","chapter":4,"section":null,"page":5,"src":"1993 외교백서 제4장.pdf","id":"1992-s00767"},{"year":1993,"admin":"김영삼","text":"중국은 1989년 천안문사태 후의 외교적 고립상태에서 벗어나, ASEAN 국가들, 한국 및 일본등을 포함한 주변국가들과의 관계개선에 노 력하고 있으며, 1993년 \"월 싱가포르에서 개최된 &80^&니-810()에 게스트 자격으로 참가하였으며 1993년 11월 미국 시애틀에서 개최된 &210(7정상회 의에도 참석하는 등 양자관계뿐 아니라 다자간 지역 협력 문제에도 점차 긍 정적인 자세를 보여주고 있다.","chapter":2,"section":3,"page":24,"src":"1994 외교백서 제2장.pdf","id":"1993-s00209"},{"year":1997,"admin":"김영삼","text":"이러한 안정된 국내정치 상황을 바탕으로 중국의 쟝쩌민(江澤民) 주석과 미 Clinton 대통령은 양국 정상회담에서 양국간 관계를 천안문사태 이전으로 회복시키고자 하는 전략적 동반자 관계를 모색함으로써, 미 중 관계가 상당히 호전되는 양상을 보이고 있다.","chapter":1,"section":2,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00092"},{"year":1998,"admin":"김대중","text":"1999년에도 중국은 중화인민공화국 수립 50주년, 천안문사태 발생 10주년 및 마카오 주권회복 등을 맞아, 정치적 안정을 도모하면서 경제적 측면 에서의 개혁과 개방정책을 지속적으로 추진해 나갈 것으로 전망된다.","chapter":1,"section":3,"page":1,"src":"1999 외교백서 제1장.doc","id":"1998-s00216"},{"year":1999,"admin":"김대중","text":"나. 중 　국 1) 국내 정세 중국은 1999년 중화인민공화국 수립 50주년과 천안문사태 발생 10주년 및 마카오 주권회복 등을 맞이하여 정치적 안정을 도모하는 한편, 경제적으로는 미국과의 WTO 가입협상을 타결하는 등 개혁과 개방 정책을 지속적으로 추진하였다.","chapter":1,"section":3,"page":1,"src":"2000 외교백서 제1장.hwp","id":"1999-s00202"},{"year":2009,"admin":"이명박","text":"티베트 사태 50주년, 천안문 사태 20주년 등 정세 불안요인이 잠재되어 있었으나 안정을 유지하면서 국가적 통합 강화에 주력하였다.","chapter":1,"section":1,"page":17,"src":"2010 외교백서_제1장.pdf","id":"2009-s00104"},{"year":1989,"admin":"노태우","text":"미국은 천안문사태에 대한 항의로 취한 확매 군사무기 빼랍차 지조치(1989. 6. 5)를 아직도 해제하지 않고 있다.","chapter":1,"section":null,"page":8,"src":"1990 외교백서 제1장.pdf","id":"1989-s00115"},{"year":1990,"admin":"노태우","text":"그러나 이데올로기적 경직성 및 북한의 88&울종67의 한계와 개방에 따른 천안문사태와 같은 정치적 불안정 요인의 발생에 대한 우려를 감안할 때, 가까운 장래에 북한이 과감한 개방정책을 펼 가능성은 희박할 것으로 보인다.","chapter":1,"section":null,"page":15,"src":"1991 외교백서 제1장.pdf","id":"1990-s00100"},{"year":1991,"admin":"노태우","text":"일본은 천안문 사태이후 소원했었던 중국과의 관계정상화에 적극적인 자세를 보였으며, 나까야마 외상의 방중(4월), 전기침 외교부장의 방일(6월)에 이어, 176. 제4장 각 지성정세 및 우리나라와의 관계 카이후 수상이 천안문 사태 후 서방 지도자로서는 처음으로 중국을 방문(8윌)함 으로써 양국관계에 큰 진전이 있었다.","chapter":4,"section":null,"page":4,"src":"1992 외교백서 제4장.pdf","id":"1991-s00884"},{"year":1992,"admin":"노태우","text":"138 ” 제4장 지역정세 및 우리나라와의 관계 1989년 천안문사태 이후 개혁ㆍ개방 정책이 일시 주춤하기도 했으나 1992년 1-8월 등소평의 “남순강화” 이후 중국의 개혁 개방은 연해지역으 로부터 내륙으로까지 확산되고 있으며 외국인 투자급중으로 공업 및 농업 생산, 국제수지, 재정 등 제반분야가 확대되는 실정이다.","chapter":4,"section":null,"page":7,"src":"1993 외교백서 제4장.pdf","id":"1992-s00773"},{"year":1997,"admin":"김영삼","text":"쟝쩌민 국가주석은 89년 6월 4일 천안문사태 이후 97년 10월 중국 국가원수로서는 최초로 미국을 방문, 미국과의 21세기 새로운 시대를 향한 \"건설적인 전략적 동반자관계(constructive strategic partnership)\" 구축에 합의함으로써 그간의 경색된 양국관계를 청산하고 관계 정상화를 위한 주요한 기반을 마련하였다.","chapter":1,"section":3,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00201"}],"docCount":21},{"id":"해운협정","kind":"treaty","aliases":["해운 협정","해운협정"],"total":33,"byYear":{"1992":2,"1993":2,"1994":1,"1995":1,"1999":3,"2000":5,"2001":10,"2002":1,"2003":5,"2006":1,"2010":1,"2015":1},"rateByYear":{"1992":15.7,"1993":15.9,"1994":7.5,"1995":7.1,"1999":12.0,"2000":20.0,"2001":31.5,"2002":7.1,"2003":17.2,"2006":6.5,"2010":5.0,"2015":4.6},"byAdmin":{"김대중":19,"노무현":6,"김영삼":4,"노태우":2,"이명박":1,"박근혜":1},"focus":0.58,"first":1992,"last":2015,"peak":2001,"peakRate":"2001","docs":[{"year":1992,"admin":"노태우","text":"이번 중국 방문을 계기로 양국은 기존의 민간무역협정과 투자보장협정을 정부간 협정으로 대체하고, 과학기술협력협정과 경제ㆍ무역ㆍ기술 공동위원 회 설치협정을 체결하였으며 빠른 시일내에 항공 및 해운협정과 이중과세 방지 협정을 체결하기로 합의함으로써 양국간 교역과 강제협력을 더욱 증 대시킬 수 있는 기반을 구축하였다.","chapter":2,"section":null,"page":18,"src":"1993 외교백서 제2장.pdf","id":"1992-s00235"},{"year":1993,"admin":"김영삼","text":"。 <한\"중간 교역 추이> (단위 : 억불) 수 ㅎ | 165 | 97 | 449 | 이 | 수 이 | 270 | 40 | 0 | 99 | ㅣ. 고 | 88 | 80 | 81 | 8 | ※ 주요 교역품목 ~ 수출품목 ： 철강, 유기화학, 섬유직물, 일반기계, 전자제품등 ~ 수입품목 : 농산물, 직물, 광물연료, 비금속광물, 철강제품등 양국간의 경제협력을 위한 제도적 장치도 착실히 마련중에 있는 바, 1993 년 10월에는 해운협정이 체결되었으며 현재 항공협정, 이중과세 방지협정, 어업 협정 체결을 위한 협상이 진행중에 있다.","chapter":3,"section":1,"page":12,"src":"1994 외교백서 제3장.pdf","id":"1993-s00620"},{"year":1994,"admin":"김영삼","text":"이와 더불어 각종 경제관계를 뒷받침하기 위한 정부간의 협정체결 작업 도 이제 마무리단계에 와 있는데 1992년도의 무역협정, 투자보장협정, 과학기술협정에 이어 1993년도에는 해운협정, 우편 및 전기통신협정, 환경보호협정이 체결되었고, 1994년에는 산업협력협정, 항공협정, 이중 과세방지협정이 체결되었다.","chapter":4,"section":2,"page":18,"src":"1995 외교백서 제4장.pdf","id":"1994-s00826"},{"year":1999,"admin":"김대중","text":"이와 더불어 지속적이고 효과적인 대외 경제․통상 증진을 위해서 무역협정․투자보장협정․사회보장협정․항공협정․해운협정을 체결하는 등 우리기업의 해외진출 지원을 위한 법적 기반을 마련하고, 원자력․수산 등 자원협력을 통해 우리자원의 안정적 공급기반을 마련하였다.","chapter":2,"section":2,"page":1,"src":"2000 외교백서 제2장.hwp","id":"1999-s00660"},{"year":2000,"admin":"김대중","text":"라. 해운협정 해운협정은 우리 국적선사의 안정적인 해외 영업환경을 조성하고, 체약당사국간 해운협력을 촉진하기 위한 양자간 협정을 의미한다.","chapter":4,"section":5,"page":2000,"src":"2001 외교백서 제4장.hwp","id":"2000-s01500"},{"year":2001,"admin":"김대중","text":"라. 해운협정 해운협정은 우리 국적선사의 안정적인 해외 영업환경을 조성하고, 체약당사국간 해운협력을 촉진하기 위한 양자간 협정을 의미한다.","chapter":4,"section":5,"page":1,"src":"2002 외교백서 제4장.hwp","id":"2001-s01642"},{"year":2002,"admin":"김대중","text":"나몾몶뫊 곎몼몽 봊구봊 필구봊 있읠경봈 봍뫁몶뫊 우리나라는 지금까지 미국과의 우호통상항해조약을 포함, 영국, 독일, 중국, 네덜란드, 파키스탄, 나이지리아 등 총 11개국과 해운협정을 체결하였으며, 현재 사우디아라비아, 이집트, 이란, 우크라이나, 태국 등과 협정체결 교섭을 하고 있다.","chapter":4,"section":5,"page":1,"src":"2003 외교백서 제4장.hwp","id":"2002-s00939"},{"year":2003,"admin":"노무현","text":"경제협정을 몇 가 지로 분류해 보면 우리 기업의 해외 진출 지원을 위한 투자보장협정, 사회보장협정, 이중과세방지협정, 세관협력협정과 우리 항공사 및 해운선사의 해외시장 접근 확대를 위한 항공협정, 해운협정 그리고 우리나라의 해외 자원 확보와 과학기술 및 원자력 협력의 틀을 마련 해 주는 자원협력협정, 어업협정, 과학기술협력협정, 원자력협력협정 등으로 나눌 수 있다.","chapter":4,"section":5,"page":95,"src":"2004 외교백서 제4장.pdf","id":"2003-s01753"},{"year":2006,"admin":"노무현","text":"또한 해운분야의 경우, 정부는 그리스, 이탈리아 등과 양자간 해운협정 체결을 추진하였으며, 그리스와는 2006년 5월 그리스 해운장관의 방한을 계기로 양국간 해운협정에 가서명하고, 2006년 9월에 동 협정을 정식 서명한 바 있다.","chapter":4,"section":5,"page":208,"src":"2007 외교백서 제4장.pdf","id":"2006-s01406"},{"year":2015,"admin":"박근혜","text":"아울러 양국 은 이번 정상회담을 계기로 체결한 ‘SMART 공동 파트너십 및 인력양성 양해각 서(MOU)’에 근거하여 우리의 중소형 원자로인 스마트(SMART)를 세계 최초로 상용화하는 데 합의하였으며, 이 외에도 양국 정상이 임석한 가운데 ‘해운협정’, ‘창조경제협력에 관한 프레임워크 MOU’를 체결하는 등 양국 간 신뢰 관계를 바 탕으로 협력을 다변화하는 기틀을 마련하였다.","chapter":3,"section":4,"page":173,"src":"2016 외교백서 3장.pdf","id":"2015-s00882"},{"year":1992,"admin":"노태우","text":"양국 경제ㆍ통상 관계틀 확대 발전시키기 위한 노력의 일환으로 수교후 1992년도에는 한중간에 무역협정, 과학기술협정, 투자보장협정이 체결되었 고, 1993년 5월 해운협정이 체결되었으며 기타 경제공동위, 무역실무위, 통 제1절 경제‧통상 외교 . 79 상장관회담 등의 다양한 정부간 채널이 확보되었다.","chapter":3,"section":null,"page":16,"src":"1993 외교백서 제3장.pdf","id":"1992-s00461"},{"year":1993,"admin":"김영삼","text":"이와 더불어 각종 경제관계를 뒷받침하기 위한 정부간의 협정체결 작업도 이제 마무리단계에 와 있는데 1992넌도의 무역협정, 투자보장협정, 과학기 술협정에 이어 1993년도에는 해운협정, 우편 및 전기통신협정, 환경보호협 정이 체결 되었고, 1994년에는 항공협정, 이중과세방지협정, 어업협정이 체 결될 전망이다.","chapter":5,"section":2,"page":18,"src":"1994 외교백서 제5장.pdf","id":"1993-s00887"},{"year":1999,"admin":"김대중","text":"라. 해운협정 정부는 1956년 미국과 '우호통상항해조약'을 체결한 이래 1999년까지 중국, 영국, 노르웨이 등 총 12개국과 해운협정을 체결하였다.","chapter":4,"section":6,"page":58,"src":"2000 외교백서 제4장.hwp","id":"1999-s01511"},{"year":2000,"admin":"김대중","text":"해운협정은 과거 우호통상항해조약에 규정되어 있던 국가간 통상 및 항해의 자유보장이 해운업의 발전에 따라 점차 전문화되어 별도의 협정으로 규율할 필요성이 증대됨에 따라 등장한 조약 형태이다.","chapter":4,"section":5,"page":2000,"src":"2001 외교백서 제4장.hwp","id":"2000-s01501"}],"docCount":19},{"id":"우크라이나사태","kind":"event","aliases":["우크라이나 사태","우크라이나사태"],"total":32,"byYear":{"2014":10,"2015":6,"2016":1,"2022":13,"2023":2},"rateByYear":{"2014":42.8,"2015":27.5,"2016":12.5,"2022":68.6,"2023":9.1},"byAdmin":{"박근혜":17,"윤석열":15},"focus":0.53,"first":2014,"last":2023,"peak":2022,"peakRate":"2022","docs":[{"year":2014,"admin":"박근혜","text":"우크라이나 사태에 따른 대러시아 제재의 주도, 중동 지역에서의 폭력적 극 단주의 세력(ISIL) 부상에 따른 공동 공습 감행, 서아프리카 지역 에볼라 바이러 스 확산에 따른 대처 등 일련의 현안들에 대해 리더십을 발휘하면서도 독자 방식 이 아닌 국제사회와의 다양한 협력 관계를 만들어 가면서 대응했다.","chapter":1,"section":1,"page":12,"src":"2015 외교백서(국문)-1장.pdf","id":"2014-s00017"},{"year":2015,"admin":"박근혜","text":"한·러 관계는 우크라이나 사태 등 어려운 국제정세 여건 속에서도 12월 말 파리에서 열린 기후변화협약 당사국 총회를 계기로 한·러 정상회담을 개최하는 등 고위급 차원에서 의 지속적인 소통을 이어왔으며, 수교 25주년을 계기로 ‘유라시아 친선특급’ 행사를 성공적 으로 치르는 등 다양한 협력사업을 통해 양국 관계를 원만하게 관리하였습니다.","chapter":1,"section":null,"page":3,"src":"2016 외교백서 1장.pdf","id":"2015-s00024"},{"year":2016,"admin":"박근혜","text":"2016년도에도 러시아는 우크라이나 사태 이후 계속된 대러 제재 및 민스크 합 의 이행에 대한 시각차, 7월 NATO군의 발트3국 전진배치 결정 등을 둘러싸고 서방과의 긴장 국면을 지속하였으며 하반기에는 러시아의 미국 대선 개입 의혹이 불거지기도 했다.","chapter":1,"section":1,"page":9,"src":"2017 외교백서(1장).pdf","id":"2016-s00033"},{"year":2022,"admin":"윤석열","text":"우크라이나 사태는 유럽 및 글로벌 안보 지형에 변화를 가져왔는 데, 오랫동안 중립을 지켜온 핀란드와 스웨덴의 NATO 가입 추진이 대표적인 사례이다.","chapter":1,"section":null,"page":8,"src":"2022년도 국제정세와 외교활동(외교백서).pdf","id":"2022-s00038"},{"year":2023,"admin":"윤석열","text":"미국과 제9차 한·미 에너지안보 대화를 차관보급으로 격상 개최하여, 우크라이나 사태가 촉발한 글로벌 에너지 위기 상황 을 진단하고, 에너지 안보, 청정에너지로의 전환, 핵심광물안보파트너십(MSP) 등 관련 분 야 협력 방안을 논의하였다.","chapter":4,"section":null,"page":208,"src":"2023년도 국제정세와 외교활동.pdf","id":"2023-s01661"},{"year":2014,"admin":"박근혜","text":"그러나 우크라이나 사태 때 미국 주도의 대러시아 제재 불참과 블라디미르 푸틴(Vladimir Putin) 러시아 대통령의 방중 및 가스협정 체결을 계기로 중·러시아 간 전면적 전략 협력동반자 관계가 심화되면서 강대국들 간의 대결 구도에 대한 우려가 제기되기도 했다.","chapter":1,"section":1,"page":12,"src":"2015 외교백서(국문)-1장.pdf","id":"2014-s00020"},{"year":2015,"admin":"박근혜","text":"러시아의 경우 크림반도 합병 이후, 미국을 비롯한 서방 국가들의 대러 제재에 계속 직면하였으며, 2월 우크라이나 사태 해결을 위한 당사자 간 민스크 종합조치 합의에도 불구하고 민스크 합의 이행의 어려움으로 우크라이나 사태 해결이 지연 되었다.","chapter":1,"section":1,"page":13,"src":"2016 외교백서 1장.pdf","id":"2015-s00061"},{"year":2022,"admin":"윤석열","text":"5. 경제안보·세일즈 외교 및 과학기술외교 전개 정부는 지정학적 갈등, 우크라이나 사태, 공급망, 기후변화, 디지털 전환 등 역내 공동 과제에 대응하고, 역내 공급망 안정화 및 다변화를 위한 국제 논의에 적극 참여했다.","chapter":1,"section":null,"page":28,"src":"2022년도 국제정세와 외교활동(외교백서).pdf","id":"2022-s00246"},{"year":2023,"admin":"윤석열","text":"2023년 4월에는 외교부 2차관이 NATO 외교장관회의에 참석하여 우크라이나 사태 등 글로벌 안보 도전에 관한 논의에 참여하고, 북한 비핵화에 대한 국제사회의 단합되고 일 관된 메시지를 전달하는 데 있어 NATO의 지속적인 협력을 당부하였다.","chapter":5,"section":null,"page":230,"src":"2023년도 국제정세와 외교활동.pdf","id":"2023-s01794"},{"year":2014,"admin":"박근혜","text":"러시아는 우크라이나 사태에 따른 외교 파장과 경제 위기로 인해 중국·중앙 아시아 등 비서방 국가와의 외교에 주력했다.","chapter":1,"section":1,"page":13,"src":"2015 외교백서(국문)-1장.pdf","id":"2014-s00025"},{"year":2015,"admin":"박근혜","text":"러시아는 우크라이나 사태 이후 경제 제재와 유가 하 락, 루블화 폭락으로 –3.7% 성장을 보였다.","chapter":1,"section":1,"page":17,"src":"2016 외교백서 1장.pdf","id":"2015-s00096"},{"year":2022,"admin":"윤석열","text":"아울러 한·아세안 협력, 우크라이나 사태 등에 대해서도 의견을 나누고 공조 방안을 논의 하였다.","chapter":3,"section":2,"page":73,"src":"2022년도 국제정세와 외교활동(외교백서).pdf","id":"2022-s00579"}],"docCount":12},{"id":"복합위기","kind":"event","aliases":["복합 위기","복합위기"],"total":32,"byYear":{"2022":7,"2023":10,"2024":7,"2025":8},"rateByYear":{"2022":36.9,"2023":45.3,"2024":34.5,"2025":43.8},"byAdmin":{"윤석열":24,"이재명":8},"focus":0.75,"first":2022,"last":2025,"peak":2023,"peakRate":"2023","docs":[{"year":2022,"admin":"윤석열","text":"외교백서 2022년도 국제정세와 외교활동 인사말 2022년 전 세계는 미중 간 전략경쟁 심화, 우크라이나 전쟁, 글로벌 팬데믹, 그 과정에 서 강화된 자국중심주의와 공급망 교란 등 복합위기 상황을 경험하며, 70년 넘게 유지되 었던 전후 질서의 재편을 목도했습니다.","chapter":null,"section":null,"page":1,"src":"2022년도 국제정세와 외교활동(외교백서).pdf","id":"2022-s00001"},{"year":2023,"admin":"윤석열","text":"9) 중앙아시아 최근 우크라이나 전쟁, 미·중 전략경쟁 등으로 인한 글로벌 복합위기가 대두되면서 지 리적 요충지라는 이점과 풍부한 천연자원을 겸비한 중앙아시아의 전략적 가치가 점증함 에 따라, 주요국들은 중앙아시아와의 협력을 적극 모색하고 있다.","chapter":1,"section":null,"page":20,"src":"2023년도 국제정세와 외교활동.pdf","id":"2023-s00175"},{"year":2024,"admin":"윤석열","text":"9) 중앙아시아 풍부한 부존자원을 보유한 중앙아시아 지역은 아시아와 유럽을 잇는 지리적 요충지로, 우크라이나 전쟁 및 미·중 전략경쟁 등으로 인한 글로벌 복합위기 상황에서 그 전략적 가 치가 점증하였다.","chapter":1,"section":null,"page":18,"src":"2024년도 국제정세와 외교활동.pdf","id":"2024-s00143"},{"year":2025,"admin":"이재명","text":"5) 동남아시아 2025년 동남아시아는 국제적 복합위기에 직면하며 고도성장이 정체되자, 외부 충격에도 회복력 있는 경제구조를 구축하려는 모습을 보였다.","chapter":1,"section":null,"page":14,"src":"2025년도 국제정세와 외교활동.pdf","id":"2025-s00076"},{"year":2022,"admin":"윤석열","text":"이처럼 전례 없는 글로벌 복합위기 속에 2022년 5월 출범한 윤석열 정부는 국정기조로 ‘다시 도약하는 대한민국, 함께 잘사는 국민의 나라’를 세우고, ‘자유, 평화, 번영에 기여하 는 글로벌 중추국가’를 외교분야 국정목표로 제시하였습니다.","chapter":null,"section":null,"page":2,"src":"2022년도 국제정세와 외교활동(외교백서).pdf","id":"2022-s00003"},{"year":2023,"admin":"윤석열","text":"제1장 2023년 국제정세 및 외교정책 기조 제 2 절 외교정책 기조 ‘자유, 평화, 번영에 기여하는 글로벌 중추국가’를 목표로 하는 윤석열 정부는 2023년 한해 글로벌 복합위기 극복에 기여하기 위한 능동적인 외교 노력을 지속하였다.","chapter":1,"section":2,"page":24,"src":"2023년도 국제정세와 외교활동.pdf","id":"2023-s00224"},{"year":2024,"admin":"윤석열","text":"한반도평화교섭본부를 외교전략정보본부로 확대 개편하고, 산하에 외교전략기획국, 외교정보기획국, 한반도정책국, 국제안보국을 설치하여 글로벌 복합위기와 지정학적 지 각 변동에 능동적으로 대응하고 보다 포괄적이고 기민한 외교정책을 추진할 수 있는 제 도적 기반을 마련하였다.","chapter":1,"section":null,"page":28,"src":"2024년도 국제정세와 외교활동.pdf","id":"2024-s00247"},{"year":2025,"admin":"이재명","text":"9) 중앙아시아 풍부한 부존자원을 보유한 중앙아시아 지역은 아시아와 유럽을 잇는 지리적 요충지로, 미･중 전략경쟁 및 우크라이나 전쟁 등으로 인한 글로벌 복합위기 상황에서 그 전략적 가치가 점차 높아지고 있다.","chapter":1,"section":1,"page":17,"src":"2025년도 국제정세와 외교활동.pdf","id":"2025-s00110"},{"year":2022,"admin":"윤석열","text":"코 로나19 이후 일상으로의 회복과 국제 경제·공급망 안정화를 위한 각국의 노력에도 불구 하고, 러시아의 우크라이나 침공, 첨단기술을 포함한 미·중 간 전략경쟁 심화 등이 국제정 세의 긴장과 갈등 요인으로 부각되면서, 전 세계적 복합 위기 상황을 초래하였다.","chapter":1,"section":null,"page":8,"src":"2022년도 국제정세와 외교활동(외교백서).pdf","id":"2022-s00034"},{"year":2023,"admin":"윤석열","text":"5. 능동적 경제안보·과학기술·세일즈 외교 정부는 글로벌 복합위기 시대 경제는 안보, 안보는 곧 경제라는 인식하에 불확실성 을 줄이고, 대외 리스크에 대한 대응력과 회복력을 높이며, 경제도약의 기회를 창출할 수 있도록 능동적인 경제안보와 에너지자원·과학기술 외교를 추진하였다.","chapter":1,"section":null,"page":28,"src":"2023년도 국제정세와 외교활동.pdf","id":"2023-s00263"},{"year":2024,"admin":"윤석열","text":"조 장관은 2월 21일 G20 외교장관회의 계기 리우데자네이루에서 개최된 제25차 믹타 외교장관회의에서는 전 세계 복합위기 속에서 믹타가 국제사회의 연대를 강화하고 분열 을 극복하는 데 중요한 역할을 할 수 있다고 강조하였다.","chapter":2,"section":7,"page":163,"src":"2024년도 국제정세와 외교활동.pdf","id":"2024-s01167"},{"year":2025,"admin":"이재명","text":"급변하는 국제정세 속에서 복합위기의 험난한 파도를 마주하여 이념이나 기존의 관행에 얽매이지 않고, 국민적 공감대와 초당적 지지에 기반한 국익을 핵심좌표로, 주변 상황을 냉철하게 주시하며 위기를 헤쳐나가는 외교전략이다.","chapter":1,"section":2,"page":22,"src":"2025년도 국제정세와 외교활동.pdf","id":"2025-s00162"}],"docCount":12},{"id":"피랍사건","kind":"event","aliases":["피랍 사건","피랍사건"],"total":30,"byYear":{"2006":2,"2007":4,"2008":6,"2012":1,"2014":1,"2018":1,"2019":3,"2020":7,"2021":4,"2022":1},"rateByYear":{"2006":13.1,"2007":29.3,"2008":38.1,"2012":4.8,"2014":4.3,"2018":6.0,"2019":16.5,"2020":31.2,"2021":23.3,"2022":5.3},"byAdmin":{"문재인":15,"이명박":7,"노무현":6,"박근혜":1,"윤석열":1},"focus":0.5,"first":2006,"last":2022,"peak":2020,"peakRate":"2008","docs":[{"year":2006,"admin":"노무현","text":"특히, 노무현 대통령은 대우건설 한국인 직원 피랍사건 발생시, 나이지리아 정부가 보여준 신속한 해결 노력이 우리 기업들에게 신뢰를 주었다고 평가하였다.","chapter":3,"section":1,"page":94,"src":"2007 외교백서 제3장.pdf","id":"2006-s00630"},{"year":2007,"admin":"노무현","text":"6) 위험지역 진출업체 안전대책 마련 2007년 1월 나이지리아 무장단체에 의한 대우건설직원 피랍사건을 계기로, 외교 통상부는 위험지역 진출 건설업체에 대한 안전대책을 점검하기 위해 관계 정부부처 점검단을 4회에 걸쳐 파견하고 점검결과를 바탕으로 각 지역별 특성에 맞는 안전 대책을 마련하였다.","chapter":5,"section":3,"page":178,"src":"2008 외교백서 제5장.pdf","id":"2007-s01347"},{"year":2008,"admin":"이명박","text":"위험지역 안전점검단 2007년 1월 나이지리아 무장단체에 의한 대우건설직원 피랍사건 등을 계기로, 위험 지역 진출 건설업체에 대한 안전대책을 보다 체계화하고자 관계 정부 부처 안전점검단을 연간 2회에 걸쳐 파견하고 점검 결과를 바탕으로 지역별 특성에 맞는 안전대책을 마련하 고 있다.","chapter":6,"section":1,"page":4,"src":"2009 외교백서_제6장.pdf","id":"2008-s01541"},{"year":2012,"admin":"이명박","text":"정부는 향후에 해적에 의한 우리 선원 및 선박의 피랍사건 예방을 위해 선내 선원 안전대피처(Citadel) 설치 의무화 등 선박의 안전장비 강화, 위험해역 항해시 보안요원 탑승의무화 등 다각적인 노력을 지속 경주할 예정이다.","chapter":6,"section":1,"page":318,"src":"2013 외교백서_제6장.pdf","id":"2012-s02106"},{"year":2014,"admin":"박근혜","text":"2014년에는 리비아 주재 코트라 무역관장 피랍 사건(1월), 이집트 타바 폭탄 테러 사건(2월), 리비아 한국 국민 철수 지원(8월), 베링해 오룡호 침몰사고(12 월), 자바해 에어아시아 항공기 추락 사고(12월) 등 대형 사건·사고 대응을 위해 신속대응팀을 파견하였다.","chapter":6,"section":1,"page":377,"src":"2015 외교백서(국문)-6장.pdf","id":"2014-s02185"},{"year":2018,"admin":"문재인","text":"1) 가나 해상 우리 국민 탑승 어선 피랍 사건 대응 2018년 3월 26일 우리 국민이 탑승한 어선이 가나 해상에서 조업활동 중 해적에게 납치됐다.","chapter":6,"section":4,"page":237,"src":"2019 외교백서 국문_제6장.pdf","id":"2018-s01622"},{"year":2019,"admin":"문재인","text":"「재외국민 보호를 위한 영사조력법」을 제정해 재외국 민 보호 인프라를 확충하고, 헝가리 유람선 침몰 사고와 우리 국민 피랍 사건 등 우리 국민 의 해외 사고에 신속하고 적극적으로 대응했다.","chapter":1,"section":2,"page":22,"src":"2020 외교백서 국문_제1장.pdf","id":"2019-s00170"},{"year":2020,"admin":"문재인","text":"외교부 신속대응팀은 2020년 네팔 안나푸르나 트레킹 실종사고부터 토고 인근 해 역 피랍사건까지 우리 국민의 안전 확보를 위해 세계 각지를 누볐다.","chapter":1,"section":null,"page":22,"src":"2021 외교백서(국문).pdf","id":"2020-s00170"},{"year":2021,"admin":"문재인","text":"2021년에는 호르무즈해협 우리나라 선박 억류(1월), 가나 해역 우리 국민 1명 피랍 사건 (5월), 베냉 해역 우리 국민 4명 피랍 사건(5월), 아이티 우리 국민 부부 피랍 사건(6월) 등 의 사건 해결 과정에서 우리 국민의 안전을 확보하기 위해 활동했다.","chapter":7,"section":4,"page":201,"src":"2021년도 국제정세와 외교활동(외교백서)_홈페이지 게시.pdf","id":"2021-s01570"},{"year":2022,"admin":"윤석열","text":"2022년에는 카자흐스탄 비상사태 대응(1월), 우크라이나 사태 대응(2월), 대만 선박 침 몰 사고(4월), 아이티 우리국민 피랍 사건(5월), 필리핀 세부 항공기 사고(10월), 이태원 사 고(10월), 기니만 해역 우리선원 억류사건(11월) 등 각종 해외 위난 상황에서 우리국민 안 전을 확보하기 위해 다양한 재외국민보호 활동을 전개하였다.","chapter":6,"section":3,"page":247,"src":"2022년도 국제정세와 외교활동(외교백서).pdf","id":"2022-s01862"},{"year":2006,"admin":"노무현","text":"제 1 절 재외국민의 안전과 동포의 권익 보호 증진 217 6) 위험지역 진출업체 안전대책 마련 2007년 1월 나이지리아 무장단체에 의한 대우직원 피랍사건을 계기로 외교통상부는 위험지역 진출 건설업체에 대한 안전대책을 점검하기 위해 관계 정부부처 점검단을 4회에 걸쳐 파견하 였다.","chapter":5,"section":1,"page":6,"src":"2007 외교백서 제5장.pdf","id":"2006-s01471"},{"year":2007,"admin":"노무현","text":"또한, 피랍사건 발생 가능성이 높은 원양어선 다수 진출지역에 대한 안전점검을 실시하는 동시에 국제해적방지기구와의 협력체제를 강화하는 등의 노력을 기울였다.","chapter":5,"section":3,"page":178,"src":"2008 외교백서 제5장.pdf","id":"2007-s01348"},{"year":2008,"admin":"이명박","text":"또한 피랍사건 발생 가능성이 높은 원양어선 진출지역에 대한 안전점검을 실시 하고 해외 선교사의 신변 보호를 위해 안전 교육 실시, 비상 연락망 등 네트워크 구축을 위해 서로 노력하고 있다.","chapter":6,"section":1,"page":4,"src":"2009 외교백서_제6장.pdf","id":"2008-s01542"},{"year":2019,"admin":"문재인","text":"(2) 리비아 내 우리 국민 피랍 사건 비 2018년 ?월 6일 리비아 대수로청 산하 공기업에서 근무하던 우리 국민 1명과 필리핀 너 | 인 3명이 리비아 무장단체에 남치됐다.","chapter":6,"section":4,"page":251,"src":"2020 외교백서 국문_제6장.pdf","id":"2019-s01762"}],"docCount":20},{"id":"북방정책","kind":"policy","aliases":["북방 정책","북방정책"],"total":30,"byYear":{"1989":15,"1990":8,"1991":4,"1992":2,"2020":1},"rateByYear":{"1989":99.8,"1990":60.0,"1991":33.7,"1992":15.7,"2020":4.5},"byAdmin":{"노태우":29,"문재인":1},"focus":0.97,"first":1989,"last":2020,"peak":1989,"peakRate":"1989","docs":[{"year":1989,"admin":"노태우","text":"제2절 동북아 및 탑우조 정세 15 나. 북한인 대외훈향 (1) 대공산권 동향 북한은 중-소와의 균형적 동맹관계를 견지하고 있으나 우리의 성공적인 북방정책 추진과 소련 및 동구 사회주의국가의 민주화 주으로 인해 국제 적 고립이 심화되자 중국, 쿠바 등 강경보수 사회주의국가와 유대관계의 계 속을 피하고 있다.","chapter":1,"section":null,"page":15,"src":"1990 외교백서 제1장.pdf","id":"1989-s00170"},{"year":1990,"admin":"노태우","text":"1990년 6월 한ㆍ미 정상회담에서는 미국의 대한 방위공약을 재확인하고 통상등 현안문제 해결을 위한 상호 협의를 강화함으로써 양국간의 우호협력 관계를 가일층 증진하였으며, 한반도 통일정책과 북방정책에 대한 미국의 지지를 확보하고 한ㆍ미간의 사전 협조체제를 강화하였다.","chapter":1,"section":null,"page":19,"src":"1991 외교백서 제1장.pdf","id":"1990-s00117"},{"year":1991,"admin":"노태우","text":"나. 북방외교하 내실화 북방정책의 성과를 한반도 통일 안보 환경조성에 활용한다는 기조하에 고르바 초프 소련 대통령의 방한 (1991년 4월)과 3차례의 한ㆍ소 외무장관 회담(4월, 10월)을 통하여 한ㆍ소 양국간의 호헤적 협력기반을 확대하고 남북한 유엔가입 및 한반도 평화정책을 위한 소측의 건설적 기여를 확보하였으며, 북한의 핵문제에 관하여 한ㆍ소 양국이 공동노력하기로 하였다.","chapter":1,"section":null,"page":17,"src":"1992 외교백서 제1장.pdf","id":"1991-s00121"},{"year":1992,"admin":"노태우","text":"정부는 이와 같은 시대적 요청에 부응하여 국제질서와 한반도 주변 정세 의 변화를 능동적으로 활용하며, 한반도 안보환경을 개선시켜 새로운 남북 . 관계를 설정할 목적하에 북방정책을 추진하기 시작하였다.","chapter":2,"section":null,"page":14,"src":"1993 외교백서 제2장.pdf","id":"1992-s00214"},{"year":2020,"admin":"문재인","text":"강경화 외교장관은 포럼 참석을 위해 방한한 우즈베키스탄, 카자흐스탄, 타지키스 탄 외교장관들과 각각 양자 회담을 열고 양국 관계, 코로나19 대응 및 실질협력, 국제 무대에서의 협력 등 상호 관심사에 대해 의견을 교환하고, 한반도 평화프로세스와 신 북방정책에 대한 지지를 확인했다.","chapter":6,"section":null,"page":226,"src":"2021 외교백서(국문).pdf","id":"2020-s01836"},{"year":1989,"admin":"노태우","text":"나. 전통우방국대9| 성숙전 동반자조계 확립 1989년 2월 부쉬 미국 대통령의 방한과 10월 노태우 대통령의 답방을 통 하여 한미 양국은 2차례의 정상회담수 개최, 양국간의 전통적인 우호협력관 계를 더욱 공고히 하고, 남북대화와 북방정책에 대한 미국측의 이해와 지지 를 확고히 하는 등 양국간의 동반자관계는 그 어느때 보다도 가일층 심화되 었다.","chapter":1,"section":null,"page":21,"src":"1990 외교백서 제1장.pdf","id":"1989-s00216"},{"year":1990,"admin":"노태우","text":"정상회담을 비롯한 주요 인사의 빈번한 교류 및 접촉, 한국의 북방정책 및 유엔가입 노력에 대한 미국의 측면지원, 그리고 반.태협 역, 걸프사태등 주요 국제문제에서의 협력증대등은 양국관계의 견고함을 잘 반영하는 '몇가지 예가 될수 있을 것이다.","chapter":2,"section":null,"page":24,"src":"1991 외교백서 제2장.pdf","id":"1990-s00143"},{"year":1991,"admin":"노태우","text":"1980년대중반 이후 고르바초프의 페레스트로이카 정책에 기초한 소련에서의 개혁과 개방의 진전은 동구의 변혁을 초래하였고, 이러한 국제정세의 변화에 맞추어 시의적절하게 추진된 우리의 북방정책은 한ㆍ소 수교(1990년 9윌)와 중국에 무역사무소 개설(91년 1월 30일)등의 결실을 거두어 한반도의 긴장완화 와 우리의 평화통일 달성을 위한 국제적 여건을 마련하게 되었다.","chapter":2,"section":null,"page":46,"src":"1992 외교백서 제2장.pdf","id":"1991-s00420"},{"year":1992,"admin":"노태우","text":"| 이상과 같이 우리는 지금까지의 북방정책의 성과를 바탕으로 미ㆍ일ㆍ러 시아ㆍ중국 등 한반도 주변국들과의 협조체제를 더욱 강화해 나가는 한편, 남ㆍ북한간 교류협력을 본격화함으로써 따른 시일내에 민족의 염원인 번영 된 통일조국을 실현하도록 노력을 다할 것이다.","chapter":2,"section":null,"page":17,"src":"1993 외교백서 제2장.pdf","id":"1992-s00228"},{"year":1989,"admin":"노태우","text":"북방외교인 추진 우리 외교사상 최초로 동구권의 형가리와 1989년 2월 외교관계를 수립함 으로써 제6공화국 수립 이후 추진하여온 우리의 북방정책이 결실을 맺기 시 작하였으며, 이에 힘입어 11월, 12월에는 폴란드 및 유고와 각각 외교관계선 수립하였고, 소련과는 11월에 상호간 영사처 개설에 합의함으로써 한ㆍ소간의 사실상의 영사관계를 수립하는 등 1989년도는 우리의 외교 영역이 북방제국 에까지 확산되는 일대전환기를 맞이하였다.","chapter":1,"section":null,"page":22,"src":"1990 외교백서 제1장.pdf","id":"1989-s00221"},{"year":1990,"admin":"노태우","text":"아울러 동 정상회담을 통해 미국의 대한 안보공약을 재확인하고, 우리의 북방정책과 통일정책에 26” 제2장 한반도 평화정활 및 통일함 위한 주요외교활동 확한 미국의 지지와 지원을 확보하는 한편, 북한의 개방화 유도를 위해서는 양국이 계속적으로 긴밀한 협조 관계를 유지할 필요성이 있다는데 인식을 같이 하였다.","chapter":2,"section":null,"page":9,"src":"1991 외교백서 제2장.pdf","id":"1990-s00147"},{"year":1991,"admin":"노태우","text":"즉 1990년 9월 소련과의 외교관계 수립, 1990년 10월 중국과의 무역대표부 80 제2장 한절도 주제준꼽 및 &%-을 위한 주요외교활동 상호 교환설치 합의등 그간 정부가 일관되게 추진헤온 북방정책의 성과에 힘입어 우리의 유엔가입은 이제 가능성의 영역으로 진입할 수 있게 되었다.","chapter":2,"section":null,"page":54,"src":"1992 외교백서 제2장.pdf","id":"1991-s00459"}],"docCount":12},{"id":"코소보사태","kind":"event","aliases":["코소보 사태","코소보사태"],"total":29,"byYear":{"1997":2,"1998":4,"1999":13,"2000":3,"2001":2,"2002":3,"2003":2},"rateByYear":{"1997":9.2,"1998":15.9,"1999":52.0,"2000":12.0,"2001":6.3,"2002":21.4,"2003":6.9},"byAdmin":{"김대중":25,"김영삼":2,"노무현":2},"focus":0.86,"first":1997,"last":2003,"peak":1999,"peakRate":"1999","docs":[{"year":1997,"admin":"김영삼","text":"<코소보 사태> 1998년 2월 신유고 남부의 코소보 지역에서 발생한 세르비아계 경찰과 알바니아 분리주의자간의 무력충돌이 알바니아 주민의 대규모 시위 및 무장 저항으로 확산되어 150여명의 희생자가 발생하는 등 대규모 유혈사태로 비화됨에 따라 발칸지역이 또다시 분쟁에 휘말릴 조짐을 보이고 있다.","chapter":1,"section":3,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00565"},{"year":1998,"admin":"김대중","text":"또한, 1998년 5월 인도와 파키스탄의 핵실험을 위요한 핵비확산 등 범세계적 문제에 대한 적극 대응 및 국제문제의 평화적 해결을 강조하고, 이라크 및 코소보 사태 등에 대한 무력 및 압력 사용에 반대하기도 하였다.","chapter":1,"section":3,"page":1,"src":"1999 외교백서 제1장.doc","id":"1998-s00237"},{"year":1999,"admin":"김대중","text":"대외적으로는 코소보 사태, TMD 개발 문제 등으로 미․일을 비롯한 서방국가들과 갈등을 보였으나, WTO 가입 협상타결을 계기로 이들 국가와의 협력을 도모하는 한편, 동남아시아국가연합(Association of South-East Asian Nations : ASEAN)과의 정상외교를 통한 관계 강화로 지역 강대국으로서의 역할을 모색하였다.","chapter":1,"section":1,"page":1,"src":"2000 외교백서 제1장.hwp","id":"1999-s00042"},{"year":2000,"admin":"김대중","text":"체제전환 이후 강도 높은 개혁 작업에도 불구하고, 코소보 사태, EU 경기의 둔화, 러시아 경기의 침체 등으로 인하여 성장 둔화를 경험한 중 동유럽 국가들은 2000년도에는 유럽경제의 성장세와 러시아의 경기 회복, 코소보 사태의 종결 등에 따른 여건 호전으로 빠른 회복세를 보였다.","chapter":1,"section":1,"page":1,"src":"2001 외교백서 제1장.hwp","id":"2000-s00090"},{"year":2001,"admin":"김대중","text":"1999년 코소보 사태 이후 소원하던 NATO와도 9.11 테러사태 이후 새로운 협력관계를 모색하고 있다.","chapter":1,"section":3,"page":1,"src":"2002 외교백서 제1장.hwp","id":"2001-s00683"},{"year":2002,"admin":"김대중","text":"특히 코소보 사태, 보스니아 내전, 마케도니아 내전 등으로 점철되어온 발칸 지역은 지역 안정이 갖는 국제정치경제적 중요성에 대한 인식이 제고되면서 경제 재건을 위한 국제적인 지원이 본격화되기 시작하여 2001년 내전을 겪은 마케도니아를 제외하고 뚜렷한 성장세를 보였다.","chapter":1,"section":3,"page":10,"src":"2003 외교백서 제1장.hwp","id":"2002-s00160"},{"year":2003,"admin":"노무현","text":"1999년 코소보 사태 이후 소원하던 NATO와도 9.11 테러 사태 이 후 새로운 협력관계를 모색하고 있다.","chapter":1,"section":3,"page":100,"src":"2004 외교백서 제1장.pdf","id":"2003-s00672"},{"year":1997,"admin":"김영삼","text":"최근 코소보 사태의 원인은 1989년 밀로세비치 당시 세르비아 대통령이 코소보의 자치권을 박탈하고 이에 저항하는 알바니아 분리주의자들이 세력을 확대하면서 비롯되었다.","chapter":1,"section":3,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00567"},{"year":1998,"admin":"김대중","text":"또한 러시아는 군축을 포함, 서방과의 협력을 강화함으로써 러시아에 대한 우호 분위기 조성 및 실리 추구에 주력하였는 바, 1998년 12월 러-NATO간 공동상임위원회 및 OSCE 회의 참석을 통해 코소보 사태 등 유럽안보문제를 협의하고 미국과도 양국간 전략무기 감축협상 및 미.러 경제공동위원회 개최 등을 통해 양국간 안정적 협력관계를 유지해 왔다.","chapter":1,"section":3,"page":1,"src":"1999 외교백서 제1장.doc","id":"1998-s00561"},{"year":1999,"admin":"김대중","text":"한편, EU는 코소보 사태를 계기로 서유럽동맹(Western European Union: WEU)을 흡수하고 6만명 규모의 유럽 방위군을 2003년까지 창설키로 하는 등 독자적인 방위기구 설립을 모색하게 되었다.","chapter":1,"section":1,"page":1,"src":"2000 외교백서 제1장.hwp","id":"1999-s00053"},{"year":2000,"admin":"김대중","text":"코소보 사태 이후 EU의 방위력 강화를 위해 추진 중인 6만명 규모의 유럽 신속대응군 구성을 위해 영국은 12,000여명의 병력을 유사시 제공할 계획임을 밝히는 등 적극적인 참여 태도를 취하는 동시에 NATO가 유럽집단 안보 방위의 중심이며 유럽 신속대응군은 NATO가 개입하지 않는 평화유지, 인도적 개입 분야에만 개입해야 한다는 점을 분명히 함으로써 유럽의 안보와 번영 유지에 미국과의 긴밀한 협력이 계속 필요하다는 입장을 고수하였다.","chapter":1,"section":3,"page":1,"src":"2001 외교백서 제1장.hwp","id":"2000-s00496"},{"year":2001,"admin":"김대중","text":"특히, 전후 냉전체제의 틀 내에서 억제되어 온 인종적, 종교적 갈등이 냉전종식 이후 분출됨에 따라 보스니아 내전, 코소보 사태, 마케도니아 사태 등 복잡한 무력충돌 상황이 빚어지게 되었다.","chapter":1,"section":3,"page":1,"src":"2002 외교백서 제1장.hwp","id":"2001-s00730"},{"year":2002,"admin":"김대중","text":"몳뽬종 몓고봈 1999년 코소보 사태 이후 소원하였던 NATO와도 9.11 테러 사태 이후 새로운 협력관계를 모색하고 있다.","chapter":1,"section":3,"page":10,"src":"2003 외교백서 제1장.hwp","id":"2002-s00442"},{"year":2003,"admin":"노무현","text":"특히 냉전체제하에서 억제되어 온 인종적, 종교적 갈등이 냉전종식 이후 분출됨에 따라 보스니아 내전, 코소보 사태, 마케도니아 사태 등 일련의 무력충돌이 발생하였다.","chapter":1,"section":3,"page":109,"src":"2004 외교백서 제1장.pdf","id":"2003-s00730"}],"docCount":18},{"id":"걸프사태","kind":"event","aliases":["걸프 사태","걸프사태"],"total":29,"byYear":{"1990":14,"1991":10,"1992":4,"1993":1},"rateByYear":{"1990":105.0,"1991":84.2,"1992":31.4,"1993":7.9},"byAdmin":{"노태우":28,"김영삼":1},"focus":0.97,"first":1990,"last":1993,"peak":1990,"peakRate":"1990","docs":[{"year":1990,"admin":"노태우","text":"걸프 사태와 같은 국제문제에 대한 우리의 본격적인 참여와 지원은 우리 역사상 처음있는 일로서 우리도 이제는 국제적 위상에 걸맞는 책임과 역할을 담당하여야 할 것이라는 정책적 고려에서 결정된 것이다.","chapter":2,"section":null,"page":5,"src":"1991 외교백서 제2장.pdf","id":"1990-s00169"},{"year":1991,"admin":"노태우","text":"또한 1991년 1월 걸프사태 발발과 관련, 미측과의 긴밀한 협조로 군의료단 파견및 걸프사태 재정지원 조정위 참석등 국제비상사태시 우리의 국력 및 국제적 위상에 걸맞는 책임과 의무를 수행하였다.","chapter":1,"section":null,"page":16,"src":"1992 외교백서 제1장.pdf","id":"1991-s00118"},{"year":1992,"admin":"노태우","text":"또한 우리의 국제적 위상제고와 더불어 중동ㆍ아프리카지역내의 정세변 화는 우리나라에 보다 직접적인 영향을 미치게 될 것이며, 국제평화유지의 차원에서 우리의 기여가 요구될 것인바, 1990-1991년중 걸프사태에 대한 우리 국민의 높은 관심과 정부의 다국적군에 대한 지원은 이를 반영한 것이 라고 할 것이다.","chapter":2,"section":null,"page":12,"src":"1993 외교백서 제2장.pdf","id":"1992-s00207"},{"year":1993,"admin":"김영삼","text":"한편, 걸프사태와 관련하여 우리나라는 국제분쟁이 평화적 협상을 통해 해결되어야 하며, 무력침략이 용인되어서는 안된다는 입장에서 국제평화 유 지 노력에 일익을 담당하기 위해 우리의 경제능력상 적지 않은 부담이었지 만 걸프 주변 피해국에 1억 1천 5백만불과 미국 등 다국적군에 3억 8천 5 백만불을 지원하는 등 총 5억불의 재정지원을 공여하였으며, 이와는 별도로 걸프전쟁 기간중 군 의료지원단 및 수송단을 파견하였다.","chapter":2,"section":3,"page":67,"src":"1994 외교백서 제2장.pdf","id":"1993-s00511"},{"year":1990,"admin":"노태우","text":"고위인사의 방문으로는 1990년중 권영각 건설부장관의 리비아 대수로 8단계 계약서명 및 제8차 한ㆍ리비아 공동위 참석차 리비아 방문(2.3-6)， 나미비아 독립관련, 남부아 정세파악 및 대나미비아 관계 개선 타진을 위한 송학원 대사의 나미비아 방문(2.15-3.24)， 최영철 노동부장관의 리비아 방문(6.11- 13) , 노재원 특사의 대비동맹국 우호증진을 위한 알제리, 예멘 방문(8.6-8) , 유총하 차관을 단장으로 한 걸프사태 피해국 지원조사단 파견(10.27-11.8) 이 있었다.","chapter":2,"section":null,"page":18,"src":"1991 외교백서 제2장.pdf","id":"1990-s00236"},{"year":1991,"admin":"노태우","text":"또한, 우리의 국제적 위상제고와 더불어 중동ㆍ아프리카지역내의 정세변화는 우리나라에 보다 직접적인 영향을 미치게 될 것이며, 국제 평화유지의 차원에서 우리의 기여가 요구될 것인바, 1990년-1991년중 걸프사태에 대한 우리 국민의 높은 관심과 정부의 다국적군에 대한 지원은 이를 반영한 것이라고 할 것이다.","chapter":2,"section":null,"page":17,"src":"1992 외교백서 제2장.pdf","id":"1991-s00252"},{"year":1992,"admin":"노태우","text":"걸프사태 를 계기로 일본의 국제공헌에 관한 논의가 일게 되면서, 자민당과 정부내에 대 일본이 국제사회에서 국력에 상응하는 인적 공헌을 해야 한다는 인식이 확산되었다.","chapter":4,"section":null,"page":132,"src":"1993 외교백서 제4장.pdf","id":"1992-s00734"},{"year":1990,"admin":"노태우","text":"그리고 최근 걸프사태와 관련 현 비동맹 의장국인 유고를 중심으로 평화적 해결방안이 모색되었으나 온건국가와 강경국가들간의 의견일치가 사실상 불가능 하게 됨에따라 동 사태 해결에 크게 기여하지 못하였다.","chapter":2,"section":null,"page":54,"src":"1991 외교백서 제2장.pdf","id":"1990-s00476"},{"year":1991,"admin":"노태우","text":"비동맹은 최근 걸프사테시 현 비동맹 의장국인 유고를 중심으로 평화적 헤결방안을 모색하였으나 온건국가와 강경국가들간의 의견일치가 사실상 불가능 하여 동 사태해결에 크게 기여하지 못하였다。 즉 1991년 8월 유고 베오그라드 에서 게최된 15개 비동맹국 외상희의에서는 유고 및 인도측이 제시한 걸프사태 관련 평화협상안이 알제리, 쿠바등 강경파 국가들의 적극적인 반대로 무산된 바 있다.","chapter":2,"section":null,"page":59,"src":"1992 외교백서 제2장.pdf","id":"1991-s00479"},{"year":1992,"admin":"노태우","text":"그러나 걸프사태 이후 중동정세는 상당기간 유동적이고 불안정할 것으로 예상됨에 따라 우리의 대중동 외교도 그러한 정세추이를 예의 관찰 주시하 면서 우리의 국익을 최대한 보장하는 방향으로 기동성 있게 대처해 나가고 있다.","chapter":4,"section":null,"page":51,"src":"1993 외교백서 제4장.pdf","id":"1992-s01049"}],"docCount":10},{"id":"무력도발","kind":"event","aliases":["무력 도발","무력도발"],"total":28,"byYear":{"1989":1,"1990":2,"1991":1,"1998":2,"1999":2,"2010":14,"2011":1,"2012":2,"2013":1,"2014":1,"2015":1},"rateByYear":{"1989":6.7,"1990":15.0,"1991":8.4,"1998":8.0,"1999":8.0,"2010":70.4,"2011":5.5,"2012":9.6,"2013":5.7,"2014":4.3,"2015":4.6},"byAdmin":{"이명박":17,"노태우":4,"김대중":4,"박근혜":3},"focus":0.61,"first":1989,"last":2015,"peak":2010,"peakRate":"2010","docs":[{"year":1989,"admin":"노태우","text":"1950년 북한의 남침에 의한 6. 25동란과 그후 수많은 무력도발은 말할 것도 없이 최근에만도 1983년의 랑군사건, 1987년 KAL7] 폭파사건 등은 북한의 호전적 신험주의 매문에 한반도의 긴장이 얼마나 심각한가를 보여주고 있다.","chapter":2,"section":null,"page":49,"src":"1990 외교백서 제2장.pdf","id":"1989-s00586"},{"year":1990,"admin":"노태우","text":"1950년 북한의 남침에 의한 6.25동란과 그후 수많은 무력도발은 말할 것도 없이 최근에만도 1983년의 랑군사건, 1987년 KAL7] 폭파사건 등은 북한의 변함없는 대남정책 때문에 한반도의 긴장이 아직도 완화되지 않고 . 제5절 동북아 평화협의회의 추진 79 있음을 보여주고 있다.","chapter":2,"section":null,"page":55,"src":"1991 외교백서 제2장.pdf","id":"1990-s00485"},{"year":1991,"admin":"노태우","text":"알제리의 지원감소로 입지가 약화된 폴리사리오는 국제적 관심을 끌기 위해 1989년 10월 무력도발을 재개하였으나, UN척 중재로 휴전하고 주민투표 실시를 위한 UN 주민투표 실시단(44040850)이 파견되어 주민투표를 준비하고 있지만 아직도 서부사하라 문제 해결전망은 불투명한 상태이다.","chapter":4,"section":null,"page":48,"src":"1992 외교백서 제4장.pdf","id":"1991-s01133"},{"year":1998,"admin":"김대중","text":"2. 한반도 평화정착 및 포괄적 안보체제 구축 김대중 대통령 취임이래 정부는 ①일체의 무력도발 불용, ②흡수통일 불추구, ③교류협력의 적극추진 등 대북정책 3원칙을 제시하였으며, 이를 바탕으로 한반도에서의 전쟁재발 가능성을 미연에 방지하고 양측간의 평화공존을 실현해 나가기 위한 대북 포용정책을 일관되게 추진해 나갔다.","chapter":2,"section":2,"page":1,"src":"1999 외교백서 제2장.doc","id":"1998-s00682"},{"year":1999,"admin":"김대중","text":"제 2절 1999년도 주요 외교 시책 1. 한반도 평화와 안정 정착을 위한 외교 1999년도에도 정부는 ①일체의 무력도발 불용, ②흡수통일 불추구, ③교류협력의 적극 추진 등 대북정책 3원칙에 입각한 대북 포용정책을 일관성 있게 추진하였다.","chapter":2,"section":2,"page":1,"src":"2000 외교백서 제2장.hwp","id":"1999-s00639"},{"year":2010,"admin":"이명박","text":"이러한 북한의 무력도발은 유엔 헌장, 남북기본합의서, 정전협정을 위반 한 것으로, 한반도는 물론 동북아의 평화와 안정을 심각하게 저해하는 것이었다.","chapter":1,"section":1,"page":15,"src":"2011 외교백서_제1장.pdf","id":"2010-s00090"},{"year":2011,"admin":"이명박","text":"우리 정부는 북한의 무력도발에 대해서는 단호하게 대처할 것임을 천명하고, 천안함 폭침 및 연평도 포격도발에 대해 북한이 책임있는 조치를 취해야 한다는 입장을 밝혔다.","chapter":2,"section":1,"page":28,"src":"2012 외교백서 02.pdf","id":"2011-s00176"},{"year":2012,"admin":"이명박","text":"우리 정부는 북한의 무력도발에 대해서는 단호하게 대처할 것임을 천명하고, 천안함 폭침 및 연평도 포격도발에 대해 북한이 책임있는 조치를 취해야 한다는 입장을 밝혔다.","chapter":2,"section":1,"page":29,"src":"2013 외교백서_제2장.pdf","id":"2012-s00188"},{"year":2013,"admin":"박근혜","text":"한반도 신 뢰프로세스는 튼튼한 안보를 바탕으로 북한의 무력도발을 확고하게 억지하는 한 편, 대화의 문을 열어두고 기존 합의의 이행과 점진적인 협력의 축적을 통해 남북 간 신뢰를 형성함으로써 남북관계를 발전시키고, 한반도에 평화를 정착시키며, 나아가 통일의 기반을 구축하려는 정책이다.","chapter":2,"section":1,"page":32,"src":"2014 외교백서_제2장.pdf","id":"2013-s00174"},{"year":2015,"admin":"박근혜","text":"한반도 신뢰프로세스는 튼튼한 안보를 바탕으로 북한의 무력 도발을 확 고하게 억지하는 한편, 대화의 문을 열어두고 기존 합의의 이행과 점진적 협력의 관행 축적을 통해 남북 간 신뢰를 형성함으로써 남북 관계를 발전시키고, 한반도 에 평화를 정착시키며, 나아가 통일의 기반을 구축하려는 정책이다.","chapter":2,"section":1,"page":34,"src":"2016 외교백서 2장.pdf","id":"2015-s00207"},{"year":1990,"admin":"노태우","text":"알제리의 지원 감소로 입지가 약화된 폴리사리오는 국제적 관심을 끌기 위해 1989년 10월 무력도발을 재개한 바도 있어 서부사하라 문제의 해결 전망은 아직 불투명한 상태이나 현재보다 더 사태가 악화되지는 않을 것으로 예상된다.","chapter":4,"section":null,"page":43,"src":"1991 외교백서 제4장.pdf","id":"1990-s01166"},{"year":1998,"admin":"김대중","text":"제 1절 대북 포용정책과 한반도 평화정착을 위한 외교적 노력 1. 대북 포용정책 1998년 2월 김대중 대통령의 취임과 함께 정부는 북한의 어떠한 무력도발도 용납하지 않고, 북한을 흡수통일코자 추구하지 않으며, 북한과의 화해. 협력을 적극 추진한다는 대북정책의 3원칙을 천명하고, 이에 입각하여 안보와 화해.협력을 병행하는 대북 포용정책을 추진하게 되었다.","chapter":3,"section":1,"page":1,"src":"1999 외교백서 제3장.doc","id":"1998-s00709"},{"year":1999,"admin":"김대중","text":"정부는 이를 위해 북한의 어떠한 무력도발도 용납하지 않는 반면, 북한에 대한 흡수 통일을 추구하지 않으며, 북한과의 화해․협력을 적극 추진한다는 대북 정책의 3원칙을 천명하였고 이에 입각하여 1999년에도 대북 포용정책을 일관성 있게 추진하였다.","chapter":3,"section":1,"page":245,"src":"2000 외교백서 제3장.hwp","id":"1999-s00690"},{"year":2010,"admin":"이명박","text":"천안함 사태 이후 우리 정부는 국제사회에 단호하고 일치된 대응을 요청하였으며, 국 제사회는 유엔 안보리 의장 성명, G8, 정상 선언문, ARF 외교장관회담 의장 성명 등의 채 택을 통해 무력도발을 규탄하고 재발방지를 촉구하였다.","chapter":1,"section":1,"page":15,"src":"2011 외교백서_제1장.pdf","id":"2010-s00091"}],"docCount":16},{"id":"25전쟁","kind":"event","aliases":["25전쟁"],"total":25,"byYear":{"2010":1,"2013":1,"2015":2,"2018":5,"2019":3,"2020":13},"rateByYear":{"2010":5.0,"2013":5.7,"2015":9.2,"2018":29.8,"2019":16.5,"2020":58.0},"byAdmin":{"문재인":21,"박근혜":3,"이명박":1},"focus":0.84,"first":2010,"last":2020,"peak":2020,"peakRate":"2020","docs":[{"year":2013,"admin":"박근혜","text":"양국 정상은 정전 60주년을 맞아 뉴질랜드의 6.25전쟁 참전에 따른 유대를 바탕으로 양국관계가 더욱 발전되어 나가길 기대하며, 교민·유학생 등 양국 간 인적교류와 양국 FTA 체결에 관한 의견을 교환하였다.","chapter":3,"section":1,"page":97,"src":"2014 외교백서_제3장.pdf","id":"2013-s00544"},{"year":2015,"admin":"박근혜","text":"이번 방한은 키 총리 취임 이후 네 번째 방한으로서 6.25전쟁 참전국으로 우리 의 전통 우방인 뉴질랜드와의 우호 협력 관계와 양국 정상 간 신뢰·유대를 더욱 돈독히 하였다.","chapter":3,"section":1,"page":113,"src":"2016 외교백서 3장.pdf","id":"2015-s00611"},{"year":2018,"admin":"문재인","text":"문 대통령은 축전을 통해 태국이 아시아 국가 중 6.25전쟁에 가장 먼저 파병한 데 사의를 표명했다.","chapter":3,"section":1,"page":72,"src":"2019 외교백서 국문_제3장.pdf","id":"2018-s00510"},{"year":2019,"admin":"문재인","text":"3) 총리급 외교 (1) 콜롬비아 공식 방문 이낙연 국무총리는 2019년 5월 4~6일 1 -- 콜롬비아를 공식 방문해 이반 누케 마르케 놀 은 스(780 12006 81860ㅁ62) 콜롬비아 대 ' 1 통령과 5월 6일 단독 및 확대 회담을 열 세 고, 중남미 유일의 6.25전쟁 참전국인 콜 롬비아와 '전략적 협력 농반자 관계' 발전 { 방안을 논의행다.","chapter":3,"section":4,"page":111,"src":"2020 외교백서 국문_제3장.pdf","id":"2019-s00814"},{"year":2020,"admin":"문재인","text":"7 6.25전쟁 참전국 마스크 지원 2020년은 6.25전쟁 70주년을 맞이하는 해로 외교부는 국가보훈처, 국방부, 식약처, 산업부 등과 협업해 코로나19로 어려움을 겪고 있는 22개국 6.25전쟁 참전용사 및 유 가족에게 마스크 100만 장을 지원하며 그들의 희생과 공헌에 감사하는 마음을 전했다.","chapter":2,"section":3,"page":53,"src":"2021 외교백서(국문).pdf","id":"2020-s00556"},{"year":2015,"admin":"박근혜","text":"양국 장관들은 호주 의 6.25전쟁 참전, 54년의 수교 역사, 2014년 12월 한·호주 자유무역협정(FTA) 발효 등을 통해 양국 관계가 준동맹 수준의 파트너십으로 발전해 왔다는 데 의견 을 같이하였다.","chapter":3,"section":1,"page":114,"src":"2016 외교백서 3장.pdf","id":"2015-s00614"},{"year":2018,"admin":"문재인","text":"문 대통령은 쁘라윳 총리에게 6.25전쟁 태국 참전용사들의 숭고한 희생을 언급하 며 양국 관계 발전을 위한 잠재력을 실현하기 위해 협력해 나가자고 했다.","chapter":3,"section":1,"page":72,"src":"2019 외교백서 국문_제3장.pdf","id":"2018-s00515"},{"year":2019,"admin":"문재인","text":"이 총리는 동포ㆍ 지사 . 이낙연 국무총리-콜롬비아 대통령 단독회담 (2019.5.6, 보고타) 상사 대표 초청 만찬 간담회와 한ㆍ콜롬비 아 비즈니스 포럼에 참석하는 한편, 6.25전쟁 참전 기념탐 헌화, 참전용사 초청 오찬 간담 회 참석, 한ㆍ콜롬비아 우호재활센터 방문 등을 통해 보훈외교 활농을 전개했다.","chapter":3,"section":4,"page":111,"src":"2020 외교백서 국문_제3장.pdf","id":"2019-s00815"},{"year":2020,"admin":"문재인","text":"또한 문 대통령은 코리아 소사이어티 주최 연례 만 찬 기조연설(10.8)에서도 2020년은 6.25전쟁이 발발한 지 70년이 되는 해임을 상기하 면서 한반도에서 전쟁이 완전히 그리고 영구적으로 종식돼야 한다고 강조했다.","chapter":3,"section":null,"page":60,"src":"2021 외교백서(국문).pdf","id":"2020-s00601"},{"year":2018,"admin":"문재인","text":"양국 정상 은 태국의 6.25전쟁 파병 이후 발전해 온 양국의 우호적 협력관계를 높이 평가하고 향 후 교역 및 투자 확대를 비롯한 제반 분야 교류 증진을 위해 협력하기로 했다.","chapter":3,"section":1,"page":72,"src":"2019 외교백서 국문_제3장.pdf","id":"2018-s00516"},{"year":2019,"admin":"문재인","text":"강 장관은 아비 아흐메드 알리 총리 취임 이후 국내 개혁과 주변국 간 관계 개선을 적극 추진하고 있는 에티오피아 정부의 노력을 환영하고, 우리 기업의 에티오피아 진출 및 개발 협력, 6.25전쟁 참전용사 지원 등 다양한 분야에서 협력사업이 원활하게 추진될 수 있도 록 에티오피아 정부의 지속적인 관심과 지원을 당부했다.","chapter":3,"section":5,"page":129,"src":"2020 외교백서 국문_제3장.pdf","id":"2019-s00945"},{"year":2020,"admin":"문재인","text":"문 대통령은 모리슨 총리가 6.25전쟁 70주년 행사에서 영상 메시지를 통해 한반도 의 평화와 안정에 대한 지지를 표명한 데 대해 감사를 전하고, 한반도의 완전한 비핵화 와 항구적 평화정착을 위한 우리의 노력을 호주 정부가 계속 지지해 줄 것을 당부했다.","chapter":4,"section":null,"page":104,"src":"2021 외교백서(국문).pdf","id":"2020-s00940"}],"docCount":12},{"id":"비핵화공동선언","kind":"treaty","aliases":["비핵화 공동선언","비핵화공동선언"],"total":25,"byYear":{"1991":8,"1992":6,"1993":5,"1994":3,"2003":1,"2006":1,"2009":1},"rateByYear":{"1991":67.3,"1992":47.1,"1993":39.7,"1994":22.5,"2003":3.4,"2006":6.5,"2009":5.9},"byAdmin":{"노태우":14,"김영삼":8,"노무현":2,"이명박":1},"focus":0.56,"first":1991,"last":2009,"peak":1991,"peakRate":"1991","docs":[{"year":1991,"admin":"노태우","text":"한반조정세인 있어서도 1991년사 역사적다 남북한 UN 동시가입, 그리고 「남북간 기본합의서」기「한반도 비핵화 공동선언J인 채택을 통하여 남북한 날화공존체제오 구축하고 나아가 통일도 시대와 다가서는 첫걸음을 내디딘 한 해로 기록 될 것입니다.","chapter":null,"section":null,"page":3,"src":"1992 외교백서 머리말_목차.pdf","id":"1991-s00002"},{"year":1992,"admin":"노태우","text":"제2절 동북아 및 훼수트 정세”9 ._상기와 같은 불확실성의 요인에도 불구하고 남북한간 「기본합의서」및 『한반도 비핵화 공동선언」 채택 발효, 이에 따른 부속합의서 채택 및 남북 한간 제반합의 사항을 이행할 수 있는 공동위의 발족 등 남북한간 화해 협 력과 평화 공존을 위한 제도적 기반이 이미 마련되어 있으므로 남북한이 이 를 성실히 이행하기만 하면 한반도 평화공존체제가 구축될 것이다.","chapter":1,"section":null,"page":9,"src":"1993 외교백서 제1장.pdf","id":"1992-s00065"},{"year":1993,"admin":"김영삼","text":"북한은 체제에 대한 위협요소를 제거할 수 있다는 전제하에 우리와 「남북 사이의 화해와 불가침 및 교류 협력에 관한 합의서」와 「비핵화 공동선언」에 서명한 바 있고. 남북한 경제교류도 적극 추진시키려는 의향을 보여 왔다.","chapter":2,"section":2,"page":15,"src":"1994 외교백서 제2장.pdf","id":"1993-s00152"},{"year":1994,"admin":"김영삼","text":"한ㆍ미 양국은 핵문제 해결 전반 과정에서 북한 핵문제의 근원적 해결을 위해서는 북한 핵활동에 대한 과거, 현재 및 미래의 투명성 확보가 필수적이라는 간단아래, 북한의 NPT 복귀, 특별사찰을 포함한 IAEA 핵안전조치의 전면 적용, 남ㆍ북한간 한반도 비핵화 공동선언의 실천을 핵문제 해결의 목표와 원칙으로 설정하고 이를 실현시키고자 노력하여 왔다.","chapter":3,"section":3,"page":21,"src":"1995 외교백서 제3장.pdf","id":"1994-s00690"},{"year":2003,"admin":"노무현","text":"핵문제 발생후 개최된 8차~12차 남북장관급회담에서는 핵문제 해결 추구를 지속적으로 제기하였으며, 또한 각급의 남북대 화 채널을 통해 한반도 비핵화 공동선언 및 핵문제 해결을 위한 다자 회담 수용 등을 북측에 촉구하고, 우리 국민과 국제사회의 우려를 전 달하였다.","chapter":3,"section":3,"page":23,"src":"2004 외교백서 제3장.pdf","id":"2003-s01094"},{"year":2006,"admin":"노무현","text":"4. 또한 이번 행위는 남북이 지난 1991년 합의한 바 있는‘한반도 비핵화 공동선언’을 일방적으로 파기하고 무효화시킨 것으로서 이후 발생하는 남북관계를 비롯한 모든 사태에 대한 책임은 전적으로 북한에 있다는 점을 재차 분명히 밝혀 둔다.","chapter":2,"section":1,"page":6,"src":"2007 외교백서 제2장.pdf","id":"2006-s00257"},{"year":2009,"admin":"이명박","text":"이는 또 한반도 비핵화 공동선언과 6자회담 합의 의무를 저버리는 것이며 추가 핵실험을 금지한 유엔 안보리 결의 1718호에 대한 명백한 위반으로, 결코 용납할 수 없는 도 발행위다.","chapter":2,"section":1,"page":5,"src":"2010 외교백서_제2장.pdf","id":"2009-s00162"},{"year":1991,"admin":"노태우","text":"특히 동북아 전략환경의 [안보 핵심고리](56600ㅁ1 100400010)를 이루고 있는 한반도에도 한ㆍ소 수교, 한ㆍ중 관계 진전, 일ㆍ북한 수교 교섭, 미ㆍ북한 접촉 등 4강의 남북한 교차승인 가시화는 물론, 남북 유엔공동가입 등은 급속한 탈냉전화를 촉진하고 있고 최근 남북고위급회담의 진전에 따른 [남북합의서], ｌ비핵화공동선언」]채택 등 한반도의 탈냉전화와 평화체제 구축 움직임도 동북아 지역 데땅트에 크게 기여할 것으로 전망된다.","chapter":1,"section":null,"page":10,"src":"1992 외교백서 제1장.pdf","id":"1991-s00074"},{"year":1992,"admin":"노태우","text":": 4. 남북한 관계 북한은 체제에 대한 위협요소를 제거할 수 있다는 전제하에 우리와 「남북 사이의 화해와 불가침 및 교류ㆍ협력에 관한 합의서」와 「비핵화 공동선언」 에 서명한 바 있고, 남북한 경제교류도 적극 추진시키려는 의향을 보여왔 다.","chapter":1,"section":null,"page":10,"src":"1993 외교백서 제1장.pdf","id":"1992-s00074"},{"year":1993,"admin":"김영삼","text":"남-북 비핵화 공동선언 합의 이전에 우리정부는 이미 11윌 8일에 비핵화 선언과 12월 18일에 핵 부재 선언을 발표한 바 있었다.","chapter":3,"section":4,"page":25,"src":"1994 외교백서 제3장.pdf","id":"1993-s00701"},{"year":1994,"admin":"김영삼","text":"그러나 북한이 결국 한반도 비핵화 공동선언 이행과 남ㆍ북 대화 착수에 동의함으로써 한반도의 비핵화를 실현하고 남ㆍ북한 기본 합의서 를 실천에 옮겨, 남ㆍ북관계의 획기적 진전을 이룩할 수 있는 계기를 마련하였다.","chapter":3,"section":3,"page":29,"src":"1995 외교백서 제3장.pdf","id":"1994-s00732"},{"year":1991,"admin":"노태우","text":"14 제1장 국제질서 동향이 우리 외교정책 방향 북한은 체제에 대한 위협요소를 제거할 수 있다는 전제하에 남한과의 1991년 128월 13일 제5차고위급회담에서 !남북사이의 화해와 불가침 및 교류ㆍ협력에 ㆍ 관한 합의서] 서명과 1991년 128월 31일 |비핵화 공동선언」을 가서명한 바 있고, 남북한 경제교류도 적극 추진시키려는 의향을 가지고 있으며 제한적인 통신ㆍ통행도 받아들이는 등 남북한 관계진전에 상당한 신축성을 보이고 있다.","chapter":1,"section":null,"page":14,"src":"1992 외교백서 제1장.pdf","id":"1991-s00104"},{"year":1992,"admin":"노태우","text":"이러한 북방외교의 추진은 북한으로 하여금 1991년 12월 「화해, 불가침 및 교류와 협력에 관한 합의서』와 「한반도 비핵화 공동선언」에 함의케하고, 남북 정상희담에도 긍정적인 자세를 표명토록 유도하는 큰 요인중의 하나 가 되었다.","chapter":2,"section":null,"page":16,"src":"1993 외교백서 제2장.pdf","id":"1992-s00222"},{"year":1993,"admin":"김영삼","text":"한편, 북한도 남북 비핵화공동선언 합의에 이어 1992년 1월 30일에 1618&와 핵 안전조치협정에 서명하였고, 같은 해 4월 10일 이를 비준.발효 시켰다.","chapter":3,"section":4,"page":25,"src":"1994 외교백서 제3장.pdf","id":"1993-s00703"}],"docCount":14},{"id":"영유권분쟁","kind":"event","aliases":["영유권 분쟁","영유권분쟁"],"total":24,"byYear":{"1994":1,"1995":4,"1996":3,"1997":5,"1998":1,"2001":1,"2003":2,"2004":3,"2005":2,"2015":1,"2025":1},"rateByYear":{"1994":7.5,"1995":28.6,"1996":18.1,"1997":22.9,"1998":4.0,"2001":3.1,"2003":6.9,"2004":108.7,"2005":17.2,"2015":4.6,"2025":5.5},"byAdmin":{"김영삼":13,"노무현":7,"김대중":2,"박근혜":1,"이재명":1},"focus":0.54,"first":1994,"last":2025,"peak":1997,"peakRate":"2004","docs":[{"year":1994,"admin":"김영삼","text":"미ㆍ북 제네바 합의에 따른 구체적 이행문제, 중국ㆍ대만관계, 일ㆍ중간의 역내주도권 경쟁가능성, Southern Kuril 1513185를 둘러싼 일ㆍ러관계, Spratly Islands (남사군 도) 영유권 분쟁 등 잠재적 불안요인이 많은 것도 사실이나 지역내 주요 국가들은 경제적 실리를 추구하는 실용주의적 정책을 취하여 상호의존성 이 증대되고 실질협력관계가 강화되었다.","chapter":2,"section":1,"page":5,"src":"1995 외교백서 제2장.pdf","id":"1994-s00184"},{"year":1995,"admin":"김영삼","text":"아시아ㆍ태평양 지역의 경우 1995년에도 북한의 불안한 동향과 남사군 도 영유권 분쟁 등 지역 정세 안정에 부정적인 요소가 여전히 남아있었지 만, 1995년 7월 베트남이 아세안에 가입하였으며, 1995년 8월 미국과 베트남간의 외교관계가 재개됨으로써 전반적으로 이 지역 국가들간의 정 치ㆍ경제적 협력관계가 더욱 강화되어 가는 모습을 보였다.","chapter":2,"section":1,"page":4,"src":"1996 외교백서 제2장.pdf","id":"1995-s00203"},{"year":1996,"admin":"김영삼","text":"아시아ㆍ 태평양지역에서는 남사군도 영유권 분쟁과 관련해서 중국과 필리핀간에 마찰이 심화되고, 아프가니스탄 내전이 악화되는 등 역내 안 보상황이 유동적이 되었다.","chapter":1,"section":1,"page":5,"src":"1997 외교백서 제1장.pdf","id":"1996-s00069"},{"year":1997,"admin":"김영삼","text":"안보면에서는 아세안 지역안보포럼(ASEAN Regional Forum: ARF)을 중심으로 동 지역의 다자안보대화가 진행되고 있는데, 1997년도에도 동 포럼을 통해 한반도문제, 남중국해 영유권분쟁, 캄보디아 및 미얀마 정세 등 지역안보 문제와 핵군축, 대인지뢰 등 군축문제가 논의되었다.","chapter":1,"section":1,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00043"},{"year":1998,"admin":"김대중","text":"지역안보와 관련, ARF에서는 지금까지 북한 핵문제, 남중국해 문제, 핵실험 문제 등 아.태지역내 주요 안보현안들이 논의되었는데, 참가국 외무 장관들은 냉전종식 후 아.태지역의 전반적인 안보여건이 개선되고 있으나 북한 핵문제, 남중국해 영유권 분쟁, 핵실험 재개 등 역내에 불안요인이 상존 하고 있다는데 인식을 같이하였다.","chapter":5,"section":2,"page":1,"src":"1999 외교백서 제5장.doc","id":"1998-s01747"},{"year":2001,"admin":"김대중","text":"멩기스투 정권을 타도한 이디오피아 인민혁명민주전선(EPRDF)의 집권으로 국정운영이 안정화 추세에 있었으나, 1993년 독립한 에리트리아와의 영유권 분쟁이 1998년 전쟁으로 이어졌다.","chapter":1,"section":3,"page":1,"src":"2002 외교백서 제1장.hwp","id":"2001-s00812"},{"year":2003,"admin":"노무현","text":"그러나 동남아 지역의 안보 질서는 동남아시아국가연합(ASEAN) 중심 의 역내 협력에도 불구하고 미∙중 관계 향방에 따른 여파, 남중국해 영유권 분쟁, 인도네시아의 분리주의 운동 등 역내 안보의 불안정 요인 이 상존하고 있다.","chapter":1,"section":1,"page":4,"src":"2004 외교백서 제1장.pdf","id":"2003-s00040"},{"year":2004,"admin":"노무현","text":"그러나 남중국해의 영유권 분쟁, 인도네시아의 분리주의동 등 역내 불안 정 요인이 상존하고 있으며, 급성호흡기 증후군(SARS), 조류독감 등의 전염병과 20만여 명의 희생자 를 낸 12월 남아시아 지진해일 피해 복구 등도 향후 지역 통합과 경제성장을 위해 극복해 나가야할 과 제이다.","chapter":1,"section":null,"page":3,"src":"2005 외교백서 제1장.pdf","id":"2004-s00077"},{"year":2005,"admin":"노무현","text":"일본과 중국은 2005년 양국간 교역액이 1,844억 달러에 이르는 등 경제적 상호의존 관계 가 날로 증대되고 있으나 고이즈미 총리의 야스쿠니신사 참배 문제, 센카쿠(조어도 : 댜오위 다오) 영유권 분쟁, 동중국해 자원개발 문제 등으로 상호 갈등과 견제가 지속되는 양상을 보였다.","chapter":1,"section":1,"page":5,"src":"2006 외교백서 제1장.pdf","id":"2005-s00139"},{"year":2015,"admin":"박근혜","text":"2015년에도 남중국해 도서를 둘러싼 베트남·필리핀 등 동남아 국가와 중국 간 영유권 갈등이 계속되었으며, 10월에는 상설중재재판소(PCA: Permanent Court of Arbitration)가 중국과 필리핀 간 영유권 분쟁과 관련한 심리를 개시하 자 중국이 이에 반발하면서 양국 간 갈등이 격화되기도 하였다.","chapter":1,"section":1,"page":13,"src":"2016 외교백서 1장.pdf","id":"2015-s00063"},{"year":2025,"admin":"이재명","text":"남아시아에서는 카슈미르 영유권 분쟁을 배경으로 인도-파키스탄 간 무력충돌이 발생했으며, 동남아에서는 태국-캄보디아 간 국경분쟁이 군사충돌로 비화되었다.","chapter":1,"section":1,"page":9,"src":"2025년도 국제정세와 외교활동.pdf","id":"2025-s00015"},{"year":1995,"admin":"김영삼","text":"또 하나의 역내 불안요소인 남사군도 문제는 1995년 2월 필리핀이 영 유권을 주장하는 도서에 중국이 시설물을 설치한데 대해 필리핀이 외교적 제3절 지역별 정세 / 65 으로 강력히 항의하고 무력시위를 하는 등 중국과 필리핀간 영유권 분쟁 이 발생함으로써 남사군도 문제는 역내 분쟁 요소로 계속 남게 되었다.","chapter":2,"section":3,"page":28,"src":"1996 외교백서 제2장.pdf","id":"1995-s00350"},{"year":1996,"admin":"김영삼","text":"예멘과 에리트리아간의 80181군도에 관한 영유권 분쟁은 1995년 12 월 에리트리아가 880181군도를 무력 점령하는 등 양국간의 무력층돌에까 지 이르렀다。 그러나 프랑스의 적극적인 중재노력으로 1996년 5월 양국 제 3절 지역별 정세 / 95 이 중재를 통한 해결방안을 수용하기로 하는 협정을 체결함으로써, 동 분쟁의 평화적 해결 전망이 밝아졌다.","chapter":1,"section":3,"page":86,"src":"1997 외교백서 제1장.pdf","id":"1996-s00637"},{"year":1997,"admin":"김영삼","text":"또한 일 러간의 소위 북방영토문제, 일 중간의 동중국해상 도서(일본명 : 센까꾸열도, 중국명 : 조어대)에 대한 영유권 분쟁 및 중국과 동남아 국가들간의 Spratly 및 Paracel 등 남지나해 군도에 관한 영유권 문제는 아직도 해결되지 않은채 잠재적인 분쟁요인으로 남아 있다.","chapter":1,"section":2,"page":1,"src":"1998 외교백서 제1장.doc","id":"1997-s00067"}],"docCount":21},{"id":"상품무역협정","kind":"treaty","aliases":["상품무역 협정","상품무역협정"],"total":24,"byYear":{"2006":1,"2007":4,"2008":6,"2009":2,"2010":2,"2011":2,"2012":7},"rateByYear":{"2006":6.5,"2007":29.3,"2008":38.1,"2009":11.8,"2010":10.1,"2011":11.0,"2012":33.7},"byAdmin":{"이명박":19,"노무현":5},"focus":0.79,"first":2006,"last":2012,"peak":2012,"peakRate":"2008","docs":[{"year":2006,"admin":"노무현","text":"제 1 절 자유무역협정(FTA)의 전략적 확대 추진 171 3) 한·ASEAN FTA 상품협정 타결 및 서비스·투자 협상 진행 2006년 8월 24일 말레이시아 콸라룸푸르에서 열린 한·ASEAN 경제장관회의에서 한국과 ASEAN 회원국 통상장관들은 2006년 5월 최종 타결된 상품양허안과 원산지 규정을 포함한 한·ASEAN FTA 상품무역협정에 정식 서명하였으며, 아울러‘개성공단 제품 특혜관세 부여 이행에 관한 교환각서’에 서명하였다.","chapter":4,"section":1,"page":18,"src":"2007 외교백서 제4장.pdf","id":"2006-s01169"},{"year":2007,"admin":"노무현","text":"분야별로 살펴보면, 우선 경제·통상 (연도) 분야에서는 한·ASEAN 자유무역협정 ‘61~ ‘70 ‘71~ ‘80 ‘01~ ‘07 ‘91~ ‘00 ‘81~ ‘90 ‘48~‘60 (기본협정, 분쟁해결협정, 상품무역협정)이 2007년 6월에 발효되었다.","chapter":3,"section":5,"page":129,"src":"2008 외교백서 제3장.pdf","id":"2007-s00925"},{"year":2008,"admin":"이명박","text":"4) 한₩ASEAN FTA 이행(상품, 서비스) 및 투자 협상 진행 (1) 상품 협정 ASEAN 국가 중 태국을 제외한 한₩ASEAN FTA 상품무역협정이 2007년 6월 1일 발 효된 바 있다.","
