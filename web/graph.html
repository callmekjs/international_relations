<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>외교백서 지식그래프</title>
<style>
:root{
  --ground:#f6f4ef; --panel:#fffdf9; --line:#ddd7c9; --line-soft:#eae5d9;
  --ink:#1c1a17; --ink-2:#57524a; --ink-3:#8b8478;
  --country:#1f6f6b; --org:#8a6a1f; --policy:#7b3a68; --event:#a8442a; --treaty:#3a5a8f;
  --협력:#2f7d5e; --갈등:#b23a2e; --대화:#3a5a8f; --지원:#8a6a1f;
  --edge:rgba(90,84,74,.18); --edge-hot:rgba(28,26,23,.55);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#14161a; --panel:#1b1e24; --line:#2f343d; --line-soft:#252a31;
  --ink:#eceae5; --ink-2:#a8a49b; --ink-3:#726d64;
  --country:#5fc7bd; --org:#d8ae53; --policy:#cf8ab6; --event:#e58a68; --treaty:#7fa8e0;
  --협력:#5fbf92; --갈등:#e5715f; --대화:#7fa8e0; --지원:#d8ae53;
  --edge:rgba(200,196,187,.15); --edge-hot:rgba(236,234,229,.6);
}}
:root[data-theme="dark"]{
  --ground:#14161a; --panel:#1b1e24; --line:#2f343d; --line-soft:#252a31;
  --ink:#eceae5; --ink-2:#a8a49b; --ink-3:#726d64;
  --country:#5fc7bd; --org:#d8ae53; --policy:#cf8ab6; --event:#e58a68; --treaty:#7fa8e0;
  --협력:#5fbf92; --갈등:#e5715f; --대화:#7fa8e0; --지원:#d8ae53;
  --edge:rgba(200,196,187,.15); --edge-hot:rgba(236,234,229,.6);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
.serif{font-family:"Nanum Myeongjo","Apple SD Gothic Neo",Batang,serif}
.wrap{display:grid;grid-template-columns:244px minmax(0,1fr) 312px;height:100vh;height:100dvh}
@media(max-width:1040px){.wrap{grid-template-columns:1fr;grid-template-rows:auto 60vh auto;height:auto}}

aside,.detail{background:var(--panel);overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:18px}
aside{border-right:1px solid var(--line)}
.detail{border-left:1px solid var(--line)}
h1{font-size:18px;line-height:1.25;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--ink-3);font-size:11px;margin-top:5px;letter-spacing:.02em}
.grp{display:flex;flex-direction:column;gap:8px}
.lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.13em;color:var(--ink-3);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid var(--line-soft);
  border-radius:6px;background:none;color:var(--ink);cursor:pointer;font:inherit;font-size:11.5px;
  transition:border-color .15s,opacity .15s}
.chip:hover{border-color:var(--line)}
.chip[aria-pressed="false"]{opacity:.32}
.chip:focus-visible{outline:2px solid var(--ink-2);outline-offset:2px}
.chip .n{color:var(--ink-3);font-size:10px;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.seg{display:flex;border:1px solid var(--line-soft);border-radius:6px;overflow:hidden}
.seg button{flex:1;padding:6px 8px;text-align:left;border:0;background:none;color:var(--ink-2);font:inherit;
  font-size:11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ground);color:var(--ink);font-weight:700}
.seg button:focus-visible{outline:2px solid var(--ink-2);outline-offset:-2px}
.yr{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.searchbox{width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:6px;
  background:var(--ground);color:var(--ink);font:inherit;font-size:12px}
.searchbox:focus-visible{outline:2px solid var(--ink-2);outline-offset:1px}
.crumb{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:11.5px}
.crumb button{border:0;background:none;color:var(--ink-3);font:inherit;font-size:11.5px;
  padding:1px 3px;border-radius:4px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.crumb button:hover{color:var(--ink)}
.crumb button:focus-visible{outline:2px solid var(--ink-2);outline-offset:1px}
.crumb .sep{color:var(--ink-3);opacity:.6}
.crumb .now{color:var(--ink);font-weight:700}
.gap{font-size:11px;line-height:1.55;color:var(--ink-2);border:1px solid var(--event);
  border-radius:6px;padding:8px 10px}
.gap b{color:var(--event)}
.note{font-size:10.5px;color:var(--ink-3);line-height:1.55;border-top:1px solid var(--line-soft);
  padding-top:10px;margin-top:auto}
.note b{color:var(--ink-2)}

main{position:relative;overflow:hidden;background:var(--ground)}
canvas{display:block;width:100%;height:100%;cursor:grab}
canvas:active{cursor:grabbing}
.badge{position:absolute;left:12px;top:11px;font-size:10.5px;color:var(--ink-3);background:var(--panel);
  border:1px solid var(--line-soft);border-radius:20px;padding:3px 10px;
  font-variant-numeric:tabular-nums;pointer-events:none}

.name{font-size:21px;letter-spacing:-.015em;margin:0;line-height:1.2}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink-2);margin-top:4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-soft);
  border:1px solid var(--line-soft);border-radius:7px;overflow:hidden}
.stat{background:var(--panel);padding:8px 10px}
.stat .k{font-size:9px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3)}
.stat .v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.spark{width:100%;height:48px;display:block}
.quote{font-size:12px;line-height:1.7;color:var(--ink-2);border-left:2px solid var(--line);padding-left:10px}
.quote cite{display:block;font-style:normal;font-size:10px;color:var(--ink-3);margin-top:6px}
.rel button{display:flex;align-items:center;gap:7px;width:100%;padding:4px 6px;border:0;border-radius:5px;
  background:none;color:var(--ink);font:inherit;font-size:12px;cursor:pointer;text-align:left}
.rel button:hover{background:var(--ground)}
.rel button:focus-visible{outline:2px solid var(--ink-2);outline-offset:-2px}
.rel .w{margin-left:auto;color:var(--ink-3);font-size:10.5px;font-variant-numeric:tabular-nums}
.rel .kind{font-size:9.5px;padding:0 5px;border-radius:9px;border:1px solid currentColor;flex:0 0 auto}
.empty{color:var(--ink-3);font-size:12px;line-height:1.7}
.docs{display:flex;flex-direction:column;gap:0}
.doc{border-top:1px solid var(--line-soft);padding:9px 0}
.doc:first-child{border-top:0}
.doc p{margin:0;font-size:12px;line-height:1.68;color:var(--ink)}
.doc .meta{display:flex;gap:6px;flex-wrap:wrap;font-size:9.5px;color:var(--ink-3);
  margin-top:5px;font-variant-numeric:tabular-nums}
.doc .meta b{color:var(--ink-2);font-weight:600}
.doc mark{background:color-mix(in srgb,currentColor 18%,transparent);color:inherit;
  border-radius:2px;padding:0 1px}
.more{border:1px solid var(--line-soft);border-radius:6px;background:none;color:var(--ink-2);
  font:inherit;font-size:11.5px;padding:6px;cursor:pointer;width:100%}
.more:hover{border-color:var(--line);color:var(--ink)}
.more:focus-visible{outline:2px solid var(--ink-2);outline-offset:1px}
</style>

<div class="wrap">
<aside>
  <div>
    <h1 class="serif">외교백서 지식그래프</h1>
    <div class="sub" id="scope"></div>
  </div>

  <div class="grp">
    <div class="lbl">무엇을 볼까</div>
    <div class="seg" id="view" style="flex-direction:column">
      <button type="button" data-v="country" aria-pressed="true">🌍 나라 중심</button>
      <button type="button" data-v="policy"  aria-pressed="false">📋 정책 중심</button>
      <button type="button" data-v="event"   aria-pressed="false">⚡ 사건 중심</button>
      <button type="button" data-v="all"     aria-pressed="false">전부 한 판에</button>
    </div>
    <div class="sub" id="viewNote" style="margin:0"></div>
  </div>

  <div class="grp"><div class="lbl">점의 종류</div><div class="chips" id="kinds"></div></div>

  <div class="grp">
    <div class="lbl">시기</div>
    <nav class="crumb" id="crumb" aria-label="시기 이동"></nav>
    <div class="chips" id="periods"></div>
  </div>

  <div id="gap"></div>

  <div class="grp">
    <div class="lbl">선의 굵기</div>
    <div class="seg" id="metric">
      <button type="button" data-m="weight" aria-pressed="true">함께 나온 횟수</button>
      <button type="button" data-m="pmi" aria-pressed="false">특별함</button>
    </div>
  </div>

  <div class="grp"><div class="lbl">관계 종류</div><div class="chips" id="rels"></div></div>

  <div class="grp">
    <div class="lbl">찾기</div>
    <input class="searchbox" id="q" placeholder="북한, 신남방정책…" aria-label="개체 찾기">
  </div>

  <div class="note" id="note"></div>
</aside>

<main><canvas id="cv"></canvas><div class="badge" id="badge"></div></main>

<div class="detail" id="detail"></div>
</div>

<script>
const DATA = /*DATA*/;
const KIND = {
  country:{label:"나라",   css:"--country"},
  org:    {label:"국제기구", css:"--org"},
  policy: {label:"정책",   css:"--policy"},
  event:  {label:"사건",   css:"--event"},
  treaty: {label:"조약",   css:"--treaty"},
};
const RELS = DATA.meta.relKinds;
const ADMINS = [...new Set(Object.values(DATA.meta.yearAdmin))];
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

const nodes = DATA.nodes.map(n => ({...n, x:0, y:0, vx:0, vy:0}));
const byId = new Map(nodes.map(n => [n.id, n]));
const links = DATA.links.map(l => ({...l, s:byId.get(l.source), t:byId.get(l.target)}))
                        .filter(l => l.s && l.t);

const on = Object.fromEntries(Object.keys(KIND).map(k => [k, true]));
const relOn = Object.fromEntries([...RELS, "언급"].map(r => [r, true]));
let year = null, admin = null, sel = null, hover = null, query = "", metric = "weight";
let view = "country";

// 보기마다 '무엇이 주인공인가'가 다르다. 한 판에 다 올리면 나라—나라 선이
// 454개라 나머지 95개를 덮어버린다(2026-08-16 실측).
//   나라 중심  나라·기구끼리 — 30년 외교 지형
//   정책 중심  정책이 주인공, 그 정책이 닿은 나라만 곁들인다
//   사건 중심  사건이 주인공, 그 사건에 얽힌 나라만
const VIEW = {
  country: {kinds:["country","org"], hub:null,
            note:"나라와 국제기구끼리만 봅니다. 30년 외교 지형이 드러납니다."},
  policy:  {kinds:["country","org","policy"], hub:"policy",
            note:"정책이 주인공입니다. 그 정책이 닿은 나라만 함께 보입니다."},
  event:   {kinds:["country","org","event","treaty"], hub:"event",
            note:"사건·조약이 주인공입니다. 얽힌 나라만 함께 보입니다."},
  all:     {kinds:["country","org","policy","event","treaty"], hub:null,
            note:"다섯 종류를 한 판에 올립니다. 나라 선이 많아 복잡합니다."},
};

/* ── 조작판 ── */
const mk = (host, key, color, label, count, toggle) => {
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button"; b.setAttribute("aria-pressed", "true");
  b.innerHTML = `<span class="dot" style="background:${color}"></span>${label}` +
                (count != null ? `<span class="n">${count}</span>` : "");
  b.onclick = () => { const v = b.getAttribute("aria-pressed") === "true";
    b.setAttribute("aria-pressed", !v); toggle(!v); layout(); };
  host.append(b);
};
for (const [k, v] of Object.entries(KIND))
  mk(document.getElementById("kinds"), k, `var(${v.css})`, v.label,
     nodes.filter(n => n.kind === k).length, s => on[k] = s);
for (const r of RELS)
  mk(document.getElementById("rels"), r, `var(--${r})`, r,
     links.filter(l => l.rel === r).length, s => relOn[r] = s);
mk(document.getElementById("rels"), "언급", cssv("--ink-3"), "함께 언급",
   links.filter(l => !l.rel).length, s => relOn["언급"] = s);

const years = DATA.meta.years;

/* 시기는 **계단**이다. 전체 → 정권 → 연도로 파고들고, 이름을 눌러 되돌아온다.
   버튼 두 벌(정권 칩 + 연도 슬라이더)을 나란히 두면 '지금 어디에 있는지'를
   알 수 없다. 계단은 현재 위치가 늘 보인다. */
const crumbEl = document.getElementById("crumb");
const periodEl = document.getElementById("periods");

function goto(nextAdmin, nextYear) {
  admin = nextAdmin; year = nextYear;
  renderPeriods(); setScope(); layout();
  if (sel) { docLimit = 5; renderDocs(sel); }
}

function renderPeriods() {
  // 지금 어디에 있나
  crumbEl.innerHTML = "";
  const add = (label, fn, now) => {
    if (now) { const s = document.createElement("span"); s.className = "now"; s.textContent = label; crumbEl.append(s); }
    else { const b = document.createElement("button"); b.type = "button"; b.textContent = label; b.onclick = fn; crumbEl.append(b); }
  };
  const sep = () => { const s = document.createElement("span"); s.className = "sep"; s.textContent = "›"; crumbEl.append(s); };
  add("전체 37개년", () => goto(null, null), !admin && !year);
  if (admin) { sep(); add(admin + " 정권", () => goto(admin, null), !year); }
  if (year) { sep(); add(year + "년", null, true); }

  // 한 층 아래를 보여준다
  periodEl.innerHTML = "";
  const items = !admin ? ADMINS.map(a => ({label:a, on:() => goto(a, null)}))
                       : years.filter(y => DATA.meta.yearAdmin[y] === admin)
                              .map(y => ({label:String(y), on:() => goto(admin, y), sel:y === year}));
  for (const it of items) {
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button";
    b.setAttribute("aria-pressed", it.sel ? "true" : "false");
    b.textContent = it.label;
    b.onclick = it.on;
    periodEl.append(b);
  }
  if (admin && !year) {
    const hint = document.createElement("span");
    hint.className = "sub"; hint.style.margin = "0"; hint.textContent = "연도를 누르면 그 해로 들어갑니다";
    periodEl.append(hint);
  }
}
document.getElementById("q").oninput = e => { query = e.target.value.trim(); draw(); };
document.getElementById("view").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  view = b.dataset.v;
  document.getElementById("view").querySelectorAll("button")
    .forEach(x => x.setAttribute("aria-pressed", x === b));
  document.getElementById("viewNote").textContent = VIEW[view].note;
  layout();
};
document.getElementById("metric").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  metric = b.dataset.m;
  document.getElementById("metric").querySelectorAll("button")
    .forEach(x => x.setAttribute("aria-pressed", x === b));
  draw();
};

function setScope() {
  document.getElementById("scope").textContent =
    year ? `${year}년 · ${DATA.meta.yearAdmin[year]} 정권`
    : admin ? `${admin} 정권` : `1989 – 2025 · 37개년`;
  const g = year && (DATA.meta.gaps || {})[year];
  document.getElementById("gap").innerHTML = g
    ? `<div class="gap"><b>원본 결손</b> — ${g.map(x => `${x.missing} 없음(${x.ratio})`).join(", ")}.
       이 해가 작아 보이는 것은 자료가 없어서이지 외교가 적었기 때문이 아닙니다.</div>` : "";
}

/* ── 무엇을 보일지 ── */
const yearsOf = a => a ? years.filter(y => DATA.meta.yearAdmin[y] === a) : null;
function cnt(o) {
  if (year) return o.byYear[year] || 0;
  const ys = yearsOf(admin);
  if (!ys) return o.total ?? Object.values(o.byYear).reduce((x, y) => x + y, 0);
  return ys.reduce((s, y) => s + (o.byYear[y] || 0), 0);
}
let shown = [], shownL = [], alpha = 1;
function layout() {
  const V = VIEW[view];
  shown = nodes.filter(n => on[n.kind] && V.kinds.includes(n.kind) && cnt(n) > 0);
  let S = new Set(shown.map(n => n.id));
  shownL = links.filter(l => S.has(l.s.id) && S.has(l.t.id) &&
                             relOn[l.rel || "언급"] && cnt(l) > 0);
  if (V.hub) {
    // 주인공에 닿은 선만 남긴다. 나라—나라 선을 빼야 정책·사건이 보인다.
    shownL = shownL.filter(l => l.s.kind === V.hub || l.t.kind === V.hub ||
                                (V.hub === "event" && (l.s.kind === "treaty" || l.t.kind === "treaty")));
  }
  shown = shown.filter(n => shownL.some(l => l.s === n || l.t === n));
  shown.forEach(n => { if (!n.placed) { n.x = (Math.random()-.5)*520; n.y = (Math.random()-.5)*520; n.placed = 1; } });
  const b = document.getElementById("badge");
  if (shown.length === 0) {
    // 빈 화면을 그냥 두면 고장인 줄 안다. **왜 비었는지** 말해 준다.
    const what = {country:"나라", policy:"정책", event:"사건·조약", all:"자료"}[view];
    b.textContent = `이 조건에는 ${what}가 없습니다 — ` +
      (admin ? `${admin} 정권 백서에 잡힌 ${what} 이름이 없습니다` : "조건을 넓혀 보세요");
  } else {
    b.textContent = `점 ${shown.length} · 선 ${shownL.length} · 종류 붙은 선 ${shownL.filter(l => l.rel).length}`;
  }
  alpha = .9;
}

function tick() {
  for (const l of shownL) {
    const dx = l.t.x - l.s.x, dy = l.t.y - l.s.y, d = Math.hypot(dx, dy) || 1;
    const want = 70 + 250 / (1 + Math.log1p(l.weight));
    const f = (d - want) / d * .012 * alpha;
    l.s.vx += dx*f; l.s.vy += dy*f; l.t.vx -= dx*f; l.t.vy -= dy*f;
  }
  for (let i = 0; i < shown.length; i++) {
    const a = shown[i];
    for (let j = i+1; j < shown.length; j++) {
      const b = shown[j];
      let dx = b.x-a.x, dy = b.y-a.y, d2 = dx*dx + dy*dy;
      if (d2 > 260000) continue;
      if (d2 < 1) { dx = Math.random(); dy = Math.random(); d2 = 1; }
      const f = 900*alpha/d2;
      a.vx -= dx*f; a.vy -= dy*f; b.vx += dx*f; b.vy += dy*f;
    }
    a.vx -= a.x*.0016*alpha; a.vy -= a.y*.0016*alpha;
    a.x += a.vx *= .82; a.y += a.vy *= .82;
  }
  alpha *= .992;
}

/* ── 그리기 ── */
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let W=0, H=0, dpr=1, k=1, ox=0, oy=0;
function resize(){ dpr = Math.min(devicePixelRatio||1, 2); W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
addEventListener("resize", resize);
const rad = n => 4 + Math.sqrt(cnt(n)) * (year ? 2.4 : (admin ? 1.0 : .55));
const sx = n => n.x*k + ox + W/2, sy = n => n.y*k + oy + H/2;
const thick = l => metric === "pmi"
  ? Math.max(.4, (l.pmi + 3) * .55)
  : Math.max(.4, Math.log1p(cnt(l)) * .55);

function draw() {
  ctx.clearRect(0,0,W,H);
  const near = sel ? new Set(shownL.filter(l => l.s===sel||l.t===sel).flatMap(l => [l.s.id, l.t.id])) : null;
  ctx.lineCap = "round";
  for (const l of shownL) {
    const hot = sel && (l.s===sel || l.t===sel);
    ctx.strokeStyle = l.rel ? cssv("--" + l.rel) : (hot ? cssv("--edge-hot") : cssv("--edge"));
    ctx.globalAlpha = sel && !hot ? .16 : (l.rel ? .75 : 1);
    ctx.lineWidth = thick(l) * Math.min(k, 1.6);
    // 섞인 관계는 점선으로. 확정과 같은 실선으로 그으면 아는 척이 된다.
    ctx.setLineDash(l.relMixed ? [4, 4] : []);
    ctx.beginPath(); ctx.moveTo(sx(l.s), sy(l.s)); ctx.lineTo(sx(l.t), sy(l.t)); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.globalAlpha = 1;
  const hit = query ? nodes.filter(n => n.id.includes(query)).map(n => n.id) : null;
  for (const n of shown) {
    const r = rad(n)*Math.min(k,1.5), X = sx(n), Y = sy(n);
    const dim = (sel && !near.has(n.id) && n!==sel) || (hit && !hit.includes(n.id));
    ctx.globalAlpha = dim ? .16 : 1;
    ctx.beginPath(); ctx.arc(X, Y, r, 0, 7);
    ctx.fillStyle = cssv(KIND[n.kind].css); ctx.fill();
    if (n===sel || n===hover) { ctx.lineWidth = 2; ctx.strokeStyle = cssv("--ink"); ctx.stroke(); }
    const big = cnt(n) > (year ? 6 : (admin ? 60 : 300));
    if (!dim && (big || n===sel || n===hover || (hit && hit.includes(n.id)))) {
      ctx.font = `${n===sel?700:500} ${Math.min(13, 10+r/5)}px system-ui,sans-serif`;
      ctx.fillStyle = cssv("--ink"); ctx.textAlign = "center";
      ctx.fillText(n.id, X, Y-r-5);
    }
  }
  ctx.globalAlpha = 1;
}
(function loop(){ if (alpha > .002) tick(); draw(); requestAnimationFrame(loop); })();

/* ── 눌렀을 때 ── */
function at(mx,my){ let best=null, bd=400;
  for (const n of shown) { const d=(sx(n)-mx)**2+(sy(n)-my)**2, r=(rad(n)*Math.min(k,1.5)+7)**2;
    if (d<r && d<bd) { bd=d; best=n; } } return best; }
let drag = null;
cv.onpointerdown = e => { drag = {x:e.clientX, y:e.clientY, ox, oy, moved:0}; cv.setPointerCapture(e.pointerId); };
cv.onpointermove = e => { const r = cv.getBoundingClientRect();
  if (drag) { drag.moved += Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y);
    ox = drag.ox + e.clientX-drag.x; oy = drag.oy + e.clientY-drag.y; }
  else { hover = at(e.clientX-r.left, e.clientY-r.top); cv.style.cursor = hover ? "pointer" : "grab"; } };
cv.onpointerup = e => { const r = cv.getBoundingClientRect();
  if (drag && drag.moved < 5) select(at(e.clientX-r.left, e.clientY-r.top)); drag = null; };
cv.onwheel = e => { e.preventDefault(); k = Math.max(.25, Math.min(4, k*Math.exp(-e.deltaY*.0012))); };

/* ── 자세히 ── */
function select(n) {
  sel = n; docLimit = 5;
  const d = document.getElementById("detail");
  if (!n) { d.innerHTML = `<p class="empty">점을 고르면 여기에 자세히 나옵니다.</p>`; return; }
  const rel = shownL.filter(l => l.s===n || l.t===n)
    .map(l => ({o: l.s===n ? l.t : l.s, w: cnt(l), rel: l.rel, sample: l.sample,
                mixed: l.relMixed, top2: l.relTop2 || []}))
    .filter(r => r.w > 0).sort((a,b) => b.w - a.w).slice(0, 14);
  const max = rel.length ? rel[0].w : 1;
  const src = year || admin ? n.byYear : n.rateByYear;
  const vals = years.map(y => (n.rateByYear[y] ?? 0)), mx = Math.max(...vals, .1);
  const pts = vals.map((v,i) => `${i/(vals.length-1)*260},${46 - v/mx*40}`).join(" ");
  const withRel = rel.find(r => r.rel && r.sample);
  const adm = Object.entries(n.byAdmin).sort((a,b) => b[1]-a[1]).slice(0,3);

  d.innerHTML = `
    <div><h2 class="name serif">${n.id}</h2>
      <div class="tag"><span class="dot" style="background:var(${KIND[n.kind].css})"></span>${KIND[n.kind].label}</div></div>
    <div class="stats">
      <div class="stat"><div class="k">언급</div><div class="v">${cnt(n).toLocaleString()}</div></div>
      <div class="stat"><div class="k">분량대비 최고</div><div class="v">${n.peakRate}</div></div>
      <div class="stat"><div class="k">처음</div><div class="v">${n.first}</div></div>
      <div class="stat"><div class="k">마지막</div><div class="v">${n.last}</div></div>
    </div>
    <div><div class="lbl" style="margin-bottom:5px">해마다 (백서 분량 대비)</div>
      <svg class="spark" viewBox="0 0 260 50" preserveAspectRatio="none" aria-hidden="true">
        <polyline points="${pts}" fill="none" stroke="var(${KIND[n.kind].css})" stroke-width="1.6"/></svg>
      <div class="yr"><span>${years[0]}</span><span>${years[years.length-1]}</span></div></div>
    <div><div class="lbl" style="margin-bottom:5px">많이 다룬 정권</div>
      <div class="sub" style="margin:0">${adm.map(([a,c]) => `${a} ${c.toLocaleString()}`).join(" · ")}</div></div>
    <div id="docs"></div>
    ${withRel ? `<div><div class="lbl" style="margin-bottom:5px">관계의 근거</div>
      <blockquote class="quote">${withRel.sample.text}
      <cite>${withRel.sample.year}년 · ${n.id}—${withRel.o.id} → <b style="color:var(--${withRel.rel})">${withRel.rel}</b></cite></blockquote></div>` : ""}
    <div><div class="lbl" style="margin-bottom:5px">이어진 것 ${rel.length}</div>
      <div class="rel">${rel.map(r => `<button type="button" data-id="${r.o.id}">
        <span class="dot" style="background:var(${KIND[r.o.kind].css})"></span>${r.o.id}
        ${r.rel ? `<span class="kind" style="color:var(--${r.rel})">${
          r.mixed ? r.top2.map(t => t.kind).join("·") + " 섞임" : r.rel}</span>` : ""}
        <span class="w">${r.w}</span></button>`).join("")}</div></div>`;
  renderDocs(n);
  d.querySelectorAll("[data-id]").forEach(b => b.onclick = () => select(byId.get(b.dataset.id)));
  d.scrollTop = 0;
}

/* 근거 원문 — 지식그래프의 점이 '어디에 그렇게 쓰여 있나'를 보여준다.
   그래프만 있고 원문이 없으면 확인할 길이 없다. */
let docLimit = 5;
function renderDocs(n) {
  const host = document.getElementById("docs");
  if (!host) return;
  const scope = d => (!year && !admin) || (year ? d.year === year : d.admin === admin);
  const all = (n.docs || []).filter(scope);
  if (!all.length) {
    // '아예 안 나왔다'와 '데모에 안 담았다'는 다르다. 섞으면 오해한다.
    const c = cnt(n);
    host.innerHTML = `<div class="lbl" style="margin-bottom:5px">원문</div>
      <p class="empty">${c > 0
        ? `이 시기에 ${c}번 나오지만, 데모에는 원문을 담지 않았습니다.`
        : "이 시기에는 나오지 않습니다."}</p>`;
    return;
  }
  const list = all.slice(0, docLimit);
  // 이름에 표시를 한다. 정규식 대신 쪼개서 붙인다 — 이름에 특수문자가
  // 들어 있어도 안전하고, 이스케이프를 틀릴 일이 없다.
  const esc = t => t.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  // 별칭까지 표시한다 — 'UN' 이 든 문장도 '유엔' 노드의 근거다
  const hl = t => (n.aliases || [n.id]).reduce(
    (acc, a) => acc.split(a).join(`${a}`), esc(t))
    .split("").join("<mark>").split("").join("</mark>");
  host.innerHTML = `
    <div class="lbl" style="margin-bottom:5px">원문 ${all.length}${all.length < n.docCount ? ` / 전체 ${n.docCount}` : ""}</div>
    <div class="docs">${list.map(x => `<div class="doc">
      <p>${hl(x.text)}</p>
      <div class="meta"><b>${x.year}년</b> ${x.admin} 정권
        ${x.chapter ? `· ${x.chapter}장` : ""}${x.section ? ` ${x.section}절` : ""}
        ${x.page ? `· ${x.page}쪽` : ""} · ${x.src}</div></div>`).join("")}</div>
    ${all.length > list.length
      ? `<button class="more" type="button" id="moreDocs">더 보기 (${all.length - list.length}개 남음)</button>` : ""}`;
  const m = document.getElementById("moreDocs");
  if (m) m.onclick = () => { docLimit += 10; renderDocs(n); };
}

   선은 <b>한 문장 안에 함께 나온 것</b>입니다. 관계 종류는 세 갈래로 적었습니다.<br>
