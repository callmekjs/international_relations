<title>정권이 바뀌면 외교가 바뀌는가</title>
<style>
:root{
  --ground:#f6f4ef; --panel:#fffdf9; --line:#ddd7c9; --line-soft:#eae5d9;
  --ink:#1c1a17; --ink-2:#57524a; --ink-3:#8b8478;
  --swap:#a8442a; --steady:#8b8478; --peak:#b23a2e;
  --arrive:#2f7d5e; --leave:#a8442a;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#14161a; --panel:#1b1e24; --line:#2f343d; --line-soft:#252a31;
  --ink:#eceae5; --ink-2:#a8a49b; --ink-3:#726d64;
  --swap:#e58a68; --steady:#726d64; --peak:#e5715f;
  --arrive:#5fbf92; --leave:#e5715f;
}}
:root[data-theme="dark"]{
  --ground:#14161a; --panel:#1b1e24; --line:#2f343d; --line-soft:#252a31;
  --ink:#eceae5; --ink-2:#a8a49b; --ink-3:#726d64;
  --swap:#e58a68; --steady:#726d64; --peak:#e5715f;
  --arrive:#5fbf92; --leave:#e5715f;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased;
}
.serif{font-family:"Nanum Myeongjo","Apple SD Gothic Neo",Batang,serif}
.page{max-width:1080px;margin:0 auto;padding:40px 26px 80px;
  display:flex;flex-direction:column;gap:46px}
@media(max-width:640px){.page{padding:26px 15px 50px;gap:34px}}

header h1{font-size:31px;line-height:1.22;margin:0;letter-spacing:-.025em;text-wrap:balance}
@media(max-width:640px){header h1{font-size:24px}}
header .lede{font-size:15px;color:var(--ink-2);margin-top:12px;max-width:62ch}
header .lede b{color:var(--ink)}

.finding{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;
  background:var(--line-soft);border:1px solid var(--line-soft);border-radius:9px;overflow:hidden;
  margin-top:22px}
.finding div{background:var(--panel);padding:13px 15px}
.finding .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.11em;color:var(--ink-3)}
.finding .v{font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25;
  margin-top:3px}
.finding .n{font-size:11px;color:var(--ink-3);margin-top:2px}

section{display:flex;flex-direction:column;gap:14px}
.hd{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
.hd .num{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;font-weight:700;
  letter-spacing:.06em}
.hd h2{font-size:20px;margin:0;letter-spacing:-.015em}
.hd .say{font-size:12.5px;color:var(--ink-3)}
.frame{background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;
  padding:16px 16px 10px;overflow-x:auto}
svg{display:block;width:100%;height:auto;overflow:visible}
.axis{font-size:9.5px;fill:var(--ink-3);font-variant-numeric:tabular-nums}
.admlab{font-size:10px;fill:var(--ink-2);font-weight:700}
.gridline{stroke:var(--line-soft);stroke-width:1}
.admline{stroke:var(--line);stroke-width:1;stroke-dasharray:2 3}

.legend{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.chip{display:flex;align-items:center;gap:6px;padding:3px 9px;border:1px solid var(--line-soft);
  border-radius:6px;background:none;color:var(--ink);font:inherit;font-size:11.5px;cursor:pointer;
  transition:opacity .15s,border-color .15s}
.chip:hover{border-color:var(--line)}
.chip[aria-pressed="false"]{opacity:.3}
.chip:focus-visible{outline:2px solid var(--ink-2);outline-offset:2px}
.dot{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
.chip .n{color:var(--ink-3);font-size:10px;font-variant-numeric:tabular-nums}

.seg{display:inline-flex;border:1px solid var(--line-soft);border-radius:7px;overflow:hidden}
.seg button{padding:5px 11px;border:0;background:none;color:var(--ink-2);font:inherit;font-size:11.5px;
  cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ground);color:var(--ink);font-weight:700}
.seg button:focus-visible{outline:2px solid var(--ink-2);outline-offset:-2px}

.bar{cursor:pointer}
.bar rect{transition:opacity .12s}
.bar:hover rect{opacity:.72}
.bar[aria-current="true"] rect{stroke:var(--ink);stroke-width:1.5}

.words{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:600px){.words{grid-template-columns:1fr}}
.wordbox{border:1px solid var(--line-soft);border-radius:9px;padding:13px 15px;background:var(--panel)}
.wordbox .k{font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;
  margin-bottom:9px}
.wordbox.in .k{color:var(--arrive)} .wordbox.out .k{color:var(--leave)}
.wordbox ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:5px}
.wordbox li{border:1px solid var(--line-soft);border-radius:5px;padding:2px 8px;font-size:12.5px}
.wordbox.in li{border-color:color-mix(in srgb,var(--arrive) 40%,transparent)}
.wordbox.out li{border-color:color-mix(in srgb,var(--leave) 40%,transparent)}

.pick{font-size:13px;color:var(--ink-2);margin-bottom:4px}
.pick b{color:var(--ink);font-size:15px}
.pick .d{font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:11.5px;margin-left:6px}

table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--line-soft)}
th{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-weight:700}
td.num{text-align:right;font-variant-numeric:tabular-nums}
tr.swap td{color:var(--ink)} tr.swap td:first-child{font-weight:700}
tr.plain td{color:var(--ink-3)}

.note{font-size:11.5px;color:var(--ink-3);line-height:1.7;border-top:1px solid var(--line-soft);
  padding-top:14px}
.note b{color:var(--ink-2)}
.tip{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--line);
  border-radius:7px;padding:7px 10px;font-size:11.5px;opacity:0;transition:opacity .1s;z-index:9;
  box-shadow:0 4px 14px rgba(0,0,0,.1)}
.tip b{font-variant-numeric:tabular-nums}
</style>

<div class="page">

<header>
  <h1 class="serif">정권이 바뀌면 외교정책도 바뀌는가</h1>
  <div class="lede">
    외교백서 37개년(1989–2025)의 낱말 분포를 해마다 만들고, 이웃한 해끼리 얼마나
    다른지 쟀습니다. <b>정권이 바뀌는 해에 유난히 크게 변합니다 — 다만 1위는
    정권 교체가 아니었습니다.</b>
  </div>
  <div class="finding" id="finding"></div>
</header>

<section>
  <div class="hd">
    <span class="num">장면 1</span>
    <h2>정권마다 무엇을 다뤘나</h2>
    <span class="say">백서의 절을 13개 줄기로 묶어, 해마다의 비중을 쌓았습니다</span>
  </div>
  <div class="seg" role="group" aria-label="보기 방식">
    <button id="mode-share" aria-pressed="true">비중(%)</button>
    <button id="mode-count" aria-pressed="false">절 수</button>
  </div>
  <div class="frame"><svg id="flow" viewBox="0 0 1000 380" role="img"
    aria-label="1989년부터 2025년까지 외교 주제 비중의 변화"></svg></div>
  <div class="legend" id="legend"></div>
</section>

<section>
  <div class="hd">
    <span class="num">장면 2</span>
    <h2>해마다 앞해와 얼마나 달라졌나</h2>
    <span class="say">막대를 누르면 그때 들고 난 말이 아래에 나옵니다</span>
  </div>
  <div class="frame"><svg id="curve" viewBox="0 0 1000 300" role="img"
    aria-label="해마다 앞해 대비 변화량"></svg></div>
</section>

<section>
  <div class="hd">
    <span class="num">장면 3</span>
    <h2>그때 들고 난 말</h2>
  </div>
  <div class="pick" id="pick"></div>
  <div class="words">
    <div class="wordbox in"><div class="k">새로 들어온 말</div><ul id="arrived"></ul></div>
    <div class="wordbox out"><div class="k">사라진 말</div><ul id="left"></ul></div>
  </div>
</section>

<section>
  <div class="hd"><span class="num">표</span><h2>정권 교체 8건의 순위</h2></div>
  <div class="frame" style="padding:6px 10px 2px"><table id="rank"></table></div>
</section>

<div class="note" id="note"></div>
</div>
<div class="tip" id="tip"></div>

const S = DATA.shift, T = DATA.theme;

const NS = "http://www.w3.org/2000/svg";

/* ── 장면 1 · 주제 흐름 ──────────────────────────────────── */
// 쌓는 차례. 붙이는 우선순위(themes.py)와 **보는 차례**는 다르다.
// 가까운 주제끼리 붙여 놓아야 띠가 뒤섞이지 않고 흐름으로 읽힌다.
// 아래에서 위로: 한반도 → 나라 → 지역 → 다자 → 경제 → 사람 → 살림.
const STACK = ["한반도·북핵", "주변국·동맹", "지역외교", "다자·국제기구", "개발협력",
               "경제·통상", "코로나·보건", "영사·재외국민", "국민과 함께",
               "공공·문화외교", "법적기반", "외교인프라", "국제정세"];
const byName = Object.fromEntries(T.meta.themes.map(t => [t.name, t]));
const themes = STACK.filter(n => byName[n]).map(n => byName[n]);
let hidden = new Set(), mode = "share";
const yearsT = T.meta.years;
const admOf = T.meta.yearAdmin;

function flowSeries(){
  const shown = themes.filter(t => !hidden.has(t.name));
  return yearsT.map(y => {
    const row = T.byYear[String(y)] || {};
    const vals = shown.map(t => row[t.name] || 0);
    const sum = vals.reduce((a, b) => a + b, 0) || 1;
    return {y, vals, sum};
  });
}

function drawFlow(){
  const svg = $("flow"); svg.textContent = "";
  const W = 1000, H = 380, L = 34, R = 12, TOP = 26, B = 30;
  const shown = themes.filter(t => !hidden.has(t.name));
  const series = flowSeries();
  const maxSum = Math.max(...series.map(s => s.sum), 1);
  const x = i => L + i * (W - L - R) / Math.max(yearsT.length - 1, 1);
  const total = s => mode === "share" ? s.sum : maxSum;
  const y = v => TOP + (H - TOP - B) * (1 - v);

  // 정권 경계 세로선
  let prev = null;
  yearsT.forEach((yr, i) => {
    const a = admOf[String(yr)];
    if (prev !== null && a !== prev){
      svg.appendChild(el("line", {x1:x(i)-((x(1)-x(0))/2), x2:x(i)-((x(1)-x(0))/2),
        y1:TOP-14, y2:H-B, class:"admline"}));
      const t = el("text", {x:x(i)-((x(1)-x(0))/2)+4, y:TOP-18, class:"admlab"});
      t.textContent = a; svg.appendChild(t);
    }
    if (prev === null){
      const t = el("text", {x:L+2, y:TOP-18, class:"admlab"}); t.textContent = a;
      svg.appendChild(t);
    }
    prev = a;
  });

  // 쌓기
  const base = series.map(() => 0);
  shown.forEach((th, ti) => {
    let d = "";
    series.forEach((s, i) => {
      const v = base[i] + s.vals[ti] / total(s);
      d += (i ? "L" : "M") + x(i) + " " + y(v);
    });
    for (let i = series.length - 1; i >= 0; i--)
      d += "L" + x(i) + " " + y(base[i]);
    d += "Z";
    series.forEach((s, i) => { base[i] += s.vals[ti] / total(s); });
    const p = el("path", {d, fill: th.color, "fill-opacity": .82, stroke: "none"});
    p.addEventListener("mousemove", e => showTip(e, th, series));
    p.addEventListener("mouseleave", hideTip);
    svg.appendChild(p);
  });

  // 연도 눈금
  yearsT.forEach((yr, i) => {
    if (yr % 5 && i !== 0 && i !== yearsT.length - 1) return;
    const t = el("text", {x:x(i), y:H-B+16, class:"axis", "text-anchor":"middle"});
    t.textContent = yr; svg.appendChild(t);
  });
  const yl = el("text", {x:2, y:TOP+4, class:"axis"});
  yl.textContent = mode === "share" ? "100%" : maxSum + "절";
  svg.appendChild(yl);
}

function showTip(e, th, series){
  const svg = $("flow"), r = svg.getBoundingClientRect();
  const i = Math.round((e.clientX - r.left) / r.width * 1000 - 34)
          / ((1000 - 46) / Math.max(series.length - 1, 1));
  const k = Math.max(0, Math.min(series.length - 1, Math.round(i)));
  const s = series[k], v = s.vals[themes.filter(t => !hidden.has(t.name)).indexOf(th)] || 0;
  const tip = $("tip");
  tip.innerHTML = `<b>${s.y}</b> · ${esc(th.name)}<br>절 <b>${v}</b>개 · 비중 <b>${(100*v/s.sum).toFixed(0)}%</b>`;
  tip.style.left = Math.min(e.clientX + 13, innerWidth - 170) + "px";
  tip.style.top = (e.clientY + 13) + "px";
  tip.style.opacity = 1;
}
const hideTip = () => { $("tip").style.opacity = 0; };

function drawLegend(){
  const counts = {};
  for (const t of themes) counts[t.name] = 0;
  for (const y of yearsT){ const row = T.byYear[String(y)] || {};
    for (const k in row) counts[k] = (counts[k] || 0) + row[k]; }
  $("legend").innerHTML = themes.map(t => `
    <button class="chip" data-t="${esc(t.name)}" aria-pressed="${!hidden.has(t.name)}">
      <span class="dot" style="background:${t.color}"></span>${esc(t.name)}
      <span class="n">${counts[t.name] || 0}</span></button>`).join("");
  $("legend").querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
    const n = b.dataset.t;
    hidden.has(n) ? hidden.delete(n) : hidden.add(n);
    if (hidden.size === themes.length) hidden.delete(n);
    drawLegend(); drawFlow();
  }));
}
$("mode-share").addEventListener("click", () => setMode("share"));
$("mode-count").addEventListener("click", () => setMode("count"));
function setMode(m){
  mode = m;
  $("mode-share").setAttribute("aria-pressed", String(m === "share"));
  $("mode-count").setAttribute("aria-pressed", String(m === "count"));
  drawFlow();
}

/* ── 장면 2 · 변화량 ─────────────────────────────────────── */
let picked = S.steps.findIndex(s => s.swap);

function drawCurve(){
  const svg = $("curve"); svg.textContent = "";
  const W = 1000, H = 300, L = 40, R = 12, TOP = 24, B = 42;
  const steps = S.steps;
  const max = Math.max(...steps.map(s => s.distance)) * 1.08;
  const bw = (W - L - R) / steps.length;
  const y = v => TOP + (H - TOP - B) * (1 - v / max);

  // 같은 정권 평균 가로선
  [["insideMean", "같은 정권 평균"], ["acrossMean", "교체 평균"]].forEach(([k, lab]) => {
    const yy = y(S.meta[k]);
    svg.appendChild(el("line", {x1:L, x2:W-R, y1:yy, y2:yy, class:"gridline"}));
    const t = el("text", {x:L+3, y:yy-4, class:"axis"});
    t.textContent = `${lab} ${S.meta[k]}`; svg.appendChild(t);
  });

  steps.forEach((s, i) => {
    const g = el("g", {class:"bar", role:"button", tabindex:"0",
      "aria-current":String(i === picked),
      "aria-label":`${s.from}에서 ${s.to}, 거리 ${s.distance}`});
    const h = (H - B) - y(s.distance);
    g.appendChild(el("rect", {x:L + i*bw + 1.5, y:y(s.distance), width:bw-3, height:Math.max(h,1),
      rx:2, fill: s.swap ? "var(--swap)" : (s.rank === 1 ? "var(--peak)" : "var(--steady)"),
      "fill-opacity": s.swap ? .95 : (s.rank === 1 ? .95 : .42)}));
    g.addEventListener("click", () => { picked = i; drawCurve(); drawWords(); });
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){
      e.preventDefault(); picked = i; drawCurve(); drawWords(); } });
    svg.appendChild(g);

    if (s.swap || s.rank === 1){
      const t = el("text", {x:L + i*bw + bw/2, y:y(s.distance) - 6, class:"axis",
        "text-anchor":"middle", fill: s.swap ? "var(--swap)" : "var(--peak)"});
      t.textContent = s.rank + "위"; svg.appendChild(t);
    }
    // 1위가 정권 교체가 아니라는 것이 이 그림의 요점이다. 이름을 붙여 둔다.
    if (s.rank === 1 && !s.swap){
      const t = el("text", {x:L + i*bw + bw/2, y:y(s.distance) - 19, class:"axis",
        "text-anchor":"middle", fill:"var(--peak)", "font-weight":"700"});
      t.textContent = "코로나"; svg.appendChild(t);
    }
    if (s.from % 5 === 0 || i === 0 || i === steps.length - 1){
      const t = el("text", {x:L + i*bw + bw/2, y:H-B+15, class:"axis", "text-anchor":"middle"});
      t.textContent = s.from; svg.appendChild(t);
    }
    if (s.swap){
      const t = el("text", {x:L + i*bw + bw/2, y:H-B+29, class:"axis", "text-anchor":"middle",
        fill:"var(--swap)"});
      t.textContent = s.toAdmin; svg.appendChild(t);
    }
  });
  const t0 = el("text", {x:L-6, y:TOP+4, class:"axis", "text-anchor":"end"});
  t0.textContent = max.toFixed(1); svg.appendChild(t0);
}

/* ── 장면 3 · 들고 난 말 ─────────────────────────────────── */
function drawWords(){
  const s = S.steps[picked];
  $("pick").innerHTML = `<b>${s.from} → ${s.to}</b>
    ${s.swap ? `${esc(s.fromAdmin)} → ${esc(s.toAdmin)}` : `${esc(s.fromAdmin)} 정부 안`}
    <span class="d">거리 ${s.distance} · 전체 ${S.steps.length}쌍 중 ${s.rank}위</span>`;
  $("arrived").innerHTML = s.arrived.map(w => `<li>${esc(w)}</li>`).join("");
  $("left").innerHTML = s.left.map(w => `<li>${esc(w)}</li>`).join("");
}

/* ── 표 ─────────────────────────────────────────────────── */
const swaps = S.steps.filter(s => s.swap).sort((a, b) => a.rank - b.rank);
const topInside = S.steps.filter(s => !s.swap).sort((a, b) => a.rank - b.rank).slice(0, 2);
$("rank").innerHTML = `
  <tr><th>교체</th><th>연도</th><th class="num">거리</th><th class="num">순위</th></tr>
  ${swaps.map(s => `<tr class="swap"><td>${esc(s.fromAdmin)} → ${esc(s.toAdmin)}</td>
    <td>${s.from}→${s.to}</td><td class="num">${s.distance}</td>
    <td class="num">${s.rank}위</td></tr>`).join("")}
  ${topInside.map(s => `<tr class="plain"><td>${esc(s.fromAdmin)} 정부 안 — 교체 아님</td>
    <td>${s.from}→${s.to}</td><td class="num">${s.distance}</td>
    <td class="num">${s.rank}위</td></tr>`).join("")}`;

$("note").innerHTML = `
  <b>어떻게 쟀나.</b> 해마다 백서 본문의 낱말 분포를 만들고, 이웃한 해끼리
  코사인 거리를 쟀습니다. 두 가지를 걷어냈습니다 — 편집자가 바뀌면 달라지는
  <b>문체·서식 낱말</b>('하였다'↔'했다', '외교부'↔'외교통상부'),
  그리고 원본이 60% 결손된 <b>2004년</b>. 걷어내지 않으면 1.04배(차이 없음)로
  나옵니다.<br><br>
  <b>줄기는 어떻게 묶었나.</b> 백서 목차의 절 ${T.meta.sections}개를 13개 줄기로
  묶었습니다. 줄기 이름과 열쇠말은 모두 절 제목에 실제로 쓰인 말입니다.
  ${T.meta.matched}개(${T.meta.matchRate}%)가 붙었고 ${T.meta.unmatched}개는
  어디에도 안 붙었습니다 — 대부분 옛 스캔본의 글자 인식이 깨진 제목입니다.
  표본 40개를 원문과 대조해 뚜렷한 오분류는 없었습니다.<br><br>
  <b>주의.</b> 낱말이 달라졌다는 것이 곧 정책이 달라졌다는 뜻은 아닙니다.
  대통령 이름과 장관 이름도 낱말이라 정권이 바뀌면 반드시 달라집니다.
  이 그림은 <b>"얼마나 달라 보이나"</b> 를 잰 것이지 정책의 옳고 그름이 아닙니다.`;

drawLegend(); drawFlow(); drawCurve(); drawWords();
</script>
